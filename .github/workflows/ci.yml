# The gates below are mirrored by .githooks/pre-push, which runs them before a
# push leaves the machine. Add a step here and add it there too.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Verifies every example still produces its committed transcript, so an
      # explanation can never drift from what the code actually does.
      - name: Examples
        run: cargo test --workspace

      # The coverage gate: vendor integrity, cross-references, line coverage.
      - name: Coverage
        run: cargo xtask coverage --json

      # The site must build from the annotation store on every commit.
      - name: Build site
        run: cargo site

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.json

      # trybuild leaves a `target/tests/target` symlink that rust-cache's post
      # step cannot walk, so every run ends in an ENOENT error annotation and
      # the cache save aborts (Swatinem/rust-cache#193). It is build output the
      # next `cargo test` recreates, so removing it here costs nothing. Runs on
      # failure too, since the post step runs then as well.
      - name: Drop trybuild symlink before cache save
        if: always()
        run: rm -rf target/tests

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Must match the exact pin in playground/Cargo.toml. If it drifts,
      # `cargo xtask wasm` fails up front naming both versions.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      # Every example must also build for the browser.
      - name: Build examples for wasm32
        run: cargo build --target wasm32-unknown-unknown $(printf -- '-p %s ' $(ls examples))

      # Builds the playground, runs wasm-bindgen over it, and then runs every
      # example out of the built module under node, diffing each against the
      # transcript the `Examples` job above asserts natively. Compiling for
      # wasm32 and passing natively do not add up to "the browser prints what
      # the explanation claims"; this is the step that checks that.
      - name: Build playground
        run: cargo xtask wasm

      - name: Site with playground
        run: cargo site
