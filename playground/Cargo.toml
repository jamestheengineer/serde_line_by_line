[package]
name = "playground"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly: wasm-bindgen and wasm-bindgen-cli must agree, and a mismatch
# is a confusing failure if it is allowed to drift (decision D1).
wasm-bindgen = "=0.2.127"

# One entry per directory in examples/. build.rs generates the dispatch from
# that directory, so a missing entry here fails the build by name.
closure_kinds = { path = "../examples/closure_kinds" }
collect_str = { path = "../examples/collect_str" }
compile_fail = { path = "../examples/compile_fail" }
default_methods = { path = "../examples/default_methods" }
error_custom = { path = "../examples/error_custom" }
iterator_by_hand = { path = "../examples/iterator_by_hand" }
lifetime_basics = { path = "../examples/lifetime_basics" }
move_and_borrow = { path = "../examples/move_and_borrow" }
num_widening = { path = "../examples/num_widening" }
ok_and_error = { path = "../examples/ok_and_error" }
primitive_dispatch = { path = "../examples/primitive_dispatch" }
seq_state_machine = { path = "../examples/seq_state_machine" }
