[package]
name = "playground"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly: wasm-bindgen and wasm-bindgen-cli must agree, and a mismatch
# is a confusing failure if it is allowed to drift (decision D1).
wasm-bindgen = "=0.2.127"

# One entry per directory in examples/. build.rs generates the dispatch from
# that directory, so a missing entry here fails the build by name.
ok_and_error = { path = "../examples/ok_and_error" }
