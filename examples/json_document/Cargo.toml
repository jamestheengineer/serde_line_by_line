[package]
name = "json_document"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The version the walk describes. `serde_json` 1.0.151 resolves `serde_core` to
# exactly the 1.0.229 this repo claims line by line, so the parser running here
# is compiled against the trait definitions the reader has already read.
serde_json = "=1.0.151"
# The derive the walk's last unit follows. `serde` is the facade over the two
# crates this repo claims — `serde_core` 1.0.229 and `serde_derive` 1.0.229 —
# so the impl `Document` gets is the one `expand/` shows being emitted.
serde = { version = "=1.0.229", features = ["derive"] }
