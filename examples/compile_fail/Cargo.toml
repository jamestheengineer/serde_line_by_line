[package]
name = "compile_fail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

# trybuild compiles each tests/ui/*.rs, asserts it fails, and diffs the
# compiler's output against the committed .stderr. Regenerate after a rustc
# upgrade with: TRYBUILD=overwrite cargo test -p compile_fail
[dev-dependencies]
trybuild = "1.0"
