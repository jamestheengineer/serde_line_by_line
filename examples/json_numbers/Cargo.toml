[package]
name = "json_numbers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Default features, on purpose. `float_roundtrip` would switch the parser to
# `lexical/`, and Cargo unifies features across the workspace, so turning it
# on here would turn it on for every example the site runs. What this example
# shows is the build a reader gets without asking.
serde_json = "=1.0.151"
