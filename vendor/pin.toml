# Regenerate with `cargo xtask pin`; change a version with `cargo xtask bump`.
# src_tree_sha256 protects annotation and glossary line ranges: if it moves,
# the coverage gate fails until the change is an explicit migration.
#
# role decides what the gates ask of a source:
#   coverage  — every line must be claimed once manifest.toml calls a file
#               complete. The reference track's promise.
#   narrative — annotated where the story goes, never asked to be exhaustive
#               (PLAN.md §13). No coverage promise and no percentage: a walk
#               reports the lines it cites, not a fraction of a crate.
#               serde_derive held this role through N1-N5 and gave it up in
#               R1 (D12); serde_json held it through J1-J4 and gave it up in
#               K1 (D14). Each time the walk became an ordering over
#               annotations rather than a track with citations of its own.
#               No source holds the role today, and the gates still know it.
#   glossary  — never annotated at all; quoted verbatim by glossary entries
#               (D9). The pin is what keeps a quotation honest.
#
# extra_files names files outside src/ that the promise covers anyway
# (D14). They are hashed, counted and claimed like any file under src/.

