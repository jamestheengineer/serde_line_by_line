[[annotation]]
id    = "de-mod-0033"
file  = "src/de/mod.rs"
lines = "1031-1044"
title = "f32, f64, char — the last of the scalars"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits"]
prereqs = ["de-mod-0032", "ser-mod-0024", "ser-mod-0025"]
body = """
Three more required hints, closing out the fourteen primitives.

`deserialize_char` is the one that will most often go unanswered as asked. Almost
no format has a character type, so a JSON deserializer receiving this hint reads
a string and calls `visit_str`, leaving the visitor to check that it holds
exactly one scalar value. The hint still earns its place: a format that *does*
have a character type now knows to use it.
"""

[[annotation]]
id    = "de-mod-0034"
file  = "src/de/mod.rs"
lines = "1045-1066"
title = "str and string — the first hint about ownership, not type"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "strings", "ownership", "borrowing"]
prereqs = ["de-mod-0027"]
body = """
Two methods for one data model type, and the difference between them is not what
is in the input — it is **what the program intends to do with it**.

`deserialize_str` says: I will look at this string and I do not need to own a
`String`. `deserialize_string` says: I am going to keep it, so if you already
have a `String` lying around, hand it over rather than lending me a slice I will
have to copy.

Neither is a promise about what arrives. Both may be answered with `visit_str`,
`visit_borrowed_str`, or `visit_string` — the hint only tells the format which
choice would save work. A deserializer that has just parsed escapes into a
scratch buffer will answer `deserialize_string` by moving that buffer out, and
answer `deserialize_str` by lending it and reusing it afterwards.

This is the first place the three flavors from the data model list become an API
rather than a paragraph, and it is the shape of everything that follows. The type
being deserialized is the same. The allocation strategy is what is being
negotiated.
"""

[[annotation]]
id    = "de-mod-0035"
