The one method here that is not about the input at all. It asks what kind of
format is on the other side, and it is the same escape hatch `Serializer`
provides — with the same seventy lines of documentation arguing for restraint.

The doctest is the canonical use: a `Timestamp` that reads an RFC 3339 string
from JSON and a `u64` of seconds from a binary format. `ser/impls.rs` does exactly
this for `IpAddr` and the socket address types, and those are close to the
complete list of justified cases.

The last paragraph is the part to take seriously: *"modifying this method to
change a format from human-readable to compact or vice versa should be regarded
as a breaking change, as a value serialized in human-readable mode is not
required to deserialize from the same data in compact mode."* A format author
flipping this default silently changes the meaning of every document their users
have ever written. It looks like a one-line behavioural tweak and it is a wire
format change.

The default is `true`, and `#[inline]` on a body that returns a constant means
the branch in the doctest above compiles away entirely for any format that does
not override it.
"""

[[annotation]]
id    = "de-mod-0042"
file  = "src/de/mod.rs"
lines = "1257-1266"
title = "__deserialize_content_v1 — a private method on a public trait"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["visibility", "cfg", "associated-types"]
prereqs = ["de-mod-0029"]
body = """
Marked `// Not public API.`, `#[doc(hidden)]`, named with two leading underscores,
and gated on the derive being present and an allocator existing. Everything about
it says *do not call this*.

It exists for `#[serde(untagged)]` and internally tagged enums, which have to
buffer a value before they know what type to interpret it as. That buffer is
`private::Content`, and the `V: Visitor<'de, Value = crate::private::Content<'de>>`
bound is the giveaway — the method is only callable with a visitor producing
serde's own internal type, which no outside crate can name.

The default forwards to `deserialize_any`. A format can override it to buffer
more efficiently, which is why it is on the trait at all rather than being a free
function. The `v1` in the name is version-tolerance: when the internal
representation changes, a `v2` can be added beside it without breaking formats
that overrode the first.

This is what a stability escape hatch looks like in a crate that cannot make
breaking changes — and there are more of them in `private/`.
"""

[[annotation]]
id    = "de-mod-0043"
file  = "src/de/mod.rs"
lines = "1267-1316"
title = "Visitor — the trait that receives what the format found"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["traits", "lifetime-de", "associated-types"]
prereqs = ["de-mod-0029"]
body = """
The third trait in this file to define `'de`, and the third wording: *"the
requirement for lifetime of data that may be borrowed by `Self::Value`"*.

Collect all three and the picture is complete. On `Deserialize` it is what `Self`
may borrow. On `Deserializer` it is what the format may lend. On `Visitor` it is
what the produced value may keep. One lifetime, three vantage points, and every
confusing `'de` error is a disagreement between two of them.

The `LongString` example is worth reading for what it does *not* do. It has state
— a `min` field — which it uses in both `expecting` and `visit_str`. It
implements exactly one visit method. And it rejects with `invalid_value` rather
than `invalid_type`, because a short string is the right kind of thing with the
wrong content. Everything a hand-written visitor needs is in those twenty lines.
"""

[[annotation]]
id    = "de-mod-0044"
file  = "src/de/mod.rs"
lines = "1317-1343"
title = "type Value and expecting — the only thing you must write"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["associated-types", "traits", "sized-bound"]
prereqs = ["de-mod-0043"]
body = """
`type Value` is not `Self`. The visitor is a temporary object that receives
callbacks; the value is what it builds. `LongString` is not a string, it produces
one. Conflating the two is the standard first error when writing a visitor by
hand.

`expecting` is the **only required method** in a trait with twenty-eight. Every
`visit_*` has a default, so a visitor is defined entirely by which ones it
overrides — and the ones it does not override refuse. That inversion is the trick
of the whole design: you do not declare what you accept, you implement it, and
silence means no.

The consequence is that `expecting` has to carry real information, because it is
what the reader sees when nothing matched. *"a string containing at least 64
bytes"* explains a failure; *"a LongString"* does not. The docs pin the wording
convention — complete the sentence "This Visitor expects to receive …",
uncapitalized, no period — and the `Expected` blanket impl earlier in the file is
what routes it into error messages.
"""

[[annotation]]
id    = "de-mod-0045"
file  = "src/de/mod.rs"
lines = "1344-1353"
title = "visit_bool — the default that refuses, and why that is the right default"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "custom-errors"]
prereqs = ["de-mod-0044", "de-mod-0009"]
body = """
Ten lines that set the pattern for the next four hundred:

```rust
Err(Error::invalid_type(Unexpected::Bool(v), &self))
```

The default refuses, reporting what arrived and passing `&self` as the
description of what was wanted — the `Expected` blanket impl over all visitors
turning into a concrete error message.

Refusing by default is what makes the trait usable. A visitor for a `u32` should
reject a boolean, and it gets that for free by not writing `visit_bool`. The
alternative — a required method per type — would mean every visitor spelling out
twenty-eight refusals, which is exactly what `ser/impossible.rs` has to do and
exactly why that file is two hundred lines long.
"""

[[annotation]]
id    = "de-mod-0046"
file  = "src/de/mod.rs"
lines = "1354-1400"
title = "visit_i8 … visit_i64 — where serde's widening policy actually lives"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["default-methods", "traits"]
prereqs = ["de-mod-0045"]
body = """
Not all defaults refuse. `visit_i8`, `visit_i16`, and `visit_i32` **forward** —
each widens to `i64` and calls `visit_i64`, which is the one that refuses.

That single decision is serde's integer conversion policy, and it is worth
knowing where it lives, because people go looking for it in the derive or in
`serde_json`. A visitor that implements only `visit_i64` accepts all four signed
widths without writing a line of conversion code. A format that emits the
narrowest type it can — Postcard writing a `1` as an `i8` — still reaches a
visitor expecting `i64`.

Widening is always lossless, which is why the defaults can do it unconditionally.
Narrowing is not, so it is not here: a visitor wanting an `i8` has to implement
`visit_i64` and range-check, and the derive-generated visitors do exactly that.
"""

[[annotation]]
id    = "de-mod-0047"
file  = "src/de/mod.rs"
lines = "1401-1416"
title = "visit_i128 — a stack buffer, because Unexpected has no variant for it"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["no-std", "strings", "custom-errors", "default-methods"]
prereqs = ["de-mod-0015", "ser-impls-0051"]
body = """
This closes a loop opened earlier in the file. `Unexpected` has no variant for
128-bit integers, so this default cannot say `Unexpected::Signed(v)` — the value
does not fit. It formats a message instead and reports it through
`Unexpected::Other`.

And it does so without allocating, using the same `crate::format::Buf` stack
writer as the `Ipv4Addr` serializer: a fixed array, a `fmt::Write` impl that
fills it, an `.unwrap()` that can only fire if the array was sized wrong.

The array is sized exactly. `[0u8; 58]` holds ``integer `` (9 bytes) plus
`i128::MIN` at its full 40 characters plus `` as i128`` (9 bytes) — 58. The
`u128` version below uses 57, because `u128::MAX` is 39 digits and has no sign.
Two constants, each computed from the widest possible value, in a crate that
cannot allocate to find out.

Note it forwards to nothing. Unlike the narrower signed types, a `i128` cannot
widen any further, so this is terminal by necessity rather than by choice.
"""

[[annotation]]
id    = "de-mod-0048"
file  = "src/de/mod.rs"
lines = "1417-1478"
title = "visit_u8 … visit_u128 — the mirror, and the bridge that is missing"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "traits"]
prereqs = ["de-mod-0046", "de-mod-0047"]
body = """
The unsigned block widens the same way: `u8`, `u16`, and `u32` forward to
`visit_u64`, which refuses, and `visit_u128` builds its message in a 57-byte
stack buffer.

The gap worth noticing is between the two blocks. `visit_u64` does **not**
forward to `visit_i64`, and `visit_i64` does not forward to `visit_u64`. A
visitor implementing only `visit_i64` rejects every unsigned value a format hands
it, including ones that would fit perfectly.

That is deliberate — the conversion is not lossless in either direction, so serde
declines to guess — and it is why derive-generated visitors implement both sides
and range-check. It is also a common surprise in a hand-written visitor: it works
against one format and fails against another, because the two formats disagree
about whether `1` is signed.
"""

[[annotation]]
id    = "de-mod-0049"
file  = "src/de/mod.rs"
lines = "1479-1514"
title = "visit_f32, visit_f64, visit_char — two more forwards"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "strings", "no-std"]
prereqs = ["de-mod-0046"]
body = """
`visit_f32` widens to `visit_f64`, which refuses. Same policy as the integers,
and lossless for the same reason.

`visit_char` is the interesting one: it forwards to `visit_str` with a
one-character string, built by `v.encode_utf8(&mut [0u8; 4])` — a four-byte stack
array, the maximum length of a UTF-8 scalar, so no allocation happens even in
`no_std`.

That default is what makes `char` work against formats that have no character
type. JSON hands the visitor a string, the visitor's `visit_str` checks it holds
exactly one scalar; a format with a native char type calls `visit_char`, and a
visitor that only implemented `visit_str` still receives it. Both directions
covered by one line of default.
"""

[[annotation]]
id    = "de-mod-0050"
file  = "src/de/mod.rs"
lines = "1515-1532"
title = "visit_str — the transient string, and a rule stated twice"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["borrowing", "lifetimes", "strings"]
prereqs = ["de-mod-0034", "de-mod-0045"]
body = """
The first of the three string flavors, and the docs open with the constraint:
*"The lifetime of the string is ephemeral and it may be destroyed after this
method returns."*

Read the signature — `v: &str`, with an anonymous lifetime tied to the call.
Nothing about it can escape. A visitor wanting to keep this text must copy it,
and that is not a limitation to work around, it is the deserializer telling the
truth about a scratch buffer it is going to reuse.

Then the rule, which this file states four separate times for the four methods it
applies to: *"It is never correct to implement `visit_string` without
implementing `visit_str`. Implement neither, both, or just `visit_str`."*

The reason is that `visit_string`'s default forwards here, and nothing forwards
the other way. Implement only the owned variant and every format that hands you a
borrowed or transient string hits the erroring `visit_str` default — your type
works with one deserializer and mysteriously fails with the next. Stating it four
times is not redundancy; it is the most common way to get this trait wrong.
"""

[[annotation]]
id    = "de-mod-0051"
file  = "src/de/mod.rs"
lines = "1533-1549"
title = "visit_borrowed_str — sixteen lines, and the entire point of 'de"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "borrowing", "lifetimes", "zero-cost"]
prereqs = ["de-mod-0050"]
body = """
```rust
fn visit_borrowed_str<E>(self, v: &'de str) -> Result<Self::Value, E>
```

`&'de str`, not `&str`. That one lifetime is what this entire module is built
around, and everything else about the method is unremarkable.

`'de` is the input's lifetime. A string with that lifetime points into the
original bytes, not into a scratch buffer, and it stays valid as long as the
input does. So a visitor producing `&'de str` can return this reference
**unchanged** — no copy, no allocation, no `String`. The docs' example is the
whole promise: JSON input containing `"borrowed"` deserializes into a `&'a str`
that points directly at the eight bytes inside the original document.

The default forwards to `visit_str`, and forwarding **throws the lifetime away** —
`&'de str` coerces to a shorter `&str` and the knowledge that it could have been
kept is gone. That is the correct default, because most visitors cannot use the
guarantee, and it is why zero-copy is opt-in: a type gets it only by overriding
this method, which is exactly what `&'de str`'s own `Deserialize` impl does.

Not every format can call it. A deserializer reading from an `io::Read` has no
persistent input to point into and will only ever call `visit_str`. That is the
practical content of the `DeserializeOwned` bound on `from_reader`, seen from the
other end.
"""

[[annotation]]
id    = "de-mod-0052"
file  = "src/de/mod.rs"
lines = "1550-1574"
title = "visit_string — the owned flavor, and the copy it exists to avoid"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["ownership", "strings", "cfg", "no-std"]
prereqs = ["de-mod-0050"]
body = """
The third flavor: the deserializer built a `String` — because the input had
escape sequences, or arrived in pieces — and is handing over ownership rather
than lending a view of it.

A visitor producing a `String` takes it and is done: zero copies. The default
takes it, calls `visit_str(&v)`, and **drops it**, which the documentation says
outright. That is one wasted allocation, and it is the right trade — the
alternative is every visitor implementing a method it does not need.

Note the hedge in the docs about `deserialize_string`: *"although not every
deserializer will honor such a request."* The hint says what would help; the
format answers with whatever it has. A visitor must handle all three flavors no
matter which one it asked for.

Gated on `std` or `alloc`, since `String` needs an allocator. In a bare `no_std`
build this method does not exist and only the borrowed and transient flavors
remain — which is a coherent world, just a smaller one.
"""

