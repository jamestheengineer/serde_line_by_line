[[annotation]]
id    = "de-mod-0006"
file  = "src/de/mod.rs"
lines = "115-134"
title = "Module wiring, and the three spellings of StdError again"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["modules", "visibility", "cfg", "no-std", "msrv"]
prereqs = ["ser-mod-0006", "ser-mod-0007"]
body = """
`pub mod value` is public and `mod ignored_any` / `mod impls` are private, with
`IgnoredAny` re-exported by name. Same shape as `ser`: the impls are an
implementation detail, the useful types are lifted to the module root.

`de::value` being public is the difference. It is a whole module of adapter
deserializers — turn a `u32` into a `Deserializer`, turn an iterator into a
`SeqAccess` — and it has no counterpart in `ser`, because there is nothing on the
serialization side that needs adapting. It is also 1,895 lines, the third-largest
file in the crate.

Then the three `StdError` spellings, identical to `ser/mod.rs`: `std::error::Error`
with `std`, `core::error::Error` when the toolchain has it, and serde's own
shim otherwise. Chosen by `#[cfg]`, gated on a build-script probe rather than on
user configuration, and re-exported with `#[doc(no_inline)]` so rustdoc renders a
link instead of copying the trait in.
"""

[[annotation]]
id    = "de-mod-0007"
file  = "src/de/mod.rs"
lines = "135-165"
title = "declare_error_trait! — the same name, a different macro"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "supertraits", "cfg", "custom-errors"]
prereqs = ["ser-mod-0008"]
body = """
Byte for byte the matcher from `ser/mod.rs`:
`(Error: Sized $(+ $($supertrait:ident)::+)*)`. Same name, same trick, same
reason — a trait's supertrait list cannot be `#[cfg]`-ed, so the whole
declaration is abstracted over the part that varies.

And it is a **separate macro**, not a shared one. `macro_rules!` macros are
scoped to where they are defined, and `ser` and `de` each declare their own copy.
Nothing but the matcher is common: the trait inside differs entirely, in its
documentation and in how much it demands.

That difference is the thing to carry into the next few annotations.
`ser::Error` declares exactly one method. This trait declares one required method
and **seven with default bodies**, and the reason is structural rather than
incidental. Serialization fails when a format cannot represent something — a
short list, known to the format. Deserialization fails when the input does not
match the program, which happens in recognizable, recurring ways: wrong type,
wrong value, wrong length, unknown field, missing field, duplicate field. Serde
names all six, so every format reports them in the same words.

The `diagnostic::on_unimplemented` attribute is the same courtesy as on the
serialization side — replace rustc's default "trait bound not satisfied" with a
sentence naming `serde::de::Error` specifically.
"""

[[annotation]]
id    = "de-mod-0008"
file  = "src/de/mod.rs"
lines = "166-197"
title = "custom — the one method a format must write"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "12-errors-iterators-closures"
rust_features = ["custom-errors", "traits", "result"]
prereqs = ["de-mod-0007"]
body = """
The same signature as its serialization counterpart — `fn custom<T>(msg: T) -> Self
where T: Display` — and the same rationale: a `Deserialize` impl that hits a
problem has no idea what error type the format uses and cannot construct one, so
every format must offer a way to build an error out of any displayable value.

`Display` rather than `&str` again, so `format_args!` can be passed without
allocating. Every one of the seven default methods below relies on that.

The doc example is the pattern you will actually write. Deserialize a `String`,
call `.parse()`, and map the parse failure through `de::Error::custom` — three
lines that turn any `FromStr` type into a `Deserialize` type. It is the most
common hand-written `Deserialize` impl there is, and it never mentions `Visitor`
at all.

Note the style rule, repeated from `ser`: messages are not capitalized and do not
end with a period, because they get embedded inside larger messages by formats.
"""

[[annotation]]
id    = "de-mod-0009"
file  = "src/de/mod.rs"
lines = "198-233"
title = "invalid_type and invalid_value — the two that read the input back to you"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "12-errors-iterators-closures"
rust_features = ["custom-errors", "trait-objects", "default-methods"]
prereqs = ["de-mod-0008"]
body = """
The first two of the seven defaults, and the distinction between them is exactly
the one a confused user needs: `invalid_type` means the input had the wrong
*kind* of thing, `invalid_value` means the right kind with an unusable content.
An integer where a string was expected is the first. Bytes that are not UTF-8
where a string was expected is the second — a byte string was the right shape, its
contents were not.

Both take `unexp: Unexpected` and `exp: &dyn Expected`, and the pairing is worth
noticing. `Unexpected` is an enum of what was found, built by the deserializer.
`Expected` is a **trait object** — one of only a handful of `dyn` uses in the
whole crate — because what was expected is described by the `Visitor` that was
waiting, and any visitor can supply it.

`#[cold]` on every default method here tells the optimizer these are error paths:
move the code out of line and lay out the caller's hot path without them. It
appears on all seven, and on nothing else in this module.

The bodies all funnel into `custom(format_args!(...))`. A format that implements
only `custom` still gets *"invalid type: integer `7`, expected a string"* for
free, phrased identically to every other serde format. That uniformity is the
point of putting these here instead of leaving each format to invent its own.
"""

[[annotation]]
id    = "de-mod-0010"
file  = "src/de/mod.rs"
lines = "234-247"
title = "invalid_length — for the shapes that count"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["custom-errors", "default-methods"]
prereqs = ["de-mod-0009"]
body = """
Raised when a sequence or map holds the wrong number of elements — a four-element
tuple in the input where the program declared six.

The signature is `(len: usize, exp: &dyn Expected)`, so the message can say what
was found and what was wanted, and the docs are careful to note that the count
may be too high *or* too low. A tuple, a fixed-size array, and a tuple struct all
route their length complaints here.

Same `#[cold]`, same funnel into `custom`.
"""

[[annotation]]
id    = "de-mod-0011"
file  = "src/de/mod.rs"
lines = "248-283"
title = "unknown_variant and unknown_field — where the derive's field lists surface"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["custom-errors", "default-methods", "proc-macro-boundary"]
prereqs = ["de-mod-0010"]
body = """
These two produce the error messages people actually see, and their second
parameter is where derived code shows through: `expected: &'static [&'static str]`
is the list of names `serde_derive` baked into the binary when it generated the
impl. Both `'static`, because both are compile-time constants — the field names of
your struct, sitting in the read-only section of your program.

Each has two branches. When the list is empty the message says *"there are no
variants"* rather than listing nothing, which is the difference between a useful
error and a confusing one for a struct with `#[serde(deny_unknown_fields)]` and no
fields.

Otherwise the list is wrapped in `OneOf`, a helper defined further down this file
whose only job is to render `["a", "b", "c"]` as *"one of `a`, `b`, `c`"* with
correct grammar at one, two, and many. Ten lines of formatting code, so that
thousands of error messages read like English.
"""

[[annotation]]
id    = "de-mod-0012"
file  = "src/de/mod.rs"
lines = "284-301"
title = "missing_field and duplicate_field — the last two, and the end of the macro"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["custom-errors", "default-methods"]
prereqs = ["de-mod-0011"]
body = """
The simplest of the seven. Both take a single `&'static str` — again a name the
derive knew at compile time — and both produce a one-clause message.

`duplicate_field` is the one worth pausing on, because it encodes a decision that
is not obvious: seeing the same field twice is an **error**, not a
last-one-wins overwrite. Formats vary on this and JSON's own specification
declines to rule, so serde ruled, and every derived struct rejects duplicates
identically.

Then three closing braces: the trait, the macro's single rule, and the macro.
"""

[[annotation]]
id    = "de-mod-0013"
file  = "src/de/mod.rs"
lines = "302-307"
title = "The two invocations, unchanged from ser"
kind  = "macro-use"
