[[annotation]]
id    = "de-mod-0056"
file  = "src/de/mod.rs"
lines = "1634-1654"
title = "visit_none and visit_some — the second of which receives a deserializer"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["option", "default-methods", "generic-params"]
prereqs = ["de-mod-0036"]
body = """
`visit_none` takes nothing. `visit_some` takes **a deserializer**, not a value.

That is the detail to hold on to. At the moment the visitor learns something is
present, the inner value has not been read — the format has only established that
it is not null. The visitor is handed the means to read it and decides what type
to read it as.

The error types differ in a way that follows from this. `visit_none` is generic
over `E: Error` like every other visit method; `visit_some` returns `D::Error`,
because the error can now come from the nested deserialization rather than from
this call. The same pattern appears in `visit_newtype_struct` below, and in
`visit_seq`, `visit_map`, and `visit_enum`, which all borrow their error type
from the access object they were given.

Both defaults refuse with `Unexpected::Option`, which is why a `u32` field
rejects a JSON `null` rather than silently producing zero.
"""

[[annotation]]
id    = "de-mod-0057"
file  = "src/de/mod.rs"
lines = "1655-1678"
title = "visit_unit and visit_newtype_struct"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "generic-params"]
prereqs = ["de-mod-0056"]
body = """
`visit_unit` receives nothing and means nothing was there. It is what a
`()`-producing visitor implements, and also what `Option`'s visitor sees in
formats that encode `None` as a unit rather than as a null.

`visit_newtype_struct` receives a deserializer for the wrapped value, mirroring
`visit_some`. Since newtype wrappers are transparent on the serialization side, a
format that wrote nothing extra will call this method with a deserializer
positioned exactly where the inner value starts — the wrapper costs nothing in
either direction.

`let _ = deserializer;` in both defaults, discarding the parameter without
renaming it so rustdoc keeps the documented name. The same convention as
`ser/impossible.rs`.
"""

[[annotation]]
id    = "de-mod-0058"
file  = "src/de/mod.rs"
lines = "1679-1711"
title = "visit_seq, visit_map, visit_enum — where the visitor takes control"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "generic-params", "associated-types"]
prereqs = ["de-mod-0056"]
body = """
The three compound methods, and the inversion is complete here.

Each receives an **access object** — `SeqAccess`, `MapAccess`, `EnumAccess` — and
the visitor drives it. The deserializer is not looping and calling back; it has
handed over a cursor and is waiting. That is why the flattening doctest earlier
could run a `while let Some(elem) = seq.next_element()?` loop inside
`visit_seq`: at that moment the visitor is in charge, and the format is the thing
being asked.

The error type is `A::Error`, taken from the access object rather than from a
generic `E`. There is nowhere else it could come from — the errors that arise
inside the loop are the format's.

All three defaults refuse, so a scalar visitor handed a JSON array reports
*"invalid type: sequence, expected …"* rather than doing something creative.
"""

[[annotation]]
id    = "de-mod-0059"
