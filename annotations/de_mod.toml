prereqs = ["de-mod-0042"]
body = """
The second hidden method in this file, for flattened `Option` fields, and the
signature is worth a second look: `Result<Self::Value, ()>`.

An error type of `()` carries no information, which tells you this is a **probe**
rather than an operation. The caller is asking "can you produce a value from
this?" and the only two answers needed are yes-with-a-value and no. There is
nothing to report, because a failure here is not an error — it is the normal path
