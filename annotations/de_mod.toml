[[annotation]]
id    = "de-mod-0014"
file  = "src/de/mod.rs"
lines = "308-336"
title = "Unexpected — naming what the input actually held"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["custom-errors", "traits"]
prereqs = ["de-mod-0009"]
body = """
The docs give this type one job: describe *what was found*, so that
`invalid_type` and `invalid_value` can say something more useful than "wrong
type".

Read the doctest carefully, because it is the shape of every rejection you will
ever write. A `Visitor` that does not want booleans implements `visit_bool` and
immediately returns `Err(de::Error::invalid_type(Unexpected::Bool(v), &self))`.
The visitor reports the value it was handed *and passes itself* as the
description of what it wanted — that second argument is why the `Expected` trait
below exists.

Note that this is what a `Visitor` does with a method it does not support. It
does not omit the method; it implements it and refuses. The reason is in the
`Visitor` trait further down, and it is the single most important thing to
understand about this module.
"""

[[annotation]]
id    = "de-mod-0015"
file  = "src/de/mod.rs"
lines = "337-399"
title = "Eighteen variants, and the ones the data model collapses"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["pattern-matching", "borrowing", "lifetimes", "ownership"]
prereqs = ["de-mod-0014", "ser-mod-0013"]
body = """
Eighteen variants for twenty-nine data model types, so some collapsing has
happened, and the collapses are informative.

`Unsigned(u64)` covers `u8` through `u64`; `Signed(i64)` covers `i8` through
`i64`. The width is not preserved, because an error message saying *"expected a
u16, found an integer"* loses nothing by not saying which integer width the
input happened to use. `Float(f64)` does the same for `f32`.

What is missing is more interesting: there is **no variant for 128-bit
integers**. A format that hands a visitor a `u128` it did not want has to report
it through `Other`, losing the value. The same gap as `serialize_i128`'s erroring
default — 128-bit support was added late and did not reach everywhere.

`Unexpected<'a>` carries a lifetime because `Str` and `Bytes` **borrow**. Building
an error out of a string the deserializer is holding costs no allocation, which
matters when the error is being constructed on a path that may be hot in a
parser that fails often. The whole enum is `Copy` for the same reason — every
payload is either a scalar or a shared reference.

`Other(&'a str)` is the escape hatch, with a documented style rule: a noun
phrase, uncapitalized, no period, because it gets embedded mid-sentence. The
docs' own example — *"unoriginal superhero"* — tells you these messages are
expected to be specific.
"""

[[annotation]]
id    = "de-mod-0016"
file  = "src/de/mod.rs"
lines = "400-425"
title = "Display for Unexpected — three deliberate choices in eighteen lines"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "strings", "modules"]
prereqs = ["de-mod-0015"]
body = """
A flat match producing one phrase per variant, and three of the arms are
decisions rather than transcriptions.

**`Bytes(_)` prints "byte array" and nothing else.** The bytes themselves are
discarded. They could be megabytes, they could be binary noise, and an error
message is the wrong place for either. Compare `Str(s)`, which uses `{:?}` — so a
string is quoted and escaped, and a string containing a newline does not break
the message across lines.

**`Unsigned` and `Signed` both print "integer".** The signedness is not leaked,
so *"invalid type: integer `-1`, expected u32"* reads the way a person would say
it.

**`Float` goes through `WithDecimalPoint`.** That helper, defined at the bottom
of this file, exists to stop `1.0f64` from rendering as `1` — which would make
*"invalid type: floating point `1`"* look like it was complaining about an
integer. It wraps the formatter, watches the bytes going past for a `.`, and
appends `.0` if none appeared. Thirty lines of machinery so that one class of
error message cannot mislead.

`use self::Unexpected::*;` inside the function body keeps eighteen match arms
from being eighteen qualified paths, without polluting the module.
"""

[[annotation]]
id    = "de-mod-0017"
file  = "src/de/mod.rs"
lines = "426-488"
title = "Expected — a one-method trait that Display could not have been"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "09-blanket-impls-and-coherence"
rust_features = ["traits", "trait-objects", "blanket-impls"]
prereqs = ["de-mod-0014"]
body = """
One method, with the identical signature to `Display::fmt`. The obvious question
is why this is not simply `Display`, and the answer is coherence.

What serde needs is for **every `Visitor` to be usable as a description of what
was expected**, so a visitor can pass `&self` into an error constructor. That
means a blanket impl over all visitors. `Display` is a foreign trait — it belongs
to `core` — and the orphan rules forbid
`impl<T: Visitor<'_>> Display for T` in a crate that owns neither. Declaring a
local trait sidesteps the problem entirely: `Expected` is serde's, so serde may
blanket-implement it for whatever it likes.

The docs also fix the wording convention. The message completes the sentence
*"This Visitor expects to receive …"*, so it is a noun phrase — *"an integer
between 0 and 64"* — uncapitalized and unpunctuated, matching every other error
string in this file.

Two doctests for the two ways to supply one. Inside a `Visitor`, pass `&self` and
the message comes from `expecting`. Outside, pass `&"a negative integer"` and the
string is the message. The second is what you want in a hand-written
`Deserialize` that is validating rather than visiting.
"""

[[annotation]]
id    = "de-mod-0018"
file  = "src/de/mod.rs"
lines = "489-510"
title = "Three impls, including one on a trait object"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "09-blanket-impls-and-coherence"
rust_features = ["blanket-impls", "trait-objects", "lifetimes", "sized-bound"]
prereqs = ["de-mod-0017"]
body = """
Twenty lines that make the previous annotation's design work, and every one of
the three is doing something slightly unusual.

`impl<'de, T> Expected for T where T: Visitor<'de>` is the blanket impl the trait
was created for: every visitor describes itself by forwarding to its own
`expecting` method. Note that `'de` appears nowhere in the self type — it is an
unconstrained lifetime parameter, which Rust permits for lifetimes though not for
type parameters, and it is fine here because the body cannot depend on it.

`impl Expected for &str` is what makes `&"a negative integer"` compile. The
argument type is `&dyn Expected`, so a `&&str` coerces with `&str` as the
concrete type behind the object.

`impl Display for dyn Expected + '_` is the one to stop at. This implements a
trait **for a trait object type** rather than for a concrete type — legal,
occasionally necessary, and rare enough that most Rust programmers never write
one. It exists because the error constructors interpolate `exp` into
`format_args!("... expected {}", exp)`, and `{}` requires `Display` on the
`dyn Expected` itself, not on the types behind it. The body just forwards to
`Expected::fmt`.

The `+ '_` is an elided lifetime bound on the object type, letting the impl cover
`dyn Expected + 'a` for any `'a` rather than only the `'static` case.
"""

[[annotation]]
id    = "de-mod-0019"
file  = "src/de/mod.rs"
lines = "511-554"
title = "Deserialize — and the Sized bound that Serialize refused"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["traits", "sized-bound", "lifetime-de", "lifetimes"]
prereqs = ["ser-mod-0010", "de-mod-0004"]
body = """
`pub trait Deserialize<'de>: Sized` — two differences from `Serialize`, and both
matter.

**`Sized`.** `Serialize` deliberately has no supertrait at all, which is what
lets `str`, `[T]`, `Path`, and `CStr` implement it. `Deserialize` requires
`Sized` because its method returns `Self` by value, and you cannot return an
unsized value. That single bound is the reason the type list at the top of this
file differs from the serialization one: everything unsized can be written and
cannot be read back. `String` deserializes; `str` cannot.

**`'de`.** The docs define it in one sentence — *"the lifetime of data that may
be borrowed by `Self` when deserialized"* — and that sentence is worth
memorizing, because it is the answer to almost every confusing `'de` error. It is
not the lifetime of the deserializer. It is not the lifetime of `Self`. It is the
lifetime of **the input**, and a type only constrains it if the type intends to
borrow from that input. `String` implements `Deserialize<'de>` for every `'de`
because it borrows nothing; `&'a str` implements `Deserialize<'de>` only where
`'de: 'a`, because it borrows everything.

The `on_unimplemented` attribute is more helpful than its `ser` counterpart: two
`note` lines telling you to add a derive for your own type, or to look for a
`serde` feature flag on someone else's. That second note answers what is probably
the most frequently asked question in the ecosystem.

The comment above the message is a small piece of packaging care —
`serde_core::de::Deserialize` would confuse anyone who has only ever depended on
`serde`, so the message names `serde::Deserialize` regardless of which crate the
trait physically lives in.
"""

[[annotation]]
id    = "de-mod-0020"
file  = "src/de/mod.rs"
lines = "555-563"
title = "deserialize — an associated function, because there is no value yet"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "generic-params", "result"]
prereqs = ["de-mod-0019", "ser-mod-0012"]
body = """
Put this next to `Serialize::serialize` and the fundamental asymmetry of the two
halves is visible in one line of signature.

```rust
fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>   // ser
fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>       // de
```

Serializing has a `&self`: the value exists, and the method describes it.
Deserializing has **no `self` at all** — it is an associated function, not a
method, because the whole point is to produce a value that does not exist yet.
There is nothing to take a reference to.

That is why `Self` moves from the input side to the output side, and why the
trait needs `Sized`. The error type still comes from the format, exactly as it
does on the other side: the data structure does not know and does not care what
`D::Error` is.

`D: Deserializer<'de>` ties the format's lifetime parameter to the trait's. The
input a `String` may borrow from is the same input the deserializer is reading —
they are one lifetime, threaded through both traits so the compiler can check
that a borrowed result does not outlive the bytes it points into.
"""

[[annotation]]
id    = "de-mod-0021"
file  = "src/de/mod.rs"
lines = "564-593"
title = "deserialize_in_place — public, stable, and hidden on purpose"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "borrowing", "visibility"]
prereqs = ["de-mod-0020"]
body = """
A second method, with a default body, that most people will never call — and the
documentation says so in as many words: *"This method is stable and an official
public API, but hidden from the documentation because it is almost never what
newbies are looking for."*

That is an unusually candid piece of API design, and worth recognising as a
technique. `#[doc(hidden)]` normally signals "internal, do not touch". Here it
means "supported, but showing it would mislead by prominence". The prose is doing
the work `#[doc(hidden)]` alone would have got wrong.

What it does: deserialize into an existing value rather than returning a fresh
one, so a `Vec` in a loop can keep its allocation instead of being rebuilt every
iteration. The derive can generate these, and it forwards recursively — the docs
warn that a manual implementation must call `deserialize_in_place` on its fields
too, or the reuse stops at the first level.

The caveat is the interesting part of the contract: **on error, `place` is left
in an indeterminate state**, partially overwritten, though always memory-safe.
Very few Rust APIs are willing to say that out loud. It is only acceptable
because of the stated use case — a value that is about to be overwritten again
anyway — and stating it is what keeps it from being a trap.

The default body just delegates, so a type that ignores this method costs
nothing and behaves correctly.
"""

[[annotation]]
id    = "de-mod-0022"
file  = "src/de/mod.rs"
lines = "594-633"
title = "DeserializeOwned — a higher-ranked bound wearing a trait's clothing"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["hrtb", "blanket-impls", "lifetime-de", "sealed-traits"]
prereqs = ["de-mod-0019"]
body = """
Two lines of code and forty of explanation, and the two lines are the important
Rust in this file:

```rust
pub trait DeserializeOwned: for<'de> Deserialize<'de> {}
impl<T> DeserializeOwned for T where T: for<'de> Deserialize<'de> {}
```

An empty trait with a blanket impl is an **alias**: you never implement it, you
only ask for it. What it aliases is `for<'de> Deserialize<'de>` — a higher-ranked
trait bound, one of only two in the entire crate. Read it as *"deserializable
from an input of any lifetime whatsoever, including one shorter than the
result"*, which can only be true of a type that borrows nothing from the input.
Hence the name.

The doctest gives the reason it exists. `from_str<'a, T: Deserialize<'a>>` can
return a type that borrows out of the string you passed in. `from_reader<T:
DeserializeOwned>` cannot — the reader's buffer is gone by the time you get the
value — so the bound has to exclude every borrowing type, and this is how you
spell that.

**The trap worth knowing:** `T: DeserializeOwned` is not the same as
`T: Deserialize<'static>`, and people reach for the second one first. `&'static
str` satisfies `Deserialize<'static>` — it borrows, but from data that lives
forever. It does *not* satisfy `for<'de> Deserialize<'de>`, because a short `'de`
would leave it borrowing from something already dropped. If you write
`Deserialize<'static>` where you meant "owns its data", you have written a bound
that quietly admits the one case you were trying to exclude.

Writing the alias as a trait rather than making everyone type `for<'de>` is
mostly ergonomics, but it also gives the bound a name that says what it means
rather than how it is spelled.
"""

[[annotation]]
id    = "de-mod-0023"
file  = "src/de/mod.rs"
lines = "634-694"
title = "DeserializeSeed — the answer to \"how do I pass data into Deserialize?\""
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "marker-types"]
prereqs = ["de-mod-0020"]
body = """
The docs open by naming the question this trait answers: *"If you ever find
yourself looking for a way to pass data into a `Deserialize` impl, this trait is
the way to do it."* People do look for that, repeatedly, and the reason they
cannot find it is structural — `Deserialize::deserialize` has no `self`, so there
is nowhere for state to enter.

`DeserializeSeed` restores the `self`. The seed *is* the state, passed by value
into `deserialize`, and the produced value is a separate associated type rather
than `Self`.

The two signatures the docs put side by side are the whole idea:

```rust
fn func<'de, T: Deserialize<'de>>() -> Result<T, Error>
fn func_seed<'de, T: DeserializeSeed<'de>>(seed: T) -> Result<T::Value, Error>
```

The second is strictly more general, which raises the obvious objection: why not
make everything seeded? The answer is in the last paragraph — stateless
deserialization is the overwhelming majority, and a seeded API is appeased by
passing `PhantomData`. That escape hatch is implemented at the bottom of this
section, and it is what makes the generalization free.
"""

[[annotation]]
id    = "de-mod-0024"
file  = "src/de/mod.rs"
lines = "695-796"
title = "The flattening example — a hundred lines that teach the whole module"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "borrowing", "lifetimes", "collections"]
prereqs = ["de-mod-0023"]
body = """
The largest doctest in the crate, and the best single piece of teaching in it.
The task: turn `[[1, 2], [3, 4, 5], [6]]` into `vec![1, 2, 3, 4, 5, 6]` with one
allocation rather than one per inner array.

Trace the pieces, because every trait in this module appears:

- `FlattenedVecVisitor<T>` walks the **outer** array. Its `Value` is the finished
  `Vec<T>`, and it creates the single vector.
- For each inner array it calls `seq.next_element_seed(ExtendVec(&mut vec))`
  rather than `next_element`. That is the whole trick — the seed carries a
  mutable borrow of the vector into the nested deserialization.
- `ExtendVec<'a, T>(&'a mut Vec<T>)` is the seed. Its `Value` is `()`, because it
  appends rather than produces. A seed whose output is nothing is a perfectly
  ordinary seed.
- `ExtendVecVisitor` is defined **inside** the method that uses it — a serde
  idiom you will see everywhere. Visitors are single-use types with no meaning
  outside one call, so they are declared in the narrowest scope that works.
- `seq.size_hint()` reserves capacity when the format knows the length. Note it
  is an `Option`: a streaming format may not know, and the code copes.

Then read the borrow structure. `&mut vec` is handed to a seed, which hands it to
a visitor, which pushes through it while the outer loop is suspended mid-iteration
— and none of it needs `RefCell` or unsafe, because the outer visitor is not
touching the vector while the inner one holds it. The lifetime `'a` on `ExtendVec`
is what proves that to the compiler.

If you read one doctest in this crate, read this one.
"""

[[annotation]]
id    = "de-mod-0025"
file  = "src/de/mod.rs"
lines = "797-812"
title = "The trait itself — self by value, Value by association"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "sized-bound", "ownership"]
prereqs = ["de-mod-0024"]
body = """
Sixteen lines after a hundred of explanation, which is the right ratio for a
trait this small and this easy to misread.

`type Value` is separate from `Self`. The seed and its product are different
types — `ExtendVec` produces `()`, `PhantomData<T>` produces `T` — and conflating
them is the usual first mistake.

`fn deserialize(self, ...)` takes `self` **by value**. Not `&self`, not `&mut
self`. A seed is consumed by the deserialization it feeds, which is what allows
it to hand out the `&mut Vec<T>` it was holding without any borrow outliving the
call.

`Sized` for the same reason as `Deserialize`: the seed is moved.
"""

[[annotation]]
id    = "de-mod-0026"
file  = "src/de/mod.rs"
lines = "813-827"
title = "PhantomData as a seed — the bridge back to stateless"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "08-phantomdata-and-variance"
rust_features = ["marker-types", "blanket-impls", "zero-cost", "inlining"]
prereqs = ["de-mod-0025", "ser-impls-0015"]
body = """
Fourteen lines that make the entire seeded API optional.

`PhantomData<T>` carries no data, which makes it the exact expression of "a seed
with no state". Its `Value` is `T`, and its `deserialize` forwards straight to
`T::deserialize`. So any function that demands a `DeserializeSeed` can be called
statelessly by passing `PhantomData`, and the result is identical to what
`Deserialize` would have produced.

This is why serde could make every access trait's method pair — `next_element`
and `next_element_seed`, `next_value` and `next_value_seed` — where the
convenient one is defined in terms of the general one. Without this impl the two
worlds would need parallel implementations. With it, the stateless case is the
stateful case with a zero-sized seed, and `#[inline]` on a body this small means
the abstraction has no run-time existence at all.

Worth noticing what `PhantomData` is doing here, because it is not the usual job.
Elsewhere in this crate it appears as a field, marking a type parameter as used.
Here it is a **value**, chosen precisely because it is the only value its type
has, so passing it communicates a type and nothing else.
"""

[[annotation]]
id    = "de-mod-0027"
file  = "src/de/mod.rs"
lines = "828-894"
title = "The same 29 types, read back — and the sentence that starts everything"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "strings", "borrowing"]
prereqs = ["ser-mod-0013", "ser-mod-0014"]
body = """
The same twenty-nine types as `ser/mod.rs`, described from the other direction,
and the list is nearly a transcription. Two entries are not.

Under **string**: *"When serializing, all strings are handled equally. When
deserializing, there are three flavors of strings: transient, owned, and
borrowed."* Under **byte array**, the same note. Those two sentences are the
reason this half of the crate is shaped the way it is.

Serializing a string is one case: you have a `&str`, you hand it over, the format
copies what it needs. Reading one back is three:

- **transient** — the deserializer has the text in a scratch buffer it is about
  to reuse. The visitor may look but must copy if it wants to keep it.
- **owned** — the deserializer built a `String` and will give it away. If the
  visitor wanted a `String` anyway, no copy happens.
- **borrowed** — the text sits in the original input, unchanged and still alive.
  The visitor may keep a reference into it, and no copy happens at all.

Only the third can produce a `&str` that outlives the call, and only if the
visitor can prove the input outlives the result. That proof is the `'de`
lifetime.

The other difference is in **seq** and **tuple**: on the serialization side the
length may be unknown, on this side a `seq`'s length is discovered by reading and
a `tuple`'s is known before reading starts. Same distinction, opposite direction.
"""

[[annotation]]
id    = "de-mod-0028"
file  = "src/de/mod.rs"
lines = "895-944"
title = "Two entry points, and the choice that decides which formats you support"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["traits", "lifetime-de"]
prereqs = ["de-mod-0027"]
body = """
The most consequential fifty lines in the module, and they are prose rather than
code.

**`deserialize_any`** asks the format *"what have you got?"* A self-describing
format like JSON can answer — an opening brace means a map — and drives the
visitor accordingly. This is how `serde_json::Value` works: it does not know what
it wants, so it accepts whatever is there.

**The `deserialize_*` methods** tell the format what to expect. They are *hints*,
not commands: `deserialize_u64` says "the program is expecting an integer here",
and a non-self-describing format like Postcard needs exactly that, because the
bytes on the wire do not say what they are. Without the hint there is nothing to
read.

Then the warning, and it deserves to be read as a rule rather than advice:
*"relying on `Deserializer::deserialize_any` means your data type will be able to
deserialize from self-describing formats only, ruling out Postcard and many
others."*

That is a real fork in the road, and it is invisible at the point you take it. A
hand-written `Deserialize` that calls `deserialize_any` because it seemed simpler
compiles fine, works fine in tests against JSON, and silently cannot be used with
half the format ecosystem. Anyone reviewing a manual `Deserialize` impl should
look for this first.

The `# Lifetime` section restates `'de` once more, this time as *"the lifetime of
data that may be borrowed from the input"* — subtly different wording from
`Deserialize`'s, and the difference is the point of view: there, what `Self` may
borrow; here, what the format may lend.
"""

[[annotation]]
id    = "de-mod-0029"
file  = "src/de/mod.rs"
lines = "945-962"
title = "Deserializer, its Error type, and deserialize_any"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "sized-bound", "generic-params"]
prereqs = ["de-mod-0028", "ser-mod-0017"]
body = """
`pub trait Deserializer<'de>: Sized` — `Sized` for the same reason `Serializer`
needs it: every method takes `self` by value, so the type has to be movable, and
`dyn Deserializer` is ruled out.

`type Error: Error` is the only associated type here, against `Serializer`'s
nine. The reason is the whole design of this half: a serializer needs seven
associated types because *it* builds the compound structures, while a
deserializer hands the visitor an access object and the visitor drives. Those
access types are generic parameters on the visitor's methods rather than
associated types on the format.

`deserialize_any` comes first, and it is **required**, not defaulted. A format
that cannot self-describe still has to provide it — and typically provides one
that returns an error. Serde could have given it a default; leaving it required
forces every format author to make the decision consciously.

The shape every method in this trait shares: take `self`, take a visitor, return
`V::Value`. The deserializer never returns data. It calls a method on the visitor
and returns whatever the visitor made.
"""

[[annotation]]
id    = "de-mod-0030"
file  = "src/de/mod.rs"
lines = "963-987"
title = "bool, i8 … i64 — six hints, one shape"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "generic-params"]
prereqs = ["de-mod-0029", "ser-mod-0019"]
body = """
Six required methods, identical apart from the type they name, each documented
with the same sentence: *"Hint that the `Deserialize` type is expecting an `iN`
value."*

The word **hint** is doing precise work. This is not a request to produce an
`i32`; it is a statement about what the program wants, and the format is free to
supply something else. A JSON deserializer asked for `deserialize_i32` on the
input `1.0` may legitimately call `visit_f64` — and then it is the *visitor* that
decides whether to accept, convert, or reject.

That is the inversion at the heart of this module. On the serialization side,
calling `serialize_i32` writes an `i32`. Here, calling `deserialize_i32` asks a
question and the answer arrives through a completely different trait.
"""

[[annotation]]
id    = "de-mod-0031"
file  = "src/de/mod.rs"
lines = "988-997"
title = "deserialize_i128 — the same late arrival, from the other side"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "custom-errors"]
prereqs = ["ser-mod-0021", "de-mod-0030"]
body = """
The mirror of `serialize_i128`: one of only two methods in this trait with a
default body, and that body is
`Err(Error::custom("i128 is not supported"))` — the same message, in the same
words, as its serialization counterpart.

`let _ = visitor;` to discard the unused parameter without renaming it, the same
convention as `ser/impossible.rs`.

The reason is compatibility. Adding a required method to a public trait breaks
every existing implementation, so 128-bit support arrived as a default that
fails, and formats opt in one at a time. The cost is that a type using `i128`
compiles against every format and fails at run time against the ones that never
implemented it.
"""

