[[annotation]]
id    = "de-mod-0068"
file  = "src/de/mod.rs"
lines = "2008-2034"
title = "EnumAccess — the two-step that enums require"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits", "lifetime-de"]
prereqs = ["de-mod-0063"]
body = """
*"created by the `Deserializer` and passed to the `Visitor` in order to identify
which variant of an enum to deserialize."*

Identify first, then read. An enum cannot be deserialized in one step, because
what to read depends on which variant is present, and that has to be discovered
before anything else can happen. `EnumAccess` is step one; `VariantAccess`, the
trait immediately below, is step two.

Nothing on the serialization side needs this. Writing an enum, you already know
the variant.
"""

[[annotation]]
id    = "de-mod-0069"
file  = "src/de/mod.rs"
lines = "2035-2063"
title = "variant_seed — the method that returns the next trait object to talk to"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["associated-types", "traits", "sized-bound"]
prereqs = ["de-mod-0068"]
body = """
Two associated types, and the second one carries the interesting constraint:

```rust
type Variant: VariantAccess<'de, Error = Self::Error>;
```

An associated type bounded by another trait, *with that trait's own associated
type pinned to this one's*. The two halves of reading an enum must agree on their
error type, and this is how you say that in Rust. Without the `Error =` clause a
visitor would have two unrelated error types to reconcile mid-way through
deserializing one value.

`variant_seed` returns `(V::Value, Self::Variant)` — the identified variant *and*
the object for reading its contents. That pairing is the whole two-step handoff
in one return type: you learn which variant it is and simultaneously receive
permission to read it.

`Sized` is back on this trait, unlike the two access traits above, because
`variant_seed` takes `self` by value. Identification happens once, so the object
is consumed.
"""

[[annotation]]
id    = "de-mod-0070"
file  = "src/de/mod.rs"
lines = "2064-2092"
title = "VariantAccess — step two, and a doc comment that calls it a visitor"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
prereqs = ["de-mod-0069"]
body = """
The receiving half of the handoff: four methods, one per variant shape — unit,
newtype, tuple, struct — matching the four `serialize_*_variant` methods on the
other side exactly.

The opening sentence is slightly off, and worth flagging because it can mislead:
*"`VariantAccess` is a visitor that is created by the `Deserializer`."* It is not
a `Visitor`. It is an access object, in the same family as `SeqAccess` and
`MapAccess`, and two of its methods *take* a visitor. The word is being used
loosely in the older sense of "the thing that walks the data", and reading it as
the trait name sends you looking for a `Visitor` impl that does not exist.

`type Error: Error`, documented as *"Must match the error type of our
`EnumAccess`"* — which the `Error = Self::Error` bound above already enforces, so
the comment is describing a guarantee rather than asking for cooperation.
"""

[[annotation]]
id    = "de-mod-0071"
file  = "src/de/mod.rs"
lines = "2093-2128"
title = "unit_variant — and thirty lines of doctest showing how to refuse"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "custom-errors"]
prereqs = ["de-mod-0070", "ser-mod-0030"]
body = """
The signature is three words long: `fn unit_variant(self) -> Result<(),
Self::Error>`. There is nothing to read, so nothing comes back — the method
exists to consume whatever the format wrote and to confirm the shape was right.

The thirty lines above it are a complete worked example of the *failure* path,
and all four methods in this trait carry one. They show precisely which
`invalid_type` error to construct when the input holds a different variant shape
than expected — `Unexpected::UnitVariant`, `&"tuple variant"`, and so on.

That is unusual documentation. Serde is not describing what the method does; it
is prescribing the exact error a correct implementation must produce, because
these are the messages users see when an enum does not match, and four format
authors inventing four phrasings would be four different debugging experiences
for the same mistake.
"""

[[annotation]]
id    = "de-mod-0072"
file  = "src/de/mod.rs"
