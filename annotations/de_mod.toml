The map counterpart to `SeqAccess`, and structurally the same: created by the
deserializer, driven by the visitor, parameterized by `'de` for what the entries
may borrow.

It has seven methods to `SeqAccess`'s three, and the extra four are all
consequences of one fact — a map entry is two things arriving separately, so
there are two ways to ask for them and both need a seeded and a stateless form.
