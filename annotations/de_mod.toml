[[annotation]]
id    = "de-mod-0001"
file  = "src/de/mod.rs"
lines = "1-10"
title = "The same two roles, and why this half is harder"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "01-why-a-data-model"
rust_features = ["traits"]
prereqs = ["ser-mod-0001"]
body = """
Word for word the structure of `ser/mod.rs`: a data structure trait and a data
format trait, each knowing nothing about the other. Read the two openings side by
side and the symmetry is exact.

The asymmetry is in what the two jobs actually involve. Serializing means walking
a value you already have and telling the format what you found — the shape is
known, and the format writes it down. Deserializing means the reverse and the
information flows the wrong way: the format has bytes, the type knows what it
wants, and neither can proceed alone.

That is the whole reason this module is larger and stranger than its counterpart.
`ser` has two traits worth reading. `de` has `Deserialize`, `Deserializer`,
`Visitor`, `SeqAccess`, `MapAccess`, `EnumAccess`, `VariantAccess`,
`DeserializeSeed`, and a lifetime parameter threading through all of them. Every
one of those exists because you cannot hand back a value the caller has not told
you how to build.
"""

[[annotation]]
id    = "de-mod-0002"
file  = "src/de/mod.rs"
lines = "11-29"
title = "Where Deserialize implementations come from"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits", "proc-macro-boundary"]
prereqs = ["ser-mod-0002"]
body = """
The same four sources as on the serialization side: built into serde, generated
by `serde_derive`, written by hand, or supplied by a third-party crate for its
own types.

Note the phrasing of the third: *"In rare cases it may be necessary to implement
`Deserialize` manually."* On the `Serialize` side, writing one by hand is
unusual but straightforward — you have the value, you describe it. Doing the same
here means writing a `Visitor`, and the docs are being honest by calling it rare
rather than routine. Most of the difficulty in this module is difficulty you
never meet, because the derive absorbs it.
"""

[[annotation]]
id    = "de-mod-0003"
file  = "src/de/mod.rs"
lines = "30-37"
title = "Formats live in other crates, on this side too"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits"]
prereqs = ["ser-mod-0003"]
body = """
Three named examples, the same three the serialization module names, and the same
consequence: serde ships no format at all. `serde_json`, `serde_yaml`, and
`postcard` implement `Deserializer` without serde knowing they exist.

Worth noticing that the two lists are identical. A crate that implements one half
almost always implements both, because the hard part — modelling the format — is
shared, and shipping only half would be a strange product.
"""

[[annotation]]
id    = "de-mod-0004"
file  = "src/de/mod.rs"
lines = "38-102"
title = "The built-in list, and the types that only go one way"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "strings", "collections"]
prereqs = ["ser-mod-0004"]
body = """
Sixty lines of list, and the sentence introducing it is the one to read twice:
*"This is a slightly different set of types than what is supported for
serialization. Some types can be serialized by Serde but not deserialized. One
example is `OsStr`."*

Compare the two lists and the differences are all the same shape. `OsStr` can be
written — `ser/impls.rs` tags it with the platform it came from — but not read
back, because reconstructing one requires either raw bytes or UTF-16 depending on
where you are running, and the target platform may not be the source platform.
`Path` serializes and does not deserialize, for the same reason `&Path` is a
borrow of something the deserializer would have to own. `SocketAddr` appears on
both. `Weak` appears on neither side of the read.

The category with no counterpart at all is **Zero-copy types**: `&str` and
`&[u8]`. Nothing in `ser` needed a heading for these, because serializing a
borrow is trivial. Deserializing *into* one means handing back a reference that
points into the deserializer's own input, and the caller has to be able to prove
that input outlives the result.

That single requirement is where the `'de` lifetime comes from, and it is the
reason this module's every trait carries a lifetime parameter that `ser`'s do
not. Two lines of a documentation list; the rest of the file is the consequence.
"""

