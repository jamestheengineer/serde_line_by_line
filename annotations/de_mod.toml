Worth remembering the asymmetry with serialization here. A `Vec<u8>` does *not*
serialize through `serialize_bytes` — it goes out as a sequence of numbers unless
you use `serde_bytes`. These two methods exist for the types that do opt in, and
for formats that have a native byte-string concept, which most binary formats do
and most text formats do not.
"""

[[annotation]]
id    = "de-mod-0036"
file  = "src/de/mod.rs"
lines = "1089-1104"
title = "option and unit — absence, and nothing"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["option", "traits"]
prereqs = ["ser-mod-0028", "ser-mod-0029"]
body = """
`deserialize_option` is what lets a format map its own idea of absence onto
`Option`. The docs say it plainly: a nullable value becomes `None` or
`Some(value)`. JSON's `null`, a missing key, a Postcard tag byte — all arrive
here, and the visitor sees `visit_none` or `visit_some`.

Note what `visit_some` receives: not a value, but *another deserializer*. The
inner value has not been read yet at the point the visitor is told there is one.
That is how `Option<T>` avoids committing to `T`'s representation.

`deserialize_unit` is the degenerate case — the input contains nothing, and
saying so still requires a method, because a format has to know to consume
whatever placeholder it wrote.
"""

[[annotation]]
id    = "de-mod-0037"
file  = "src/de/mod.rs"
lines = "1105-1123"
title = "unit_struct and newtype_struct — the first methods that carry a name"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "proc-macro-boundary"]
prereqs = ["ser-mod-0031"]
body = """
The first two methods with a parameter beyond the visitor: `name: &'static str`.

That name comes from the derive, which knew it at compile time, and it exists so
a self-describing format can check what it is reading against what the program
declared. Most formats ignore it. The ones that do not — a format that writes
type names into the output, or one checking a schema — could not work without it.

`&'static str` and not `&str`, because these are always literals baked into the
binary. Nothing has to be allocated to pass a type's own name around.
"""

[[annotation]]
id    = "de-mod-0038"
file  = "src/de/mod.rs"
lines = "1124-1145"
title = "seq, tuple, tuple_struct — where the length comes from"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "collections"]
prereqs = ["ser-mod-0033", "ser-mod-0034"]
body = """
Three methods for three levels of prior knowledge, and the parameters record
exactly how much is known before reading.

`deserialize_seq` takes nothing but a visitor: the length is whatever the input
turns out to hold. `deserialize_tuple` takes `len`, because the program knows —
a `(u8, String)` is two elements whatever the input says. `deserialize_tuple_struct`
takes a name as well.

This is the reverse of the serialization side, where `serialize_seq` takes an
`Option<usize>` hint the format may ignore. Here `len` is not a hint at all: for
a non-self-describing format it is the only thing that makes the input readable,
because the wire holds elements with nothing marking where they stop.
"""

[[annotation]]
id    = "de-mod-0039"
file  = "src/de/mod.rs"
lines = "1146-1173"
title = "map, struct, enum — and the string lists the derive hands over"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "proc-macro-boundary", "collections"]
prereqs = ["de-mod-0038", "ser-mod-0036"]
body = """
`deserialize_map` is the open case: arbitrary keys, unknown count.
`deserialize_struct` and `deserialize_enum` are the closed cases, and both take
something the open one cannot — a `&'static [&'static str]` of every field or
variant name.

Those two slices are the derive's output made visible. `serde_derive` reads your
struct definition and writes the field names into a static array, and the
deserializer receives the complete set before it reads a byte. That is what makes
several things possible at once: a format can look up a key without allocating,
`unknown_field` can list the alternatives in its error message, and a
non-self-describing format can read a struct as a plain sequence because it knows
how many fields to expect and in what order.

It is also the concrete answer to "what does the derive actually generate?" A
large part of the answer is: these two arrays, and a visitor that matches against
them.
"""

[[annotation]]
id    = "de-mod-0040"
file  = "src/de/mod.rs"
lines = "1174-1185"
title = "identifier and ignored_any — the two methods that are not about types"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "proc-macro-boundary"]
prereqs = ["de-mod-0039"]
body = """
Neither of these corresponds to a data model type. Both exist because of how
derived code reads structs and enums.

`deserialize_identifier` is called for a **field name or variant discriminant**,
not for a value. A self-describing format answers with the string it found; a
compact format answers with an integer index. Making it its own method is what
lets one derived visitor handle both, which is why the same `#[derive]` works for
JSON and Postcard.

`deserialize_ignored_any` says: whatever is here, consume it and hand back
something I can discard. This is how `#[serde(deny_unknown_fields)]`'s absence
works — an unrecognized field is skipped rather than read. The docs note the
catch: *"Deserializers for non-self-describing formats may not support this
mode"*, because skipping a value you cannot identify requires knowing how long it
is, and on a bare wire format there is nothing to measure.

`IgnoredAny`, the visitor that pairs with this method, is the entire subject of
the next file.
"""

[[annotation]]
id    = "de-mod-0041"
file  = "src/de/mod.rs"
