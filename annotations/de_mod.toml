body = """
Sixty-six lines to do for `MapAccess` what twenty-eight did for `SeqAccess`:
forward every method through the reference, `#[inline]` throughout, `A: ?Sized`
so trait objects work.

Every method is forwarded, including the ones with default bodies, for the same
reason as before — going through a default would re-derive `next_entry` from
`next_key`/`next_value` and discard whatever optimization `A` implemented.

There is no macro here, and it is the same judgement as `ser/impossible.rs`: six
methods with six different signatures, where a matcher able to accept them all
would be longer than the code it replaced.
