[[annotation]]
id    = "de-mod-0064"
file  = "src/de/mod.rs"
lines = "1837-1863"
title = "next_key_seed and next_value_seed — a state machine with a panic clause"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "borrowing"]
prereqs = ["de-mod-0063", "ser-mod-0045"]
body = """
The two required methods, and the asymmetry between their return types is the
design: `next_key_seed` returns `Option`, `next_value_seed` does not. Keys can run
out; a value cannot, because you only ask for one after a key told you it exists.

Which produces the contract in the `# Panics` section: *"Calling
`next_value_seed` before `next_key_seed` is incorrect and is allowed to panic or
return bogus results."*

Read that as a state machine with two states and no enforcement. The type system
could have prevented it — `next_key` returning a token that `next_value`
consumes — and serde chose not to, because that token would have to thread
through every derived visitor and every hand-written one for a mistake that is
hard to make and easy to notice.

This is the exact counterpart of `SerializeMap`'s `serialize_key`/`serialize_value`
split on the serialization side, including the same latitude for implementations
to misbehave when called out of order. Both halves of the crate have one place
where correctness is documented rather than checked, and it is the same place.
"""

[[annotation]]
id    = "de-mod-0065"
file  = "src/de/mod.rs"
lines = "1864-1890"
title = "next_entry_seed — the only default here that does real work"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "result", "pattern-matching"]
prereqs = ["de-mod-0064"]
body = """
Every other convenience method in these traits forwards with a `PhantomData`.
This one has a body: call `next_key_seed`, and if it produced a key, call
`next_value_seed` and pair them.

Which makes its doc note different from all the others. The rest say
implementations *should not* override; this one says they **should** override *"if
a more efficient implementation is possible"*. A format that stores entries
adjacently can read both in one pass, and the door is deliberately left open.

That is the distinction between a convenience and a genuine operation, spelled
out in the documentation rather than in the type system: forward-only methods are
frozen, methods with real bodies are hints.
"""

[[annotation]]
id    = "de-mod-0066"
file  = "src/de/mod.rs"
lines = "1891-1941"
title = "next_key, next_value, next_entry, size_hint — four conveniences"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "marker-types", "inlining"]
prereqs = ["de-mod-0065"]
body = """
Three `PhantomData` forwards and a `size_hint` that returns `None`, closing the
trait.

`next_entry` forwards two seeds at once — `self.next_entry_seed(PhantomData,
PhantomData)` — which is the stateless case of a two-seed method, and reads
slightly absurdly while being exactly right.

The `# Panics` note is repeated verbatim on `next_value`, because a caller using
the convenient API can make the same ordering mistake as one using the seeded
API. Duplicating the warning rather than linking to it is the correct call for
something people will hit at three in the morning.

`#[inline]` on every one of them: each body is a single call, and without it the
seeded/stateless split would cost a function call per map entry.
"""

[[annotation]]
