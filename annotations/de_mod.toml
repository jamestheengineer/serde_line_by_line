[[annotation]]
id    = "de-mod-0061"
file  = "src/de/mod.rs"
lines = "1749-1782"
title = "Three methods, one of which you implement"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "default-methods", "marker-types"]
prereqs = ["de-mod-0026", "de-mod-0060"]
body = """
Note what is absent from the declaration: **no `Sized` supertrait**. Unlike
`Deserializer` and `Visitor`, whose methods consume `self`, these take
`&mut self` — a sequence cursor is used repeatedly, so it is borrowed rather
than moved, and there is no reason to forbid `dyn SeqAccess`.

`next_element_seed` is the one to implement. `next_element` is a convenience
whose default is `self.next_element_seed(PhantomData)` — the bridge from the
`DeserializeSeed for PhantomData` impl paying off exactly as promised. The
stateless call is the stateful call with a zero-sized seed, so a format author
writes one method and callers get both.

The docs make it a rule: *"`SeqAccess` implementations should not override the
default behavior."* Overriding it would let the two entry points disagree, and
nothing would catch that.

`size_hint` defaults to `None` and means "I do not know", which is honest for a
streaming format. A visitor should treat it as an optimization and never as a
count — the flattening doctest gets this right, using it only to `reserve`.
"""

[[annotation]]
id    = "de-mod-0062"
file  = "src/de/mod.rs"
lines = "1783-1810"
title = "SeqAccess for &mut A — forwarding, and an apparent rule violation"
kind  = "impl"
tracks = ["reference"]
rust_features = ["blanket-impls", "borrowing", "sized-bound", "inlining"]
prereqs = ["de-mod-0061"]
body = """
A blanket impl making `&mut A` a `SeqAccess` whenever `A` is one. It exists so a
visitor holding an access object can pass `&mut seq` into a helper function
without giving up ownership — the same reason `&mut W` is the `Serializer` in
`ser/fmt.rs`, arrived at from the other direction.

`A: ?Sized` admits `&mut dyn SeqAccess`, which is only possible because this
trait has no `Sized` supertrait.

Now notice that this impl **overrides `next_element`**, which the documentation
one screen up says implementations should not do. It is not a contradiction: the
prohibition is about changing behaviour, and this forwards to the inner
`next_element` rather than reimplementing it, so whatever `A` does is exactly
what `&mut A` does. Going through the default would route a direct call into
`next_element_seed`, adding a `PhantomData` round trip for nothing. `#[inline]`
on all three makes the wrapper free.
"""

[[annotation]]
id    = "de-mod-0063"
