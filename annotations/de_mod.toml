kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "marker-types", "inlining"]
prereqs = ["de-mod-0071"]
body = """
Seeded method required, stateless convenience defaulting to
`self.newtype_variant_seed(PhantomData)`, and the docs repeating that
implementations should not override the default.

That is the fourth trait in this file built on exactly this pattern —
`SeqAccess`, `MapAccess`, `EnumAccess`, and now `VariantAccess`. Once you have
read one you have read all of them, which is the payoff for serde having applied
the idea uniformly instead of only where it was first needed.

Its own `invalid_type` doctest, prescribing the error for a variant that turned
out not to be a newtype.
"""

[[annotation]]
id    = "de-mod-0073"
file  = "src/de/mod.rs"
lines = "2187-2229"
title = "tuple_variant — where a visitor arrives instead of a seed"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "generic-params"]
prereqs = ["de-mod-0072", "de-mod-0038"]
body = """
This one breaks the pattern, and the break is informative. It takes a `len` and a
**`Visitor`**, not a seed, and there is no stateless convenience beside it.

The reason is that a tuple variant's contents are a sequence, and sequences are
read by visitors driving a `SeqAccess`, not by seeds producing single values. So
the method hands the problem back to the machinery that already handles it: call
this, get your visitor's `visit_seq` invoked, loop as usual.

`len` is present for the same reason `deserialize_tuple` takes one — a
non-self-describing format has no other way to know where the variant's fields
stop.
"""

[[annotation]]
id    = "de-mod-0074"
file  = "src/de/mod.rs"
lines = "2230-2281"
title = "struct_variant — the last method, and the last static string list"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "proc-macro-boundary"]
prereqs = ["de-mod-0073", "de-mod-0039"]
body = """
`fields: &'static [&'static str]` and a visitor — the same pair
`deserialize_struct` takes, for the same reason. A struct variant is a struct
that happens to live inside an enum, and everything true of one is true of the
other.

That closes `VariantAccess`, and with it the four access traits. Between them,
`SeqAccess`, `MapAccess`, `EnumAccess`, and `VariantAccess` cover every compound
shape in the data model, and every one of them works the same way: the
deserializer hands the visitor an object, and the visitor drives.
"""

[[annotation]]
id    = "de-mod-0075"
file  = "src/de/mod.rs"
lines = "2282-2323"
title = "IntoDeserializer — turning a value you already have into a format"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "09-blanket-impls-and-coherence"
rust_features = ["traits", "associated-types", "generic-params"]
prereqs = ["de-mod-0029"]
body = """
Six lines of trait, and it inverts everything the module has been doing.
Everywhere else a deserializer reads bytes. Here a value *becomes* a
deserializer, so that machinery expecting a format can be pointed at data already
in memory.

The doctest is the reason most people meet it. A `#[derive(Deserialize)]` enum
gets a `FromStr` impl in three lines:

```rust
Self::deserialize(s.into_deserializer())
```

A `&str` turns itself into a deserializer, the derived code reads a unit variant
out of it, and the enum's `#[serde(rename)]` attributes govern the parsing —
without a second list of strings anywhere. It is the deserialization mirror of
the `&mut Formatter` trick in `ser/fmt.rs`, and just as useful.

`E: Error = value::Error` is a **defaulted generic parameter on a trait**, which
is rare enough to be worth naming. It lets `x.into_deserializer()` work with no
turbofish in the common case, while a format that needs its own error type can
still say `IntoDeserializer<'de, MyError>`.

The implementations are in `de/value.rs`, the 1,895-line module this trait
exists to anchor.
"""

[[annotation]]
id    = "de-mod-0076"
file  = "src/de/mod.rs"
lines = "2324-2355"
title = "OneOf — thirty lines so that error messages read like English"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "iterators", "pattern-matching"]
prereqs = ["de-mod-0011"]
body = """
A private struct wrapping a slice of names, with a `Display` impl that handles
three cases separately:

- one name: `` `a` ``
- two names: `` `a` or `b` ``
- more: ``one of `a`, `b`, `c` ``

That is the difference between an error message a person reads and one they
parse. *"expected `on` or `off`"* is a sentence; *"expected one of ['on', 'off']"* is a
debug dump.

The zero case is `panic!()` with the comment `// special case elsewhere`, and the
elsewhere is `unknown_field` and `unknown_variant` back at the top of the file,
both of which check for an empty list before constructing a `OneOf`. The struct's
own doc comment states the precondition — *"The slice of names must not be
empty"* — so the panic is an assertion about a private invariant, not a
user-reachable failure.

`&'static [&'static str]` throughout: these are the derive's baked-in name lists,
and rendering them costs no allocation at all.
"""

[[annotation]]
id    = "de-mod-0077"
file  = "src/de/mod.rs"
lines = "2356-2392"
title = "WithDecimalPoint — a formatter wrapping a formatter, to add one character"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "12-errors-iterators-closures"
rust_features = ["traits", "strings", "no-std", "interior-mutability"]
prereqs = ["de-mod-0016"]
body = """
The last thirty-six lines of the file, and they exist to stop *"floating point
`1`"* from appearing in an error message about a float.

The mechanism is worth studying. `LookForDecimalPoint` is a `fmt::Write` declared
**inside** the `fmt` method that uses it, wrapping the real formatter. Every
fragment passes through it on the way out, and it sets a flag if it sees a `.`.
After the number has been written, if no decimal point went past, `.0` is
appended.

So the value is formatted exactly once, forwarded byte for byte, and inspected in
flight. The obvious alternative — render to a `String`, check it, fix it up —
would allocate, which is not available here.

Both `write_str` and `write_char` are implemented, because `Display` for `f64`
may use either and missing one would let a lone `.` through unnoticed.

The `is_finite` branch skips all of it: `inf` and `NaN` have no decimal point and
appending one would be worse than the problem being fixed.

Thirty-six lines, one character of output, in the error path of a trait method
most programs never reach. That ratio is a fair summary of the crate's attitude to
its own error messages.
"""
