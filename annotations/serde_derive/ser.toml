[[annotation]]
id    = "ser-0010"
file  = "src/ser.rs"
lines = "133-154"
title = "build_generics — four transformations, in an order that matters"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["generic-params", "where-clauses"]
glossary = ["syn::Generics", "syn::parse_quote"]
body = """
The generics on the emitted impl are the input's, put through four passes.

Defaults come off first, because `struct Foo<T = u32>` has a default in its
definition and repeating it on the impl is a syntax error. Then per-field and
per-variant `#[serde(bound = "...")]` predicates are added. Then the container's
own `bound` attribute, if present, *replaces* inference entirely — that is the
escape hatch, and the `match` is where it is honoured.

Only in the `None` arm does inference run: `with_bound` adds `T: Serialize` for
each type parameter that appears in a field type that will actually be
serialized. `needs_serialize_bound` is the predicate deciding "actually".
"""

[[annotation]]
id    = "ser-0011"
file  = "src/ser.rs"
lines = "155-170"
title = "needs_serialize_bound — four ways for a field to opt out"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["where-clauses", "closures"]
body = """
A field contributes a `T: Serialize` bound unless it is skipped, serialized by
someone else's function, carries its own bound, or belongs to a variant that
does any of those three.

The reason this predicate exists at all is that the naive rule — bound every
type parameter — generates impls that do not compile for types serde never
touches. `PhantomData<T>` is the standard example: `T` appears in a field type,
`T: Serialize` gets required, and a user with a non-`Serialize` marker type is
stuck writing `#[serde(bound = "")]` to undo it.

`variant.map_or(true, ...)` reads as "if there is no variant, nothing at the
variant level objects".
"""

[[annotation]]
id    = "ser-0012"
file  = "src/ser.rs"
lines = "171-190"
title = "serialize_body — the fork that picks one of seven shapes"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
Every `Serialize` body in existence comes out of this `match`, and the order of
the three levels is the precedence the attributes have.

`transparent` wins over everything: the struct disappears and its one field is
serialized in its place. `into` comes next: the value is cloned, converted, and
the conversion target is serialized instead. Only if neither is set does the
shape of the data decide, and `Style` has been normalized by this point so a
one-field tuple struct is `Newtype` rather than `Tuple`.

Each arm returns a `Fragment`, not a `TokenStream`. Some of these bodies are a
single expression and some are a block of statements ending in one, and the
caller needs to know which — that is `Fragment`'s entire job.
"""

[[annotation]]
id    = "ser-0013"
file  = "src/ser.rs"
lines = "191-208"
title = "serialize_transparent — find the one field that is not skipped"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
`#[serde(transparent)]` means the wrapper does not exist on the wire. The
validation that exactly one field is transparent happened in `internals::check`,
which is why the `unwrap` here is safe and the `unreachable!` for enums is not
a shortcut — `transparent` on an enum is rejected before this runs.

The `path` match is the pattern this file uses everywhere for
`#[serde(serialize_with = "...")]`: if the user named a function, call it; if
not, call `Serialize::serialize` with the *field's own span* attached.
`quote_spanned` is what makes a type error in the generated call point at the
field, and it is the difference between a usable error message and
"expected Serialize, found Foo" with no location.
"""

