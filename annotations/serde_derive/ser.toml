[[annotation]]
id    = "ser-0029"
file  = "src/ser.rs"
lines = "395-420"
title = "serialize_enum — one arm per variant, and the remote escape hatch"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["iterators", "pattern-matching"]
emits_from = "serialize"
emits_case = "enum_untagged"
emits = """
            match *self {
                Value::Number(ref __field0) => {
                    _serde::Serialize::serialize(__field0, __serializer)
                }
"""
body = """
An enum's `Serialize` body is a `match` over `*self`, and the arms are generated
here, in declaration order, each carrying its index.

`variant_index` is passed as a `u32` computed by `enumerate`. Nothing counts
variants at runtime — the index reaches the format as a literal, which is what
lets a compact binary format write a number instead of a name for no extra cost.

The extra arm requires *both* `remote` and `non_exhaustive`. A remote enum
marked non-exhaustive may gain variants upstream that this build has never seen,
so the generated `match` cannot be exhaustive by construction; the fallback
returns a custom error naming the unrecognized value. A local `non_exhaustive`
enum needs no arm, because the derive sees every variant it has.

`match *self` with `ref` bindings, rather than `match self` with reference
patterns: both work on modern Rust, this spelling works on the older compilers
serde still supports, and changing it would be an MSRV bump for no gain. The
dereference is why the patterns below bind `ref __field0` — they must borrow,
because `self` is behind a shared reference.
"""

