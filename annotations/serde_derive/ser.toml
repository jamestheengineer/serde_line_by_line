title = "serialize_tuple_struct_visitor — one statement per field"
kind  = "codegen"
tracks = ["reference"]
body = """
This and `serialize_struct_visitor` are the two functions that actually write
fields, and every sequence-shaped caller in this file goes through one of them.
Returning `Vec<TokenStream>` rather than one stream is what lets a caller splice
the statements with `#(...)*` and put its own code before and after.

`is_enum` decides where a field's value comes from; `tuple_trait` decides which
method writes it.
"""

[[annotation]]
id    = "ser-0074"
file  = "src/ser.rs"
lines = "1064-1081"
title = "The field expression — a binding, or a member access"
kind  = "codegen"
tracks = ["reference"]
body = """
`continue` on `skip_serializing` is why the count fold upstream filters the same
way: the statement list and the length have to agree, and they agree by applying
the same predicate rather than by sharing a computation.

For an enum, the value is the pattern binding `__fieldN`. For a struct, it is
whatever `get_member` decides, which is where `&self.0`, packed-field copies and
remote getters are all resolved.
"""

[[annotation]]
id    = "ser-0075"
file  = "src/ser.rs"
lines = "1082-1090"
title = "The skip predicate is built before the wrapper, deliberately"
kind  = "codegen"
tracks = ["reference"]
body = """
`skip_serializing_if` is applied to the *raw* field expression, and only then is
`serialize_with` allowed to replace that expression with a wrapper type.

The order is load-bearing. The user's predicate takes the field's own type —
`Option::is_none` expects an `&Option<T>` — and handing it `&__SerializeWith`
would not compile. This is the kind of ordering constraint that is invisible
until you swap two lines and get an error inside generated code.
"""

[[annotation]]
id    = "ser-0076"
file  = "src/ser.rs"
lines = "1091-1104"
title = "…and the statement, wrapped in an `if` when it can be skipped"
kind  = "codegen"
tracks = ["reference"]
emits_from = "serialize"
emits_case = "enum_externally_tagged"
emits = """
                    _serde::ser::SerializeTupleVariant::serialize_field(
                        &mut __serde_state,
                        __field0,
                    )?;
"""
body = """
`tuple_trait.serialize_element(span)` resolves to one of three method paths,
carrying the field's span so a type error lands on the field.

There is no `else` branch here, unlike the struct visitor: a sequence has no
way to record that an element was omitted, so a skipped element simply does not
appear and the length computed upstream is what keeps the count honest.
"""

[[annotation]]
id    = "ser-0077"
file  = "src/ser.rs"
lines = "1105-1118"
title = "serialize_struct_visitor — the same shape, with keys"
kind  = "codegen"
tracks = ["reference"]
body = """
The struct-shaped twin of the function above. Same `is_enum` decision, same
`continue` on skipped fields; what is added is a key for every write, and a
`flatten` branch that changes the call entirely.
"""

[[annotation]]
id    = "ser-0078"
file  = "src/ser.rs"
lines = "1119-1136"
title = "The key, resolved at expansion time — and the wrapper, applied after it"
kind  = "codegen"
tracks = ["reference"]
emits_from = "serialize"
emits_case = "struct_rename"
emits = """
            _serde::ser::SerializeStruct::serialize_field(
                &mut __serde_state,
                "xCoord",
                &self.x_coord,
            )?;
"""
body = """
`field.attrs.name().serialize_name()` is where `rename_all = "camelCase"` ends
up: the emitted call carries the literal `"xCoord"` and there is no renaming
code in the output at all.

This is the single most useful thing to see in a real expansion. Renaming looks
like a runtime feature in the documentation and is entirely a compile-time one.

Below it, the same ordering the tuple visitor uses and for the same reason: the
`skip_serializing_if` predicate is built against the *raw* field expression, and
only then may `serialize_with` replace that expression with a wrapper type. The
user's predicate takes the field's own type — `Option::is_none` expects an
`&Option<T>` — and handing it an `&__SerializeWith` would not compile.
"""

[[annotation]]
id    = "ser-0079"
file  = "src/ser.rs"
lines = "1137-1148"
title = "The flatten branch — FlatMapSerializer, not a key"
kind  = "codegen"
tracks = ["reference"]
body = """
A flattened field is serialized with no key at all. `FlatMapSerializer` wraps the
in-progress map and forwards whatever entries the field produces into it, which
is how a nested struct's fields end up as siblings of the outer ones.

That is why the enclosing container had to switch to `serialize_map`: the field
emits an unknown number of entries directly into the parent, and no length could
have been computed for it.
"""

[[annotation]]
id    = "ser-0080"
file  = "src/ser.rs"
lines = "1149-1172"
title = "…and skip_field, which a map does not have"
kind  = "codegen"
tracks = ["reference"]
emits_from = "serialize"
emits_case = "struct_rename"
emits = """
            if !Option::is_none(&self.label) {
                _serde::ser::SerializeStruct::serialize_field(
                    &mut __serde_state,
                    "label",
                    &self.label,
                )?;
            } else {
                _serde::ser::SerializeStruct::skip_field(&mut __serde_state, "label")?;
            }
"""
body = """
The `else` branch is the detail most readers miss. `SerializeStruct` has a
`skip_field` method, and the generated code calls it when a field is skipped at
runtime, so a format that writes fixed-layout records can still account for the
field it did not receive.

`SerializeMap` has no such method, so `skip_field` returns `None` for it and the
emitted code is an `if` with no `else`. One predicate, two different shapes,
decided by which trait the container chose pages earlier.
"""

