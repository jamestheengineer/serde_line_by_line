title = "wrap_serialize_variant_with — all of a variant's fields at once"
kind  = "plumbing"
tracks = ["reference"]
body = """
`#[serde(serialize_with)]` on a variant passes *every* field to the user's
function, so the expression list is built from the variant's members: named ones
keep their names, unnamed ones become `__fieldN` via `field_i`.

The two vectors are collected before the call rather than passed as iterators,
