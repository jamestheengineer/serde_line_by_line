[[annotation]]
id    = "ser-0001"
file  = "src/ser.rs"
lines = "1-12"
title = "What a code generator imports"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["proc_macro2::Span", "proc_macro2::TokenStream", "quote::quote", "quote::quote_spanned", "syn::spanned::Spanned", "syn::Ident", "syn::Index", "syn::Member", "syn::parse_quote"]
body = """
Read the import list as a table of contents. Three of these lines are the whole
reason this crate is different from the one it generates calls into.

`proc_macro2::TokenStream` is the currency: everything this file builds and
returns is a stream of tokens, never a string and never an AST it constructs by
hand. `quote` and `quote_spanned` are how a token stream gets written — you
will see 76 of them in this file. `syn::spanned::Spanned` is how a span gets
taken off an input token so an error about generated code points at the user's
source instead of at nothing.

Everything under `crate::` is the division of labour. `internals::ast` holds
the shape of the input after parsing, `internals::attr` the `#[serde(...)]`
attributes after validation, `bound` the generic-bound inference, `fragment`
the expression-versus-block distinction that runs through every function here.
This file does none of those jobs. It decides what code to emit.
"""

[[annotation]]
id    = "ser-0002"
file  = "src/ser.rs"
lines = "13-28"
title = "expand_derive_serialize — the pipeline, and the five values it builds"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["proc-macro-boundary", "result"]
glossary = ["syn::DeriveInput", "syn::Result"]
body = """
This is where `#[derive(Serialize)]` arrives, and it is worth reading as two
halves: six lines that refuse to continue, then five bindings the rest of the
function interpolates.

`replace_receiver` rewrites `Self` in the input to the concrete type name,
because the generated code lives inside a different `impl` than the one the user
wrote and `Self` there would mean something else. `Container::from_ast` parses
the `#[serde(...)]` attributes and normalizes the shape; it returns `None` when
that failed, and the `let ... else` returns the accumulated errors rather than a
single one.

That accumulation is the thing to notice. `Ctxt` collects every error instead of
bailing at the first, so a struct with four bad attributes reports four
problems. `ctxt.check()?` is where they are drained, and it is called twice —
once inside the `else`, once after `precondition` — because a `Ctxt` dropped
with unchecked errors panics on purpose.

Then the five values. `params` carries everything about the target type that
codegen needs. `split_for_impl` turns one `Generics` into the three fragments an
impl header needs, which are genuinely different: the impl side carries bounds,
the type side does not, and the where clause is separate again. And `body` is a
`Fragment` — either an expression or a block — wrapped in `Stmts` to say "render
this as statements". That distinction exists because an expression can be the
tail of a function and a block cannot be spliced into one, and getting it wrong
produces code that does not compile rather than code that misbehaves.
"""

[[annotation]]
id    = "ser-0003"
file  = "src/ser.rs"
lines = "29-45"
title = "The remote branch — an inherent fn, not a trait impl"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["proc-macro-boundary", "visibility"]
body = """
`#[serde(remote = "...")]` exists for a type you do not own, and it cannot
produce `impl Serialize for ThatType` because that impl would be an orphan.

So this branch emits an inherent `impl` on *your* placeholder type with a
`serialize` function of the same shape, taking the remote type by reference as
`__self` rather than `&self`. You then point `#[serde(with = "Placeholder")]`
at it from a field. The generated signature is deliberately identical to the
trait method's, so the call site does not care which it got.

`#vis` is the user's own visibility, copied through. `pretend_used` is the odd
one: it emits code that touches every field so the compiler stops warning about
fields the remote definition never reads.
"""

[[annotation]]
id    = "ser-0004"
file  = "src/ser.rs"
lines = "46-58"
title = "The ordinary branch — the impl this whole crate exists to write"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["generic-params", "where-clauses", "associated-types"]
emits_from = "serialize"
emits_case = "struct_rename"
emits = """
    impl _serde::Serialize for Point {
        fn serialize<__S>(
            &self,
            __serializer: __S,
        ) -> _serde::__private229::Result<__S::Ok, __S::Error>
        where
            __S: _serde::Serializer,
        {
"""
body = """
Thirteen lines, and every `#` is a hole. What comes out is on the right.

Four things are worth reading off the template rather than the output.
`__S` is the type parameter name, double-underscored so it cannot collide with
a parameter the user wrote — there is no hygiene for generic parameters in a
derive macro, so the convention has to do the work. `_serde` is the crate alias
established outside this block, so the impl works whether or not the user has
`serde` in scope under that name. `#private` is a versioned module path, which
is how serde keeps a genuinely private API private across releases. And
`#allow_deprecated` is there so deriving on a deprecated type does not warn at
the derive site.

The return type is `Result<__S::Ok, __S::Error>` — both associated types of the
format's `Serializer`, not of the data. That is the shape decision this file
inherits from `serde_core` and never gets to make.
"""

[[annotation]]
id    = "ser-0005"
file  = "src/ser.rs"
lines = "59-65"
title = "wrap_in_const — why the output starts with `const _: () = {`"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["modules", "macro-hygiene"]
emits_from = "serialize"
emits_case = "struct_rename"
emits = """
const _: () = {
    #[allow(unused_extern_crates, clippy::useless_attribute)]
    extern crate serde as _serde;
"""
body = """
The impl is wrapped in an anonymous `const` block, and that wrapper is doing
three jobs at once.

It scopes the `extern crate serde as _serde;` so the alias exists for the
generated code and nowhere else — this is the substitute for macro hygiene that
a derive macro does not get. It keeps the helper types the expansion sometimes
emits (`__SerializeWith`, `__AdjacentlyTagged`) out of the user's namespace. And
because a `const _` item can appear anywhere an item can, the expansion is legal
inside a function body as well as at module scope.

`custom_serde_path` is what `#[serde(crate = "...")]` feeds, for the case where
serde has been re-exported under another name.
"""

[[annotation]]
id    = "ser-0006"
file  = "src/ser.rs"
lines = "66-77"
title = "precondition — two attributes that only make sense when deserializing"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
`#[serde(field_identifier)]` and `#[serde(variant_identifier)]` mark a type used
to *name* a field or variant while deserializing. There is nothing to serialize
about them, so this reports an error rather than generating something useless.

`error_spanned_by(cont.original, ...)` is the pattern to notice: the span comes
from the user's own item, so the message lands under their type rather than at
the macro call. That is the whole reason `original` is kept on `Container`.
"""

[[annotation]]
id    = "ser-0007"
file  = "src/ser.rs"
lines = "78-101"
title = "Parameters — the six facts the templates interpolate"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["syn::Ident", "syn::Path", "syn::Generics"]
body = """
Everything downstream reads from this struct, so it is worth knowing what each
field decides.

`self_var` is `self` or `__self`, and it is a field rather than a constant
because the remote branch generates a free function whose receiver has another
name. `this_type` and `this_value` are the same path in the two positions Rust
spells differently — `Foo<T>` in type position, `Foo::<T>` in expression
position — and keeping both avoids threading turbofish decisions through a
dozen functions.

`generics` is not the input's generics: it is the inferred set, after bounds
have been added. `is_packed` exists because a field of a `repr(packed)` struct
cannot be borrowed, which changes what `get_member` may emit.
"""

[[annotation]]
id    = "ser-0008"
file  = "src/ser.rs"
lines = "102-125"
title = "Parameters::new — where the remote decision cascades from"
kind  = "plumbing"
tracks = ["reference"]
body = """
One attribute drives two fields. `remote()` being present makes `self_var`
`__self`, and the same fact reaches `this_type` and `this_value` through
`this::this_type` and `this::this_value`, which return the remote path instead
of the local ident.

`build_generics` is called here rather than lazily, which matters: the bound
inference walks every field of the container, and doing it once at construction
means the rest of the file can treat `params.generics` as a plain value.
"""

