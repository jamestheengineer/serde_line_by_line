[[annotation]]
id    = "ser-0085"
file  = "src/ser.rs"
lines = "1233-1240"
title = "The span that points at `with = \"...\"`"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["proc-macro-boundary"]
body = """
The comment above these lines is worth more than most of this file's code: the
call to the user's function is spanned on the *path they wrote*, so a function
with the wrong signature reports the error under the attribute rather than
inside code they cannot see.

This is the sharpest example of why `quote_spanned` exists. Without it the
diagnostic has nowhere to point, and a derive macro's errors become the kind
people file issues about.
"""

[[annotation]]
id    = "ser-0086"
file  = "src/ser.rs"
lines = "1241-1264"
title = "…and the wrapper itself, inside a borrow expression"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["marker-types", "lifetimes"]
body = """
`quote!(&{ ... })` — the whole thing is a block expression, immediately
borrowed, so it can be passed straight into a `serialize_field` call as a
`&impl Serialize`.

Putting the struct, the impl and the construction inside one block is what keeps
`__SerializeWith` from colliding when a struct has two fields that both use
`serialize_with`: each expansion has its own scope, so each gets its own
`__SerializeWith`.
"""

[[annotation]]
id    = "ser-0087"
file  = "src/ser.rs"
lines = "1265-1278"
title = "mut_if — an entire function to avoid one warning"
kind  = "plumbing"
tracks = ["reference"]
body = """
An empty struct generates a `__serde_state` that is never mutated, and `let mut`
on it would warn. Since the warning appears in the *user's* build, on code they
did not write and cannot edit, the only fix is not to emit the `mut`.

Returning `Option<TokenStream>` rather than an empty stream is a small nicety:
`quote!` interpolates `None` as nothing, so the call site stays a plain `#let_mut`
with no conditional.
"""

[[annotation]]
id    = "ser-0088"
file  = "src/ser.rs"
lines = "1279-1288"
title = "get_member — the ordinary case, and the packed one"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["unsafe", "borrowing"]
body = """
`&self.field` for a normal struct. For `repr(packed)`, `&{self.field}` — braces
that copy the field to a temporary first, then borrow that.

The braces are not style. Taking a reference to a misaligned field is undefined
behaviour, and the copy is the only way to get an aligned value to borrow. This
is one of the few places in the crate where the generated code exists to avoid
UB rather than to express a format.
"""

[[annotation]]
id    = "ser-0089"
file  = "src/ser.rs"
lines = "1289-1301"
title = "The remote cases, and what `constrain` is for"
kind  = "codegen"
tracks = ["reference"]
body = """
For a remote impl the field expression is wrapped in
`ser::constrain::<#ty>(...)`, an identity function with a type annotation.

It exists so the compiler checks the field type against the *remote definition's*
declared type. Without it, a mismatch between the user's placeholder struct and
the real remote type would either compile into something wrong or report an
error far from the field that caused it.

The getter arm is the same idea for `#[serde(getter = "...")]`: call the
getter, constrain the result.
"""

[[annotation]]
id    = "ser-0090"
