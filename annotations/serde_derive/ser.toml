[[annotation]]
id    = "ser-0019"
file  = "src/ser.rs"
lines = "257-274"
title = "serialize_tuple_struct — the visitor first, then the length"
kind  = "codegen"
tracks = ["reference"]
body = """
The per-field statements are generated before anything else, by
`serialize_tuple_struct_visitor`, and passed `false` for `is_enum` — that flag
decides whether fields are read out of `self` or out of pattern bindings.

`peekable` plus `mut_if` is a small piece of care with a real payoff: if every
