field, first. This emits that write, or nothing at all for every other tag type.

The `_ => quote! {}` arm is what the caller tests with `is_empty()` — an empty
token stream is the signal for "no tag field", and it doubles as the value
spliced into the template. Returning `Option<TokenStream>` would need the caller
to unwrap it at the splice site for no gain.
"""

[[annotation]]
id    = "ser-0024"
file  = "src/ser.rs"
