The `fields_pat` match is there so the pattern is syntactically right for each
shape — `(..)` for tuples and newtypes, `{ .. }` for struct variants, nothing
for units. The bindings are deliberately absent; nothing in the arm reads them.
"""

[[annotation]]
id    = "ser-0032"
file  = "src/ser.rs"
lines = "448-473"
title = "The patterns — where `__field0` comes from"
kind  = "codegen"
tracks = ["reference"]
