emits_from = "serialize"
emits_case = "struct_rename"
emits = """
                false as usize + 1 + if Option::is_none(&self.label) { 0 } else { 1 },
"""
body = """
The fold starts at `#tag_field_exists as usize`, and `tag_field_exists` is a
Rust `bool` being interpolated into generated code — so it arrives as the
literal `false` or `true`, and the emitted expression opens with
