[[annotation]]
id    = "ser-0020"
file  = "src/ser.rs"
lines = "275-288"
title = "The field count, folded into an arithmetic expression"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["iterators", "closures"]
body = """
A self-describing format wants the element count before the elements, and
`skip_serializing_if` is a runtime predicate, so the count cannot be a constant.

What is emitted instead is a sum: `0 + 1 + if is_empty(&self.x) { 0 } else { 1 }`.
`fold` builds it left to right, and every term is either the literal `1` or a
conditional. The expression is evaluated once, at the top of the generated
function, before any field is written.

This is the clearest small example of the rule that governs the whole file:
anything knowable at expansion time becomes a literal, and anything that is not
becomes emitted code.
"""

[[annotation]]
id    = "ser-0021"
file  = "src/ser.rs"
lines = "289-295"
title = "…and the three-part block every sequence shape produces"
kind  = "codegen"
tracks = ["reference"]
body = """
Open, write each element, end. `#(#serialize_stmts)*` is quote's repetition
syntax splicing a `Vec<TokenStream>` in sequence, and it is how a variable
number of fields becomes a fixed-shape block.

`?` is in the generated code, not in this file's control flow. Errors from a
half-written sequence propagate out of the user's `serialize`, which is why the
state value has to be returned to `end` rather than dropped.
"""

[[annotation]]
id    = "ser-0022"
file  = "src/ser.rs"
lines = "296-314"
title = "serialize_struct — an assertion, and the fork that flatten forces"
kind  = "plumbing"
tracks = ["reference"]
body = """
An assertion and a fork.

`serialize_struct` takes a `usize` length, but every self-describing format
ultimately writes that count into something narrower. The assert draws the line
at `u32::MAX` and fails the *build* with the type's name rather than emitting
code that would truncate. A struct with four billion fields is not a real case;
the assertion is here because the alternative failure is silent.

The fork is the one that matters. `#[serde(flatten)]` on any non-skipped field
switches the container from `serialize_struct` to `serialize_map`, and the
reason is arithmetic: a flattened field contributes an unknown number of
entries, so the length passed to `serialize_struct` cannot be computed. A map
may be serialized with `None` for its length, and self-describing formats accept
that. It is a real cost — a format that needs the count up front, like some
binary encodings, cannot represent a flattened struct at all.
"""

[[annotation]]
id    = "ser-0023"
file  = "src/ser.rs"
lines = "315-327"
title = "serialize_struct_tag_field — the tag, for internally tagged structs"
kind  = "codegen"
