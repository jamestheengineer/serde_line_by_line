title = "…and the variant version, which returns early for a struct"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["where-clauses"]
body = """
The same shape, over variants. A struct has none, so it returns the generics
unchanged rather than iterating nothing — one clone either way, and the early
return says why.
"""

[[annotation]]
id    = "bound-0005"
file  = "src/bound.rs"
lines = "85-102"
title = "with_bound — and the worked example above it"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["where-clauses", "generic-params"]
body = """
The inference proper, and the comment gives the case exactly: `struct S<'b, A,
B: 'b, C>` with a skipped `C` needs `A: Serialize, B: Serialize` and must not
require `C: Serialize`.

Getting this wrong in either direction is a real bug. Too few bounds and the
impl does not compile; too many and it rejects types that would have worked.
"""

[[annotation]]
id    = "bound-0006"
file  = "src/bound.rs"
lines = "103-150"
title = "FindTyParams — three sets, and the hardcoded PhantomData exception"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["associated-types"]
glossary = ["syn::TypePath", "syn::punctuated::Pair"]
body = """
Three fields. `all_type_params` is the whole set up front; `relevant_type_params`
is filled as the visitor sees them; `associated_type_usage` is the third case and
the least obvious.

A field of type `T::Assoc` needs `T::Assoc: Serialize`, not `T: Serialize` —
bounding `T` says nothing about its associated type. `visit_field` detects that
shape by checking whether the *first* path segment is a known type parameter,
and records the whole path.

`visit_path` carries the exception everyone eventually meets. `PhantomData<T>`
implements `Serialize` and `Deserialize` regardless of `T`, so a parameter used
only as a marker must not be bounded — and the check is a name comparison on the
last path segment, with a comment saying "hardcoded exception".

Without it, `struct S<T> { marker: PhantomData<T> }` would require
`T: Serialize`, and every user with a non-serializable marker type would have to
write `#[serde(bound = "")]`. It is the most load-bearing five lines in the file,
and there is no way to ask the type system this question from inside a proc
macro, because a proc macro has no type system.

A single-segment path that names a type parameter is what marks it relevant —
`leading_colon.is_none() && segments.len() == 1`, so `other::T` does not count.
"""

