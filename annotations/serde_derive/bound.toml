body = """
"Everything below is simply traversing the syntax tree", says the comment, and
it is right — but the two `cfg_attr` denies in it are worth noticing. This is
the second of three hand-written walkers over syn's `Type` in the crate, and
both places where it matches a `#[non_exhaustive]` enum carry the lint that
turns a new variant into a test failure.
"""

[[annotation]]
id    = "bound-0008"
file  = "src/bound.rs"
lines = "225-283"
title = "…running the visitor, over only the fields the filter accepts"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["closures", "iterators"]
body = """
`filter` is `needs_serialize_bound` or `needs_deserialize_bound`, and it decides
per field whether the visitor sees it at all. A skipped field contributes no
bound because its type is never visited.

`field.original` rather than the parsed `Field`: the visitor walks syn's tree,
and the serde model does not carry the full type structure.
"""

[[annotation]]
id    = "bound-0009"
file  = "src/bound.rs"
lines = "284-328"
title = "…and building the predicates, by hand"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["where-clauses"]
glossary = ["syn::PredicateType", "syn::TraitBound", "syn::TraitBoundModifiers"]
body = """
`make_where_bounded_type` constructs a `WherePredicate` field by field rather
than with `parse_quote!`, and the two inline comments name the two halves — the
bounded type and the bound.

Constructing rather than parsing because the bound arrives as a `syn::Path` from
the caller and re-serializing it to tokens to re-parse would lose spans.

Two loops: the relevant type parameters, then the associated-type paths. They
are separate because the second set is not parameters at all.
"""

[[annotation]]
id    = "bound-0010"
