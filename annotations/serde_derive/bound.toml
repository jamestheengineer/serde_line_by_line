title = "bound — five ways to build the generics of a generated impl"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["syn::punctuated::Pair", "syn::punctuated::Punctuated"]
body = """
Every impl this crate emits gets its generics through this file, and the comment
on the first function is a good warning of the register: these are all
workarounds for the difference between what is legal in a *declaration* and what
is legal in an *impl header*.
"""

[[annotation]]
id    = "bound-0002"
file  = "src/bound.rs"
lines = "11-27"
title = "without_defaults — and the error message that explains it"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["generic-params"]
body = """
`struct S<T = u32>` is legal; `impl<T = u32> Serialize for S<T>` is not, and the
compiler's message for it is quoted in the comment: "associated type bindings
are not allowed here", because `T = u32` in that position parses as an
associated-type binding.

Three lines of real work, and without them every generic type with a default
would fail to derive with an error naming a feature nobody used.
"""

[[annotation]]
id    = "bound-0003"
file  = "src/bound.rs"
lines = "28-59"
title = "with_where_predicates, and the field version"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["where-clauses"]
body = """
`make_where_clause()` creates the `where` clause if the generics do not have
one, which is why nothing here handles the `None` case.

The field version takes an accessor as a `fn` pointer — `attr::Field::ser_bound`
or `de_bound` — so one function serves both halves of the crate. Passing a
function pointer rather than a closure keeps it non-generic, which matters for
a proc macro's compile time.
"""

[[annotation]]
id    = "bound-0004"
