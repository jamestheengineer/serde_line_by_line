title = "with_self_bound — `Self: Default`, for a container default"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["where-clauses"]
body = """
`#[serde(default)]` on a container needs the container itself to implement
`Default`, and this adds that predicate using `type_of_item` at the bottom of
the file for the bounded type.
"""

[[annotation]]
id    = "bound-0011"
file  = "src/bound.rs"
lines = "358-390"
title = "with_lifetime_bound — `'__a`, and everything outliving it"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes", "generic-params"]
body = """
The function behind every borrowed wrapper type in the crate:
`__SerializeWith`, `__AdjacentlyTagged`, `__EnumFlatten`.

It prepends the new lifetime and adds it as a bound to every existing
parameter — lifetimes get `'a: '__a`, type parameters get `T: '__a`, const
parameters get nothing. Without the bounds, a wrapper holding `&'__a T` would
not compile for a `T` that might not outlive it.

Prepended rather than appended, so the generated header reads in the
conventional order.
"""

[[annotation]]
id    = "bound-0012"
file  = "src/bound.rs"
lines = "391-431"
title = "type_of_item — the type as a type expression, and the one panic"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["generic-params"]
glossary = ["syn::TypePath", "syn::AngleBracketedGenericArguments", "syn::GenericParam"]
body = """
Turns `struct S<'a, T>` into the type `S<'a, T>` — the parameters used as
arguments, which is a different thing from the parameters declared.

Built rather than parsed, forty lines of syn constructors, because the parts
come from the user's generics and must keep their spans.

And the panic: `"Serde does not support const generics yet"`. It is the only
unconditional panic in the crate's non-error paths, it is reached only through
`with_self_bound` — so only by a container with `#[serde(default)]` and a const
generic parameter — and it is the clearest statement in the source of a
limitation the documentation states more gently.
"""
