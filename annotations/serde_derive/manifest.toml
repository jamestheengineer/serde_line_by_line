# Per-file completion status.
#
# A file listed under `complete` turns coverage gaps from a warning into a hard
# CI failure. Add a file here only when every one of its lines is claimed.
#
# R1 made `serde_derive` an annotated source (D12) with this list empty; R2
# through R5 fill it. Until a file is named here the gate reports its gaps as
# warnings, and the narrative's steps into that file are not yet asked to name
# a containing annotation, because there is not one to name. Naming a file here
# turns both of those on at once.
source = "serde_derive-1.0.229"

complete = [
    "src/ser.rs",
    "src/de.rs",
    "src/de/enum_.rs",
    "src/de/enum_adjacently.rs",
    "src/de/enum_externally.rs",
    "src/de/enum_internally.rs",
    "src/de/enum_untagged.rs",
    "src/de/identifier.rs",
    "src/de/struct_.rs",
    "src/de/tuple.rs",
    "src/de/unit.rs",
    "src/internals/ast.rs",
    "src/internals/attr.rs",
    "src/internals/case.rs",
    "src/internals/check.rs",
    "src/internals/ctxt.rs",
    "src/internals/mod.rs",
    "src/internals/name.rs",
    "src/internals/respan.rs",
    "src/internals/symbol.rs",
]
