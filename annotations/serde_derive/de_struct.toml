emits_from = "deserialize"
emits_case = "struct_rename"
emits = """
            const FIELDS: &'static [&'static str] = &["xCoord", "label"];
"""
body = """
The list a format is given so it can report `unknown_field` against it. Built
from `aliases`, so every accepted spelling appears.

`None` under flatten, because there is no such thing as an unknown field then —
anything unrecognized belongs to the flattened member. Emitting the constant
would leave it unused.
"""

[[annotation]]
