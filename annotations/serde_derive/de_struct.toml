[[annotation]]
id    = "de-st-0020"
file  = "src/de/struct_.rs"
lines = "420-453"
title = "deserialize_in_place — and the shape it declines"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
Returns `Option`, and `None` for anything flattened: filling a value in place
requires knowing which field each key belongs to before reading it, and flatten
does not.

That `None` propagates through `de.rs`'s `?` and suppresses the whole method.
"""

[[annotation]]
id    = "de-st-0021"
file  = "src/de/struct_.rs"
lines = "454-511"
title = "…and the in-place visitor, holding a place instead of a marker"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["cfg", "lifetimes"]
body = """
The same substitution as `tuple.rs`: `place: &'place mut Self` where the
by-value visitor has `marker: PhantomData<T>`, and `type Value = ()`.

Both `visit_seq` and `visit_map` are present here, unlike the by-value path
where `visit_seq` can be suppressed — the shapes this function accepts are
exactly the shapes it declined to decline above.
"""

[[annotation]]
id    = "de-st-0022"
file  = "src/de/struct_.rs"
lines = "512-540"
title = "deserialize_map_in_place — booleans instead of Options"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
The difference that makes in-place worth having. The by-value path allocates an
`Option<T>` per field to hold the value until the end; this one writes directly
into the place and keeps a `bool` per field to record that it happened.

For a struct of `String` fields, that is the difference between building N new
allocations and reusing N existing ones.
"""

[[annotation]]
id    = "de-st-0023"
file  = "src/de/struct_.rs"
lines = "541-578"
title = "…and the arms, writing through InPlaceSeed"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
`next_value_seed(&mut __map, InPlaceSeed(&mut self.place.#member))` is the
in-place read: the seed carries the destination, so the format writes into it.

The `deserialize_with` arm cannot do that — the user's function returns a value —
so it assigns. The flag is set after the read in both cases, which matters: a
failed read must not mark the field as seen.
"""

[[annotation]]
id    = "de-st-0024"
file  = "src/de/struct_.rs"
lines = "579-608"
title = "…and the same ignored-key handling, minus flatten"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
Two cases instead of three, because flatten was refused at the top. Otherwise
identical to the by-value version, including the uninhabited-match branch — the
fourth and last appearance of that trick in the crate.
"""

[[annotation]]
id    = "de-st-0025"
file  = "src/de/struct_.rs"
lines = "609-639"
title = "…and the flag check, which sometimes must not assign"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
The most subtle block in the in-place path, and the comment says why: when
`expr_is_missing` returns an expression that unconditionally *returns an error*,
assigning it to `self.place.#member` would be assigning a value of type `!` and
would not compile.

That happens for exactly one combination — no field default, no container
default, and a `deserialize_with` — which is the condition spelled out here. In
that case the missing expression is emitted as a statement instead.
"""

