title = "deserialize — one function for structs and three kinds of struct variant"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["lifetime-de"]
body = """
`StructForm` is the only thing separating a plain struct from a struct variant
of an externally, internally or untagged enum. Everything below branches on it a
handful of times and is otherwise shared.

The `construct` block is the getter conversion again, identical to `tuple.rs`'s
— the third copy of these five lines in the crate.
"""

