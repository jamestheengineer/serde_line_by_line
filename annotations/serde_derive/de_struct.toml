[[annotation]]
id    = "de-st-0027"
file  = "src/de/struct_.rs"
lines = "671-697"
title = "deserialize_field_identifier — three shapes of “everything else”"
kind  = "codegen"
tracks = ["reference"]
emits_from = "deserialize"
emits_case = "struct_rename"
emits = """
            enum __Field {
                __field0,
                __field1,
            }
"""
body = """
The small function that decides what `__Field` does with a key it does not
recognize, and it is worth reading last because every choice above depends on it.

Under flatten, `__other(Content<'de>)` carries the key onward — which is where
the lifetime parameter on the generated enum comes from. Under
`deny_unknown_fields`, there is no extra variant and no fallthrough, so an
unknown key fails inside the field visitor. Otherwise `__ignore` swallows it.

Three lines of difference here produce three quite different generated bodies
two hundred lines up.
"""
