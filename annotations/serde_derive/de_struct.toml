emits = """
            _serde::Deserializer::deserialize_struct(
                __deserializer,
                "Point",
                FIELDS,
                __Visitor {
"""
body = """
`deserialize_struct` for the ordinary case, `deserialize_map` when flattened,
`struct_variant` or `newtype_variant_seed` for an externally tagged variant, and
`deserialize_any` for the internally tagged and untagged ones.

`deserialize_any` is the expensive one and the reason those two representations
do not work with non-self-describing formats: the generated code cannot tell the
format what to expect, because it does not know yet.
"""

