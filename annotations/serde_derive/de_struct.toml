[[annotation]]
id    = "de-st-0004"
file  = "src/de/struct_.rs"
lines = "55-69"
title = "…the fields that get a slot, and the two exclusions"
kind  = "codegen"
tracks = ["reference"]
body = """
Skipped fields and flattened fields are both left out, for different reasons.
A skipped field is never read. A flattened field is not a *key* — its contents
arrive under the keys of whatever it contains — so it has no entry in the field
identifier enum either.

The comment above the filter says exactly this. `field_i(i)` uses the index in
the original list, so the generated `__field2` still corresponds to the third
declared field even when the second was skipped.
"""

[[annotation]]
id    = "de-st-0005"
file  = "src/de/struct_.rs"
lines = "70-96"
title = "…visit_seq, which two forms do not get"
kind  = "codegen"
tracks = ["reference"]
body = """
A struct is normally readable from a sequence as well as a map — that is how a
compact format sends one — but two cases cannot.

An untagged struct variant is reached through `deserialize_any`, and accepting a
sequence there would make `[1, 2]` ambiguous with a tuple variant. A flattened
struct has no fixed field order at all, so position means nothing. Both return
`None` and the method is simply absent from the generated visitor.
"""

[[annotation]]
id    = "de-st-0006"
file  = "src/de/struct_.rs"
lines = "97-121"
title = "…and the DeserializeSeed impl an externally tagged flattened variant needs"
kind  = "codegen"
tracks = ["reference"]
body = """
One narrow case with its own impl. An externally tagged struct variant that has
a flattened field cannot use `struct_variant` — that method wants a field list,
and flatten means there is not one — so it is read as a *newtype* variant whose
payload is a map.

`newtype_variant_seed` needs a `DeserializeSeed`, not a `Visitor`, so the same
`__Visitor` type gets a second impl whose `deserialize` immediately calls
`deserialize_map` on itself.
"""

[[annotation]]
id    = "de-st-0007"
