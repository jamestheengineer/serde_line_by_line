emits_case = "struct_rename"
emits = """
                    while let _serde::__private229::Some(__key) = _serde::de::MapAccess::next_key::<
                        __Field,
                    >(&mut __map)? {
"""
body = """
`while let Some(key) = next_key::<__Field>()` is the loop every derived struct
runs. One call per key, and `__Field`'s own `Deserialize` impl is what turns the
name into a variant.

The `deny_unknown_fields && all_skipped` branch is the third appearance of the
uninhabited-match trick: with every field skipped and unknown fields denied,
`__Field` has no variants, so any key at all is an error and the only way to
write the match is over a type that cannot be constructed. The same `FIXME` for
`exhaustive_patterns` is here as in the externally tagged module.
"""

