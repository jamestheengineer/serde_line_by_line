"""

[[annotation]]
id    = "de-st-0016"
file  = "src/de/struct_.rs"
lines = "327-346"
title = "…and the flattened fields, read out of the buffer"
kind  = "codegen"
tracks = ["reference"]
body = """
`FlatMapDeserializer` presents the collected key-value pairs as a map, and the
flattened field's own `Deserialize` reads from it. That is the whole mechanism:
flatten is not a wire-format feature, it is a buffer replayed as a map.

It also explains the constraint people hit — the flattened type has to be
something that can be deserialized *from a map*, which is why flattening a
`Vec` does not work.
"""

[[annotation]]
id    = "de-st-0017"
file  = "src/de/struct_.rs"
lines = "347-364"
title = "…and deny_unknown_fields under flatten, which must run last"
kind  = "codegen"
tracks = ["reference"]
body = """
With flatten and `deny_unknown_fields` together, an unknown key cannot be
detected when it arrives — it might belong to the flattened member. So the check
runs *after* every flattened field has taken what it recognized, and anything
still in the buffer is genuinely unknown.

`content_as_str` because the leftover key may not be a string at all; a map with
an integer key gets "unexpected map key" rather than a name.
"""

