[[annotation]]
id    = "de-st-0010"
file  = "src/de/struct_.rs"
lines = "199-223"
title = "deserialize_map — one Option slot per field"
kind  = "codegen"
tracks = ["reference"]
emits_from = "deserialize"
emits_case = "struct_rename"
emits = """
                    let mut __field0: _serde::__private229::Option<i32> = _serde::__private229::None;
                    let mut __field1: _serde::__private229::Option<Option<String>> = _serde::__private229::None;
"""
body = """
The pattern that makes map deserialization work: every field gets a local
`Option<T>` initialized to `None`, filled as keys arrive, and unwrapped at the
end.

`Option<Option<String>>` for an `Option<String>` field is not a mistake. The
outer `Option` means "did this key appear", the inner one is the field's own
type, and collapsing them would make a present `null` indistinguishable from an
absent key.
"""

[[annotation]]
id    = "de-st-0011"
file  = "src/de/struct_.rs"
lines = "224-235"
title = "…and the buffer flattened fields collect into"
kind  = "codegen"
tracks = ["reference"]
body = """
A `Vec<Option<(Content, Content)>>` of key-value pairs that did not match a known
field. Both halves are buffered because the flattened member has not been
deserialized yet and will need the whole thing.

`Option` around each pair so entries can be *taken* rather than removed — with
two flattened fields, the first one consumes what it recognizes and leaves holes
for the second.
"""

[[annotation]]
id    = "de-st-0012"
file  = "src/de/struct_.rs"
lines = "236-275"
title = "…one match arm per field, with the duplicate check"
kind  = "codegen"
tracks = ["reference"]
emits_from = "deserialize"
emits_case = "struct_rename"
emits = """
                            __Field::__field0 => {
                                if _serde::__private229::Option::is_some(&__field0) {
                                    return _serde::__private229::Err(
                                        <__A::Error as _serde::de::Error>::duplicate_field("xCoord"),
                                    );
                                }
"""
body = """
The arm that runs when a key resolves to this field. The `is_some` test is the
duplicate-key check, and it reports the *renamed* name, because that is what the
input contained.

The `deserialize_with` arm spells out its error handling instead of using `?`,
for the same reason as elsewhere: it is a block expression being assigned, not a
statement in a function that can return.
"""

[[annotation]]
id    = "de-st-0013"
file  = "src/de/struct_.rs"
lines = "276-292"
title = "…and what happens to a key nobody claimed"
kind  = "codegen"
tracks = ["reference"]
body = """
Three possibilities, and they are mutually exclusive by construction. Under
flatten, the key and its value are pushed into `__collect`. Under
`deny_unknown_fields`, there is no arm at all — the field visitor already
errored, because it had no `__ignore` variant to return. Otherwise the value is
read into `IgnoredAny` and dropped.

`IgnoredAny` reads and discards an arbitrarily nested value without allocating,
which is what keeps ignoring an unknown field cheap.
"""

