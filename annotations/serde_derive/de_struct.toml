body = """
697 lines, the biggest file in `de/`, and roughly a third of it is the in-place
twin. What is left is still the most-executed code path in the crate: every
derived `Deserialize` for a named-field struct comes out of here.
"""

[[annotation]]
id    = "de-st-0002"
