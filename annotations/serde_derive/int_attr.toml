kind  = "plumbing"
tracks = ["reference"]
glossary = ["syn::WherePredicate", "syn::Type", "syn::punctuated::Punctuated"]
body = """
`bound = "T: Serialize + Clone"` is parsed as a punctuated list of predicates,
and `from = "Vec<u8>"` as a type. Both go through `parse_with` on the literal,
so the span of every token in the result points inside the user's string.

That is the mechanism behind serde's best diagnostics on these attributes: the
compiler underlines the offending part of the string, not the whole attribute.
"""

