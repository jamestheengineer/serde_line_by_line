body = """
`&str`, `&[u8]`, and `Option` of either: types that can only ever borrow, so no
attribute is needed.

The twenty-line comment above `is_cow` is the honest part and is worth reading
in full. It states, with examples, that this test has both false negatives — a
`Cow` imported under another name is missed — and false positives — a local type
called `str` is matched.

A proc macro cannot resolve names; it sees tokens. Every type test in every
derive macro has this limitation, and most of them do not say so.
"""

[[annotation]]
