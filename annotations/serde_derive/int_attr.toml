A hand-written `+`-separated parser, because syn has no punctuated-lifetime
type to reach for.

Two errors it can raise beyond a parse failure: a duplicate lifetime in the
list, and an empty list — `borrow("")` is almost certainly a mistake, and
accepting it would silently mean "borrow nothing".
