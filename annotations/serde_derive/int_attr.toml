[[annotation]]
id    = "int-attr-0055"
file  = "src/internals/attr.rs"
lines = "1732-1798"
title = "collect_lifetimes — every lifetime a type mentions, structurally"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes", "pattern-matching"]
glossary = ["syn::Type", "syn::GenericArgument", "syn::QSelf"]
body = """
Sixty-seven lines of recursion over `syn::Type`, and the interesting arms are
the last few.

`Type::Path` descends into generic arguments *and* into a qualified self type,
so `<Foo<'a> as Trait>::Assoc` is covered. `Type::Macro` cannot be parsed at all
— the macro has not expanded — so it falls back to scanning raw tokens.

The `cfg_attr(all(test, exhaustive), deny(non_exhaustive_omitted_patterns))`
attribute on the match is upstream's own guard: syn's `Type` is
`#[non_exhaustive]`, and that lint makes a new variant a *test* failure rather
than something silently swallowed by the `_` arm. A neat answer to the problem
of exhaustively matching a type you do not own.
"""

