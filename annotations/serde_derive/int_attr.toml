The fallback, and the last twenty lines of the file: walk raw tokens looking for
an apostrophe punct joined to an identifier, which is how a lifetime is spelled
at the token level.

`Spacing::Joint` is the whole check — `'a` has no space between the apostrophe
and the name, and a `'` followed by a space is something else. Getting that
wrong would collect lifetimes from character literals.

Recursing into groups, because `mac!(Foo<'a>)` nests.
"""
