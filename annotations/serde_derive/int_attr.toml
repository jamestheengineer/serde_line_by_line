glossary = ["syn::meta::ParseNestedMeta", "syn::Token"]
body = """
The function behind `rename`, `rename_all`, `bound` and `alias` all accepting
both `attr = "x"` and `attr(serialize = "x", deserialize = "y")`.

`lookahead1` peeks for `=` or `(` and branches; the `=` case inserts the same
value into both directions, cloning it. Generic over the inner parser `f`, so
the same logic serves string literals and where-predicates.

The `else` returns `lookahead.error()`, which is syn's accumulated "expected one
of" message — so `rename: "x"` reports the two things that would have worked
rather than a generic parse failure.
"""

