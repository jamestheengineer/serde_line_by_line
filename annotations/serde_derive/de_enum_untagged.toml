title = "deserialize_variant — shared with adjacent tagging"
kind  = "codegen"
tracks = ["reference"]
body = """
The comment says it: adjacently tagged enums call this too, because once the tag
has been read the content is deserialized exactly as an untagged variant would
be. Four representations, three reading paths.
"""

[[annotation]]
id    = "de-unt-0005"
file  = "src/de/enum_untagged.rs"
lines = "76-94"
title = "Unit variant — UntaggedUnitVisitor, and an explicit match"
kind  = "codegen"
tracks = ["reference"]
body = """
`UntaggedUnitVisitor` accepts unit or `None` and rejects everything else, which
is how an untagged unit variant matches `null` and nothing more.

The `match` with an explicit `Err` arm rather than `?` is because this is a
`quote_expr!` — an expression, in a position where the `?` operator would need
an enclosing function to return from. The fragment distinction, showing up in
generated code.
"""

[[annotation]]
id    = "de-unt-0006"
file  = "src/de/enum_untagged.rs"
lines = "95-110"
title = "…and the three shapes, in the same order as everywhere else"
kind  = "codegen"
tracks = ["reference"]
body = """
Newtype, tuple, struct — each handed to the module that reads that shape, with
`TupleForm::Untagged` or `StructForm::Untagged` carrying the variant ident for
the `expecting` message.

Unlike internal tagging, tuple variants *are* allowed here: with no tag to
place, a tuple variant is just a sequence.
"""

[[annotation]]
id    = "de-unt-0007"
file  = "src/de/enum_untagged.rs"
lines = "111-135"
title = "deserialize_newtype_variant — used by three representations"
kind  = "codegen"
tracks = ["reference", "course"]
course_unit = "21-enum-representations"
body = """
Both comments above it are pointing at the same fact: this is the shared newtype
reader, reached from untagged, internally tagged and adjacently tagged code.

`Result::map(deserialize(...), Variant)` uses the variant constructor *as a
function*, which is why the emitted code has no closure. A tuple-like variant's
name is a function value, and passing it directly is both shorter and exactly
what `map` wants.

The `deserialize_with` arm binds `__value` with an explicit type annotation
first. Without it, nothing in the expression would tell inference what the
user's function is supposed to return.
"""
