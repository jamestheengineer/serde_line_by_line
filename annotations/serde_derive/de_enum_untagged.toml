kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "21-enum-representations"
body = """
The representation with the least information on the wire and the most work to
read it. Nothing identifies the variant, so deserialization is a sequence of
attempts.
"""

[[annotation]]
id    = "de-unt-0002"
file  = "src/de/enum_untagged.rs"
lines = "21-43"
title = "deserialize — one attempt per variant, and an honest TODO"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["iterators", "closures"]
body = """
Each non-skipped variant becomes an expression that tries to read the whole
input as that variant.

The `TODO` above the message is upstream's and is worth reading in place: it
says the failure message is poor, describes the heuristic TOML uses instead, and
declines to adopt it. That is the shape of the known problem — by the time the
last variant fails, the reasons the earlier ones failed have been discarded, so
the error can only say "none of these matched".
"""

[[annotation]]
id    = "de-unt-0003"
file  = "src/de/enum_untagged.rs"
lines = "44-59"
title = "…buffer once, then re-run the buffer against each variant"
kind  = "codegen"
tracks = ["reference", "course"]
course_unit = "21-enum-representations"
body = """
The input is read once into `Content` and then replayed by
`ContentRefDeserializer` for every attempt — by *reference*, because each
attempt may need the whole thing again.

`#first_attempt` is where a partly-tagged enum's tagged half is spliced in, from
`enum_::deserialize`. The `#(...)*` repetition after it is the untagged
attempts, each an `if let Ok(...) { return ... }`.

`let private2 = private;` exists because `#private` is already interpolated
inside the repetition and quote cannot use the same variable as both a repeating
and a non-repeating interpolation. A one-line workaround for a real constraint
of the macro.
"""

[[annotation]]
id    = "de-unt-0004"
file  = "src/de/enum_untagged.rs"
