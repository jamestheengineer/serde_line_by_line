[[annotation]]
id    = "int-name-0001"
file  = "src/internals/name.rs"
lines = "1-8"
title = "name — what a field or variant is called on the wire"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["syn::LitStr", "proc_macro2::Span", "quote::ToTokens"]
body = """
The type that answers "what string does this field appear as", and it is not
one string: serialization and deserialization can differ, and deserialization
can accept several.
"""

[[annotation]]
id    = "int-name-0002"
file  = "src/internals/name.rs"
lines = "9-58"
title = "MultiName — up to four answers, and two flags"
kind  = "plumbing"
tracks = ["reference"]
body = """
`serialize`, `deserialize`, a set of aliases, and a `renamed` bool for each
direction. The bools are not redundant with comparing against the source name:
`#[serde(rename = "x")]` on a field already called `x` is explicit renaming, and
`check` uses that distinction to reject combinations that would otherwise look
accidental.

`from_attrs` is where the fallback happens — an unset direction takes the source
name — and it is the only place that decision is made.

The aliases are a `BTreeSet`, so the generated `FIELDS` constant and the
matcher arms come out in a stable order across builds.
"""

[[annotation]]
id    = "int-name-0003"
file  = "src/internals/name.rs"
lines = "59-70"
title = "Name — a string and the span it came from"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["syn::LitStr", "quote::ToTokens"]
body = """
The span is the point. A `Name` interpolated into generated code becomes a
`LitStr` carrying the span of the `rename = "..."` the user wrote, so an error
about that string lands on their attribute rather than on the derive.

That is why this is a type rather than a `String`, and why `ToTokens` is
implemented by hand.
"""

[[annotation]]
id    = "int-name-0004"
file  = "src/internals/name.rs"
lines = "71-113"
title = "…and the comparison impls, which ignore the span"
kind  = "plumbing"
tracks = ["reference"]
body = """
`Ord`, `Eq` and `PartialEq` all compare only `value`. Two `Name`s from different
source locations with the same text are the same name, which is what makes the
alias `BTreeSet` deduplicate correctly.

Deriving these would have compared the span as well and produced a set with
duplicate entries that print identically — a bug that would only appear as a
confusing `FIELDS` constant.
"""
