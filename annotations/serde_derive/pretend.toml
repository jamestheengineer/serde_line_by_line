[[annotation]]
id    = "pret-0001"
file  = "src/pretend.rs"
lines = "1-31"
title = "pretend_used — generating code purely to suppress a warning"
kind  = "codegen"
tracks = ["reference"]
glossary = ["quote::format_ident"]
body = """
The comment, with its two quoted `rustc` warnings, is the entire justification:
a remote-derive placeholder never has its fields read or its variants
constructed, so the compiler reports them as dead code — in the user's build,
about a struct they wrote deliberately.

So this file generates code that pretends to use them. It is the only code in
the crate whose output is intended never to run: every construct below is inside
`match None { ... }`, so it type-checks and is unreachable.
"""

[[annotation]]
id    = "pret-0002"
file  = "src/pretend.rs"
