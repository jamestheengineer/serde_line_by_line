body = """
Four worked examples, one per case, and they are better than any paraphrase:
the ordinary struct, the packed struct on new rustc, the packed struct on old
rustc, and the enum.

Worth reading here rather than reconstructing from the four functions below —
the generated shapes are small and the differences between them are the whole
content.
"""

[[annotation]]
id    = "pret-0003"
