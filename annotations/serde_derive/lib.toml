[[annotation]]
id    = "dlib-0001"
file  = "src/lib.rs"
lines = "1-15"
title = "The crate doc: two macros, and a link to the real documentation"
kind  = "plumbing"
tracks = ["reference"]
body = """
Fifteen lines for a crate that is one of the most used in the ecosystem, and
that is the right amount. `serde_derive` has no API to document beyond two
derive macros; everything a user needs to know is about the *attributes*, and
those are documented on serde.rs rather than here.

The `edition2021` doctest fence is a custom one — serde's CI runs these under a
specific edition, because a derive macro's output can depend on it.
"""

[[annotation]]
id    = "dlib-0002"
file  = "src/lib.rs"
lines = "16-67"
title = "…and fifty lines of suppressed lints"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "msrv"]
body = """
Two `allow` blocks, one for clippy and one for clippy-pedantic, and four of the
entries carry a link to the clippy bug they are working around. That is the
detail worth taking: these are not blanket suppressions, they are a maintained
list with citations.

`cognitive_complexity`, `too_many_lines` and `too_many_arguments` are the honest
ones. `Container::from_ast` is a 300-line `if`/`else` chain and
`deserialize_seq` takes six arguments, and both are the clearest way to write
what they do.

The `cfg_attr(all(test, exhaustive), ...)` on line 66 enables the nightly lint
that makes `check.rs` and `bound.rs`'s exhaustive matches over syn's
`#[non_exhaustive]` types a test failure when syn grows a variant.
"""

[[annotation]]
id    = "dlib-0003"
file  = "src/lib.rs"
lines = "68-94"
title = "…the extern crates, and the module list"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["proc_macro2::TokenStream", "syn::parse_macro_input"]
body = """
`extern crate proc_macro;` is the one that is not decoration: `proc_macro` is
provided by the compiler rather than by Cargo, and even in the 2018 edition it
has to be named to be linked.

`#[macro_use]` on `bound` and `fragment` is why `quote_expr!` and `quote_block!`
work in every other module without an import. Two of the crate's three
`macro_rules!` are in `fragment`.
"""

[[annotation]]
id    = "dlib-0004"
file  = "src/lib.rs"
lines = "95-112"
title = "private — a lowercase struct used as a token, and the versioned module name"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["quote::ToTokens", "quote::TokenStreamExt", "proc_macro2::Ident"]
body = """
The trick that keeps serde's private API private across releases, and the thing
the expansion harness had to be careful about (D10).

`private` is a unit struct with a `ToTokens` impl that appends
`__private` + the crate's patch version — `__private229` for 1.0.229. Every path
in generated code goes through it, so code generated by one version cannot
accidentally call the private API of another: the module name does not exist
there.

`concat!` with `env!("CARGO_PKG_VERSION_PATCH")` means the name is baked in at
*this crate's* compile time, which is exactly the trap the harness has a test
for — built as part of another crate, it would read that crate's version.

The lowercase struct name is deliberate, with an `allow` to match: it is used in
`quote!` interpolation as `#private`, and a type name in that position reads as
a value.
"""

[[annotation]]
id    = "dlib-0005"
file  = "src/lib.rs"
lines = "113-127"
title = "…and the two entry points, seven lines each"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["proc-macro-boundary"]
glossary = ["syn::parse_macro_input", "syn::DeriveInput"]
body = """
The whole public surface. `parse_macro_input!` converts the compiler's
`TokenStream` into a `DeriveInput` and *returns early with a compile error* on a
parse failure — it expands to a `match` with a `return`, which is why it can
only be used in a function returning `proc_macro::TokenStream`.

`unwrap_or_else(syn::Error::into_compile_error)` is the other half: an error
from expansion becomes a `compile_error!` invocation in the output rather than a
panic. That is what makes a bad attribute produce a readable diagnostic instead
of "proc macro panicked".

These fourteen lines are also the ones the expansion harness patches: dropping
`proc-macro = true` and swapping `proc_macro::TokenStream` for
`proc_macro2::TokenStream` here is the whole of the difference between the crate
the compiler loads and the library this site runs in your browser.
"""
