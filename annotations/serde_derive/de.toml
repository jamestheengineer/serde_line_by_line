body = """
Deserializing an enum payload gives you the *contents* of a variant. This
generates the closure that puts them back in the variant, and it is used by
every tagged representation.

`with_wrapper` distinguishes the two callers: one has a `__DeserializeWith`
whose `.value` holds the payload, the other has a bare tuple. The `arg` in the
second case carries an explicit type annotation, `__wrap: (T, U)`, because
nothing at the call site would let inference find it.
"""

[[annotation]]
id    = "de-0047"
file  = "src/de.rs"
lines = "741-765"
title = "…and five shapes, one of which is not the general case"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["pattern-matching", "closures"]
body = """
Four styles, five arms — struct variants are split by field count.

The single-field struct variant is special because the payload is the field's
value directly rather than a one-element tuple, so it is `{ member: __wrap }`
and not `{ member: __wrap.0 }`. That asymmetry comes from how the payload was
read, not from a choice made here, and a reader who wonders why the two struct
arms differ will find the answer in the newtype-variant reading path.
"""

[[annotation]]
id    = "de-0048"
file  = "src/de.rs"
lines = "766-807"
title = "expr_is_missing — four answers to “the field was not there”"
kind  = "codegen"
tracks = ["reference"]
emits_from = "deserialize"
emits_case = "struct_rename"
emits = """
                            _serde::__private229::Default::default()
"""
body = """
Called wherever a field was absent from the input. Four sources are tried in a
fixed order, and the order is the attribute precedence.

The field's own bare `#[serde(default)]` becomes `Default::default()` spanned on
the field, so a type without a `Default` impl reports at the field rather than at
the derive. A named `default = "f"` becomes `f()`, spanned on the path.

Then the container's default: `__default.#member`, the field taken out of the
one default value bound earlier rather than defaulted independently. That is the
difference between `#[serde(default)]` on a container and on every field — the
container form gives you the fields of a single coherent default value.

With no default anywhere it is an error, and which error depends on whether the
field has a `deserialize_with`. The plain path calls
`private::de::missing_field`, which is not merely an error constructor: it tries
to deserialize the field from a unit first, so `Option<T>` and anything else
that accepts unit still succeeds. That is why a missing `Option` field works
without `#[serde(default)]`. The `deserialize_with` path cannot do that — the
user's function may not accept a unit — so it returns `Error::missing_field`
outright. A subtle difference in behaviour, decided here, that most users meet
as "why does my `Option` field need a default now".

The emitted `missing_field("xCoord")` carries the *renamed* name, because that
is what the reader of the error was supposed to have written.
"""

