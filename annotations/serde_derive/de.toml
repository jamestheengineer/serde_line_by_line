                        i32,
                    >(&mut __seq)? {
                        _serde::__private229::Some(__value) => __value,
                        _serde::__private229::None => {
"""
body = """
The loop that produces the body. Each field becomes exactly one `let`, named
`__field0` upward by position — including skipped fields, which get their
default value and never touch the sequence.

`index_in_seq` is deliberately *not* the loop index. It counts only fields that
are read, so the `invalid_length(index, ...)` error reports the position in the
input rather than the position in the struct. Those differ the moment a skipped
field appears before a read one, and getting it wrong produces an error message
that points at the wrong element.

The `deserialize_with` arm wraps the field type in a generated
`__DeserializeWith` and unwraps `__wrap.value` afterwards. That wrapper exists
so the user's function cannot see serde's internal state — the comment on
`wrap_deserialize_with` below says so directly.
"""

