[[annotation]]
id    = "de-0008"
file  = "src/de.rs"
lines = "89-101"
title = "precondition_sized — a trailing slice cannot be built"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["sized-bound"]
body = """
`struct S { header: u32, rest: [u8] }` is a legal unsized type and you can
borrow one, but you cannot return one by value — and `Deserialize::deserialize`
returns `Self`.

The check looks only at the *last* field, because that is the only position a
dynamically sized type may occupy. `ungroup` strips invisible token groups that
macro expansion can leave around a type, which is the kind of detail that makes
a check like this work when the type came from another macro.
"""

[[annotation]]
id    = "de-0009"
file  = "src/de.rs"
lines = "102-115"
title = "precondition_no_de_lifetime — the name collision with no hygiene"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes", "lifetime-de"]
body = """
If the user's type already has a lifetime parameter called `'de`, the generated
`impl<'de> Deserialize<'de> for S<'de>` means something the user did not intend,
and there is no hygiene for lifetime parameters to save it.

So it is rejected, with the error spanned on their `'de`. The check runs only
when something actually borrows — a type whose impl uses `'static` has no `'de`
to collide with, and rejecting it would be a rule with no reason behind it.
"""

[[annotation]]
id    = "de-0010"
file  = "src/de.rs"
lines = "116-143"
title = "Parameters — the serialize side's, minus one field and plus two"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["syn::Ident", "syn::Path", "syn::Generics"]
body = """
`self_var` is gone: there is no value to read from, only one to build.

`local` is new and is the user's own type name, kept separate from `this_type`
because the generated `__Visitor` is named after the local type even for a
remote derive. `borrowed` is the other addition, and it is the one that decides
whether the impl header carries a `'de` at all.

`has_getter` means the remote type has private fields reached through
`#[serde(getter)]`, which forces the deserialized value through an `Into`
conversion rather than being constructed directly.
"""

