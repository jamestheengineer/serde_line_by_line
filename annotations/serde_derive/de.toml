[[annotation]]
id    = "de-0013"
file  = "src/de.rs"
lines = "171-188"
title = "generics_with_de_lifetime — four fragments, two of them home-made"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "20-generating-an-impl"
rust_features = ["lifetimes", "generic-params"]
glossary = ["syn::TypeGenerics", "syn::WhereClause", "syn::Generics"]
body = """
syn's `split_for_impl` gives three fragments of the generics as they are. This
impl needs a fourth thing: the same generics *with `'de` prepended* in two
different positions, and syn has no way to ask for that.

So `DeImplGenerics` and `DeTypeGenerics` are wrapper types with hand-written
`ToTokens` impls, defined at the bottom of this file. They are returned here
instead of `impl_generics`, which is dropped on the floor — the `_` in the
destructuring — because the impl header must declare `'de` and the type must
not.
"""

[[annotation]]
