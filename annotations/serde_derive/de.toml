"""

[[annotation]]
id    = "de-0015"
file  = "src/de.rs"
lines = "200-229"
title = "…and three inferred bounds where serialization needs one"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "20-generating-an-impl"
rust_features = ["where-clauses", "generic-params"]
glossary = ["syn::parse_quote"]
body = """
The container's own `bound` still replaces inference entirely. What is different
is the `None` arm, which adds up to three kinds of bound instead of one.

`#[serde(default)]` on the container needs `Self: Default`, added by
`with_self_bound`. Then `T: Deserialize<'de>` for each parameter in a field that
will actually be read — note `#delife` interpolated into the `parse_quote!`, so
the bound says `Deserialize<'static>` for a type that borrows nothing. Then
`T: Default` for each parameter in a field carrying its own `#[serde(default)]`,
because that field is constructed rather than read.

Three separate walks over the fields, each with its own predicate. They are not
merged because a parameter can qualify for two of them and the bounds are
different.
"""

