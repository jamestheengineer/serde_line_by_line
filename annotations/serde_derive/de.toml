"""
body = """
The impl every derived `Deserialize` is. Note where `#delife` appears twice: on
the trait, `Deserialize<'de>`, and on the bound, `__D: Deserializer<'de>`. Those
have to be the same lifetime or the borrowed data has nothing to borrow from.

`#fn_deserialize_in_place` is the one structural difference from the serialize
side. It is an entire extra method, usually absent — it splices to nothing when
the feature is off or the shape does not support it — and it exists so a caller
can reuse an allocation instead of building a fresh value.
"""

