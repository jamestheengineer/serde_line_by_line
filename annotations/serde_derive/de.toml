kind  = "codegen"
tracks = ["reference"]
rust_features = ["lifetime-de", "generic-params"]
body = """
The doc comment is the whole rationale: the wrapper exists "to prevent it from
accessing the internal `Deserialize` state". A user's `deserialize_with`
function receives a `Deserializer` and nothing else — not the partially built
struct, not the field map, not the visitor.

The trick is that the function is called from inside a generated type's *own*
`Deserialize` impl, so the only thing in scope at the call site is the
deserializer that was handed in.

