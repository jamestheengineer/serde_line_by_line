[[annotation]]
id    = "de-0054"
file  = "src/de.rs"
lines = "860-873"
title = "…and the impl that prepends `'de` to the impl header"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["lifetimes", "lifetime-de"]
glossary = ["quote::ToTokens", "syn::GenericParam"]
body = """
Fourteen lines, and they are the reason this wrapper exists. syn's
`split_for_impl` renders the generics it was given; there is no way to ask it
for "these generics, plus a lifetime in front". So the params are cloned, `'de`
is chained onto the front, and *then* the result is split.

Prepended rather than appended, because `impl<'de, T>` is the conventional
order and generated code that reads unlike hand-written code is harder to debug.

When nothing borrows, `de_lifetime_param()` is `None` and this renders the
generics unchanged — which is how `impl Deserialize<'static> for T` comes out
with no lifetime parameter at all.
"""

[[annotation]]
id    = "de-0055"
file  = "src/de.rs"
lines = "874-908"
title = "InPlaceImplGenerics — two lifetimes, and a bound on every parameter"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["cfg", "lifetimes"]
glossary = ["syn::GenericParam", "syn::TypeParamBound"]
body = """
The in-place method's header needs `'place` as well as `'de`, and every existing
parameter has to outlive `'place` because the place is a `&'place mut Self`.

So this walks every parameter adding the bound — lifetimes get
`'a: 'place`, type parameters get `T: 'place`, const parameters get nothing —
and then prepends `'place` and `'de` in that order, so the final header reads
`impl<'de, 'place, ...>`.

This is the most intricate generics manipulation in the crate, and it is behind
a feature flag that is off by default. That is a fair summary of why
`deserialize_in_place` has never stabilized.
"""

