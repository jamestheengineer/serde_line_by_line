[[annotation]]
id    = "de-0001"
file  = "src/de.rs"
lines = "1-24"
title = "Imports, and nine modules the serialize side does not have"
kind  = "plumbing"
tracks = ["reference"]
glossary = ["proc_macro2::TokenStream", "quote::quote", "quote::ToTokens", "syn::punctuated::Punctuated", "syn::spanned::Spanned"]
body = """
The import list is `ser.rs`'s plus three things, and each addition is a
deserialization problem the serialize side never meets.

`std::collections::BTreeSet` holds the set of borrowed lifetimes, which has to
be ordered so the generated impl header is deterministic. `std::ptr` is used for
exactly one identity comparison. `quote::ToTokens` is imported because this file
*implements* it — four times, for wrapper types that render generics in
positions syn's own splitter does not produce.

Then nine modules. `ser.rs` is 1,369 lines and generates everything itself;
deserialization is 4,728 lines across eleven files, because reading is harder
than writing. This file keeps the dispatch and the shared helpers and hands each
shape to its own module.
"""

[[annotation]]
id    = "de-0002"
file  = "src/de.rs"
lines = "25-35"
title = "expand_derive_deserialize — the same opening, with a different check"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["result", "proc-macro-boundary"]
glossary = ["syn::DeriveInput", "syn::Result"]
body = """
Line for line the twin of `expand_derive_serialize`: rewrite `Self`, open an
error collector, parse the container, drain the errors.

`Derive::Deserialize` is the one argument that differs, and it changes what
`from_ast` validates — `skip_serializing` and `skip_deserializing` are different
attributes, and only the relevant half is enforced. The preconditions checked
below are entirely different too, which is why `precondition` here delegates to
two functions and the serialize side's does its one check inline.
"""

[[annotation]]
id    = "de-0003"
file  = "src/de.rs"
lines = "36-42"
title = "…and the extra value: the `'de` lifetime"
kind  = "codegen"
tracks = ["reference", "course"]
course_unit = "20-generating-an-impl"
rust_features = ["lifetimes", "lifetime-de"]
body = """
Four values become five. `generics_with_de_lifetime` returns *four* fragments
where the serialize side needed three, because the impl header has a lifetime
parameter the type does not: `impl<'de> Deserialize<'de> for Point`.

`delife` is that lifetime as a token — and it is not always `'de`. When no field
borrows from the input, it is `'static`, and the impl is
`impl Deserialize<'static> for T`, which is a real simplification rather than a
special case. `BorrowedLifetimes` below is what decides.
"""

[[annotation]]
id    = "de-0004"
file  = "src/de.rs"
lines = "43-58"
title = "The remote branch — an associated function returning the remote type"
kind  = "codegen"
tracks = ["reference"]
body = """
As on the serialize side, a remote impl cannot be a trait impl, so this emits an
inherent `deserialize` returning `#remote #ty_generics` rather than `Self`.

The signature is otherwise identical to the trait method's, including the `'de`
bound on `__D`, so `#[serde(with = "...")]` can call it in the place a trait
method would have been called.
"""

