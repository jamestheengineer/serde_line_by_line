[[annotation]]
id    = "de-0026"
file  = "src/de.rs"
lines = "400-417"
title = "…and the other fields, which have to come from somewhere"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
Each non-transparent field gets a value with no input to read it from. Three
sources, in order: its own `#[serde(default)]`, a named default function, or —
failing both — `PhantomData`.

That last arm is not a fallback so much as a statement about what
`#[serde(transparent)]` permits: `internals::check` only allows the attribute
when every other field is either defaultable or a `PhantomData`, so by the time
codegen runs the `Default::None` arm can only be a marker.

`ptr::eq` to find the transparent field again. Comparing by address is exact
where comparing by name would be ambiguous for a tuple struct and comparing by
index would need the index threaded down.
"""

