body = """
Only bare `#[serde(default)]` requires a `T: Default` bound. `default = "path"`
names a function that produces the value, and that function's return type is
already the field's type — requiring `Default` as well would reject types that
have a perfectly good constructor and no `Default` impl.

The `if let ... true else false` spelling rather than `matches!` is the kind of
thing an MSRV floor leaves behind in a codebase.
"""

[[annotation]]
id    = "de-0018"
file  = "src/de.rs"
lines = "257-282"
title = "BorrowedLifetimes — the enum, and the two lifetimes it yields"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "20-generating-an-impl"
rust_features = ["lifetimes", "lifetime-de"]
body = """
Two states, and the distinction runs through the whole file. `Borrowed` carries
the set of the user's lifetimes that fields borrow from the input; `Static`
means nothing does. A `BTreeSet` rather than a `Vec`, because these become
bounds in a generated impl header and the order has to be stable — two
compilations of the same input must produce the same tokens.

`de_lifetime` is the lifetime the `Deserialize` impl is parameterized by, and
when nothing borrows it is literally `'static`. The generated impl is then
`impl Deserialize<'static> for T`, which is exactly right: such a type can be
built from any deserializer, with no relationship to the input's lifetime.

`de_lifetime_param` is the same lifetime as a *declaration* — `'de: 'a + 'b`,
with the borrowed set as its bounds — for the impl header. The two are separate
functions because bounds belong only on the declaration; repeating them at every
use would not compile. `None` for the static case is the signal used everywhere
downstream: no parameter to declare, so nothing is prepended to the generics.
"""

[[annotation]]
id    = "de-0019"
file  = "src/de.rs"
lines = "283-305"
title = "borrowed_lifetimes — where `impl<'de: 'a>` comes from"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "20-generating-an-impl"
rust_features = ["lifetimes", "lifetime-de", "borrowing"]
body = """
The comment above this function is the clearest statement of zero-copy
deserialization's type-level shape in the crate, and it is worth reading in
place rather than paraphrased.

The mechanism: collect every lifetime any non-skipped field borrows from the
input, and make `'de` outlive all of them. A field holding `&'a str` taken from
the input requires the input to live at least as long as `'a`, and
`impl<'de: 'a, 'a> Deserialize<'de> for S<'a>` is how that is said.

The `'static` special case is not an optimization. `'de: 'static` would be a
strictly stronger requirement than `'static` and would reject callers that ought
to work, so when anything borrows `'static` the impl drops `'de` entirely.
"""

[[annotation]]
id    = "de-0020"
file  = "src/de.rs"
lines = "306-331"
title = "deserialize_body — the serialize fork, plus identifiers"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
The same three container attributes take precedence — `transparent`, `from`,
`try_from` — and then the shape decides, exactly as on the serialize side.

What is new is the fourth test. `#[serde(field_identifier)]` and
`variant_identifier` mark a type used to *name* a field or variant while
reading, and those are rejected outright on the serialize side. Here they are a
whole separate code path, `identifier::deserialize_custom`, because naming is
half of what deserialization does.

`Style::Tuple` and `Style::Newtype` share an arm here and do not on the
serialize side: reading a sequence of one and a sequence of many is the same
loop, while writing them reaches two different `Serializer` methods.
"""

[[annotation]]
id    = "de-0021"
file  = "src/de.rs"
lines = "332-349"
title = "deserialize_in_place_body — five ways to opt out"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "feature-unification"]
body = """
`deserialize_in_place` fills an existing value instead of returning a new one,
which lets a caller reuse allocations. It is behind a cargo feature and unstable,
and this function's job is mostly to decide not to generate it.

The five conditions are all cases where there is no existing value to fill
usefully: a transparent or converted type is built from something else entirely,
an identifier is a name rather than a value, and a type whose every field goes
through `deserialize_with` has nothing this crate can write into.

`assert!(!params.has_getter)` is a note to a future maintainer rather than a
runtime check: remote derives never reach here, and if that ever changes the
assert says which assumption broke.
"""

