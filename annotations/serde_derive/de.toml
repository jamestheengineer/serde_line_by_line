[[annotation]]
id    = "de-0044"
file  = "src/de.rs"
lines = "682-709"
title = "…and the wrapper type, with two PhantomData fields"
kind  = "codegen"
tracks = ["reference"]
rust_features = ["marker-types", "lifetime-de"]
body = """
Two markers, not one, and they are doing different jobs. `phantom` constrains
the type parameters, exactly as the serialize side's wrappers do. `lifetime:
PhantomData<&'de ()>` constrains `'de`, which appears nowhere else in the struct
— without it, the impl would be generic over a lifetime the type does not use,
which does not compile.

`__DeserializeWith` is returned together with the type to name it by, because
the caller has to both emit the definition and mention the type. Returning a
pair rather than one stream is what lets the caller put the definition inside a
block and the mention in a turbofish.
"""

