title = "deserialize_seq — the expecting message, built at expansion time"
kind  = "codegen"
tracks = ["reference"]
emits_from = "deserialize"
emits_case = "struct_rename"
emits = """
                                    &"struct Point with 2 elements",
"""
body = """
Every sequence read in this crate goes through this function, and the first
thing it builds is the error message for when the sequence is too short.

The count is of *deserialized* fields, not all of them: a skipped field is not
read from the input, so it must not be counted in "with 2 elements" or the
message would be a lie. The singular case is spelled out separately because
"with 1 elements" is the kind of detail readers notice and authors do not.

`cattrs.expecting()` lets `#[serde(expecting = "...")]` replace the whole thing,
which is the only way to get a domain-specific message out of a derived impl.
"""

