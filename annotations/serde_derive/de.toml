produced `let __field0 = ...`, this produces `self.place.x = ...`, and a skipped
field is an assignment rather than a binding.

`next_element_seed` with `InPlaceSeed` is the in-place mechanism proper: the
seed carries `&mut` the destination, so the format writes into the existing
value rather than constructing one and moving it.
"""

