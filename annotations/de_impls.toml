rust_features = ["traits", "inlining"]
prereqs = ["de-impls-0003"]
body = """
`deserialize_char` is the hint, and a self-describing format is free to ignore
it and call `visit_str` instead — which is precisely why the visitor overrides
both. `#[inline]` here and on both visit methods: this is the pattern for
scalars, where the function body is smaller than the call.
"""

[[annotation]]
id    = "de-impls-0026"
file  = "src/de/impls.rs"
lines = "576-583"
title = "Two visitors for one type, and the cfg that gates both"
kind  = "cfg-gate"
tracks = ["reference", "course"]
