[[annotation]]
id    = "de-impls-0087"
file  = "src/de/impls.rs"
lines = "1896-1939"
title = "Two visit_enum bodies, chosen by the target platform"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "11-no-std-and-cfg"
rust_features = ["cfg", "pattern-matching", "custom-errors", "strings"]
prereqs = ["de-impls-0086", "de-impls-0084"]
body = """
`OsString` is bytes on Unix and UTF-16 on Windows, and the two are not
convertible in general — a Windows path can contain unpaired surrogates, a Unix
path can contain arbitrary bytes, and neither maps into the other. Serde's
answer is to put the platform in the data: the value is serialized as an enum
with a `Unix` or `Windows` variant, so the reader can tell what it received.

Two `visit_enum` bodies, gated `#[cfg(unix)]` and `#[cfg(windows)]`. Only one is
compiled, and each handles both variants — the matching one by conversion, the
other by an explicit `Error::custom("cannot deserialize Windows OS string on
Unix")`.

This is the honest design. The alternative — lossily converting — would produce
a path that silently does not name the file it named on the other machine. A
run-time error naming both platforms is a much better failure, and it is
reachable only when data genuinely crosses between them.

Note the two `use` statements inside the method bodies. `OsStringExt` is a
platform extension trait, and importing it at module scope would break the build
on the other platform even though the method that needs it is `cfg`-ed out.
Function-local imports keep the trait's visibility as narrow as the code that
uses it.
"""

