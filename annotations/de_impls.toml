body = """
Two methods, both one line, both passing `$len` as the tuple length so a
non-self-describing format knows how many elements to read without a count in
the stream.

This is the first macro in the file to generate a `deserialize_in_place` that is
genuinely better than the default rather than merely equivalent — `seq_impl!`
clears and refills, this one overwrites in place. Fixed length is what makes the
difference.
"""

[[annotation]]
id    = "de-impls-0063"
file  = "src/de/impls.rs"
lines = "1344-1378"
title = "1 through 32 — a table that const generics made obsolete"
kind  = "macro-use"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["macro-repetition", "msrv", "generic-params"]
macro_def = "de-impls-0060"
body = """
Thirty-two lines, one per array length, each spelling out its own indices. It is
the most mechanical block in the crate and it is a historical artifact: before
const generics, `impl<T> Deserialize for [T; N]` could not be written for all
`N`, so the standard library and every crate that followed it stopped at 32.

Const generics stabilized in Rust 1.51 and this crate's declared minimum is
1.56, so the technical obstacle is gone. The table remains, and the practical
consequence is that `[T; 33]` has no `Deserialize` impl — a limit users still
hit and report.

Worth knowing when you meet it: the workaround is `#[serde(with = ...)]` or a
newtype, not a patch to this list.
"""

[[annotation]]
id    = "de-impls-0064"
file  = "src/de/impls.rs"
lines = "1379-1394"
title = "tuple_impls! — a macro split in two so one impl can opt out"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "cfg"]
prereqs = ["de-impls-0060"]
body = """
This macro generates only the impl *header* and delegates everything inside the
braces to `tuple_impl_body!`. The split exists for one caller: the one-element
tuple `(T,)`, below, needs the same body under a different header — one carrying
rustdoc attributes and a hand-written generic list.

Factoring the body into its own macro is the ordinary refactor, applied to
macros. It works because a `macro_rules!` invocation is allowed in item
position inside an impl block, so `tuple_impl_body!(...)` expands to the two
methods exactly where it is written.

`#[cfg_attr(docsrs, doc(hidden))]` hides all fifteen generated impls from the
documentation. The next annotation shows what appears in their place.
"""

[[annotation]]
id    = "de-impls-0065"
file  = "src/de/impls.rs"
lines = "1395-1432"
title = "Type parameters reused as variable names"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-hygiene", "pattern-matching"]
prereqs = ["de-impls-0064"]
body = """
The body is the array visitor's trick again — a `match` per element that either
yields a value or returns early — with one difference in how the values are
held.

An array is homogeneous, so its elements can be built directly inside the array
literal. A tuple is not: each position has its own type, and the expansion needs
a distinct binding per position. Rather than invent names, the macro reuses the
type parameter identifiers as variable names:

    let $name = match tri!(seq.next_element()) { ... };

so `T0`, `T1`, `T2` become both the types in the impl header and the locals in
the body. It is guaranteed to produce one distinct name per element, because the
type parameters already had to be distinct. The cost is `#[allow(non_snake_case)]`,
since `let T0 = ...` violates the naming lint — and that attribute is the visible
trace of the trick.

`Ok(($($name,)+))` then collects them. The trailing comma inside the repetition
is what makes the one-element case `(T0,)` a tuple rather than a parenthesised
expression.
"""

[[annotation]]
id    = "de-impls-0066"
file  = "src/de/impls.rs"
lines = "1433-1467"
title = "In place, and the parentheses around self.0"
kind  = "macro-def"
tracks = ["reference"]
rust_features = ["macro-rules", "borrowing", "msrv"]
prereqs = ["de-impls-0065"]
body = """
The in-place half needs no `fail_idx` dance: the repetition is unrolled, so each
element is a separate statement with its own `return`, and no loop holds a
borrow across the error construction. What the array visitor needed a workaround
for, the macro gets for free by not having a loop at all.

`InPlaceSeed(&mut (self.0).$n)` — the parentheses are the curiosity. `self.0` is
the `&mut` tuple the visitor wraps, and `$n` is the field index within it, so
the expression wants to be `self.0.0`. Written directly that is fine on a
current compiler; it was not always, because a tuple index followed by another
was lexed as a float literal, and this crate supports compilers back to 1.56.
The parentheses break the sequence unambiguously and cost nothing.
"""

[[annotation]]
id    = "de-impls-0067"
