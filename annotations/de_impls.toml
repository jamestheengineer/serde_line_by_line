macro_def = "de-impls-0038"
body = """
Deserialize a `CString`, then `into_boxed_c_str` to drop the excess capacity.
The two attributes are matched by `$(#[$attr:meta])*` and re-emitted onto the
impl, which is how this invocation carries the same `no_core_cstr` gate as the
`CString` code above it without the macro containing a single `cfg`.
"""

[[annotation]]
id    = "de-impls-0040"
file  = "src/de/impls.rs"
