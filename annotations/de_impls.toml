markers on a struct that a derive might need to deserialize. The relaxed bound
costs nothing because no `T` is ever touched.

Note the visitor struct itself needs `T: ?Sized` on its declaration too — a
struct's `PhantomData<T>` field requires `T: Sized` by default like any other
field position.
"""

[[annotation]]
id    = "de-impls-0046"
