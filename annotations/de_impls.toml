[[annotation]]
id    = "de-impls-0069"
file  = "src/de/impls.rs"
lines = "1498-1514"
title = "map_impl! — the same shape as seq_impl!, two callbacks lighter"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "generic-params", "where-clauses"]
prereqs = ["de-impls-0047"]
body = """
The map counterpart, and the interesting comparison is what it does *not* need.
`seq_impl!` took six arguments; this takes three, because `BTreeMap` and
`HashMap` agree on the one operation that matters — `insert(key, value)` — so no
`$insert` callback is required, and neither map has a `clear`-and-`reserve` path
worth parameterising.

There is no `deserialize_in_place` here at all. Reusing a map's existing entries
would mean matching incoming keys against keys already present, which is a
lookup per element and probably slower than rebuilding. The macro does not try,
and unlike `Option`'s omission there is no `FIXME` suggesting it should.

The matcher is `seq_impl!`'s with `K` and `V` in place of `T`, and only `K` gets
bounds — `V` is always just `Deserialize`. Note the trailing comma after
`$with_capacity:expr,`: it is part of the matcher, so every invocation must end
with one.
"""

[[annotation]]
id    = "de-impls-0070"
file  = "src/de/impls.rs"
lines = "1515-1555"
title = "visit_map — and the duplicate key that vanishes"
kind  = "impl"
tracks = ["reference"]
rust_features = ["collections", "option"]
prereqs = ["de-mod-0063", "de-impls-0069"]
body = """
`while let Some((key, value)) = tri!($access.next_entry())` is the map
equivalent of the sequence loop, and `next_entry` is the convenience that
returns both halves at once rather than making the caller sequence `next_key`
and `next_value` by hand.

`values.insert(key, value)` discards its return value, and that return value is
`Option<V>` — the previous entry, if the key was already present. So a document
containing the same key twice deserializes without complaint and the last
occurrence wins. That is a policy decision made by omission, and it differs from
what `serde_derive` does for a struct, where a repeated field is a
`duplicate_field` error. The same input can therefore be rejected as a struct
and accepted as a `HashMap`.

`deserialize_map` is the hint. A format is free to answer it with a sequence of
pairs instead, and several do — but this visitor overrides only `visit_map`, so
they will get a type error unless they call the method that was asked for.
"""

[[annotation]]
id    = "de-impls-0071"
