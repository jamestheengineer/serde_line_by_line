by a human-readable format cannot be deserialized by a binary one. The
representation is not a property of the type, it is a property of the pair.

`FromStrVisitor` is used here and defined at the very bottom of the file,
fifteen hundred lines below. That is legal because it is an item, and items are
visible throughout their module — the exact opposite of the rule that forced
`num_128!` to be defined before its callers.
"""

[[annotation]]
id    = "de-impls-0074"
file  = "src/de/impls.rs"
lines = "1592-1605"
title = "variant_identifier! — the derive, written out by hand"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "proc-macro-boundary", "cfg"]
prereqs = ["de-impls-0069"]
body = """
serde_core cannot use `#[derive(Deserialize)]` — the derive lives in
`serde_derive`, which depends on this crate, so reaching for it here would be a
cycle. Everything `serde_derive` would have generated for an enum's variant
identifier is therefore written out longhand in this macro, and a comment
further down the file says exactly that.

It is the best available look at what the derive emits, without reading the
proc-macro's own output. Three pieces come out of it: the `enum` of variant
names, a `static` array of those names as strings, and a `Deserialize` impl that
maps an index, a string or a byte string onto a variant.

The `static $variants_name: &[&str]` is not decoration. It is what
`Error::unknown_variant` needs in order to produce *"unknown variant `V5`,
expected `V4` or `V6`"* — the list of alternatives has to exist as data
somewhere, and this is where.
"""

[[annotation]]
id    = "de-impls-0075"
file  = "src/de/impls.rs"
lines = "1606-1666"
title = "Three ways to name a variant, and stringify! in pattern position"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "pattern-matching", "strings"]
prereqs = ["de-impls-0074", "de-mod-0011"]
body = """
`KindVisitor` overrides three methods because formats identify a variant in
three different ways: by index (`visit_u64`), by name (`visit_str`), or by name
as bytes (`visit_bytes`). A compact binary format writes the index; JSON writes
the name; a format with no string type writes the bytes.

The line worth noticing is inside `visit_str`:

    stringify!($variant) => Ok($name_kind :: $variant),

`stringify!` in *pattern* position. It expands to a string literal, and a string
literal is a valid pattern, so the match arm compares against the variant's own
name with no runtime work and no chance of the two drifting apart. The same
trick would not work with a `String` — only literals are patterns.

The two error paths differ deliberately. An unrecognised index is
`invalid_value`, because an integer is not a name and there is no list to
suggest. An unrecognised name is `unknown_variant` with the `VARIANTS` static,
which produces the "expected one of" message. `visit_bytes` tries to recover the
name as UTF-8 first so it can give the better error, and falls back to
`invalid_value` only when the bytes are not text at all.
"""

[[annotation]]
id    = "de-impls-0076"
file  = "src/de/impls.rs"
lines = "1667-1703"
title = "deserialize_enum! — a macro that invokes another macro"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "pattern-matching"]
prereqs = ["de-impls-0075", "de-mod-0068"]
body = """
The second layer: this macro calls `variant_identifier!` to build the kind enum,
then adds the `EnumVisitor` that consumes it. Composing macros this way is why
the identifier machinery was factored out — `OsString`, further down, needs
`variant_identifier!` alone without the enum wrapper.

`visit_enum` is the two-step from `EnumAccess`: `data.variant()` returns the
identified variant *and* a `VariantAccess` for its contents, and
`v.newtype_variant()` then reads the payload.

The `match` has no wildcard arm, and that is a property worth pausing on. Its
arms are generated from the same `$variant` list that generated the enum, so it
is exhaustive by construction — if the two ever disagreed, the compiler would
reject the macro's own output rather than silently falling through. Generated
code that relies on exhaustiveness checking like this is safer than generated
code that adds a defensive `_ => unreachable!()`.

Note that `VARIANTS` is hardcoded as the static's name in the call to
`variant_identifier!`, so this macro can only be used once per scope — which is
why both callers put it inside a function body.
"""

