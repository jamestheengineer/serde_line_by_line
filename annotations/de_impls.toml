kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "marker-types"]
prereqs = ["de-impls-0045", "de-mod-0037"]
body = """
`deserializer.deserialize_unit_struct("PhantomData", visitor)` rather than
`deserialize_unit`. The difference is the string: a format that records type
names — a self-describing binary format, or a schema generator — sees
`"PhantomData"` in the stream and can round-trip it.

The mismatch is worth noticing: `expecting` says `"unit"`, so an error message
reads `expected unit` while the hint asked for a unit struct. Neither is wrong,
but they describe the same request differently.
"""

[[annotation]]
id    = "de-impls-0047"
file  = "src/de/impls.rs"
lines = "975-993"
title = "seq_impl! — parsing a generic parameter list by hand"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "generic-params", "where-clauses"]
prereqs = ["de-impls-0038"]
body = """
Five collection types share one impl, and the matcher is most of the work. Read
just this fragment:

    $ty:ident <T $(: $tbound1:ident $(+ $tbound2:ident)*)* $(, $typaram:ident : $bound1:ident $(+ $bound2:ident)*)*>

That is a hand-written parser for a Rust generic parameter list. It has to be
hand-written because `macro_rules!` has no fragment specifier for one — `$t:ty`
would match `BinaryHeap<T: Ord>` as a single opaque token tree, and this macro
needs the pieces separately: `$ty` goes in three places, `T`'s bounds go in two
`where` clauses, and the extra parameters go in five.

The bounds use `$(...)*` where the intent is "optional". A repetition matches
zero or more, so `BinaryHeap<T: Ord: Ord>` would technically parse; nothing
invokes it that way, and using `*` for an optional group is common enough in
older macros that it reads as idiomatic rather than as a bug.

The bounds are then re-emitted twice — once on the outer `Deserialize` impl and
once on the visitor inside it. That duplication is unavoidable: the visitor is a
separate type, so it needs its own copy of every bound the body requires.
"""

[[annotation]]
id    = "de-impls-0048"
file  = "src/de/impls.rs"
lines = "994-1030"
title = "The deserialize half — and why $access is a parameter"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-hygiene", "collections"]
prereqs = ["de-impls-0047", "de-impls-0035"]
body = """
The body is the `visit_seq` template from `CStringVisitor`, with three holes:
`$with_capacity` to build the collection, `$insert` to add one element,
and `$access` to name the `SeqAccess`.

`$access:ident` is the subtle one, and it is a deliberate defeat of macro
hygiene. Look at what an invocation passes for `$with_capacity`:

    BinaryHeap::with_capacity(size_hint::cautious::<T>(seq.size_hint()))

That expression mentions `seq`, a variable which does not exist at the
invocation site. It works because the same invocation passes `seq` as
`$access`, and the macro writes `fn visit_seq<A>(self, mut $access: A)` — so
the parameter is literally named `seq`, and the expression finds it.

`macro_rules!` hygiene would normally prevent exactly this: an identifier the
macro invents cannot be seen by code passed in from outside. Identifiers passed
*in* as parameters keep their call-site identity, so routing the binding through
`$access` is how the macro lets its caller supply an expression that reads its
local state. Every one of the five invocations passes the same name, which makes
the parameter look pointless until you notice what it enables.

`$insert(&mut values, value)` calls a method as a function value — `BinaryHeap::push`,
`BTreeSet::insert` and `VecDeque::push_back` all have the shape `fn(&mut Self, T)`,
which is what lets one call site serve four different collections.
"""

[[annotation]]
id    = "de-impls-0049"
file  = "src/de/impls.rs"
lines = "1031-1070"
title = "The in-place half — clear, reserve, refill, and a FIXME"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "borrowing", "lifetimes", "collections"]
prereqs = ["de-impls-0048", "de-impls-0029"]
body = """
Unlike `forwarded_impl!`, this macro does generate `deserialize_in_place`, and
the strategy is the crude one: `$clear` the existing collection, `$reserve`
enough room for what is coming, then refill it exactly as the by-value path
would.

That recovers the collection's own allocation — a `Vec<T>` keeps its buffer — but
throws away every element's allocation. Refilling a cleared `Vec<String>`
allocates a fresh `String` per element even though the old ones were just
dropped. The `FIXME` on the line before the loop names precisely this, listing
the three collections where overwriting in place would be possible.

`SeqInPlaceVisitor<'a, T: 'a $(, $typaram: 'a)*>` spells out `T: 'a` because the
struct holds `&'a mut $ty<T, ...>` and a reference cannot outlive what it points
at. The bound is redundant today — the compiler has inferred outlives
requirements on struct definitions since 1.31, well below this crate's 1.56
minimum — and it survives because the code predates that and removing it changes
nothing.

`&mut *self.0` rather than `self.0` at each call site is a reborrow. `self.0` is
already a `&mut`, and passing it directly would move it out of `self`, making the
second call fail. The explicit reborrow creates a shorter-lived `&mut` and leaves
the original in place.
"""

[[annotation]]
id    = "de-impls-0050"
file  = "src/de/impls.rs"
lines = "1071-1074"
title = "nop_reserve — a real function standing in for a missing method"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["generic-params", "cfg"]
prereqs = ["de-impls-0049"]
body = """
`BTreeSet` and `LinkedList` have no `reserve`. Rather than give the macro a
branch, the two invocations that need nothing pass this — a generic function
with an empty body, which the optimiser deletes entirely.

It takes `_seq: T` by value, and the value passed is a `&mut` collection. Taking
the reference by value is what makes one signature accept every collection type
without naming any of them.
"""

[[annotation]]
id    = "de-impls-0051"
file  = "src/de/impls.rs"
