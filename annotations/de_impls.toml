[[annotation]]
id    = "de-impls-0057"
file  = "src/de/impls.rs"
lines = "1177-1224"
title = "Vec in place — the deepest reuse in the crate"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["borrowing", "collections", "smart-pointers", "iterators"]
prereqs = ["de-impls-0056", "de-mod-0023"]
body = """
Forty-eight lines that reuse not just the `Vec`'s buffer but every element's,
and the mechanism is `InPlaceSeed`.

The reservation comes first and is guarded: `hint.checked_sub(self.0.len())`
returns `None` when the incoming sequence is shorter than what is already
there, and the `if let` skips the reserve rather than underflowing. Written as
`hint - self.0.len()` this would panic in a debug build on any input that
shrinks the vector.

Then the loop over existing indices. `InPlaceSeed(&mut self.0[i])` is a
`DeserializeSeed` whose `deserialize` calls `T::deserialize_in_place` on the
element it wraps — so for a `Vec<String>`, element *i* is deserialized into the
`String` already sitting at index *i*, reusing its buffer. This is where the
`deserialize_in_place` override on `String` finally pays off, several hundred
lines from where it was written.

`next_element_seed` returning `None` means the input ran out before the existing
elements did, so the vector is truncated to what was actually filled and the
function returns. Anything left in the input after the existing elements are
exhausted falls through to the ordinary push loop.

The `let next = { ... }` block is a fossil. It was written to end the borrow of
`self.0[i]` before `truncate` touches `self.0` again, which the pre-NLL borrow
checker required. Under NLL it is unnecessary: `InPlaceSeed`'s `Value` is `()`,
so `next` is an `Option<()>` holding no borrow at all, and the reference dies
when the call returns. The braces are harmless and they document the intent.
"""

[[annotation]]
id    = "de-impls-0058"
file  = "src/de/impls.rs"
lines = "1225-1239"
title = "ArrayVisitor — one type parameter for the whole array"
kind  = "impl"
tracks = ["reference"]
rust_features = ["marker-types", "generic-params"]
prereqs = ["de-impls-0041"]
body = """
`ArrayVisitor<A>` is parameterised by the array type itself — `[T; 4]` — not by
the element type. That is what lets a single struct serve thirty-three different
`Visitor` impls, each written for a different concrete `A`, with the length
living in the type rather than in a field.

`fn new()` exists because the alternative at each call site is
`ArrayVisitor { marker: PhantomData }`, and the marker field is private noise
the caller should not have to spell. It is declared in a bare `impl<A>` with no
bounds at all, so it is available for every `A` including the ones that have no
`Visitor` impl.
"""

[[annotation]]
id    = "de-impls-0059"
file  = "src/de/impls.rs"
lines = "1240-1265"
title = "[T; 0] — the impl with no bound on T"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["generic-params", "where-clauses", "zero-cost"]
prereqs = ["de-impls-0058"]
body = """
The comment above the impl is the whole point: *"Does not require T:
Deserialize<'de>."* An empty array contains no elements, so deserializing one
never deserializes a `T`, so demanding that `T` be deserializable would be a
bound that buys nothing and excludes real code — `[Box<dyn Fn()>; 0]` is a
legitimate field on a struct someone wants to derive.

That is the general principle worth taking away: put a bound where the operation
happens, not where the type appears. `serde_derive` gets this wrong by default
and generates `T: Deserialize` for every parameter, which is why
`#[serde(bound = "...")]` exists as an escape hatch.

It is hand-written rather than generated because `array_impls!` builds its array
literal from a `$(...),+` repetition, which requires at least one element.

The hint is `deserialize_tuple(0, ...)`: in serde's data model an array is a
fixed-length sequence, which is the same thing a tuple is.
"""

[[annotation]]
id    = "de-impls-0060"
file  = "src/de/impls.rs"
lines = "1266-1292"
title = "array_impls! — building a fixed-size array without partial initialization"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "unsafe", "pattern-matching"]
prereqs = ["de-impls-0047", "de-impls-0059"]
body = """
Constructing a `[T; 32]` element by element is the classic place people reach
for `MaybeUninit` and `unsafe`: you cannot assign into an array that does not
exist yet, and if element 17 fails you must drop exactly the first 16.

This macro sidesteps the whole problem. The array is built as a single
expression:

    Ok([$( match tri!(seq.next_element()) { ... } ),+])

Each element position holds a `match` that either evaluates to a `T` or returns
early from the function. The array literal is therefore never partially
initialized — either every position produces a value and the array comes into
existence complete, or the function returned before any of it was built and the
values already produced are dropped by the ordinary rules. No `unsafe`, no
`MaybeUninit`, no manual drop counting. The crate contains two `unsafe` blocks
in twelve thousand lines, and this is one of the places you might have expected
a third.

The `$($n:tt)+` capture is a list of index tokens — `0 1 2 3` — and it is used
in exactly one place, `Error::invalid_length($n, &self)`. Its real job is to be
a repetition of the right length, since `$len` alone cannot drive a
repetition; the fact that its tokens are also the correct indices for the error
message is what makes it free.
"""

[[annotation]]
id    = "de-impls-0061"
file  = "src/de/impls.rs"
lines = "1293-1321"
title = "The in-place visitor, and a variable that exists to satisfy the borrow checker"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "12-errors-iterators-closures"
rust_features = ["borrowing", "iterators", "borrow-splitting"]
prereqs = ["de-impls-0060", "de-impls-0057"]
body = """
Arrays get the element-wise reuse that `seq_impl!` could not offer, and for a
simpler reason than `Vec`: the length is fixed, so there is no truncating or
growing to think about. Walk `iter_mut()`, hand each element to `InPlaceSeed`,
done.

`fail_idx` is the line that deserves the explanation. The obvious code is to
`return Err(Error::invalid_length(idx, &self))` inside the loop — but the loop
is iterating `self.0[..].iter_mut()`, which holds a mutable borrow of `self` for
its entire duration, and `invalid_length` needs `&self` to render the
expectation. Shared and mutable borrows of the same value cannot coexist, so the
error cannot be constructed until the iterator is dropped.

The fix is to record the index, `break` to end the loop and with it the borrow,
then build the error afterwards. It reads like a workaround because it is one —
the alternative is restructuring the loop to index by integer rather than
iterate, which costs a bounds check per element.
"""

[[annotation]]
id    = "de-impls-0062"
