"""

[[annotation]]
id    = "de-impls-0023"
file  = "src/de/impls.rs"
lines = "534-552"
title = "CharVisitor — and the first type here that accepts a string"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "strings"]
prereqs = ["de-impls-0005", "de-mod-0049"]
body = """
Back to a hand-written visitor after four hundred lines of macro. `visit_char`
is the identity, exactly like `visit_bool` was.

The interesting part is what comes next. Every numeric visitor above refuses a
string outright — a JSON `"7"` will not deserialize into a `u32`. `char` is the
first type in this file that overrides `visit_str`, and it does so because most
formats have no character type at all: JSON, TOML and YAML all represent a
`char` as a one-character string, so refusing strings would make `char`
undeserializable in the three formats people actually use.

That is the rule the crate follows throughout — a conversion is accepted when
the data model genuinely lacks the type, and refused when the format simply
chose a different representation.
"""

[[annotation]]
id    = "de-impls-0024"
file  = "src/de/impls.rs"
lines = "553-565"
title = "Two calls to next(), because both alternatives are wrong"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "12-errors-iterators-closures"
rust_features = ["iterators", "pattern-matching", "strings"]
prereqs = ["de-impls-0023"]
body = """
The body is asking "does this string hold exactly one character", and the shape
it uses is worth stealing.

`v.len() == 1` would be wrong: `len` on a `&str` counts UTF-8 bytes, so it
rejects every non-ASCII character. A single `é` is two bytes and would fail.

`v.chars().count() == 1` would be correct but wasteful — `count` walks the
entire string, so validating a one-character input against a ten-megabyte string
decodes all ten megabytes before answering.

Taking two items and matching on the pair answers the question in constant time
and states it exactly: `(Some(c), None)` is "there was a first character and
there was no second". Anything else — empty, or two or more — falls through to
one `invalid_value` carrying `Unexpected::Str(v)`, so the error quotes the
string that was actually there.
"""

