prereqs = ["de-impls-0032"]
body = """
Byte slices, structurally identical to `&str`: two borrowed-only visit methods,
the same `'de: 'a` bound, `deserialize_bytes` as the hint.

The asymmetry is worth naming. `BytesVisitor::visit_borrowed_str` accepts a
string and returns `v.as_bytes()` unconditionally, because every `&str` is
valid bytes. Going the other way, `StrVisitor::visit_borrowed_bytes` has to
validate UTF-8 and can fail. The pair of impls is therefore not symmetric, and
the direction that cannot fail is the one with no error path.

`expecting` reads `"a borrowed byte array"`, which is what a user sees when a
format offers a transient slice — the same trap as `&str`, with a different
noun.
"""

[[annotation]]
id    = "de-impls-0034"
