Two lines of `where` clause do the interesting work:

    T: ?Sized,
    Box<T>: Deserialize<'de>,

The bound is on `Box<T>`, not on `T`. That is what makes `Rc<str>` and
`Rc<[u8]>` deserializable: `str` and `[u8]` are unsized and have no
`Deserialize` impl of their own, but `Box<str>` and `Box<[T]>` both got one from
`forwarded_impl!` a hundred lines above. Requiring `T: Deserialize` would have
excluded exactly the cases this macro exists to cover.

The body is then `Box::deserialize(deserializer).map(Into::into)`, relying on
`impl From<Box<T>> for Rc<T>` — which the standard library provides for unsized
`T` as well, by moving the allocation rather than copying it.

This is the third macro in the file to pick its inner type by inference, and the
most useful example of the technique: the deserialization strategy for every
`Rc<T>` is inherited from whatever `Box<T>` already knew how to do.
"""

[[annotation]]
id    = "de-impls-0094"
file  = "src/de/impls.rs"
lines = "2062-2074"
title = "Rc — and the sharing that does not survive"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-repetition", "smart-pointers", "cfg"]
macro_def = "de-impls-0093"
body = """
The doc comment is the annotation: *"Deserializing a data structure containing
`Rc` will not attempt to deduplicate `Rc` references to the same data. Every
deserialized `Rc` will end up with a strong count of 1."*

Serialize ten `Rc<String>` clones pointing at one allocation and you get ten
copies of the string on the wire and ten separate allocations back. The graph
structure is not preserved, because the data model has no way to express "this
is the same value you already saw" — there is no reference or pointer in the
twenty-nine types.

That is also why the `rc` feature is off by default. Turning it on should be a
decision, not a default, since the impls quietly change the shape of your data.
"""

[[annotation]]
id    = "de-impls-0095"
