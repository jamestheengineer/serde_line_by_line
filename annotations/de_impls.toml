body = """
Byte-for-byte the pattern from `Duration` and `SystemTime` with `start` and
`end` in place of the field names, including the `&*value` deref that makes the
`no_std` shim's return type work.

Three near-identical copies in four hundred lines is the price of not being able
to use the derive that would generate them. Counting them is a fair way to
measure what `#[derive(Deserialize)]` is actually worth.
"""

[[annotation]]
id    = "de-impls-0110"
file  = "src/de/impls.rs"
lines = "2523-2591"
title = "RangeVisitor — the first visitor that returns something other than its type"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["associated-types", "generic-params", "marker-types"]
prereqs = ["de-impls-0108", "de-impls-0102"]
body = """
`type Value = (Idx, Idx)`. Every visitor up to here produced the type its impl
was written for; this one produces a tuple and lets the caller assemble the
result.

That indirection is the whole design. Four range types — `Range`,
`RangeInclusive`, and `RangeFrom` and `RangeTo` below — read the same fields and
build differently, so the shared part stops at "two values were read" and the
divergence happens in the four callers. Making `Value` an intermediate rather
than a destination is what makes the sharing possible.

`expecting: &'static str` and `phantom: PhantomData<Idx>` are the two fields:
the message so error text names the right type, and the marker because `Idx`
appears only in the impl's bounds, not in any real field.

Below that it is the familiar pair — `visit_seq` reading positionally with
`invalid_length`, `visit_map` accumulating `Option`s with `duplicate_field` and
`missing_field`. By the fourth appearance the shape should be predictable, which
is itself the point: this is what derived code looks like, every time.
"""
