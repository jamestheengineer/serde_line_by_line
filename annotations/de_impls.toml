[[annotation]]
id    = "de-impls-0021"
file  = "src/de/impls.rs"
lines = "465-517"
title = "num_128! — defined here because macros are scoped by position"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-hygiene", "custom-errors"]
examples = ["num_widening"]
prereqs = ["de-impls-0012", "de-mod-0047"]
body = """
A seventh helper, sitting in the middle of the file rather than with its five
siblings. That position is deliberate and it teaches the rule: `macro_rules!`
definitions are textually scoped from the point of definition to the end of the
enclosing block, unlike `fn` and `struct` items, which are visible throughout
their module. The twelve invocations above do not need this macro, the two below
do, and putting it here is legal only because "below" is what matters.

What it does is the one conversion the other helpers cannot express. `int_to_int!`
and `uint_to_self!` both funnel through `i64` or `u64` to keep one arm per
helper; a 128-bit target has nothing wider to funnel through. So the range check
is written directly, and in two halves:

    v as i128 >= Self::Value::MIN as i128 && v as u128 <= Self::Value::MAX as u128

The low bound is compared in `i128` and the high bound in `u128`, because
neither type alone can hold both ends of the union of `i128` and `u128`. Each
comparison is exact in its own domain.

The error is the other difference. `Unexpected` has no 128-bit variant — the
same gap that forced `visit_i128`'s default to build a string by hand — so this
macro passes `Unexpected::Other(stringify!($ty))`. The consequence is
user-visible: where the 64-bit helpers report `invalid value: integer 300`, this
one reports `invalid value: u128`, naming the type and losing the number.
"""

[[annotation]]
id    = "de-impls-0022"
