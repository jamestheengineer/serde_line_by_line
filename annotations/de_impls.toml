[[annotation]]
id    = "de-impls-0090"
file  = "src/de/impls.rs"
lines = "1977-1992"
title = "Cow — the impl that never borrows, and the confusion it causes"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "smart-pointers", "associated-types", "strings"]
prereqs = ["de-impls-0032", "de-mod-0022"]
body = """
Sixteen lines that generate more confusion than anything else in serde:

    T::Owned::deserialize(deserializer).map(Cow::Owned)

A `Cow<'a, str>` field always deserializes to `Cow::Owned`. Never `Borrowed`.
The type is named "clone on write" and the impl clones unconditionally.

The reason is in the header. `impl<'de, 'a, T> Deserialize<'de> for Cow<'a, T>`
— `'a` and `'de` are unrelated, with no outlives bound between them. Without one
there is no way to produce a `&'a T` from data living for `'de`, so `Owned` is
the only variant this impl can construct. And the bound cannot simply be added:
it would make `Cow<'a, str>` fail every `DeserializeOwned` bound, exactly as
`&'a str` does, breaking every existing user who reaches for `Cow` expecting an
ordinary owned type.

The way to actually borrow is `#[serde(borrow)]` on the field, which makes
`serde_derive` bypass this impl entirely and generate code that deserializes a
`&str` and wraps it in `Cow::Borrowed`. That attribute exists because of this
impl's limitation, and reading them together is the only way either makes sense.

`T: ?Sized + ToOwned` with `T::Owned: Deserialize<'de>` is what lets one impl
serve `Cow<str>`, `Cow<[u8]>` and `Cow<Path>` — the bound is on the owned form,
which is the only form ever built.
"""

[[annotation]]
id    = "de-impls-0091"
file  = "src/de/impls.rs"
lines = "1993-2016"
title = "Weak — parse the value, then throw it away"
kind  = "impl"
tracks = ["reference"]
rust_features = ["smart-pointers", "cfg", "option"]
prereqs = ["de-impls-0043"]
body = """
Two statements, and the first one's result is discarded:

    tri!(Option::<T>::deserialize(deserializer));
    Ok(RcWeak::new())

`Weak::new()` produces a pointer with a reference count of zero that can never
be upgraded, so the deserialized value is thrown away — but it still has to be
*read*, because the bytes are in the stream and a format that does not consume
them will misparse everything after. Discarding is not the same as skipping.

`Option<T>` matches what the serialize side writes: `ser/impls.rs` serializes a
`Weak` as `self.upgrade()`, which is `Some` if the value is still alive and
`None` if it is not. So the wire shape is an option either way, and this side
reads it and drops it.

The doc comment states the consequence plainly, which is the right call — a
`Weak` that silently cannot be upgraded would otherwise look like a bug in the
caller's code. The `rc` feature is off by default for the same reason: these
impls do not round-trip object graphs, they only avoid failing to compile.
"""

