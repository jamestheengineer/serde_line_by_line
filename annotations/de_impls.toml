body = """
Four methods, the same copy-versus-move pair as `String`, with `From::from`
doing the conversion in each. `From<&str>` and `From<String>` for `PathBuf` both
exist, and the `String` one reuses the allocation.

The limitation is in the two byte methods: both validate UTF-8 and refuse
anything else. On Unix a path is an arbitrary byte string — a filename can hold
bytes that are not valid UTF-8 at all — and this impl refuses every one of
them.

The serialize side agrees rather than papering over it: `Path`'s `Serialize`
calls `to_str` and returns `Error::custom("path contains invalid UTF-8
characters")` when that fails. So such a path cannot be written either, and the
type is simply not round-trippable outside UTF-8.

That gap is precisely why `OsString`, the next type in the file, goes to the
trouble of a two-variant enum instead. `PathBuf` chose the simpler encoding and
the narrower domain.

`expecting` writes `"path string"` — no article again.
"""

