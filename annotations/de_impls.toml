body = """
Read this against `seq_impl!` and there is nothing new: a local visitor carrying
`PhantomData<T>`, `expecting` writing `"a sequence"`, `visit_seq` preallocating
with `size_hint::cautious` and pushing in a loop. `Vec` could have been a sixth
invocation of the macro and this half would be unchanged.

The reason it is written out is entirely in the other half, below. The macro's
in-place strategy is clear-and-refill; `Vec` can do better, and expressing that
in the macro would have meant a sixth callback that four of the five callers pass
a no-op for.
