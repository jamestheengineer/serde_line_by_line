[[annotation]]
id    = "de-impls-0041"
file  = "src/de/impls.rs"
lines = "867-882"
title = "OptionVisitor — and the first PhantomData in the file"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "08-phantomdata-and-variance"
rust_features = ["marker-types", "generic-params", "variance"]
prereqs = ["de-impls-0002"]
body = """
The visitor is generic over `T` and has no field of type `T`. Rust rejects that:
an unconstrained type parameter on a struct is an error, because the compiler
cannot decide the type's variance or drop behaviour without knowing where `T`
appears. `PhantomData<T>` is the answer — a zero-sized field that says "behave as
though this struct owns a `T`".

`PhantomData<T>` specifically, not `PhantomData<fn() -> T>`. The two differ in
what they claim: the first says this struct owns a `T` and is covariant in it,
the second says it merely produces one. serde uses the owning form throughout,
which is the conservative choice — it can cause a `T: Drop` to affect
drop-checking for a type that never holds one, but it never permits an unsound
variance.

`expecting` writes `"option"`, not `"an option"`. The article convention slips
again.
"""

[[annotation]]
id    = "de-impls-0042"
file  = "src/de/impls.rs"
lines = "883-899"
title = "visit_unit and visit_none — two spellings of absence"
kind  = "impl"
tracks = ["reference"]
rust_features = ["option", "default-methods"]
prereqs = ["de-mod-0056", "de-impls-0041"]
body = """
Both return `None`, and the reason there are two is that formats disagree about
what "nothing" looks like.

`visit_none` is what a format calls when it asked itself whether a value is
present and the answer was no — JSON reaching `null` after `deserialize_option`.
`visit_unit` is for formats whose data model has no null at all and represent an
absent value as the unit value. Accepting both means an `Option<T>` field
round-trips through either kind of format.

This is also why `Option<Option<T>>` is ambiguous in most formats and serde
documents it as such: there is one representation of absence and two levels
asking for it.
"""

[[annotation]]
id    = "de-impls-0043"
file  = "src/de/impls.rs"
lines = "900-914"
title = "visit_some, and the probe that turns an error into None"
kind  = "impl"
tracks = ["reference"]
rust_features = ["option", "result", "visibility"]
prereqs = ["de-mod-0059", "de-impls-0042"]
body = """
`visit_some` receives a `Deserializer` rather than a value — the format has
determined something is present but has not decoded it, so the inner type gets
to drive. `T::deserialize(deserializer).map(Some)` is the recursion, and it is
where a nested `Option<Vec<Option<u32>>>` unwinds one layer at a time.

`__private_visit_untagged_option` is the second body, and its signature is
`Result<Self::Value, ()>` — an error type carrying no information, because a
failure here is not an error. The body says it plainly:
`Ok(T::deserialize(deserializer).ok())`. Whatever went wrong is discarded and
the answer is `None`.

That is what an untagged enum or a flattened field needs: it is trying variants
in order, and "this one did not parse" is the normal path, not a fault. The
method is hidden and double-underscored because a public API that swallows all
errors would be a support burden — and because `serde_derive` is the only
intended caller.
"""

[[annotation]]
id    = "de-impls-0044"
file  = "src/de/impls.rs"
lines = "915-934"
title = "Deserialize for Option, and a FIXME left in the source"
kind  = "impl"
tracks = ["reference"]
rust_features = ["option", "borrowing"]
prereqs = ["de-impls-0030", "de-impls-0043"]
body = """
The impl itself is four lines. The six lines of comment after it are the
interesting part, and they are upstream's, not this project's.

`String` overrode `deserialize_in_place` because it could reuse a buffer.
`Option<T>` does not, and the comment says why: the `Some` variant's
representation is opaque, so there is no way to hand a visitor a `&mut T`
pointing into an existing `Some` without matching on it first — and if the place
currently holds `None` there is nothing to reuse anyway. The `FIXME` proposes
branching on the old value and admits the answer is probably data-dependent.

It is still there several years later, which is the honest signal: the
optimisation is not obviously worth the branch. Leaving the reasoning in the
source instead of silently omitting the impl is why this comment is worth
reading.
"""

[[annotation]]
id    = "de-impls-0045"
