[[annotation]]
id    = "de-impls-0096"
file  = "src/de/impls.rs"
lines = "2088-2101"
title = "Cell<T> — a Copy bound inherited from the other direction"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["interior-mutability", "where-clauses", "ownership"]
prereqs = ["de-impls-0093"]
body = """
`T: Deserialize<'de> + Copy`, and the `Copy` is not needed by anything in this
function. `Cell::new` accepts any `T`; the deserialization would work fine
without it.

It is here for symmetry with the other half. `ser/impls.rs` writes `impl<T>
Serialize for Cell<T> where T: Serialize + Copy`, and there the bound is
load-bearing — reading a `Cell` means calling `self.get()`, which requires
`Copy` because it copies the value out. A type that could be deserialized into a
`Cell` but never serialized back out would be a strange asymmetry, so the bound
is mirrored.

Worth recognising as a category: a bound that documents a constraint from
elsewhere rather than one this code enforces.
"""

[[annotation]]
id    = "de-impls-0097"
file  = "src/de/impls.rs"
lines = "2102-2118"
title = "RefCell, Mutex, RwLock — three locks, never locked"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-repetition", "interior-mutability", "smart-pointers"]
macro_def = "de-impls-0038"
body = """
Each deserializes its inner type and calls `new`, which takes the value by move
— so no lock is ever acquired and no `unwrap` on a poisoned mutex can happen
here. Constructing a `Mutex` is not a synchronized operation.

`RefCell` needs no `Copy`, unlike `Cell`, because its serialize side uses
`borrow()` rather than `get()`. That side *can* panic, if the value is mutably
borrowed while being serialized — a hazard that has no counterpart on this side.
"""

[[annotation]]
id    = "de-impls-0098"
file  = "src/de/impls.rs"
lines = "2119-2141"
title = "Duration — the derive, written out and cleaned up"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["proc-macro-boundary", "modules", "visibility"]
prereqs = ["de-impls-0086", "de-mod-0039"]
body = """
The most valuable hundred and forty lines in the file, and the comment on top
says why:

    // This is a cleaned-up version of the impl generated by:
    //
    //     #[derive(Deserialize)]
    //     #[serde(deny_unknown_fields)]
    //     struct Duration { secs: u64, nanos: u32 }

Everything `serde_derive` emits for an ordinary two-field struct is here in
readable form — no `__private` paths, no underscore-prefixed identifiers, no
hygiene gymnastics. If you have ever wanted to know what `#[derive(Deserialize)]`
actually does, read this instead of `cargo expand`.

The second comment names the piece being replaced first: a *field identifier*.
`#[serde(field_identifier, rename_all = "lowercase")]` would generate this
`Field` enum, and the derive's field-name matching is the same match statement
you are about to read.

`enum Field { Secs, Nanos }` is declared inside `fn deserialize`, the same
function-local item scoping every macro-generated visitor in this file uses.
"""

[[annotation]]
id    = "de-impls-0099"
file  = "src/de/impls.rs"
lines = "2142-2185"
title = "The field identifier, and a helper with two return types"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "strings", "no-std", "custom-errors"]
prereqs = ["de-impls-0098", "de-mod-0011"]
body = """
A `Deserialize` impl whose `Value` is which-field-is-this rather than a value.
`deserialize_identifier` is the hint, and the two visit methods mirror
`variant_identifier!`: match the string, match the bytes, otherwise
`unknown_field` with the `FIELDS` list.

The interesting line is the byte fallback:

    let value = private::string::from_utf8_lossy(value);
    Err(Error::unknown_field(&*value, FIELDS))

`from_utf8_lossy` is a shim with *two different return types*. With `alloc` it
returns `Cow<str>` from the standard library. Without, it returns `&str` — and
when the bytes are not UTF-8 at all it returns three replacement characters,
with a comment saying the user will recognise them as invalid UTF-8.

That only works because of the `&*value` at the call site: `&*` derefs a `Cow`
to `&str` and derefs a `&str` to itself, so one expression compiles against both
signatures. The shim's own comment says as much. It is an unusual and legitimate
use of deref coercion to paper over a `cfg`-dependent type.

Note there is no `visit_u64`. `variant_identifier!` accepted a numeric index for
enum variants; struct fields are matched by name only.
"""

[[annotation]]
id    = "de-impls-0100"
file  = "src/de/impls.rs"
lines = "2186-2196"
title = "check_overflow — turning a panic into an error"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "12-errors-iterators-closures"
rust_features = ["result", "custom-errors", "option"]
prereqs = ["de-impls-0098"]
body = """
`Duration::new` panics if the carry from `nanos` overflows `secs`. Panicking on
malformed input is not acceptable in a deserializer — the input is untrusted, and
the caller asked for a `Result` — so this function performs the same arithmetic
with `checked_add` first and returns an error instead.

That is a pattern worth naming: when a constructor's contract is "panics on bad
input", a deserializer must check the contract itself before calling it. The
standard library types in this file that have no such constructor simply do not
need the equivalent.

`static NANOS_PER_SEC` declared inside the function keeps a constant next to its
only use. `static` rather than `const` here means one copy in the binary rather
than one inlined at each use, which for a single use is a distinction without a
difference.
"""

[[annotation]]
id    = "de-impls-0101"
file  = "src/de/impls.rs"
lines = "2197-2225"
title = "visit_seq — a struct read positionally"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "result"]
prereqs = ["de-impls-0100", "de-mod-0038"]
body = """
Every derived struct impl handles two shapes, and this is the first: the fields
arriving in declaration order with no names, which is what a compact binary
format writes and what a JSON array would look like.

`invalid_length(0, &self)` and `invalid_length(1, &self)` report *how many
elements were successfully read*, not which field is missing — so a truncated
`Duration` reports `invalid length 1, expected struct Duration` rather than
naming `nanos`. The names are simply not available on this path; the format
never sent them.

`check_overflow` runs before `Duration::new`, exactly as on the map path. Two
call sites, one function, which is why it was factored out at all.
"""

[[annotation]]
id    = "de-impls-0102"
file  = "src/de/impls.rs"
lines = "2226-2265"
title = "visit_map — the accumulator pattern every derived struct uses"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["option", "pattern-matching", "custom-errors", "proc-macro-boundary"]
prereqs = ["de-impls-0101", "de-mod-0012"]
body = """
This is the shape `serde_derive` generates for every struct you have ever
derived, and it is worth memorising:

1. One `Option<FieldType>` local per field, all starting `None`.
2. Loop over `next_key`, matching the field identifier.
3. On a repeat, `duplicate_field`. Which is why the same duplicate key that a
   `HashMap` silently accepts is an error in a struct.
4. After the loop, unwrap each local or report `missing_field`.

Fields can therefore arrive in any order, and absence is distinguished from a
present-but-null value — `#[serde(default)]` changes step 4 to a fallback
instead of an error, and nothing else.

`<A::Error as Error>::duplicate_field("secs")` is fully qualified where
`visit_seq` above wrote plain `Error::invalid_length`. Inference would resolve
both. The qualification is a fossil of generated code: the derive emits fully
qualified paths everywhere because it cannot know what names are in scope in the
user's module, and this hand-written copy kept the habit in the places the
generator would have.

`deny_unknown_fields` is visible in what the `Field` enum does with an
unrecognised name — it errors rather than returning an ignore marker. Without
that attribute the derive generates a third variant, `Field::Ignore`, and the
loop calls `next_value::<IgnoredAny>()` for it.
"""

[[annotation]]
id    = "de-impls-0103"
file  = "src/de/impls.rs"
lines = "2266-2325"
title = "SystemTime — Duration's block again, with std guaranteed"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "strings", "no-std"]
prereqs = ["de-impls-0099"]
body = """
A near-copy of the `Duration` block with the field names changed to
`secs_since_epoch` and `nanos_since_epoch`. The `// Reuse duration` comment
tells you the intent; the duplication tells you the crate would rather repeat
sixty lines than build an abstraction over two types that happen to have the
same shape.

One line differs in a way worth catching. Where `Duration` called
`private::string::from_utf8_lossy` — the shim with two return types — this block
calls `String::from_utf8_lossy` from the standard library directly, and takes
`&value` rather than `&*value`.

It can, because this impl is `#[cfg(feature = "std")]`. `SystemTime` does not
exist without `std`, so there is no configuration where the shim would be
needed. The two spellings are a precise record of which code has to survive
`no_std` and which does not.
"""

[[annotation]]
id    = "de-impls-0104"
file  = "src/de/impls.rs"
lines = "2326-2403"
title = "A visitor named DurationVisitor, inside SystemTime"
kind  = "impl"
tracks = ["reference"]
rust_features = ["result", "custom-errors"]
prereqs = ["de-impls-0102", "de-impls-0100"]
body = """
The visitor is called `DurationVisitor` and its `type Value` is `Duration`, in
the middle of `SystemTime`'s impl. That is not a copy-paste slip: what is being
read off the wire genuinely is a duration — the offset from the epoch — and the
conversion to a `SystemTime` happens after the visitor returns.

`expecting` still writes `"struct SystemTime"`, so error messages name the type
the user asked for rather than the one being parsed.

Everything else is the accumulator pattern from `Duration`, with the field-name
strings changed and the overflow message rewritten to say "SystemTime epoch
offset". Read it as confirmation that the pattern really is mechanical — this is
what `serde_derive` would have produced for both types.
"""

[[annotation]]
id    = "de-impls-0105"
file  = "src/de/impls.rs"
lines = "2404-2411"
title = "The epoch offset, and the times this type cannot represent"
kind  = "impl"
tracks = ["reference"]
rust_features = ["result", "option", "custom-errors"]
prereqs = ["de-impls-0104"]
body = """
`UNIX_EPOCH.checked_add(duration)` is the actual construction, and the second
overflow check of the block — the first guarded `Duration::new`, this one guards
a `SystemTime` far enough in the future to exceed the platform's representation.

The design decision is in what is being added to. A `SystemTime` is serialized
as a non-negative offset from 1970, which means **no time before 1970 can be
serialized at all**. The other half of the crate says so out loud:
`ser/impls.rs` calls `self.duration_since(UNIX_EPOCH)` and returns
`Error::custom("SystemTime must be later than UNIX_EPOCH")` when that fails.

So a birthday in 1969 is not a serde-representable `SystemTime`. This is a
limitation of the encoding serde chose, not of the type — `SystemTime` itself
handles pre-epoch times fine.

`D::Error::custom` here where the inner functions wrote `E::custom`: same trait
method, different type parameter in scope. Outside a visitor the error type is
the deserializer's, not the visitor's.
"""

[[annotation]]
id    = "de-impls-0106"
file  = "src/de/impls.rs"
lines = "2412-2441"
title = "Range — where the file starts sharing visitors between types"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "marker-types", "modules"]
prereqs = ["de-impls-0102"]
body = """
The comment says *"Similar to"* rather than `Duration`'s *"cleaned-up version
of"*, and the difference is real: this is no longer just the derive's output.
The visitor lives in a module below, it is shared with `RangeInclusive`, and it
returns a tuple rather than the final type.

`deserialize_struct("Range", range::FIELDS, range::RangeVisitor { ... })` then
`Ok(start..end)`. The visitor produced `(Idx, Idx)` and this line turns it into
a range, which is why one visitor can serve two types whose construction differs.

`expecting: "struct Range"` is passed *as data*. Every visitor before this one
hardcoded its expectation string in the `expecting` method; this one takes it as
a field so that two different types can share the implementation and still
produce their own error messages.
"""

[[annotation]]
id    = "de-impls-0107"
file  = "src/de/impls.rs"
lines = "2442-2461"
title = "RangeInclusive — the same visitor, a different constructor"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "visibility"]
prereqs = ["de-impls-0106"]
body = """
Identical but for two strings and the last line: `RangeInclusive::new(start,
end)` instead of `start..=end`.

Either would work here. The `new` constructor exists because
`RangeInclusive`'s fields are private — it carries an extra `exhausted` flag
that `Range` does not have, so it cannot be built with a struct literal — and
using it makes that visible at a glance.

Worth noting what the shared visitor costs: `RangeInclusive` is deserialized
from exactly the same two fields as `Range`, so the `exhausted` state of a
partially-iterated `RangeInclusive` does not survive a round trip. The type is
serialized as its bounds, and comes back fresh.
"""

[[annotation]]
id    = "de-impls-0108"
file  = "src/de/impls.rs"
lines = "2462-2478"
title = "mod range — a private module as a namespace, not a file"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "11-no-std-and-cfg"
rust_features = ["modules", "visibility"]
prereqs = ["de-impls-0106"]
body = """
An inline `mod` in the middle of a three-thousand-line file, and the reason is
name collision rather than organisation. This block needs an `enum Field`, a
`FIELDS` const and a `FieldVisitor` — and so did `Duration`, and so will
`RangeFrom` and `RangeTo` below. Function-local items solved that for `Duration`
because everything fitted inside one `fn`. Here the visitor must be shared
between two impls, so it has to outlive any single function, and a private
module is the smallest scope that holds it.

`pub` on the items inside means "visible to the parent module", not public API —
the module itself is private, so nothing escapes the crate. That two-level
visibility is what lets `range::RangeVisitor` be named from the impls above
while staying invisible to users.

The imports repeat at the top because a `mod` is a fresh namespace: `use
crate::lib::*` at the top of the file does not reach inside it.
"""

[[annotation]]
id    = "de-impls-0109"
