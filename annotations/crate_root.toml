`#[cfg(all(not(feature = "std"), no_core_error))]` — compiled only when there is
no `std` *and* the compiler predates `core::error::Error`, stabilized in 1.81.
In every other configuration an `Error` trait already exists and this module
would be a duplicate.

Three closing braces end the macro, the crate skeleton, and this file.
"""
