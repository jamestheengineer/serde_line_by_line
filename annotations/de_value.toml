The lifetime arm, and worth a second look: the struct is declared with `'a`, but
the macro is called with `'de`. Neither name survives — `$lifetime:tt` captures
one token and the transcriber re-emits it as the impl's own binder, so the
expansion declares `impl<'de, E> Copy for StrDeserializer<'de, E>`, which is the
same impl as `impl<'a, E> Copy for StrDeserializer<'a, E>`. Lifetime parameter
names are local to the item that binds them.

It reads like a bug and is not one. Compare `impl_copy_clone!(BytesDeserializer<'a>)`
below, which passes `'a` for a struct that also declares `'a`; the file is
inconsistent about which name it passes precisely because it cannot matter.
"""

[[annotation]]
id    = "de-value-0030"
file  = "src/de/value.rs"
