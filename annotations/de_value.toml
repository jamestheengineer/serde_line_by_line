[[annotation]]
id    = "de-value-0046"
file  = "src/de/value.rs"
lines = "793-829"
title = "The match that picks a visitor method — and the one it cannot pick"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["pattern-matching", "lifetime-de", "ownership"]
prereqs = ["de-value-0041", "de-value-0036"]
body = """
Four lines that are the only runtime branch over ownership in the file:

```
Cow::Borrowed(string) => visitor.visit_str(string),
Cow::Owned(string)    => visitor.visit_string(string),
```

`match self.value` moves out of `self`, which is fine because `self` was taken by
value and is being consumed. Each arm binds the payload and hands it to the
visitor method that matches its ownership.

Now the part worth fifteen minutes: the `Borrowed` arm calls `visit_str`, not
`visit_borrowed_str`. The type has a lifetime and the data really is borrowed —
so why the transient method? Because the lifetime is `'a`, and `'a` is not `'de`.
The impl header reads `impl<'de, 'a, E> Deserializer<'de> for
CowStrDeserializer<'a, E>`, two unrelated binders, and `visit_borrowed_str`
demands `&'de str`. The compiler will not let this type make the borrow promise.

So `CowStrDeserializer` saves the *allocation* when the input was already
borrowed, but it cannot pass the *borrow* through to the visitor. A format that
wants true zero-copy has to hold a `Cow<'de, str>` and match on it itself,
routing the borrowed arm to `visit_borrowed_str`. That is precisely what
`serde_json`'s string handling does, and it is why this convenience type is not
enough for it.
"""

