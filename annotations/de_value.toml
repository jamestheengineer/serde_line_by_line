body = """
`type Deserializer = StrDeserializer<'a, E>` — the lifetime of the input
reference becomes the lifetime of the deserializer, threaded through the
associated type. This is the impl that runs in the module's opening doctest when
`s.into_deserializer()` is called on a `&str` inside `from_str`.

And it is the reason `'a` cannot be `'de`. `FromStr::from_str` receives a `&str`
borrowed for some caller-chosen region and must return a `Setting` that outlives
it. If this impl produced a `'de`-borrowing deserializer, the derived
`Deserialize` impl would be free to keep references into that string, and
`from_str` could return a value pointing at freed memory. The transient
`visit_str` path is what makes the doctest sound.
"""

