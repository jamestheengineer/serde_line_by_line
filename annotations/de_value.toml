A newtype around a `usize` whose only purpose is to implement `Expected`, the
trait that exists because `Display` was already taken.

The body is an English-grammar special case: `"1 element in sequence"` singular,
`"{} elements in sequence"` plural. Twelve lines of code so that an error message
does not read "1 elements".

Note the `if` arm uses `write_str` with a literal while the `else` uses `write!`.
`write_str` skips the formatting machinery entirely — no argument list, no
`Arguments` struct — which for a fixed string is both faster and smaller. Serde
does this consistently, and it is the reason `Unexpected`'s `Display` impl in
`de/mod.rs` looks the way it does.
"""

[[annotation]]
id    = "de-value-0066"
file  = "src/de/value.rs"
lines = "1119-1132"
title = "Debug — bounded on I: Debug, and silently absent otherwise"
kind  = "impl"
tracks = ["reference"]
rust_features = ["where-clauses", "generic-params"]
prereqs = ["de-value-0059"]
body = """
`impl<I, E> Debug for SeqDeserializer<I, E> where I: Debug`. No bound on `E`,
which is the same care `impl_copy_clone!` takes, applied by hand.

The consequence is that a `SeqDeserializer` over an iterator that is not `Debug`
— a `Map` with a closure, for instance — simply has no `Debug` impl, and the
failure shows up as "the trait bound is not satisfied" at the call site rather
than anywhere near here. That is the normal cost of conditional impls, and it is
why the bound is kept as weak as it can be.
"""

[[annotation]]
id    = "de-value-0067"
file  = "src/de/value.rs"
lines = "1133-1147"
title = "Vec<T> → SeqDeserializer, and the associated-type path that names its iterator"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["associated-types", "iterators", "cfg"]
prereqs = ["de-value-0064"]
body = """
`type Deserializer = SeqDeserializer<<Self as IntoIterator>::IntoIter, E>`.

Read the associated-type path: "whatever `Vec<T>`'s `IntoIterator` impl says its
iterator type is". Writing `vec::IntoIter<T>` would have worked too, but the
qualified path is immune to the concrete type's name changing and does not
require importing it. `<Self as IntoIterator>` is the fully-disambiguated form,
needed because `Self` might implement several traits with an `IntoIter`
associated type.

`T: IntoDeserializer<'de, E>` propagates the recursion: `Vec<Vec<String>>` works
because `Vec<String>` implements the trait via this same impl.

This is also the impl that catches `Vec<u8>` and makes it a sequence rather than
a byte blob — see the `&[u8]` section above for why that asymmetry cannot be
fixed without specialization.
"""

[[annotation]]
id    = "de-value-0068"
file  = "src/de/value.rs"
lines = "1148-1177"
title = "BTreeSet and HashSet — the same body, with the bounds their containers demand"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["where-clauses", "cfg", "iterators"]
prereqs = ["de-value-0067"]
body = """
Two more sequence sources, and the differences between them are entirely in the
`where` clauses.

`BTreeSet<T>` needs `T: Eq + Ord`, because that is what the container requires
to exist. `HashSet<T, S>` needs `T: Eq + Hash` plus `S: BuildHasher` — the
hasher parameter has to be named and bounded even though the impl never touches
it, since `HashSet<T, S>` is not a valid type otherwise. These bounds are not
needed to *iterate*; they are needed to *mention the type*, and forgetting that
distinction is a common source of confusion when writing generic impls over
collections.

The `cfg` gates differ too: `BTreeSet` lives in `alloc`, `HashSet` only in `std`.
That split runs through the whole crate.

One consequence worth stating plainly: deserializing a struct from a set means
the element order is whatever the container's iteration order is. For `BTreeSet`
that is sorted and deterministic; for `HashSet` it is neither. Feeding a
`HashSet` to a `Deserialize` that cares about position — a tuple, say — gives a
different answer on different runs.
"""
