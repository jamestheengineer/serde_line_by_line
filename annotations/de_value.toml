[[annotation]]
id    = "de-value-0025"
file  = "src/de/value.rs"
lines = "373-406"
title = "deserialize_enum — the method this whole type exists for"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "macro-rules"]
prereqs = ["de-mod-0039", "de-mod-0068"]
body = """
Compare the `forward_to_deserialize_any!` list here with the one the macro
generates: this one is missing `enum`. That is the single difference, and the
next twenty lines are why.

`deserialize_enum` receives the enum's name and the list of its variant names —
both from the derive — and discards both with `let _ = name; let _ = variants;`.
It cannot use them: it holds a number, and matching that number against the
variant list is the *visitor's* job, not the deserializer's. Then it calls
`visitor.visit_enum(self)`, handing itself over as the `EnumAccess`.

That is the two-step from `de/mod.rs` playing out in the smallest possible case.
The visitor asks its `EnumAccess` for a variant identifier, gets the `u32` back,
and resolves it to a variant by index. Deserializing `2u32` into an enum with
three variants gives you the third one.

`deserialize_any` still calls `visit_u32`, so the same value read into a `u64`
field is just a number. One type, two readings, chosen by which method the
`Deserialize` impl calls.
"""

