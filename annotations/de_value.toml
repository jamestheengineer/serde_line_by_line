[[annotation]]
id    = "de-value-0033"
file  = "src/de/value.rs"
lines = "542-550"
title = "BorrowedStrDeserializer<'de, E> — the same struct, with the lifetimes joined"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "lifetimes", "borrowing", "zero-cost"]
prereqs = ["de-value-0028"]
body = """
*"A deserializer holding a `&str` with a lifetime tied to another
deserializer."* One field of type `&'de str` — the same shape as
`StrDeserializer`, with `'a` replaced by `'de`, and that substitution is the
entire difference between the two types.

"Tied to another deserializer" is the doc comment naming the real use. You are
inside a format implementation, you hold a `&'de str` that points into the input
buffer the caller lent you for `'de`, and you need to pass it on to a nested
`Deserialize` without copying. Handing it to this type preserves the borrow;
handing it to `StrDeserializer` would throw it away.

Compare the two `Deserializer` impls directly: `for StrDeserializer<'a, E>` binds
`'de` freshly, `for BorrowedStrDeserializer<'de, E>` reuses the struct's own.
When the struct's lifetime *is* `'de`, `visit_borrowed_str` becomes typeable, and
a `Deserialize` impl can return a `&'de str` that borrows the input rather than
owning a copy. That is zero-copy deserialization, in the smallest example the
crate contains.
"""

