body = """
`&'a [u8]` becomes a `BytesDeserializer`. Note the asymmetry this sets up with
the owned case: further down, `impl<T> IntoDeserializer for Vec<T>` produces a
`SeqDeserializer`, and that impl covers `Vec<u8>` along with every other element
type.

So `(&[1u8, 2, 3][..]).into_deserializer()` calls `visit_bytes`, while
`vec![1u8, 2, 3].into_deserializer()` calls `visit_seq`. The same three bytes,
two different data-model shapes, decided by which container you happen to be
holding. There is no `ByteBufDeserializer` to correct it — a specialized impl for
`Vec<u8>` would overlap the generic one, and Rust has no stable specialization.
If you need the blob reading from an owned buffer, wrap it in `serde_bytes` or
construct `BytesDeserializer::new(&v)` yourself.
"""

