course_unit = "09-blanket-impls-and-coherence"
rust_features = ["lifetime-de", "visibility", "blanket-impls"]
prereqs = ["de-value-0030"]
body = """
Two things are different here from every other `new` in the file, and the second
is the important one.

First, this constructor has a real doc comment instead of
`#[allow(missing_docs)]`. It is a constructor a format author is expected to call
deliberately, not an incidental part of a generated block.

Second — look for `impl IntoDeserializer for &'de str` producing a
`BorrowedStrDeserializer`. It does not exist, and it cannot. The impl above
already claims `&'a str` for `StrDeserializer`, and a second impl of the same
trait for the same type is a coherence error no matter how the lifetimes are
written; lifetimes are erased before overlap checking, so the two would be
indistinguishable.

The consequence is a real asymmetry in the API. `"hello".into_deserializer()`
always gives you the transient one. To get the borrowing one you must name it:
`BorrowedStrDeserializer::new(s)`. Zero-copy is opt-in here, and the opt-in is a
constructor call, because the trait slot was already taken.
"""

[[annotation]]
id    = "de-value-0036"
file  = "src/de/value.rs"
lines = "563-595"
title = "visit_borrowed_str — one method name, and the whole point of 'de"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["lifetime-de", "borrowing", "zero-cost"]
prereqs = ["de-value-0031", "de-mod-0051"]
body = """
Set this beside the `StrDeserializer` impl thirty lines up. Same `type Error`,
same `deserialize_enum`, same forwarding list. One token differs:
`visit_borrowed_str` instead of `visit_str`.

`visit_borrowed_str` takes `&'de str` and is the promise "this reference lives as
long as the deserialization, keep it if you want". `Deserialize for &'de str`
implements exactly one method — that one — which is why `#[derive(Deserialize)]`
on a struct with a `&'a str` field works against `serde_json::from_str` and fails
against `from_reader`. The reader has no buffer to lend.

The default `visit_borrowed_str` in `Visitor` forwards to `visit_str`, so a
visitor that does not care about borrowing sees no difference and pays nothing.
The borrow is offered, not imposed. That default is what lets serde have both
behaviors without doubling every visitor.
"""

