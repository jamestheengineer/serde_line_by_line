body = """
A public constructor taking nothing and returning the zero-sized struct with
`marker: PhantomData`. `PhantomData` is a unit struct, so naming it is the whole
construction.

`#[allow(missing_docs)]` appears on this and on the `new` of every deserializer
in the file. The crate denies missing documentation on public items; rather than
write "Constructs a new UnitDeserializer" thirty times, dtolnay silences the lint
at each site. That is a defensible call — a doc comment that only restates the
signature is worse than none — but note what it costs: on docs.rs these
constructors appear with no description at all.
"""

[[annotation]]
id    = "de-value-0013"
file  = "src/de/value.rs"
lines = "152-178"
title = "The Deserializer impl — every method forwarded, except the two that matter"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "05-default-methods"
rust_features = ["traits", "associated-types", "macro-rules", "option"]
prereqs = ["de-mod-0029", "de-mod-0036"]
body = """
This is the template for every self-describing deserializer in the file, and it
is three parts.

`type Error = E` — the error type is the caller's choice, threaded straight
through from the type parameter.

`forward_to_deserialize_any!` with 29 of the 30 hint methods listed. The macro
(defined in `macros.rs`) generates a body for each name that ignores the hint and
calls `deserialize_any`. This is what "self-describing" means mechanically: the
data is already a `()`, so asking for it as a `u64` cannot change what it is —
the hint is discarded and the visitor is told the truth. A visitor that wanted a
`u64` will reject `visit_unit` with `invalid_type`, which is the correct outcome.

`deserialize_any` calls `visitor.visit_unit()`. Two lines, and they are the
entire semantic content of the type.

`deserialize_option` is the one method deliberately left off the forwarding list,
because forwarding it would be wrong. `Option`'s `Deserialize` impl calls
`deserialize_option` and expects either `visit_none` or `visit_some`; routing it
to `deserialize_any` would produce `visit_unit`, and `Option`'s visitor would
report a type error. Instead this returns `visit_none`, so deserializing `()`
into an `Option<T>` yields `None`. Whether that is *right* is a design judgment —
it means unit and absent are the same thing to this deserializer — but it is
deliberate, and it is why the forwarding list here is one name shorter than the
one in the macro below.
"""

[[annotation]]
id    = "de-value-0014"
file  = "src/de/value.rs"
lines = "179-195"
title = "IntoDeserializer for the deserializer itself — the identity impl"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "09-blanket-impls-and-coherence"
rust_features = ["traits", "associated-types"]
prereqs = ["de-value-0009"]
body = """
`impl IntoDeserializer for UnitDeserializer` with `type Deserializer = Self` and
`fn into_deserializer(self) -> Self { self }`. Every deserializer in this file
has one.

It looks like a no-op, and at runtime it is. Its job is at the type level:
generic code written as `T: IntoDeserializer<'de, E>` should accept both a raw
`u32` and an already-built `U32Deserializer`, without the caller having to know
which they hold. Serde's derived code for `#[serde(other)]` and for flattened
maps relies on exactly this — it calls `.into_deserializer()` on values whose
origin varies.

A blanket `impl<D: Deserializer<'de>> IntoDeserializer<'de, D::Error> for D`
would cover all of these at once and delete thirty impls. It cannot be written:
it would overlap with `impl IntoDeserializer for u32` the moment any downstream
crate implemented `Deserializer` for `u32`, and coherence rejects a possible
future overlap, not just an actual one. Thirty near-identical impls are the price
of that rule.

`Debug` closes the section, and it prints just the struct name — there is no
value to show.
"""

[[annotation]]
id    = "de-value-0015"
file  = "src/de/value.rs"
lines = "196-251"
title = "NeverDeserializer — the ! type, still waiting after a decade"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "11-no-std-and-cfg"
rust_features = ["cfg", "traits", "marker-types", "pattern-matching"]
prereqs = ["de-value-0013"]
body = """
Fifty-five lines gated on `feature = "unstable"`, which means nightly, which
means almost nobody compiles them. They are here because the never type `!` — the
type of an expression that does not return — has been almost-stable since 2015.

The payoff is `struct NeverDeserializer<E> { never: !, marker: PhantomData<E> }`.
A struct with a field of type `!` cannot be constructed, because you cannot
produce a value of `!`. So the type is uninhabited, and every method on it is
unreachable by construction.

Which is why `deserialize_any` has the body `self.never`. Not `unreachable!()`,
not a panic — an expression of type `!`, which coerces to *any* type, including
the `Result<V::Value, Self::Error>` the signature demands. The compiler accepts
it because a value of `!` cannot exist, so the function cannot return, so there
is nothing to check. This is the never type's one trick and it is worth carrying
around.

`impl IntoDeserializer for !` is the entry point: if you have a value of `!` you
have a contradiction, and the impl turns it into a deserializer that is equally
impossible. `fn into_deserializer(self) -> Self::Deserializer { self }` returns
`self` where a `NeverDeserializer<E>` is expected, which type-checks by the same
coercion.

Read this section as a language demo rather than a feature. The stabilization has
been blocked for years on how `!` should fall back in inference, and serde keeps
the impls behind a feature flag so they are ready the day it lands.
"""

[[annotation]]
id    = "de-value-0016"
file  = "src/de/value.rs"
lines = "252-326"
title = "primitive_deserializer! — one macro, six impls, fifteen types"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "generic-params", "marker-types"]
prereqs = ["de-value-0013", "ser-impls-0002"]
body = """
Everything the previous 130 lines did by hand for `()`, generated. Each
invocation produces six items: the struct, an `impl_copy_clone!` call, an
`IntoDeserializer` impl for the primitive, an inherent `new`, a `Deserializer`
impl, an `IntoDeserializer` identity impl, and a `Debug` impl. Fifteen
invocations follow, so this 75-line body stands in for roughly a thousand lines.

The matcher has four fixed fragments and a trailing catch-all:
`($ty:ty, $doc:tt, $name:ident, $method:ident $($cast:tt)*)`.

- `$ty:ty` is the primitive — `bool`, `i8`, `isize`.
- `$doc:tt` is a string literal used as `#[doc = $doc]`. This is the trick for
  building documentation from a macro parameter: `///` cannot interpolate, but
  `#[doc = "..."]` is just an attribute taking a literal, and two `#[doc]`
  attributes concatenate into consecutive lines. Hence the split into
  `#[doc = "A deserializer holding"]` and `#[doc = $doc]`, with the invocation
  passing `"a \\`bool\\`."` — the sentence is assembled across two attributes.
- `$name:ident` is the generated type name, `BoolDeserializer`.
- `$method:ident` is the `Visitor` method to call, `visit_bool`.
- `$($cast:tt)*` is the reason this macro is not four parameters. It captures
  *whatever tokens are left*, and the body splices them straight after
  `self.value`: `visitor.$method(self.value $($cast)*)`. For `bool` it is empty.
  For `isize` the invocation ends with `visit_i64 as i64`, so `$method` binds
  `visit_i64` and `$cast` binds `as i64`, producing `visitor.visit_i64(self.value
  as i64)`. A raw token sequence spliced into an expression — no fragment
  specifier could express "an optional cast", so the macro takes tokens.

Note that `$cast` cannot be `$ty:ty` or `$e:expr` for a subtle reason worth
knowing: once a fragment is parsed as an `expr` or `ty` it becomes an opaque AST
node, and `self.value as i64` could not then be reassembled from the pieces.
`tt` fragments stay as tokens and can be pasted anywhere.

The generated `Deserializer` impl forwards all 30 methods including `option` —
unlike `UnitDeserializer`, which held `option` back. A `BoolDeserializer` asked
for an `Option` calls `visit_bool`, and `Option`'s visitor reports a type error.
That is the correct answer for a bool; `()` was the special case.
"""

