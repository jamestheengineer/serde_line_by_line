[[annotation]]
id    = "de-value-0022"
file  = "src/de/value.rs"
lines = "344-349"
title = "U32Deserializer — written out by hand, for one extra impl"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "marker-types"]
prereqs = ["de-value-0016"]
body = """
Ninety lines that reproduce, character for character, what
`primitive_deserializer!(u32, "a \\`u32\\`.", U32Deserializer, visit_u32)` would
have produced — plus one impl it would not have: `EnumAccess`.

This is the recurring shape of the boundary between generated and hand-written
code in serde. A macro pays for itself while every case is identical; the first
case that needs one extra item either grows the macro a new optional arm or drops
out of it entirely. dtolnay chose to drop `u32` out, and the cost is that any
change to the macro body has to be mirrored here by hand.

Why `u32` in particular: enum variants are identified by index, and the index
type in serde's data model is `u32`. Deserializing an enum from a bare number —
which is what a compact binary format does — means handing a `u32` to
`deserialize_enum`, so `U32Deserializer` has to be able to act as the enum access
itself.
"""

