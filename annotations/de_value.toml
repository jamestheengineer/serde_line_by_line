[[annotation]]
id    = "de-value-0001"
file  = "src/de/value.rs"
lines = "1-22"
title = "The module that turns values you already have into deserializers"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "09-blanket-impls-and-coherence"
rust_features = ["traits", "associated-types", "modules"]
prereqs = ["de-mod-0075"]
body = """
Every other deserializer in the ecosystem reads bytes. The ones in this file read
a value that is already sitting in a variable — a `u32`, a `&str`, an iterator of
pairs — and present it to a `Visitor` as if it had just been parsed. That is the
whole module.

The doctest picks the smallest use that justifies it. `Setting` derives
`Deserialize`, which means `serde_derive` has already written the code that turns
the strings `"On"` and `"Off"` into variants. `FromStr` wants that same code but
has only a `&str` and no format in sight. `s.into_deserializer()` manufactures
one, and `Self::deserialize(...)` runs the derived logic against it. You get a
`FromStr` impl that stays in sync with the `Deserialize` impl for free, including
the `unknown_variant` error message listing the valid names.

`type Err = value::Error` is the other half of the trade. There is no format
here to own an error type, so the module supplies a minimal one — that is the
first thing defined below.
"""

[[annotation]]
id    = "de-value-0002"
file  = "src/de/value.rs"
lines = "23-30"
title = "Imports, and the one that reveals this file serializes too"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules", "no-std"]
prereqs = ["de-mod-0006"]
body = """
`crate::lib::*` is the `no_std` shim again: `PhantomData`, `fmt`, `Box`, `String`,
`Cow`, and the collections all arrive from one glob whose contents depend on which
of `std` / `alloc` is on.

The line worth stopping at is `use crate::ser;`. This is a file in `de/`, and it
imports the serialization half of the crate. The reason is one impl: the `Error`
type defined below implements *both* `de::Error` and `ser::Error`, so that the
same type can be the error of a round trip. Nothing else in this file goes near
serialization.

`self::private::{First, Second}` points at a module at the very bottom of the
file — two traits used to destructure iterator items generically. They are the
last thing here and the least obvious; forward-linking them at the top like this
is how you find out they exist.
"""

[[annotation]]
id    = "de-value-0003"
file  = "src/de/value.rs"
lines = "31-46"
title = "impl_copy_clone! — a macro that exists because derive gets a bound wrong"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "marker-types", "generic-params"]
prereqs = ["ser-impls-0002"]
body = """
Read the comment above it first, because it states a real Rust defect in two
lines: *"For structs that contain a PhantomData. We do not want the trait bound
`E: Clone` inferred by derive(Clone)."*

`#[derive(Clone)]` on `struct U32Deserializer<E> { value: u32, marker:
PhantomData<E> }` emits `impl<E: Clone> Clone for U32Deserializer<E>`. It adds a
bound for every type parameter, mechanically, without checking whether any field
actually needs it. Here `E` appears only inside `PhantomData<E>`, which is `Clone`
no matter what `E` is — so the derived bound is pure noise, and it leaks: a user
holding a `U32Deserializer<SomeNonCloneError>` cannot clone it, for no reason.

The macro writes the bound-free version by hand:

- `impl<E> Copy for $ty<E> {}` — no bound, and `Copy` requires `Clone`, which the
  next impl supplies.
- `impl<E> Clone for $ty<E> { fn clone(&self) -> Self { *self } }` — the body is a
  dereference, legal precisely because the type is `Copy`.

The matcher is `($ty:ident $(<$lifetime:tt>)*)`, and the optional repetition is
how one macro serves both `impl_copy_clone!(UnitDeserializer)` and
`impl_copy_clone!(StrDeserializer<'de>)`. `$(<$lifetime:tt>)*` matches zero or
one bracketed lifetime in practice — `macro_rules!` has no "optional" operator,
so `*` is the idiom for it. Each expansion site then repeats `$($lifetime,)*`,
which produces either nothing or `'de,` at the front of the generic list.

This trick recurs across Rust; the derive limitation it works around is
long-standing and still unfixed.
"""

[[annotation]]
id    = "de-value-0004"
file  = "src/de/value.rs"
lines = "47-59"
title = "value::Error — one field, whose type is a cfg"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "11-no-std-and-cfg"
rust_features = ["custom-errors", "cfg", "no-std"]
prereqs = ["de-mod-0007"]
body = """
*"A minimal representation of all possible errors that can occur using the
`IntoDeserializer` trait."* Minimal is exact: one private field.

`type ErrorImpl` is where the `no_std` engineering shows. With `std` or `alloc`
it is `Box<str>` — the message, heap-allocated, in the smallest box that can hold
it (`Box<str>` is two words; `String` would be three, and this type never grows
the message after construction). Without either, it is `()`: no allocator, so no
message, and the struct becomes zero-sized.

The public type is the same in both worlds. Every method below then has to be
written twice, once per `cfg`, which is what the next several impls are doing.
That is the cost of making the *type* rather than its *API* conditional, and it
is the right trade — downstream code that names `value::Error` compiles either
way.

`#[derive(Clone, PartialEq)]` is safe here where `derive(Clone)` was not above:
there are no type parameters, so there is no spurious bound to infer.
"""

[[annotation]]
id    = "de-value-0005"
file  = "src/de/value.rs"
lines = "60-81"
title = "de::Error::custom, written twice, and #[cold] both times"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "11-no-std-and-cfg"
rust_features = ["custom-errors", "cfg", "trait-objects"]
prereqs = ["de-mod-0008"]
body = """
`custom` is the one method `de::Error` cannot default, and here it appears in two
`cfg`-gated copies inside a single impl block. Only one is compiled; the other
does not exist as far as the type checker is concerned.

The allocating version is `msg.to_string().into_boxed_str()` — format the
`Display` value into a `String`, then shrink it to exactly its length. The
non-allocating version is `let _ = msg; Error { err: () }`, and that `let _ =`
line is not decoration: without it the parameter is unused and the crate's own
`deny` settings would fail the build. Binding to `_` is the idiomatic way to say
"deliberately discarded".

`#[cold]` on both tells LLVM this function is unlikely to be called, so it gets
laid out away from the hot path and is not inlined into the callers that check
for errors. Every error constructor in serde carries it. The cost of an error is
paid by the program that errors; the program that does not should not carry the
code in its instruction cache.

Note what is *lost* in the `no_std` build: `invalid_type`, `unknown_field`, and
every other diagnostic funnel down into `custom`, so all of them collapse to the
same empty value. Error messages are a feature you buy with an allocator.
"""

[[annotation]]
id    = "de-value-0006"
file  = "src/de/value.rs"
lines = "82-93"
title = "ser::Error for the same type — the round trip in eleven lines"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors", "traits"]
prereqs = ["de-value-0005"]
body = """
This is why `use crate::ser` is at the top of a file in `de/`. `value::Error`
implements the serialization error trait as well, and the body just forwards:
`de::Error::custom(msg)`.

Both traits require the same single method with the same signature, so one type
can satisfy both and code that serializes into an `IntoDeserializer` and reads
back out never has to convert between two error types. The two traits stay
separate at the trait level — `Serializer::Error: ser::Error` and
`Deserializer::Error: de::Error` are unrelated bounds — but nothing stops one
concrete type from wearing both hats.

The explicit `de::Error::custom(msg)` call, rather than `Self::custom(msg)`,
avoids an ambiguity the compiler would otherwise report: with both traits in
scope and both defining `custom`, `Self::custom` names two candidates.
"""

[[annotation]]
id    = "de-value-0007"
file  = "src/de/value.rs"
lines = "94-114"
title = "Display and Debug, and the one line that shows the no_std split leaking"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "custom-errors"]
prereqs = ["de-value-0004"]
body = """
`Display` again splits on `cfg`: print the stored message, or print the fixed
string `"Serde deserialization error"` when there is no message to print. A
caller formatting an error in a `no_std` build gets a sentence that is true but
uninformative.

`Debug` does something more interesting. It builds `debug_tuple("Error")` and
then has `#[cfg(...)] debug.field(&self.err);` as a *statement* — an attribute on
a single line of a function body, not on an item. That is legal and it is the
tersest way to write this: with an allocator the output is `Error("bad
value")`, without one it is `Error`. One function, one conditional line, instead
of two whole `fmt` bodies.

Notice the asymmetry with `Display` directly above, which *was* written twice.
`Display`'s two bodies differ in their entire expression, so a per-statement
`cfg` would not have helped. Choosing the granularity of the gate — item,
method, or statement — is the whole craft of readable `cfg` code, and this
twenty-line stretch shows two of the three.
"""

[[annotation]]
id    = "de-value-0008"
file  = "src/de/value.rs"
lines = "115-122"
title = "std::error::Error, and a method that has been deprecated for years"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "custom-errors", "msrv"]
prereqs = ["de-mod-0006"]
body = """
Only under `feature = "std"`, because `error::Error` did not move to `core` until
Rust 1.81 and serde supports much older compilers. `#[cfg_attr(docsrs,
doc(cfg(feature = "std")))]` is what puts the little "Available on crate feature
std only" banner on docs.rs.

The impl overrides `description`, which the standard library deprecated in favor
of `Display`. It is implemented here anyway and not marked deprecated, which
would normally draw a warning — the crate suppresses that centrally. The reason
to keep it is that some very old code still calls `description()` directly, and
returning `&self.err` there is strictly better than the default implementation's
`"description() is deprecated; use Display"`.

This is the kind of detail worth reading twice when it shows up in a dependency:
it is not a mistake, it is a compatibility promise that costs four lines.
"""

[[annotation]]
id    = "de-value-0009"
file  = "src/de/value.rs"
lines = "123-134"
title = "The first IntoDeserializer impl, and the shape all 30 of them share"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "generic-params"]
prereqs = ["de-mod-0075"]
body = """
`impl<'de, E> IntoDeserializer<'de, E> for ()` — the unit type can become a
deserializer, and the deserializer it becomes is `UnitDeserializer<E>`.

Read the generics carefully, because this pattern repeats about thirty times
below. `E` is chosen by the *caller*, not by this impl: whoever calls
`().into_deserializer()` decides what error type comes out, and inference usually
fills it in from the surrounding `Deserialize::deserialize` call. That is why
`E: de::Error` is the only bound. `'de` is unconstrained here — nothing in `()`
borrows — so the impl is generic over every `'de` at once, and the value can feed
a `Deserialize` impl with any lifetime requirement it likes.

`type Deserializer = UnitDeserializer<E>` is the associated type doing its usual
job: the *input value* picks the deserializer type, one-to-one, at compile time.
There is no dispatch here and nothing to look up at runtime.
"""

[[annotation]]
id    = "de-value-0010"
file  = "src/de/value.rs"
lines = "135-140"
title = "UnitDeserializer — a struct whose only field is a lie about ownership"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "08-phantomdata-and-variance"
rust_features = ["marker-types", "generic-params", "zero-cost"]
prereqs = ["de-value-0009"]
body = """
*"A deserializer holding a `()`."* It holds nothing. The single field is
`marker: PhantomData<E>`, and `()` has no representation to store.

`PhantomData<E>` is here because `E` appears in the type's signature but in none
of its fields, and Rust rejects unused type parameters outright — the parameter
has to be mentioned somewhere or the compiler cannot decide the type's variance
or drop behavior. `PhantomData<E>` says "behave as though this struct owned an
`E`", costs zero bytes, and makes `UnitDeserializer<E>` a distinct type for each
`E`, which is exactly what `type Error = E` below needs.

This struct is zero-sized. Constructing it, passing it, and dropping it all
compile to nothing at all.
"""

