[[annotation]]
id    = "de-value-0043"
file  = "src/de/value.rs"
lines = "750-758"
title = "CowStrDeserializer — one type for both halves of the ownership question"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "07-lifetimes-de-and-zero-copy"
rust_features = ["ownership", "borrowing", "cfg", "pattern-matching"]
prereqs = ["de-value-0038"]
body = """
`Cow<'a, str>` is "either a borrow or an allocation, decided at runtime", and the
deserializer holding one has to defer the same decision to runtime. Every other
type in this file knows statically which visitor method it will call; this one
picks with a `match`.

The reason it exists is escaping: a JSON parser reading `"a\\nb"` cannot hand out
a borrow of the input, because the input contains a backslash and an `n` where
the value contains a newline. The same parser reading `"ab"` can. A format that
wants zero-copy where possible and allocation only where necessary returns a
`Cow`, and this is the deserializer that consumes it.
"""

