[[annotation]]
id    = "de-value-0027"
file  = "src/de/value.rs"
lines = "418-441"
title = "EnumAccess — variant_seed, and a Variant type that allows nothing"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "marker-types"]
prereqs = ["de-mod-0069", "de-mod-0070"]
body = """
`type Variant = private::UnitOnly<E>`, and the body is one line:
`seed.deserialize(self).map(private::unit_only)`.

Read it right to left. `seed.deserialize(self)` runs the variant-identifier seed
against this deserializer — the seed asks for a `u32`, gets one, and returns
whichever variant that index names. Then `.map(private::unit_only)` pairs that
answer with a `UnitOnly<E>`, the second half of the `(T::Value, Self::Variant)`
tuple `variant_seed` must return.

`UnitOnly` is defined in the private module at the bottom of the file and its
name is its documentation: it implements `VariantAccess` such that `unit_variant`
succeeds and `newtype_variant_seed`, `tuple_variant`, and `struct_variant` all
fail with `invalid_type`. Which is exactly right — you handed over a number, and
a number carries no payload. `Direction::North` can come out of `0u32`;
`Message::Text(String)` cannot.

Every non-composite deserializer in this file that supports enums — `u32`,
`&str`, `String`, `Cow<str>` — uses `UnitOnly` for the same reason.

`Debug` closes the section, printing the wrapped value.
"""
