[[annotation]]
id    = "ser-mod-0048"
file  = "src/ser/mod.rs"
lines = "2001-2010"
title = "iterator_len_hint — ten lines that decide what a length hint means"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "05-default-methods"
rust_features = ["iterators", "option", "pattern-matching", "generic-params"]
examples = ["seq_state_machine"]
prereqs = ["ser-mod-0038"]
body = """
The private helper `collect_seq` and `collect_map` use, and a small piece of
judgement worth the whole annotation:

```rust
fn iterator_len_hint<I>(iter: &I) -> Option<usize>
where
    I: Iterator,
{
    match iter.size_hint() {
        (lo, Some(hi)) if lo == hi => Some(lo),
        _ => None,
    }
}
```

`Iterator::size_hint` returns `(lower_bound, Option<upper_bound>)`. This reports
a length **only when the two bounds are equal** — that is, only when the iterator
knows its length exactly. Anything else becomes `None`.

The conservative choice matters. A `Filter` over a `Vec` of ten reports
`(0, Some(10))`: somewhere between none and all. Passing `Some(10)` to a format
that length-prefixes would produce a header claiming ten elements followed by
three, and a file no reader can parse. Passing `None` costs a format the chance
to optimise; passing a wrong number costs correctness.

The match guard `if lo == hi` is doing all the work, and the `_ => None` arm
absorbs both the unbounded case and the merely-imprecise one.

Worth reading against the caution at line 1006. This function is careful, but it
can only be as truthful as `size_hint` — which is a safe-trait method any type
may implement badly. That is why a format still must not trust the number for
allocation. `iterator_len_hint` removes the accidental lies; it cannot remove the
deliberate ones.

Line 2010 is the end of the file.
"""
