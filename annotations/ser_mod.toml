[[annotation]]
id    = "ser-mod-0001"
file  = "src/ser/mod.rs"
lines = "1-9"
title = "Two traits, two roles: data structures and data formats"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "01-why-a-data-model"
rust_features = ["traits"]
examples = ["ok_and_error"]
body = """
The module opens by stating Serde's central organizing idea, and it is worth
reading slowly because everything else follows from it.

There are two roles, and they are held by different people:

- **`Serialize` is implemented by a data structure.** You write it (or derive
  it) for `struct User`. It says: *here is how to describe myself.*
- **`Serializer` is implemented by a data format.** `serde_json` writes it. It
  says: *here is how to write down anything that describes itself.*

Neither one knows about the other. `User` has never heard of JSON;
`serde_json` has never heard of `User`. They meet only through the trait pair.

That is what makes the ecosystem N+M instead of N×M: adding a new format does
not require touching any data structure, and adding a new data structure does
not require touching any format.
"""

[[annotation]]
id    = "ser-mod-0002"
file  = "src/ser/mod.rs"
lines = "10-29"
title = "Where Serialize implementations come from"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits", "proc-macro-boundary"]
prereqs = ["ser-mod-0001"]
body = """
Four sources of `Serialize` impls, in rough order of how often you will meet
them:

1. **Built in.** serde_core ships impls for primitives and std types. Those live
   in `src/ser/impls.rs`, and they are the bulk of that 1,046-line file.
2. **Derived.** `#[derive(Serialize)]` from `serde_derive`. Note the boundary:
   the derive macro is *not* in this crate. serde_core deliberately contains no
   proc-macro dependency, which is why it can compile before `syn` has finished.
3. **Hand-written.** For the rare type whose representation you want to control.
4. **Third-party.** A crate can implement `Serialize` for its own types.

Point 2 is the one to hold on to. The split between `serde`, `serde_core`, and
`serde_derive` exists precisely so that this file — the trait definitions —
does not have to wait on a proc-macro toolchain to compile.
"""

[[annotation]]
id    = "ser-mod-0003"
file  = "src/ser/mod.rs"
lines = "30-37"
title = "Formats live in other crates, by design"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits"]
prereqs = ["ser-mod-0001"]
body = """
Note what this section does *not* say: it does not point at a `Serializer`
implementation inside serde. There isn't one. serde_core defines the trait and
ships zero formats.

That is the discipline that makes the abstraction honest. If serde shipped a
blessed format, the trait would drift toward whatever that format needed, and
every other format would inherit decisions it did not want. Keeping all
implementations outside the crate means the data model has to be defensible on
its own terms.

The three named here — `serde_json`, `serde_yaml`, `postcard` — are deliberately
unalike: a self-describing text format, an indentation-sensitive one, and a
compact binary format for embedded targets. If the trait can serve all three, it
is probably not secretly shaped around one of them.
"""

[[annotation]]
id    = "ser-mod-0004"
file  = "src/ser/mod.rs"
lines = "38-99"
title = "The built-in list, and why it is worth reading"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "01-why-a-data-model"
rust_features = ["traits", "collections"]
prereqs = ["ser-mod-0002"]
body = """
Sixty lines of type names looks like filler. It is closer to a specification.

Every entry here is a promise that some `impl Serialize` exists in
`src/ser/impls.rs`, and together they define the boundary of what Serde
considers a data structure. Read it as a list of decisions:

- **Primitives get one entry each.** `i8` through `i128`, `u8` through `u128`,
  both floats. Later you will see these are generated by one macro rather than
  hand-written thirteen times.
- **References are included.** `&T` and `&mut T` serialize as whatever `T`
  serializes as, which is why you almost never think about them.
- **Arrays stop at 32.** A fossil from before const generics: each length needed
  its own impl, so someone picked a cutoff. It is a good reminder that this
  crate has to keep compiling on old compilers.
- **Wrappers appear where you might not expect them** — `Cell`, `RefCell`,
  `Mutex`, `Rc`, `Arc` — because a container that can hand you a `&T` can
  serialize as that `T`.

When you meet `impls.rs` later, this list is the checklist it satisfies.
"""

[[annotation]]
id    = "ser-mod-0005"
