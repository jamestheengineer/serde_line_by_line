kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "generic-params", "sized-bound"]
prereqs = ["ser-mod-0031"]
body = """
`enum E { N(u8) }` — a variant wrapping exactly one value. The signature is the
variant triple from line 889 plus the value:

```rust
name, variant_index, variant, value: &T
```

Unlike `serialize_newtype_struct`, this one cannot simply forward to the inner
value: the variant identity has to survive, or deserialization has no way to know
which variant it was. So formats really do write something here — `serde_json`
produces `{"N": 9}`.

This is the last method that completes in a single call. Everything from
`serialize_seq` onward hands back one of the seven state types from line 369 and
expects the caller to keep going.
"""

[[annotation]]
id    = "ser-mod-0033"
file  = "src/ser/mod.rs"
lines = "1006-1061"
title = "serialize_seq — where the length is a hint, not a promise"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "option", "iterators"]
examples = ["seq_state_machine"]
prereqs = ["ser-mod-0018"]
body = """
The first of the seven compound constructors, and the shape they all share:

```rust
fn serialize_seq(self, len: Option<usize>) -> Result<Self::SerializeSeq, Self::Error>;
```

`self` is consumed and something new comes back — the state object that will
accept elements and eventually produce `Self::Ok`. The doc example shows the
whole cycle: `serialize_seq`, a loop of `serialize_element`, then `end()`.

**Why `Option<usize>`.** Some formats must know the count before writing anything
— a length-prefixed binary format cannot start until it does. Others never care.
But the *data structure* may not know either: a `Vec` does, an arbitrary
`Iterator` does not. So the parameter is honest about the uncertainty rather than
forcing a `collect()` nobody asked for.

**The hazard.** `len` arrives from `Iterator::size_hint` in the general case,
which is *not* trustworthy input. A format that allocates `Vec::with_capacity(len)`
on a hostile stream hands the attacker an allocation primitive. This is the same
class of bug that made bincode's sequence handling a recurring source of
denial-of-service reports. Treat it as advice, never as a contract — the type
says `Option`, but even `Some(n)` only means "the producer believes n".

`Result` wraps the return because a format that cannot represent sequences fails
here, at the start, rather than partway through.
"""

[[annotation]]
id    = "ser-mod-0034"
file  = "src/ser/mod.rs"
lines = "1062-1133"
title = "tuple and tuple_struct — statically known lengths"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
prereqs = ["ser-mod-0033"]
body = """
Two constructors that differ from `serialize_seq` in one telling way:

```rust
fn serialize_tuple(self, len: usize) -> ...
fn serialize_tuple_struct(self, name: &'static str, len: usize) -> ...
```

`usize`, not `Option<usize>`. A tuple's arity is part of its type, so the length
is always known at compile time and the uncertainty that justified `Option` does
not exist. The signature records that.

The practical difference for a format: a sequence must generally be
self-delimiting on the wire, because the reader does not know how many elements
are coming. A tuple need not be, because the reader's type says so. Compact
binary formats exploit this — a `(u8, u8)` can be two bytes with no framing at
all, while a `Vec<u8>` of length two needs a count.

`serialize_tuple_struct` adds the `&'static str` name, following the same
pattern as everywhere else: record it, let the format discard it.

Also note `[T; N]` uses these. Arrays have statically known lengths, so they are
tuples in the model's eyes, not sequences.
"""

[[annotation]]
id    = "ser-mod-0035"
file  = "src/ser/mod.rs"
lines = "1134-1187"
title = "tuple_variant and map — the last of the uncertain lengths"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "collections", "option"]
prereqs = ["ser-mod-0034"]
body = """
`serialize_tuple_variant` is `enum E { T(u8, u8) }`: the variant triple plus a
statically known `len: usize`.

`serialize_map` returns to `Option<usize>`, for the same reason `serialize_seq`
does — a `HashMap` knows its size, an iterator of pairs may not.

The map constructor is where a format's assumptions get tested hardest, because
Serde's model puts no constraint on key types. A key may be a struct, a sequence,
another map. JSON requires string keys, so `serde_json` fails at runtime on
anything else; formats with richer key support accept them.

Serde could have restricted keys to strings and spared everyone the trouble. It
does not, on the same principle as everywhere else in this file: the model
records what Rust could express, and each format decides what it can carry.
"""

[[annotation]]
id    = "ser-mod-0036"
file  = "src/ser/mod.rs"
lines = "1188-1263"
title = "serialize_struct — and the len that skipped fields do not count toward"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "proc-macro-boundary"]
examples = ["ok_and_error"]
prereqs = ["ser-mod-0035"]
body = """
The method behind every `#[derive(Serialize)]` on a struct:

```rust
fn serialize_struct(self, name: &'static str, len: usize) -> ...
```

One sentence in the docs deserves more attention than it usually gets:

> `len` does not include fields which are skipped with `skip_serializing_if`.

So the count must be computed *after* deciding which fields to skip. That is why
derived code sometimes contains a small tally of conditionals before the
`serialize_struct` call — the format may have already written the count by the
time the first field arrives, and correcting it later is not possible in a
streaming writer.

It also means `len` and the number of `serialize_field` calls must agree. A
format is entitled to trust this. Getting it wrong in a hand-written impl
produces malformed output rather than an error, which is one of the sharper edges
in the whole trait.

`len: usize` and not `Option`, because a struct's field count is known
statically — even with skipping, it is known before serialization begins.

The `Person` example at line 240 is the concrete version of this, captioned as
what the derive generates.
"""

