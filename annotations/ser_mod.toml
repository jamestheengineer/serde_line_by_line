[[annotation]]
id    = "ser-mod-0038"
file  = "src/ser/mod.rs"
lines = "1296-1332"
title = "collect_seq — the first method with a body worth reading"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "05-default-methods"
rust_features = ["default-methods", "iterators", "generic-params", "where-clauses", "associated-types"]
examples = ["seq_state_machine"]
prereqs = ["ser-mod-0033"]
body = """
After thirty declarations, an actual implementation:

```rust
let mut iter = iter.into_iter();
let mut serializer = tri!(self.serialize_seq(iterator_len_hint(&iter)));
tri!(iter.try_for_each(|item| serializer.serialize_element(&item)));
serializer.end()
```

Four lines that hand a whole iterator to the serializer without the caller
writing a loop. It is a default method: formats inherit it and almost never
override it.

**`tri!` instead of `?`.** serde defines its own try macro (in `lib.rs`) that
expands to a plain `match`. The reason is compile time, not correctness — `?`
goes through the `Try` and `From` traits, and across the thousands of call sites
serde generates, the simpler expansion measurably speeds up builds. A rare case
where a project has good reason to avoid a language feature it could use.

**`iterator_len_hint`** is the small helper at the very bottom of this file, line
2002. It converts `Iterator::size_hint` into the `Option<usize>` that
`serialize_seq` wants — and it is where the untrustworthy length from the
previous annotation comes from.

**The bounds** are worth reading carefully.
`<I as IntoIterator>::Item: Serialize` is fully-qualified associated-type syntax:
whatever this iterator yields must itself be serializable. Nothing here requires
`I` to be a collection, or to know its size, or to be re-iterable.

`try_for_each` short-circuits on the first error, so a failure partway through
stops immediately rather than serializing the rest and discarding it.
"""

[[annotation]]
id    = "ser-mod-0039"
file  = "src/ser/mod.rs"
lines = "1333-1371"
title = "collect_map — the same shape, over pairs"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "iterators", "generic-params", "where-clauses"]
prereqs = ["ser-mod-0038"]
body = """
`collect_seq` with `(K, V)` instead of a single item, delegating to
`serialize_entry` rather than `serialize_element`.

The bound `I: IntoIterator<Item = (K, V)>` uses an associated-type equality
constraint in the sugar position, which is why `K` and `V` can be named
separately in the `where` clause and bounded independently.

Note that no ordering is imposed. Serializing a `HashMap` through this method
produces entries in whatever order the map iterates, which varies between runs
because of hash seed randomisation. If you need deterministic output — for
signatures, or golden-file tests — that is your problem to solve before calling,
usually by using `BTreeMap`. Nothing in serde will do it for you, and nothing
warns you.
"""

[[annotation]]
id    = "ser-mod-0040"
file  = "src/ser/mod.rs"
lines = "1372-1457"
title = "collect_str — the same method twice, because no_std cannot allocate"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "12-no-std-and-cfg"
rust_features = ["cfg", "no-std", "default-methods", "strings", "sized-bound"]
examples = ["collect_str"]
prereqs = ["ser-mod-0039"]
body = """
The same signature declared twice under mutually exclusive `cfg`s, and the
difference between them is the whole point.

With `std` or `alloc`, it has a default body:

```rust
self.serialize_str(&value.to_string())
```

Without either, it is **required** and has no body at all.

`to_string()` allocates. In a build with no allocator there is nothing to
allocate into, so serde cannot supply a default — the format must implement it,
typically by writing the `Display` output directly into a fixed buffer or
straight to the output stream.

This is one of the cleanest illustrations of what `no_std` actually costs. Not
"fewer features" in the abstract: a specific method loses its default because the
default's one line is unavailable, and the obligation moves to the implementor.

Why the method exists at all: types like `std::path::Display` or a chrono
timestamp know how to render themselves through `Display` but have no `&str` to
hand over. Without `collect_str` they would each allocate a `String` and call
`serialize_str`. With it, a format that can stream `Display` output avoids the
allocation entirely.

`T: ?Sized + Display` — the same opt-out as everywhere else, so `&dyn Display`
and unsized types work.
"""

[[annotation]]
id    = "ser-mod-0041"
file  = "src/ser/mod.rs"
lines = "1458-1462"
title = "is_human_readable — the one place formats are allowed to leak"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["default-methods", "inlining", "zero-cost"]
examples = ["default_methods"]
prereqs = ["ser-mod-0040"]
body = """
The last method in the trait, and an admitted compromise:

```rust
#[inline]
fn is_human_readable(&self) -> bool {
    true
}
```

Everything before this point kept data structures ignorant of the format. This
method deliberately punctures that, because a class of types genuinely wants to
serialize two different ways. An IP address should be `"192.168.0.1"` in JSON and
four bytes in a binary format. A timestamp should be RFC 3339 in one and an
integer in the other.

Without this, you would need either two Rust types or a format-specific wrapper
for every such case. With it, one `Serialize` impl branches once.

`#[inline]` plus a constant return means the branch disappears entirely: the
format's answer is known at compile time after monomorphisation, so the losing
arm is eliminated. Zero cost, despite looking like a runtime query.

The default is `true`, so a format that says nothing is treated as human
readable. That is the safer default — producing a readable encoding where a
compact one was possible wastes bytes, while the reverse produces output nobody
can read.

The obligation this creates is symmetry: `Deserializer` has the same method, and
a format **must** return the same answer from both. Disagreeing means writing one
representation and reading the other, and nothing checks it for you.

Line 1462 closes `trait Serializer`. Everything past here is the seven state
traits its associated types referred to.
"""

[[annotation]]
id    = "ser-mod-0042"
file  = "src/ser/mod.rs"
lines = "1463-1532"
title = "SerializeSeq — the state machine, and the &mut that makes it one"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types", "borrowing", "sized-bound"]
examples = ["seq_state_machine"]
prereqs = ["ser-mod-0033"]
body = """
The type `Serializer::SerializeSeq` was promising back at line 373, now declared.
Three items:

```rust
type Ok;
type Error: Error;
fn serialize_element<T>(&mut self, value: &T) -> Result<(), Self::Error> where T: ?Sized + Serialize;
fn end(self) -> Result<Self::Ok, Self::Error>;
```

The receivers encode the state machine.

**`serialize_element` takes `&mut self`** and returns `Result<(), _>` — no output
value, because the element goes into the accumulating state, and you may call it
as many times as you like.

**`end` takes `self` by value** and returns `Self::Ok`. Consuming means you
cannot add elements afterward, and cannot call `end` twice. The only legal
sequence is any number of elements followed by exactly one `end`, and that is
enforced by the borrow checker rather than by a runtime flag or a panic.

This is worth sitting with as a piece of API design. A less careful version would
have `end(&mut self)` and a `finished: bool` checked at runtime. Serde gets the
same guarantee for free, at compile time, purely by choosing receivers.

Note `Ok` and `Error` are re-declared here rather than inherited — the trait
stands alone, and the equality bounds at line 373 are what tie it back to the
serializer that produced it.
"""

[[annotation]]
id    = "ser-mod-0043"
file  = "src/ser/mod.rs"
lines = "1533-1689"
title = "SerializeTuple and SerializeTupleStruct — near-duplicates, on purpose"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
prereqs = ["ser-mod-0042"]
body = """
Two more traits, structurally identical to `SerializeSeq`. `SerializeTuple` keeps
the name `serialize_element`; `SerializeTupleStruct` calls it `serialize_field`.
Otherwise: same `&mut self` accumulation, same by-value `end`.

The obvious question is why these are not one trait with a marker parameter, or
simply reuses of `SerializeSeq`.

Because separate traits let a format give them **separate types**. `serde_json`
points several of these at one implementation and loses nothing. A format that
writes tuples without framing but sequences with a length prefix needs genuinely
different state, and separate traits let it have that with no runtime branch and
no way to mix them up.

The cost is what you are reading: about 160 lines that say almost the same thing
three times. Serde paid it for the same reason it declines to supply defaults for
`serialize_i8` — the distinction is real for some formats, so it stays in the type
system.

`SerializeTuple`'s docs carry the most useful detail here: it is used for Rust
tuples, for fixed-size arrays `[T; N]`, and by `serde_derive` for tuple structs
when it can prove the length. Three different Rust shapes, one model type.
"""

