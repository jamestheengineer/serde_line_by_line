[[annotation]]
id    = "ser-mod-0045"
file  = "src/ser/mod.rs"
lines = "1811-1866"
title = "SerializeMap — two APIs for the same thing, and a real trap"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "05-default-methods"
rust_features = ["traits", "default-methods", "associated-types", "sized-bound"]
prereqs = ["ser-mod-0042"]
body = """
The only state trait with three methods rather than two:

```rust
fn serialize_key<T>(&mut self, key: &T) -> Result<(), Self::Error>;
fn serialize_value<T>(&mut self, value: &T) -> Result<(), Self::Error>;

fn serialize_entry<K, V>(&mut self, key: &K, value: &V) -> Result<(), Self::Error> {
    tri!(self.serialize_key(key));
    self.serialize_value(value)
}
```

`serialize_entry` is a default that simply calls the other two in order. Both
APIs exist because callers differ: a `HashMap` has key and value together and
wants `serialize_entry`, while a streaming producer may have the key well before
the value and needs to emit it early.

**The trap.** Splitting a pair across two calls means the invariant
"every key is followed by exactly one value" is no longer enforceable by the type
system, the way `SerializeSeq`'s receivers enforced its invariant. Call
`serialize_key` twice in a row and nothing stops you — you get malformed output,
or a panic from a format that kept a flag, depending on the format. The docs say
so plainly, which is the most a trait can do here.

It is a useful contrast with line 1518. Where an invariant could be expressed in
receivers, serde expressed it. Where it could not, serde documented it and moved
on rather than adding runtime bookkeeping every format would pay for.

`serialize_entry` is also the reason `collect_map` at line 1333 is four lines
long: it can hand over both halves at once.
"""

[[annotation]]
id    = "ser-mod-0046"
file  = "src/ser/mod.rs"
lines = "1867-1930"
title = "SerializeStruct — and skip_field, which usually does nothing"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "default-methods", "inlining", "associated-types"]
examples = ["default_methods"]
prereqs = ["ser-mod-0036"]
body = """
The state trait behind every derived struct impl. `serialize_field` takes the
field name as `&'static str` alongside the value — the name comes from the
declaration, so it costs nothing to pass.

The interesting member is the other one:

```rust
#[inline]
fn skip_field(&mut self, key: &'static str) -> Result<(), Self::Error> {
    let _ = key;
    Ok(())
}
```

A method whose default is to do nothing, which raises the question of why it
exists.

It is called by derived code for fields removed by `#[serde(skip_serializing_if)]`.
Most formats want exactly this behaviour: the field is absent, say nothing. But a
format that must emit something for every declared field — a fixed-layout binary
format, or one carrying a schema — needs to know a field was skipped rather than
never existing. Without this hook it could not tell the difference.

So the default is "do nothing" because that is right for nearly everyone, and the
method exists because "nearly" is not "all". `#[inline]` plus an empty body means
the call vanishes for every format that does not override it.

`let _ = key;` again, to keep the parameter named in the rendered docs while
silencing the unused warning — the same courtesy as `serialize_i128`.

Recall from line 1194 that skipped fields must not be counted in the `len` passed
to `serialize_struct`. `skip_field` is the other half of that arrangement.
"""

