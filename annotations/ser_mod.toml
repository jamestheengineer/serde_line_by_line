[[annotation]]
id    = "ser-mod-0024"
file  = "src/ser/mod.rs"
lines = "663-701"
title = "f32 and f64 — where round-tripping gets hard"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits"]
prereqs = ["ser-mod-0022"]
body = """
Two more required methods in the same shape, and the same
"cast and forward if you do not care" advice.

What the trait does not say, but every format author discovers: floats are where
serialization stops being mechanical. `f64` has values that no decimal string
represents exactly, plus `NaN` and both infinities, which JSON cannot express at
all. The data model passes the `f64` through untouched and leaves all of it to
the format.

That is why `serde_json` depends on a dedicated float-formatting crate — `ryu`
historically, `zmij` in current versions — to convert `f64` to the shortest
decimal string that reads back as the identical bit pattern. Roughly a third of
serde_json's source is arbitrary-precision arithmetic serving this one problem.

None of that complexity is visible here, which is the design working. The model's
job is to say "this is a float"; correctness of the encoding belongs to whoever
writes the bytes.
"""

[[annotation]]
id    = "ser-mod-0025"
file  = "src/ser/mod.rs"
lines = "702-719"
title = "serialize_char — a type most formats do not have"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "strings"]
prereqs = ["ser-mod-0024"]
body = """
`char` is one of the 14 primitives, and it is the clearest case of the model
being Rust-shaped rather than format-shaped.

Almost no serialization format has a character type. JSON does not; postcard
does not. The docs suggest the obvious fallback — encode it as a one-character
string and forward to `serialize_str`.

So why is it in the model at all? Because a Rust `char` is not a byte and not a
string: it is exactly one Unicode scalar value, guaranteed not to be a surrogate.
That is information the type system already proved, and discarding it at the
model boundary would mean every format that *can* represent it has no way to know.

The pattern generalises: put the distinction in the model, let formats collapse
it. Collapsing is easy and local. Recovering a distinction that was never
recorded is impossible.
"""

[[annotation]]
id    = "ser-mod-0026"
file  = "src/ser/mod.rs"
lines = "720-754"
title = "serialize_str — UTF-8 guaranteed, length known, no terminator"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "13-errors-and-control-flow"
rust_features = ["traits", "strings", "sized-bound"]
prereqs = ["ser-mod-0025"]
body = """
The model's string type, defined back at line 290 as "UTF-8 bytes with a length
and no null terminator".

Each clause of that definition removes a decision from every format author:

- **UTF-8** — because `&str` already proved it. A format never has to validate,
  and never has to handle invalid encoding on the way out.
- **with a length** — so a format can length-prefix without scanning.
- **no null terminator** — so interior nulls are ordinary characters, and
  `"a\\0b"` is a three-character string rather than a bug.

Types that cannot promise UTF-8 do not get to use this method. `std::path::Path`
is the canonical case: on Unix a path is arbitrary bytes, so its `Serialize` impl
has to check, and fails through `ser::Error::custom` when the check fails. That
is the exact example used in the error-trait docs at line 130 — the two halves of
that story sit 600 lines apart in this file.
"""

[[annotation]]
id    = "ser-mod-0027"
file  = "src/ser/mod.rs"
lines = "755-787"
title = "serialize_bytes — the opt-in that Vec<u8> does not take"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "collections"]
prereqs = ["ser-mod-0026"]
body = """
A byte array is its own model type, distinct from a sequence of `u8`. A binary
format can write it as a length-prefixed blob; JSON has to invent something,
usually base64 or an array of numbers.

Here is the part that surprises people: **`Vec<u8>` does not use this method.**
Its `Serialize` impl is the generic `Vec<T>` one, so it serializes as a sequence
of 8-bit integers — in JSON, `[104,105]` rather than `"aGk="`.

That is not an oversight. `Vec<u8>` is ambiguous: sometimes it is a buffer,
sometimes it is a list of small numbers, and serde cannot tell which. Rust's
coherence rules also forbid a specialised impl for `Vec<u8>` alongside the
blanket `Vec<T>` one.

The fix lives outside this crate: `serde_bytes` provides wrapper types and a
field attribute that route to `serialize_bytes` explicitly. That crate exists
almost entirely because of this one distinction, which is why it has more than
fifty million downloads per version.

The lesson generalises. When the model has a type your Rust type could plausibly
map to but does not, the mapping is usually a decision someone made on purpose.
"""

[[annotation]]
id    = "ser-mod-0028"
file  = "src/ser/mod.rs"
lines = "788-840"
title = "none and some — Option as a model type, not an encoding"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "05-default-methods"
rust_features = ["traits", "option", "generic-params", "sized-bound"]
prereqs = ["ser-mod-0027"]
body = """
Two methods for one Rust enum, and it is worth asking why `Option<T>` gets
special treatment when no other enum does.

Because optionality is a concept most formats already have, and they disagree
about it. JSON has `null`. Some formats omit absent fields entirely. Others have
a presence bit. If `Option` were just an enum with two variants, `None` would
serialize as a unit variant named `"None"` and every format would produce
something nobody wants.

`serialize_some` is the first method here with a generic parameter:

```rust
fn serialize_some<T>(self, value: &T) -> Result<Self::Ok, Self::Error>
where
    T: ?Sized + Serialize;
```

`?Sized` opts *out* of the implicit `Sized` bound Rust adds to every type
parameter. Without it, `serializer.serialize_some(some_str)` where the value is
`&str` would not compile, because `str` has no compile-time size. Since the value
arrives behind a reference, its size never needs to be known — so the bound would
be a pure restriction. You will see `?Sized` on every method here that takes a
`&T`.

The recursion is also worth naming: `serialize_some` hands `value` to the
serializer, which calls `T`'s own `Serialize`, which calls another method on the
serializer. That is how nesting works throughout — the data model is flat, and
depth comes from the call stack.
"""

[[annotation]]
id    = "ser-mod-0029"
file  = "src/ser/mod.rs"
lines = "841-888"
title = "unit and unit_struct — two ways to say nothing"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "marker-types"]
prereqs = ["ser-mod-0028"]
body = """
`serialize_unit` is `()`: an anonymous value containing no data.
`serialize_unit_struct` is `struct Nothing;` — also no data, but with a name
attached, which is passed in as `&'static str`.

The obvious question is why the name is worth a separate method when most formats
throw it away. Two answers.

A self-describing format may want it. A schema-carrying format certainly does.
And once the name is discarded at the model boundary, no format can ever recover
it — the same one-way principle as `char`.

The `&'static str` is the detail to notice. Not `String`, not `&str` with some
lifetime: `'static`, because the name comes from a type declaration and is baked
into the binary. No allocation, no lifetime plumbing, and a format can store the
pointer without copying. Every name in this trait — struct names, variant names,
field names — is `&'static str` for the same reason.

This is a small, concrete case of a type carrying a proof: `'static` says
*this string outlives everything*, so nobody downstream has to think about it.
"""

[[annotation]]
id    = "ser-mod-0030"
file  = "src/ser/mod.rs"
lines = "889-915"
title = "serialize_unit_variant — and the index nobody expects"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "pattern-matching"]
prereqs = ["ser-mod-0029"]
body = """
The first method carrying the full variant signature, which repeats three more
times below:

```rust
fn serialize_unit_variant(
    self,
    name: &'static str,        // the enum's name
    variant_index: u32,        // its position, 0-based
    variant: &'static str,     // the variant's name
) -> Result<Self::Ok, Self::Error>;
```

Three pieces of identity for one variant, and formats genuinely split on which to
use. `serde_json` writes `variant` — the string — because JSON readers expect
names. A compact binary format writes `variant_index` as a varint, because one
byte beats eleven.

**`variant_index` is a wire-format hazard worth internalising.** It is the
declaration order of the variant in the source. Insert a variant in the middle of
an enum and every subsequent index shifts, so data written by the old code
deserializes as the wrong variant under the new code — silently, with no error,
because the index is still in range. Formats that use the index inherit a
compatibility rule that Rust does not enforce: append variants, never insert.

`name` is the enum's own name, mostly unused, present for the same reason as
everywhere else — the model records what it knew.
"""

[[annotation]]
id    = "ser-mod-0031"
file  = "src/ser/mod.rs"
lines = "916-949"
title = "serialize_newtype_struct — the wrapper that should disappear"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "generic-params", "sized-bound", "zero-cost"]
prereqs = ["ser-mod-0030"]
body = """
`struct Millimetres(u8);` — a newtype, Rust's zero-cost way to give a plain value
a distinct type.

The documented expectation is that a format should serialize it as its inner
value, so `Millimetres(9)` becomes `9` and not `{"Millimetres": 9}`. The wrapper
exists for the type checker, not for the wire.

That makes this the first method whose *recommended* implementation is a
one-liner:

```rust
value.serialize(self)
```

Hand the serializer straight to the inner value and let it call whichever of the
29 methods it wants. The `name` parameter is available for formats that want it,
and ignored by nearly all of them.

Note the signature is the same `T: ?Sized + Serialize` as `serialize_some`, for
the same reason: `value` arrives behind a reference, so its size is nobody's
business.

The wider point: the model has a type for newtype structs even though the advice
is to erase them. Recording the distinction costs one method; not recording it
would make the erasure mandatory.
"""

[[annotation]]
id    = "ser-mod-0032"
file  = "src/ser/mod.rs"
lines = "950-1005"
