kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules"]
body = """
Rustdoc reference-style link targets for the module docs above.

The mildly interesting thing is that they exist at all. Serde's docs cross-link
heavily to types that, from serde_core's point of view, live in other crates —
`serde_derive`, `serde_json`. Those cannot be `crate::` paths, so they are
written as absolute URLs and have to be maintained by hand.

This is one small piece of the cost of the crate split described in
[`docs/decisions.md`]: serde_core cannot reference serde_derive as a dependency,
so it references it as a hyperlink.
"""

[[annotation]]
id    = "ser-mod-0006"
file  = "src/ser/mod.rs"
lines = "110-117"
title = "Module wiring, and the single public re-export"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules", "visibility", "no-std"]
body = """
Four lines of structure that tell you a lot about the module.

`use crate::lib::*` is not the standard prelude. serde_core defines its own
`lib` module (in `crate_root.rs`) that re-exports either `core` or `std`
depending on features. Every file starts this way, and it is the mechanism that
makes `no_std` support invisible in the rest of the code.

Then three private modules — `fmt`, `impls`, `impossible` — and exactly one
re-export from them: `Impossible`. That asymmetry is the point. `impls` is
private because its contents are trait implementations, which need no name to be
useful. `Impossible` is public because a format author has to *write* it: it is
the type you use for `SerializeSeq` when your format cannot represent sequences.

You will use `Impossible` yourself before you finish this file.
"""

[[annotation]]
id    = "ser-mod-0007"
file  = "src/ser/mod.rs"
lines = "118-129"
title = "Three spellings of StdError, chosen at compile time"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "12-no-std-and-cfg"
rust_features = ["cfg", "no-std", "msrv"]
prereqs = ["ser-mod-0006"]
body = """
The same name, `StdError`, bound to three different types depending on where the
error trait happens to live in this build:

| condition | source |
|---|---|
| `feature = "std"` | `std::error::Error` |
| no std, but `core::error` exists | `core::error::Error` |
| no std, older compiler | serde's own `crate::std_error::Error` |

The three `cfg` predicates are mutually exclusive by construction, so exactly one
`pub use` survives.

The middle case is the interesting one. `Error` was only stabilised in `core` in
Rust 1.81. `no_core_error` is not a Cargo feature — it is set by
`build.rs` after probing the compiler version. So this block adapts to the
*toolchain*, not to user configuration, which is how the crate keeps a low MSRV
without giving up on modern `core`.

`#[doc(no_inline)]` keeps rustdoc from copying the whole `Error` trait into
serde's docs; it renders as a link instead.
"""

[[annotation]]
id    = "ser-mod-0008"
file  = "src/ser/mod.rs"
lines = "130-189"
title = "declare_error_trait! — a macro that exists to vary one bound"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "supertraits", "cfg", "custom-errors"]
examples = ["error_custom"]
prereqs = ["ser-mod-0007"]
body = """
Sixty lines of macro to declare one trait. Worth understanding exactly why.

**The matcher.** The pattern is
`(Error: Sized $(+ $($supertrait:ident)::+)*)`, which reads as: the literal
tokens `Error: Sized`, then zero or more `+ path::to::Trait` groups. The inner
`$($supertrait:ident)::+` matches a path as a sequence of identifiers separated
by `::`, so it accepts both `StdError` and `core::fmt::Debug`. The outer `$(...)*`
allows any number of them.

**Why a macro at all.** The trait body — the docs, the diagnostic attribute, the
`custom` method — is identical in every build. Only the supertrait list changes:
with `std` it is `StdError`, without it is `Debug + Display`. You cannot write
that with `#[cfg]` on a supertrait, because supertraits are part of the trait
declaration, not separate items. The choices are to duplicate the entire
declaration under two `cfg` blocks, or to abstract over the varying part. This is
the second option.

**What it declares.** `Error: Sized`, plus one method:

```rust
fn custom<T>(msg: T) -> Self where T: Display;
```

That signature is the whole contract between data structures and formats on the
error path. A `Serialize` impl that hits a problem — the doc example uses a
`Path` containing invalid UTF-8 — has no idea what error type the format uses.
It cannot construct one. So the trait requires every format's error type to be
constructible from *any* `Display` value, and `ser::Error::custom` is the
universal escape hatch.

Note the `Display` bound rather than `&str`: it means callers can pass
`format_args!` results without allocating, which matters in `no_std`.

The docs even legislate style — "should not be capitalized and should not end
with a period" — because these messages get embedded in larger ones by formats.
"""

[[annotation]]
id    = "ser-mod-0009"
file  = "src/ser/mod.rs"
lines = "190-198"
title = "The two invocations: std and no_std"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["cfg", "no-std", "supertraits"]
macro_def = "ser-mod-0008"
body = """
The payoff. Two mutually exclusive calls, each expanding to the full trait from
the previous annotation with a different supertrait list:

- With `std`: `Error: Sized + StdError`, so every format error integrates with
  `Box<dyn Error>`, `?`, and the wider error ecosystem.
- Without: `Error: Sized + Debug + Display`, the two pieces `StdError` would have
  given you anyway, minus the trait that did not exist in `core` when this was
  written.

This is a nice, small illustration of what feature-gating actually costs. The
`no_std` version is a strictly weaker bound, so code written against it works in
both builds — which is why serde's own internals only ever rely on `Display`.
"""

[[annotation]]
id    = "ser-mod-0010"
file  = "src/ser/mod.rs"
lines = "199-223"
title = "Serialize: the data-structure half of the contract"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "02-traits-and-supertraits"
rust_features = ["traits", "proc-macro-boundary"]
prereqs = ["ser-mod-0002"]
body = """
The bold phrase is doing the work: **a data structure** that can be serialized
into any format. Not "into JSON". The type commits to describing itself once,
and gets every format that exists now or later for free.

Four sources of implementations, restated from the module docs because this is
where a reader actually looking up the trait will land. The fourth is the one
that makes an ecosystem rather than a library: a crate you do not control can
implement `Serialize` for a type you do not control, and it just works, because
both sides only ever refer to this trait.

Note what the trait does *not* require: no `Sized`, no `Clone`, no supertraits at
all. `Serialize` is deliberately the cheapest possible thing to implement, since
it is implemented tens of thousands of times across the ecosystem, and only
`Serializer` — implemented a few hundred times — carries real obligations.
"""

[[annotation]]
id    = "ser-mod-0011"
file  = "src/ser/mod.rs"
lines = "224-233"
title = "Making the missing-impl error say something useful"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "traits", "msrv"]
prereqs = ["ser-mod-0010"]
body = """
`diagnostic::on_unimplemented` rewrites the compiler error a user sees when they
pass a type that does not implement `Serialize`. Instead of a bare trait-bound
failure, they get a message plus two suggestions: derive it for your own type,
or look for a `serde` feature flag on someone else's crate.

Two details reward attention.

The comment on line 227 explains the message text: it says
`serde::Serialize`, not `serde_core::Serialize`. Almost nobody depends on
serde_core directly, so naming it in an error would send people looking for a
crate they have never heard of. The split described in `docs/decisions.md` is
deliberately invisible here.

And the whole thing is wrapped in `cfg_attr(not(no_diagnostic_namespace), ...)`,
because the `diagnostic` namespace only stabilised in Rust 1.78. Same
build-script-probing trick as the `StdError` block: better errors on new
compilers, still compiles on old ones.
"""

[[annotation]]
id    = "ser-mod-0012"
file  = "src/ser/mod.rs"
lines = "234-268"
title = "One method, and the generic that makes it work"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["traits", "generic-params", "where-clauses", "associated-types", "monomorphization"]
examples = ["ok_and_error"]
prereqs = ["ser-mod-0010"]
body = """
The entire trait is this:

```rust
fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>
where
    S: Serializer;
```

Read the signature slowly, because four separate decisions are packed into it.

**`<S>` is generic, not `dyn Serializer`.** The method is monomorphised for each
format it is used with, so `serialize_field` calls compile down to direct calls
with no vtable. This is where "zero-cost" comes from — and also where compile
times go, since every (type, format) pair generates code.

**`serializer: S` is taken by value.** A `Serializer` is consumed by
serializing. That is what stops you from calling `serialize_bool` twice on the
same serializer and emitting two values where the format expected one. The type
system enforces the shape of the output.

**The return type is `S::Ok` and `S::Error`, not anything of `Serialize`'s
choosing.** The data structure does not decide what serialization produces or
how it fails; both come from the format. This is the associated-type mechanism
you will meet properly at line 364.

**`&self`.** Serializing observes, never consumes or mutates.

The doc example is unusually valuable: it is captioned "this is what
`#[derive(Serialize)]` would generate". The derive is not magic — it writes
`serialize_struct("Person", 3)`, one `serialize_field` per field, then `end()`.
Every derived impl you have ever used is that shape.
"""

[[annotation]]
id    = "ser-mod-0013"
file  = "src/ser/mod.rs"
lines = "269-283"
title = "The data model: 29 types, and why that number exists"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "01-why-a-data-model"
rust_features = ["traits"]
prereqs = ["ser-mod-0001"]
body = """
This is the most important paragraph in the crate.

Rust has an unbounded number of types. JSON has six. Postcard has its own set.
Connecting N data structures to M formats directly would need N times M pieces of
code, and every new format would have to understand every type in the ecosystem.

Serde's answer is an intermediate vocabulary of **29 types**. A `Serialize` impl
maps a Rust type *down* into that vocabulary; a `Serializer` maps the vocabulary
*out* into bytes. Neither side sees the other. N plus M instead of N times M.

Two sentences here are load-bearing:

> Each method of the `Serializer` trait corresponds to one of the types of the
> data model.

So the trait is not a grab-bag of convenience methods. It is the data model,
written as a trait. When you wonder why `Serializer` has so many methods, this is
the answer: it has exactly as many as the model has types.

> Implementations of `Serialize` map themselves into this data model by invoking
> **exactly one** of the `Serializer` methods.

Exactly one. Not zero, not two. That is an unenforced but real contract, and it
is the reason `serialize` takes the serializer by value — calling a second method
is impossible because the first one consumed it.
"""

[[annotation]]
id    = "ser-mod-0014"
file  = "src/ser/mod.rs"
lines = "284-340"
title = "The 29 types, and the shapes worth noticing"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "01-why-a-data-model"
rust_features = ["traits", "option", "strings"]
prereqs = ["ser-mod-0013"]
body = """
The full vocabulary. Rather than restate the list, here is what its *structure*
tells you.

**The model is Rust-shaped, not JSON-shaped.** It has `option`, `unit_struct`,
`newtype_variant`, `tuple_variant`. JSON has none of those concepts. Serde chose
to make the model expressive enough to describe Rust faithfully and to push the
lossy part into each format. That is why `serde_json` has to decide how to encode
an enum variant, and why different formats make different choices.

**Structs and enums each come in four flavours** — unit, newtype, tuple, and
struct-shaped — which is exactly Rust's syntax for declaring them. Eight of the
29 types exist purely to preserve that distinction.

**Named types carry their names.** `serialize_struct` receives `"Person"` even
though JSON will throw it away, because a self-describing format might want it.
The model records what the Rust type knew; discarding is the format's job.

**Some distinctions exist only for deserialization.** The note about strings and
byte arrays being "transient, owned, or borrowed" has no effect here — when
serializing, all strings are handled equally. It is a forward reference to the
`'de` lifetime machinery in `de/mod.rs`, and a hint that the two halves of the
model are not quite symmetric.

**`option` is in the model as a first-class type**, not encoded as "null or
value". This is why `Option<Option<T>>` can round-trip through formats that
support it, and why it collapses in formats that do not.
"""

[[annotation]]
id    = "ser-mod-0015"
file  = "src/ser/mod.rs"
lines = "341-354"
title = "Where to find a worked format, and one more diagnostic"
