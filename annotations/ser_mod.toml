A pointer to the website's worked JSON serializer, then the same
`diagnostic::on_unimplemented` treatment applied to `Serialize` at line 224 —
again spelling the path `serde::Serializer` rather than `serde_core::Serializer`
so error messages name the crate people actually depend on.

The message here is terser than `Serialize`'s: no "consider deriving" hint,
because you never derive a `Serializer`. Hitting this error means you passed
something that is not a data format where one was expected, and there is no
one-line fix to suggest.
"""

[[annotation]]
id    = "ser-mod-0016"
file  = "src/ser/mod.rs"
lines = "355-363"
title = "Serializer: Sized — the supertrait that rules out trait objects"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "02-traits-and-supertraits"
rust_features = ["traits", "supertraits", "sized-bound", "trait-objects", "monomorphization"]
prereqs = ["ser-mod-0012"]
body = """
`pub trait Serializer: Sized` — and that `Sized` is a decision, not boilerplate.

Traits are usable as `dyn Trait` only if they are object-safe, and requiring
`Self: Sized` deliberately gives that up. You cannot have a
`Box<dyn Serializer>`.

Why surrender it? Because nearly every method takes `self` **by value**. Passing
by value requires knowing the size at compile time, and consuming `self` is what
enforces "exactly one method call" from the previous annotation. Object safety
and by-value consumption are mutually exclusive here, and serde chose
consumption.

The consequence shows up in real code: you cannot store a heterogeneous
collection of serializers, and you cannot pick a format at runtime through this
trait. Crates that need that reach for `erased-serde`, which exists precisely to
rebuild an object-safe layer on top — at the cost of the boxing and dynamic
dispatch this line avoids.

The docs for `Ok` beginning on line 356 are worth reading before the declaration
itself, which follows.
"""

[[annotation]]
id    = "ser-mod-0017"
file  = "src/ser/mod.rs"
lines = "364-368"
title = "type Ok and type Error — the format chooses both"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["associated-types", "custom-errors"]
examples = ["ok_and_error"]
prereqs = ["ser-mod-0016"]
body = """
Two lines that carry the whole associated-type idea.

`type Ok` is what a successful serialization *produces*. The docs give the rule
of thumb: a format writing to a stream should set `Ok = ()` and accumulate into a
buffer it owns, because the output has already gone somewhere. A format building
an in-memory value — `serde_json::Value`, say — sets `Ok` to that value and
passes it back up.

The point is that **the format decides**, not serde and not the data structure.
`Serialize::serialize` returns `S::Ok`, whatever that turns out to be. The
attached example implements two serializers over the same values, one with
`Ok = String` and one with `Ok = usize`; neither the values nor their `Serialize`
impls can tell the difference.

`type Error: Error` is the same move on the failure path, with a bound: whatever
error type you choose must implement the `ser::Error` trait built by the macro at
line 130 — which means it must have `custom`, which means any `Serialize` impl
can construct one without knowing what it is.

An associated type rather than a generic parameter matters here. `Serializer<Ok>`
would let one type implement the trait many times with different `Ok`, and every
call site would need to say which. As an associated type, each format fixes one
answer and inference does the rest.
"""

[[annotation]]
id    = "ser-mod-0018"
file  = "src/ser/mod.rs"
lines = "369-409"
title = "Seven associated types for the seven compound shapes"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["associated-types", "generic-params", "zero-cost"]
prereqs = ["ser-mod-0017"]
body = """
Seven declarations in the same shape:

```rust
type SerializeSeq: SerializeSeq<Ok = Self::Ok, Error = Self::Error>;
```

Scalars finish in one call, but a sequence or a struct is serialized
incrementally: begin, then a field at a time, then end. Something has to hold the
partial state in between — how many elements so far, whether a comma is needed,
how deep the indentation is. These seven types are that state.

**The equality bounds are what make it typecheck.** `Ok = Self::Ok` and
`Error = Self::Error` say the half-finished sequence must eventually produce the
same output type, and fail with the same error type, as the serializer that
created it. Without them, `serializer.serialize_seq(...)?.end()` would return
some unrelated type and `Serialize::serialize` could not return it.

**Why seven rather than one.** Sequences, tuples, tuple structs, tuple variants,
maps, structs, and struct variants each get their own type and their own trait
(all defined lower in this file). A format is free to point several of them at
the same concrete type — most do — but it *may* distinguish them. A format that
writes struct field names but not tuple indices needs different state for each,
and this is what lets it have that without a runtime flag.

**Cost.** Seven associated types is the price of building this state machine in
the type system instead of at runtime. Nothing here allocates or branches; a
format that treats all seven identically compiles to exactly the code it would
have written by hand.

A format that supports none of them fills all seven with `Impossible` — the type
re-exported at line 116.
"""

[[annotation]]
id    = "ser-mod-0019"
file  = "src/ser/mod.rs"
lines = "410-427"
title = "serialize_bool — the shape every method follows"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "03-associated-types"
rust_features = ["traits", "associated-types"]
examples = ["ok_and_error"]
prereqs = ["ser-mod-0017"]
body = """
The first of the 29. Worth pausing on, because the next thirty methods are
variations on it:

```rust
fn serialize_bool(self, v: bool) -> Result<Self::Ok, Self::Error>;
```

`self` by value, the value by copy, `Self::Ok` out. No default body — a format
that cannot represent booleans still has to say so explicitly, by returning an
error.

The doc example is the actual `impl Serialize for bool` from `impls.rs`,
reproduced here so the two halves appear together: a bool describes itself by
calling `serialize_bool`, and a format answers by writing something.

Line 416 is a curiosity worth knowing about:

```rust
# serde_core::__private_serialize!();
```

The `#` hides it from rendered docs. It declares a local stand-in for the
`Serialize` trait so the example compiles inside serde_core, which — as the crate
split means — does not have `serde::Serialize` available to name. A small seam
where the architecture shows through into the documentation.
"""

[[annotation]]
id    = "ser-mod-0020"
file  = "src/ser/mod.rs"
lines = "428-530"
title = "i8 through i64 — four methods, one idea, and a delegation hint"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
prereqs = ["ser-mod-0019"]
body = """
Four required methods in identical shape, one per signed width, each with the
same doc example wired to its own type.

The line repeated in every one of these docs is the interesting part:

> If the format does not differentiate between `i8` and `i64`, a reasonable
> implementation would be to cast the value to `i64` and forward to
> `serialize_i64`.

That is Serde declining to make the choice for you. The data model has four
distinct signed integer types because *Rust* does, and a format that cares —
postcard, say, which varint-encodes and wants the narrowest representation — can
use the distinction. A format that does not care collapses them in three lines.

Serde could have offered default bodies that forward to `serialize_i64` and
saved every format author some typing. It deliberately does not, because a
default would silently make width-preserving formats lossy. Requiring the method
means the decision is made on purpose. The scalar serializer in the attached
example takes the forwarding option, and the forwarding is visible in its source
rather than inherited invisibly.

Note that `isize` is absent from the model. `impls.rs` serializes it as `i64`,
because a type whose width depends on the target platform cannot be part of a
portable wire format.
"""

[[annotation]]
id    = "ser-mod-0021"
file  = "src/ser/mod.rs"
lines = "531-535"
title = "serialize_i128 — the one integer with a default body, and why"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "05-default-methods"
rust_features = ["default-methods", "traits", "msrv"]
examples = ["default_methods"]
prereqs = ["ser-mod-0020"]
body = """
Every other integer method is required. This one has a body:

```rust
fn serialize_i128(self, v: i128) -> Result<Self::Ok, Self::Error> {
    let _ = v;
    Err(Error::custom("i128 is not supported"))
}
```

The reason is backward compatibility, and it is a good lesson in what a frozen
API costs. `Serializer` shipped before 128-bit integers were usable in stable
Rust. Adding a *required* method to a public trait breaks every existing
implementation, and serde 1.0 promises never to do that. Adding one with a
default body breaks nothing: formats written before `i128` existed keep
compiling, and simply report that they do not support it.

So the default is not a convenience. It is the only shape this addition could
take.

`let _ = v;` silences the unused-parameter warning without renaming the argument
to `_v`, which would degrade the rendered documentation and the IDE hint. A tiny
courtesy, repeated at line 638 for `u128`.

The cost is that the failure is now at runtime rather than compile time. A format
that forgot to implement `serialize_i128` looks fine until someone serializes an
`i128` and gets "i128 is not supported". That is the price of not breaking the
ecosystem, and serde paid it deliberately.
"""

[[annotation]]
id    = "ser-mod-0022"
file  = "src/ser/mod.rs"
lines = "536-637"
title = "u8 through u64 — the unsigned mirror"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
prereqs = ["ser-mod-0020"]
body = """
The signed block reflected, method for method and doc for doc, with the same
cast-and-forward suggestion.

The symmetry is worth a moment. Nothing forces the data model to treat signed and
unsigned separately — a model could carry one integer type plus a sign, or a
single `i128` that everything widens into. Serde keeps ten distinct integer
types because collapsing them would either lose information a format might want,
or force every format to reconstruct it.

`usize`, like `isize`, is not in the model. `impls.rs` serializes it as `u64`.

If this is starting to feel repetitive, that is the honest shape of the file: ten
integer methods, and shortly two float methods, all structurally identical.
`src/ser/impls.rs` handles the same repetition with a macro. The trait cannot,
because each method needs its own name and its own documentation — and rustdoc
does not expand macros for you.
"""

[[annotation]]
id    = "ser-mod-0023"
