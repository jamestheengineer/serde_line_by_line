[[annotation]]
id    = "ser-impls-0010"
file  = "src/ser/impls.rs"
lines = "37-48"
title = "str — the impl that proves Serialize has no Sized bound"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "02-traits-and-supertraits"
rust_features = ["sized-bound", "traits"]
prereqs = ["ser-mod-0010", "ser-mod-0026"]
body = """
`impl Serialize for str` — not `&str`, not `String`. `str` is unsized: you can
never hold one, only borrow one. This impl exists because `Serialize` was
declared without a `Sized` supertrait, and this is where that restraint gets
spent.

The payoff shows up two ways. `&str` gets an impl for free from the blanket
`impl<'a, T> Serialize for &'a T where T: ?Sized + Serialize` further down, and
`String` gets one by deref coercion. Had `Serialize` required `Sized`, both would have needed
hand-written impls that duplicate this body, and every other unsized type —
`[T]`, `CStr`, `Path`, `OsStr` — would have needed the same treatment.

No `#[cfg]` on this one. `str` is a language primitive, available in the barest
`no_std` build, so there is nothing to gate.
"""

[[annotation]]
id    = "ser-impls-0011"
file  = "src/ser/impls.rs"
lines = "49-60"
title = "String — the same body, reached by deref coercion"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "no-std", "strings", "smart-pointers"]
prereqs = ["ser-impls-0010"]
body = """
Byte for byte the same body as `str` above, and that is not duplication — it is
deref coercion. `self` here is a `&String`, `serialize_str` wants a `&str`, and
the compiler inserts the `Deref` call at the call site. Nothing in this impl
mentions `str` at all.

The two attributes are the interesting part. `#[cfg(any(feature = "std", feature
= "alloc"))]` gates the impl on `String` existing, since it comes from `alloc`.
`#[cfg_attr(docsrs, doc(cfg(...)))]` is the paired half: it makes docs.rs print
the little "Available on crate features std or alloc" banner. Every gated item
in this crate carries both, one for the compiler and one for the reader, and
forgetting the second is invisible until someone reads the docs and cannot work
out why the impl they need is missing.
"""

[[annotation]]
id    = "ser-impls-0012"
file  = "src/ser/impls.rs"
lines = "61-69"
title = "fmt::Arguments — serializing a format that has not happened yet"
kind  = "impl"
tracks = ["reference"]
rust_features = ["lifetimes", "no-std", "strings"]
examples = ["collect_str"]
prereqs = ["ser-mod-0040"]
body = """
`fmt::Arguments<'a>` is what `format_args!("{x} of {y}")` evaluates to: the
format string plus borrowed references to the arguments, with no formatting
performed and nothing allocated. The `'a` is those borrows, which is why the
impl needs a lifetime parameter it never names again.

Serializing one calls `collect_str`, whose whole reason for existing is this
case — render a `Display` value straight into the output without building a
`String` first. In a `std` build it takes the allocating shortcut; in `no_std`
it cannot, and does the harder thing instead.

So `serializer.collect_str(&format_args!(...))` is the no-allocation way to
serialize computed text, and this nine-line impl is what makes it work.
"""

[[annotation]]
id    = "ser-impls-0013"
file  = "src/ser/impls.rs"
lines = "70-95"
title = "CStr and CString — bytes, minus the terminator"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "msrv", "no-std", "strings"]
prereqs = ["ser-mod-0027", "ser-mod-0007"]
body = """
Two impls, one idea: a C string goes out as `serialize_bytes`, not as a string.
It has no UTF-8 guarantee, so `serialize_str` is not available to it.

`to_bytes()` **excludes the trailing nul**. What lands in the output is the
content only, and the deserializer is responsible for putting the terminator
back. That is the right call — the nul is a representation detail of the C ABI,
not part of the value — but it is worth knowing before you diff two encodings
and wonder where the byte went.

The `#[cfg]`s are the most intricate so far, and `no_core_cstr` is not a Cargo
feature. It is set by this crate's `build.rs` when the compiler is older than
1.64, the release that moved `CStr` into `core` and `CString` into `alloc`. So
`any(feature = "std", not(no_core_cstr))` reads as: *`std` is on, or the
toolchain is new enough that `core` has this type.* `CString` adds
`feature = "alloc"` on top, because it owns its buffer and `CStr` does not.

This is the version-detecting build script pattern in practice — the crate keeps
an MSRV of 1.56 while still offering everything a modern toolchain can support,
and no user has to configure anything.
"""

[[annotation]]
id    = "ser-impls-0014"
file  = "src/ser/impls.rs"
lines = "96-113"
title = "Option<T> — the first impl with a decision in it"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["option", "pattern-matching", "borrowing", "generic-params"]
prereqs = ["ser-mod-0028"]
body = """
Everything up to here forwarded a value. This one branches, and it is the first
impl where the data model's shape shows through: `Option` is not encoded as an
enum with two variants, it gets `serialize_some` and `serialize_none` of its
own, so formats can render absence natively — a JSON `null`, a missing key, a
protobuf optional field.

`match *self { Some(ref value) => ... }` is worth a second look. Dereferencing
`self` would move the `T` out of the borrow, so the `ref` binds a reference
instead. Written today you would say `match self { Some(value) => ... }` and let
default binding modes — "match ergonomics", stable since Rust 1.26 — do it for
you. This crate predates that and keeps the explicit form, which you will see
throughout serde and in a lot of code from the same era.

`T: Serialize` is required here and it is not optional: `serialize_some` takes
the inner value, so there genuinely is something to serialize.
"""

[[annotation]]
id    = "ser-impls-0015"
file  = "src/ser/impls.rs"
lines = "114-128"
title = "PhantomData — a type with no value, given a name anyway"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "09-phantomdata-and-variance"
rust_features = ["marker-types", "sized-bound", "generic-params"]
prereqs = ["ser-mod-0029"]
body = """
`PhantomData<T>` holds nothing, occupies no bytes, and exists only to tell the
compiler that a type behaves as though it contained a `T`. Serializing it emits
`serialize_unit_struct("PhantomData")` — the empty value, plus a name.

Two details in three lines of signature:

`T: ?Sized`, so `PhantomData<[u8]>` and `PhantomData<dyn Error>` work. There is
no value of type `T` anywhere near this code, so no reason to demand one be
sizeable.

And no `T: Serialize` bound. `PhantomData<NotSerializable>` serializes fine,
which matters more than it sounds: a struct with a phantom type parameter would
otherwise drag a bound onto every derive that touches it.

The name string is what a self-describing format writes. Most formats treat a
unit struct as nothing at all, so it usually disappears — but the model records
it, on the principle that a distinction not recorded cannot be recovered.
"""

[[annotation]]
id    = "ser-impls-0016"
file  = "src/ser/impls.rs"
lines = "129-141"
title = "[T; 0] — the special case whose bound is deliberately missing"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "result"]
prereqs = ["ser-mod-0034"]
body = """
The upstream comment says it: *does not require `T: Serialize`*. An empty array
has no elements to serialize, so demanding the bound would reject
`[Unserializable; 0]` for no reason anyone could act on. Every other length,
generated by the macro just below, does require it.

Note the destination: `serialize_tuple(0)`, not `serialize_seq`. Arrays have a
length fixed at compile time, so they go to the model's tuple methods and a
format is free to omit the count from the output entirely.

This is also the first `tri!` in the file. It is serde's own `?`, defined in
`crate_root.rs` for one reason recorded in a comment there: none of this crate's
error handling needs the `From::from` conversion that `?` performs, and skipping
it measured 9% faster to compile than `?` and 5.5% faster than the old `try!`.
On a crate that monomorphizes into every project in the ecosystem, that is a
real number rather than a micro-optimization.
"""

[[annotation]]
id    = "ser-impls-0017"
file  = "src/ser/impls.rs"
lines = "142-165"
title = "array_impls! — thirty-two lengths, before const generics"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "generic-params", "iterators"]
prereqs = ["ser-impls-0002", "ser-mod-0043"]
body = """
`($($len:tt)+)` — token trees again, but with `+` rather than `*`: one or more,
so an empty invocation is a compile error instead of a silent no-op.

The body is a real one this time, not a forward. It opens a tuple of the array's
length, iterates, and ends. Note `for e in self`: `self` is a `&[T; $len]`, and
iterating a reference to an array yields `&T`, so `serialize_element(e)` gets a
reference and the array is never consumed.

**Why thirty-two impls and not one.** Const generics —
`impl<T, const N: usize> Serialize for [T; N]` — have been stable since Rust
1.51, and this crate's MSRV is 1.56, so the usual explanation does not apply
here. The obstacle is the impl directly above: `[T; 0]` deliberately omits the
`T: Serialize` bound, and a single const-generic impl cannot vary its bounds
depending on `N`. Collapsing these thirty-two would mean putting a bound on the
empty array that is not there today, which is a breaking change for anyone whose
struct holds a `[SomethingUnserializable; 0]`.

So the pre-const-generics shape survives, not because the language cannot
express the general case, but because the general case is very slightly wrong.
"""

[[annotation]]
id    = "ser-impls-0018"
file  = "src/ser/impls.rs"
lines = "166-171"
title = "01 … 32 → thirty-two impls, laid out in a grid"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-repetition"]
macro_def = "ser-impls-0017"
body = """
One invocation, thirty-two expansions, arranged ten to a row so a human can
count them.

The leading zeros are why the columns line up, and they are harmless: `01` is a
decimal literal equal to `1`, and `[T; 01]` is the same type as `[T; 1]`.
Passing the lengths as `tt` is what allows it — the tokens go through verbatim,
so the formatting choice never has to survive being parsed as anything.
"""

[[annotation]]
id    = "ser-impls-0019"
file  = "src/ser/impls.rs"
lines = "172-186"
title = "[T] — one line, and the shape six collections copy"
kind  = "impl"
tracks = ["reference"]
rust_features = ["sized-bound", "iterators", "blanket-impls"]
prereqs = ["ser-mod-0038", "ser-impls-0010"]
body = """
A slice is unsized and has a length known only at run time, so unlike the arrays
above it goes to `collect_seq` rather than to the tuple methods.

`collect_seq(self)` does a surprising amount of work for one line. It takes
anything `IntoIterator`, and `&[T]` iterates as `&T`, which is `Serialize`
whenever `T` is. Inside, it opens a sequence with a length hint, forwards every
element, and ends — the whole loop from `array_impls!` above, written once in
`ser/mod.rs` instead of inlined here.

Remember this body. The next six collection impls are this exact line, and the
macro below exists only because their type names and feature gates differ.
"""

[[annotation]]
id    = "ser-impls-0020"
file  = "src/ser/impls.rs"
lines = "187-208"
title = "seq_impl! — where the caller supplies the attributes"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "cfg", "generic-params", "where-clauses"]
prereqs = ["ser-impls-0002"]
body = """
A different macro technique from `primitive_impl!`, and the more useful one to
learn.

**`$(#[$attr:meta])*` puts the `#[cfg]`s at the call site.** The macro body has
no idea which features gate which collection; each invocation carries its own
attributes and the transcriber pastes them back on. Six collections, six
different feature requirements, one body. The alternative — teaching the macro
about `std` versus `alloc` — would have meant a matcher branch per gate.

**The matcher mimics the syntax it generates.** `$ty:ident <T $(, $typaram:ident
: $bound:ident)*>` has literal `<`, `>`, and `,` tokens in it, so an invocation
reads like the type it produces: `HashSet<T, H: BuildHasher>`. The optional
repetition then fans out into two places in the body — `impl<T $(, $typaram)*>`
and `for $ty<T $(, $typaram)*>` — which is the thing a macro can do that a
generic function cannot.

`$bound:ident` is a single identifier, so `BuildHasher` matches and
`core::hash::BuildHasher` would not. Nothing here needs the general case, and
the narrow fragment keeps the matcher honest about it.

Now look for `$bound` in the transcriber. It is not there. The bound is matched
and discarded — the generated impl's only `where` clause is `T: Serialize`. See
`map_impl!` below, which takes the same idea considerably further.

The body itself is one line, identical to the slice impl above.
"""

[[annotation]]
id    = "ser-impls-0021"
file  = "src/ser/impls.rs"
lines = "209-220"
title = "BinaryHeap, BTreeSet → two orderings, one body"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["collections", "iterators"]
macro_def = "ser-impls-0020"
body = """
Both expand to `collect_seq(self)`, and both therefore emit whatever order their
iterator produces — which is where they differ sharply.

`BTreeSet` iterates in sorted order, so its encoding is deterministic and
diffable. `BinaryHeap::iter` is documented as **arbitrary order** and guarantees
nothing beyond that — in practice it walks the backing array, which the sift
operations leave in whatever shape the insertion sequence produced. Two heaps
holding equal sets can serialize to different sequences. Nothing here is wrong, but if you are hashing or comparing
serialized output, a `BinaryHeap` field will surprise you.
"""

[[annotation]]
id    = "ser-impls-0022"
file  = "src/ser/impls.rs"
lines = "221-226"
title = "HashSet → the invocation with the extra type parameter"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["collections", "generic-params"]
macro_def = "ser-impls-0020"
body = """
The one call that uses the optional part of the matcher. `HashSet<T, H:
BuildHasher>` passes a second type parameter and its bound, and the macro fans
it out into both the impl generics and the type being implemented — so a
`HashSet` with a custom hasher serializes exactly like one with the default.

It is also the only entry here gated on `std` alone rather than `std` or
`alloc`, because `HashSet` lives in `std`.

Its iteration order is not merely unspecified, it is randomized per process by
`RandomState`. The same program serializing the same set twice can produce two
different sequences. `BTreeSet` is the one to reach for when the output has to
be stable.
"""

[[annotation]]
id    = "ser-impls-0023"
file  = "src/ser/impls.rs"
lines = "227-244"
title = "LinkedList, Vec, VecDeque → nothing left to distinguish"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["collections"]
macro_def = "ser-impls-0020"
prereqs = ["ser-impls-0007"]
body = """
Three ordered sequences, three identical expansions, gated identically on `std`
or `alloc`. There is genuinely nothing to say about them individually, which is
the macro doing its job.

`Vec<T>` is the one that carries the traffic, and its one trap is upstream of
here: `Vec<u8>` takes this path like any other `Vec`, so a byte buffer goes out
as a sequence of numbers rather than as a byte string. Nothing in this
invocation could change that — the impl is chosen by the type, and `u8` is not
special to it.
"""

[[annotation]]
id    = "ser-impls-0024"
file  = "src/ser/impls.rs"
lines = "245-261"
title = "Range — a std type serialized as if it were derived"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "modules", "where-clauses"]
prereqs = ["ser-mod-0036"]
body = """
`1..5` goes out as a two-field struct named `Range`, with fields `start` and
`end` — exactly what `#[derive(Serialize)]` would have produced if `Range` were
serde's type to annotate. In JSON that is `{"start":1,"end":5}`, not `[1,5]` and
not `"1..5"`.

`use super::SerializeStruct;` inside the function body is the detail to notice.
`state.serialize_field(...)` and `state.end()` are trait methods, so the trait
has to be in scope to call them — the same rule that put `Error` and
`SerializeTuple` in this file's header. Here it is scoped to the one function
that needs it instead, which keeps the top of the file honest about what the
file as a whole depends on. Four more impls below repeat the same line for the
same reason.

The `2` passed to `serialize_struct` is the field count, promised up front so a
format that needs to write a length prefix can.
"""

[[annotation]]
id    = "ser-impls-0025"
file  = "src/ser/impls.rs"
lines = "262-278"
title = "RangeFrom — the same thing with one field"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params"]
prereqs = ["ser-impls-0024"]
body = """
`5..` is a one-field struct named `RangeFrom`. Nothing new happens here.

What is worth noticing is that it is written out by hand. Four range types get
four near-identical impls across seventy lines, differing only in the type name,
the field count, and which fields exist — precisely the shape that `seq_impl!`
and `map_impl!` use a macro for elsewhere in this file. The line where upstream
stops reaching for a macro is somewhere between four impls and six, and there is
no rule about it beyond what stays readable.
"""

[[annotation]]
id    = "ser-impls-0026"
file  = "src/ser/impls.rs"
lines = "279-296"
title = "RangeInclusive — accessors, and a flag that does not survive"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "visibility"]
prereqs = ["ser-impls-0024"]
body = """
The only range impl that calls methods — `&self.start()` and `&self.end()` —
rather than reading fields, because `RangeInclusive`'s fields are private.

They are private for a reason that matters here. Alongside `start` and `end`,
`RangeInclusive` carries a hidden flag recording whether iteration has finished.
It has to: `1..=u8::MAX` cannot signal completion by advancing past its end
without overflowing, so the type tracks exhaustion separately.

That flag is not among the two fields written out. A `RangeInclusive` that has
been iterated to completion serializes identically to a fresh one, and comes
back as a fresh one. For the overwhelmingly common case — a range used as a
value, not as a half-consumed iterator — this is exactly right. It is only a
trap if you were treating a partly-consumed range as state worth saving.
"""

[[annotation]]
id    = "ser-impls-0027"
file  = "src/ser/impls.rs"
lines = "297-313"
title = "RangeTo — and the two range types that are missing"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params"]
prereqs = ["ser-impls-0024"]
body = """
`..5` is a one-field struct named `RangeTo`. The last of the four.

Count what is not here: `RangeFull` (`..`) and `RangeToInclusive` (`..=5`) have
no `Serialize` impls in this crate, and the facade in `crate_root.rs` does not
even import them. `RangeFull` is a unit struct carrying no information, so an
impl would be pure ceremony; `RangeToInclusive` is a plain omission that nobody
has needed enough to ask for.

That asymmetry is a fair sample of how this file grew. It is not a systematic
sweep of `core` and `std` — it is every type someone had a reason to serialize,
added when they had the reason.
"""

[[annotation]]
id    = "ser-impls-0028"
file  = "src/ser/impls.rs"
lines = "314-335"
title = "Bound — the first enum, and the indices you must not renumber"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["pattern-matching", "generic-params", "borrowing"]
prereqs = ["ser-mod-0030", "ser-mod-0032"]
body = """
The first enum in the file, and the clearest look at how the data model handles
one. Each arm names the enum, the variant's **index**, and the variant's name.
An empty variant uses `serialize_unit_variant`; a variant wrapping one value
uses `serialize_newtype_variant`. This is precisely what `serde_derive` emits
for any enum you write, so reading it here is reading the generated code you
usually never see.

The literal `0`, `1`, `2` are the thing to be careful about. Formats that encode
variants compactly write the index instead of the name, so the numbers are part
of the wire format. Reordering `Bound`'s variants — or inserting one in the
middle — would silently change the meaning of previously written data. The names
are safe to read; the numbers are a compatibility commitment.

`ref value` again, for the same reason as `Option`: `*self` would move the `T`
out of a borrow.
"""

[[annotation]]
id    = "ser-impls-0029"
file  = "src/ser/impls.rs"
lines = "336-358"
title = "() and ! — one value and no values, both trivial"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "pattern-matching", "zero-cost"]
prereqs = ["ser-mod-0029"]
body = """
Two impls that are trivial for opposite reasons.

`()` has exactly one value, so there is nothing to write down — knowing the type
tells you the value. `serialize_unit()` records the fact that something was
there.

`!` has *no* values, and the body is the one-liner `*self`. That is not a typo
and it is not returning anything: `self` is a `&!`, so `*self` is an expression
of type `!`, which means evaluating it diverges. Rust lets a `!` expression
coerce to any type, so it type-checks as the `Result` the signature promises,
and the code is unreachable because a caller can never obtain a `!` to call it
on. The impl exists so that a generic type parameter instantiated with `!`
still satisfies `Serialize`.

It sits behind `feature = "unstable"` because `!` is still not a stable type in
Rust — the only nightly-only item in this file.
"""

[[annotation]]
id    = "ser-impls-0030"
file  = "src/ser/impls.rs"
lines = "359-374"
title = "tuple_impls! — nested repetition, and a macro that calls a macro"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "generic-params", "where-clauses"]
prereqs = ["ser-impls-0017"]
body = """
The matcher is the most structured in the crate:

```rust
($($len:expr => ($($n:tt $name:ident)+))+)
```

Two levels of repetition. The outer `$(...)+` runs once per tuple length; the
inner one runs once per element within that length, pairing a field index with a
type-parameter name. `2 => (0 T0 1 T1)` reads as "arity two, whose elements are
field `0` of type `T0` and field `1` of type `T1`".

Both levels fan out in the body. `impl<$($name),+>` becomes `impl<T0, T1>`,
`($($name,)+)` becomes `(T0, T1,)`, and `$($name: Serialize,)+` becomes the
where clause. Three different separators for three different positions —
commas between generic parameters, a trailing comma inside the tuple type,
newline-ish for the bounds — all driven by one match.

That trailing comma matters: `(T0,)` is a one-element tuple and `(T0)` is just
`T0` in parentheses. Emitting the comma unconditionally makes the expansion
correct at every arity.

`#[cfg_attr(docsrs, doc(hidden))]` hides all fifteen impls from the rendered
docs — see the hand-written one-tuple below for what replaces them.

Then the body: `tuple_impl_body!($len => ($($n)+));`. A macro invoking another
macro, which is how the one-tuple impl gets the identical body without going
through this matcher at all.
"""

[[annotation]]
id    = "ser-impls-0031"
file  = "src/ser/impls.rs"
lines = "375-390"
title = "tuple_impl_body! — a macro that expands to a trait method"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "zero-cost", "inlining"]
prereqs = ["ser-impls-0030"]
body = """
This one expands to an `fn`, not to an item — it is invoked *inside* an impl
block, in the position where a method would be written. `macro_rules!` can be
called anywhere an item is allowed, and a trait method is an item, so this
works. It is not a common placement and it is worth recognising when you meet
it.

`&self.$n` is why the index is a `tt`. Tuple field access needs a bare token
after the dot; a fragment matched as `expr` or `literal` becomes a single opaque
AST node, and `self.<opaque>` does not parse. This is the same transparency
argument as `primitive_impl!`'s `$($cast:tt)*`, in a different disguise, and it
is the reason `tt` shows up so often in real macros.

The repetition unrolls the element loop at compile time. A sixteen-element tuple
does not iterate — it produces sixteen straight-line `serialize_element` calls
with no counter, no bounds check, and no branch. Combined with `#[inline]`, a
tuple of primitives can compile down to a handful of instructions.

Only two things vary between the sixteen impls: the length passed to
`serialize_tuple`, and how many calls follow it.
"""

[[annotation]]
id    = "ser-impls-0032"
file  = "src/ser/impls.rs"
lines = "391-402"
title = "(T,) → hand-written, so rustdoc can tell one story instead of sixteen"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-rules", "cfg"]
macro_def = "ser-impls-0031"
body = """
The one-tuple gets its own impl block purely so it can carry two rustdoc
attributes, then borrows the body from `tuple_impl_body!` like all the others.

`doc(fake_variadic)` is an unstable rustdoc feature that renders a family of
tuple impls as a single entry — `impl Serialize for (T₁, T₂, …, Tₙ)` — instead
of listing every arity. It attaches to the one-element impl; the rest are
`doc(hidden)` from the macro above, so they vanish from the page. The second
attribute supplies the sentence that goes with it.

Without this, the `Serialize` documentation would open with sixteen
indistinguishable tuple impls before reaching anything a reader came for. Six
lines of attributes to fix that is a good trade, and it is why the one-tuple
looks anomalous in the source.
"""

[[annotation]]
id    = "ser-impls-0033"
file  = "src/ser/impls.rs"
lines = "403-420"
title = "2 … 16 → fifteen tuple impls, and the ceiling"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-repetition", "monomorphization"]
macro_def = "ser-impls-0030"
body = """
Fifteen lines, each one arity wider than the last, ending at sixteen. Together
with the one-tuple above that is every tuple serde can handle.

Seventeen is not a language limit — tuples have no maximum arity in Rust. It is
a cost decision. Each arity is a distinct impl with its own generic parameters,
and every one of them is parsed, expanded, and type-checked in every crate that
depends on serde, whether or not any tuple is used. Sixteen is the conventional
stopping point across the ecosystem, and the reason a nineteen-element tuple
fails to serialize with a missing-impl error rather than working slowly.

If you need one, the answer is the same as it has always been: give it a name
and derive on it.
"""

[[annotation]]
id    = "ser-impls-0034"
file  = "src/ser/impls.rs"
lines = "421-444"
title = "map_impl! — an elaborate matcher whose bounds are decoration"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "where-clauses", "generic-params", "collections"]
prereqs = ["ser-impls-0020", "ser-mod-0039"]
body = """
The matcher:

```rust
$ty:ident <K $(: $kbound1:ident $(+ $kbound2:ident)*)*, V $(, $typaram:ident : $bound:ident)*>
```

Nested optional repetitions, so the key's bounds can be absent, a single trait,
or a `+`-separated list. It accepts `BTreeMap<K: Ord, V>` and
`HashMap<K: Eq + Hash, V, H: BuildHasher>` from the same rule.

Now look for `$kbound1`, `$kbound2`, or `$bound` in the body. **None of them are
there.** Every bound the matcher works so hard to capture is discarded, and the
generated impl says only `K: Serialize, V: Serialize`.

That is not an oversight. `BTreeMap<K, V>` as a *type* carries no bounds — `Ord`
is required by the methods that insert and look up, not by the struct — so an
impl that never touches a key beyond handing it to `collect_map` does not need
it. The bounds are in the matcher so each invocation reads like the type's real
declaration, which is a legitimate use of a macro: the call site documents
itself, and the transcriber ignores what it does not need.

The cost is that the matcher is now three times the size of the body it guards.
Worth knowing before you copy this pattern — you are paying complexity for
readability at the call site, and there are only two call sites.
"""

[[annotation]]
id    = "ser-impls-0035"
file  = "src/ser/impls.rs"
lines = "445-451"
title = "BTreeMap → sorted keys, stable output"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["collections"]
macro_def = "ser-impls-0034"
body = """
`collect_map(self)` over an iterator that yields keys in sorted order, so the
encoding is deterministic: the same map always produces the same bytes. That
property is what you want for content hashes, golden-file tests, and anything
that gets diffed.
"""

[[annotation]]
id    = "ser-impls-0036"
file  = "src/ser/impls.rs"
lines = "452-457"
title = "HashMap → three type parameters, and unordered output"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["collections", "generic-params"]
macro_def = "ser-impls-0034"
prereqs = ["ser-impls-0022"]
body = """
The invocation that exercises the whole matcher: a key with two bounds, a value,
and a hasher parameter with a bound of its own. All four bounds are discarded in
expansion; what survives is `impl<K, V, H> Serialize for HashMap<K, V, H> where
K: Serialize, V: Serialize`.

Iteration order is randomized per process, so a `HashMap` serializes to a
different key order on every run. Reach for `BTreeMap` when the bytes have to
be reproducible.

One thing this impl cannot help with: nothing here requires the key to be a
*string*. `K: Serialize` is satisfied by any serializable type, so
`HashMap<MyStruct, V>` compiles — and then fails at run time in a format like
JSON, whose keys can only be strings. The model permits arbitrary keys; whether
they can be written is the format's call, and you find out when you run it.
"""

[[annotation]]
id    = "ser-impls-0037"
file  = "src/ser/impls.rs"
lines = "458-476"
title = "deref_impl! — the macro that refuses to parse its input"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "smart-pointers", "sized-bound", "borrowing"]
prereqs = ["ser-impls-0034"]
body = """
Put this next to `map_impl!` above. They solve the same problem — generate an
impl whose header varies — and they take opposite approaches.

`map_impl!` parses the header into fragments: a type name, key bounds, value,
extra parameters. `deref_impl!` parses nothing. Its matcher is a literal `<`
followed by `$($desc:tt)+`, which swallows the entire rest of the invocation as
raw tokens and pastes it back after the word `impl`. The generics, the trait,
the type, the `where` clause — the call site writes all of it, and the macro
contributes only the opening brace and the body.

That is why the invocations below read exactly like impl headers with the `{`
left off. It also means the macro cannot inspect what it was given, cannot
validate it, and cannot generate anything conditional on it. A malformed
invocation produces an error pointing at the expansion rather than at the
mistake. The trade is deliberate: six impls whose headers have nothing in common
beyond starting with `<`.

**The body is the semantic point.** `(**self).serialize(serializer)` — `self` is
a `&Self`, one deref reaches the smart pointer, the second reaches through it to
the pointee. Every type here is therefore **transparent on the wire**: a
`Box<u32>` serializes as `32`, not as a wrapper around it. There is no tag, no
indirection, nothing in the output to indicate a pointer was ever involved.

`T: ?Sized` on every invocation is what admits `Box<str>`, `Rc<[u8]>`, and
`Cow<'_, str>`.
"""

[[annotation]]
id    = "ser-impls-0038"
file  = "src/ser/impls.rs"
lines = "477-485"
title = "&T and &mut T → why you can serialize a reference to anything"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["borrowing", "lifetimes", "blanket-impls", "sized-bound"]
macro_def = "ser-impls-0037"
body = """
The two impls the rest of serde quietly depends on. `&T: Serialize` whenever
`T: Serialize` is what lets `collect_seq` hand `&T` items to the serializer,
what gives `&str` and `&[u8]` their impls from the unsized `str` and `[T]` ones,
and what makes `(&a, &b)` work as a tuple.

They also compose without limit: `&&&T` picks up the impl three times over, each
layer stripping one reference in the body.

`&mut T` is here for completeness rather than for a use case — serializing does
not need mutable access — but leaving it out would make generic code that
happens to hold a `&mut` fail for no reason a caller could act on.
"""

[[annotation]]
id    = "ser-impls-0039"
file  = "src/ser/impls.rs"
lines = "486-491"
title = "Box<T> → the wrapper that leaves no trace"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["smart-pointers", "sized-bound"]
macro_def = "ser-impls-0037"
body = """
`Box<T>` serializes as `T`. Boxing a field to break a recursive type or to move
a large value off the stack changes nothing about the encoding, which is what
you want — the indirection is a Rust-side representation choice, not part of the
data.

`?Sized` matters here: `Box<str>` and `Box<[u8]>` are real types worth
serializing, and both borrow their impls from the unsized cases earlier in the
file.
"""

[[annotation]]
id    = "ser-impls-0040"
file  = "src/ser/impls.rs"
lines = "492-519"
title = "Rc<T> and Arc<T> → shared once, written every time"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["smart-pointers", "cfg"]
macro_def = "ser-impls-0037"
body = """
The two invocations that carry documentation, and the warning in it is the most
consequential sentence in this file.

Sharing does not survive serialization. A graph where one `Rc` is referenced
from ten places serializes as **ten copies** of its contents. Deserializing that
gives ten separate allocations, not one shared node. For a genuinely shared
subgraph this is a size explosion; for a cyclic one it does not terminate at all.

Note how the documentation gets here. `$(#[$attr:meta])*` in the matcher accepts
doc comments as well as `#[cfg]`s — a `///` line is `#[doc = "..."]` to the
parser — so the prose is supplied at the call site and pasted onto the generated
impl. One capture, doing two jobs.

Both are gated on `feature = "rc"`, which is **off by default**. That is
unusual: serde's features are otherwise additive conveniences, and this one is a
deliberate speed bump. You have to ask for reference-counted serialization, and
the doc link tells you what you are asking for before you get it.
"""

[[annotation]]
id    = "ser-impls-0041"
file  = "src/ser/impls.rs"
lines = "520-525"
title = "Cow<'a, T> → borrowed or owned, indistinguishable on the wire"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["smart-pointers", "lifetimes", "strings"]
macro_def = "ser-impls-0037"
body = """
The last deref impl, and the one with an extra bound: `T: ?Sized + Serialize +
ToOwned`, since `Cow` is defined in terms of `ToOwned`.

`(**self)` reaches the `T` whichever variant is live, so `Cow::Borrowed("hi")`
and `Cow::Owned(String::from("hi"))` produce identical output. The variant is a
statement about who owns the memory, and that is not information the data model
carries.

Worth holding on to for the deserialize side, where `Cow` is the whole point:
`'de` exists so a deserializer can hand back borrowed data when the input allows
it and owned data when it does not.
"""

[[annotation]]
id    = "ser-impls-0042"
file  = "src/ser/impls.rs"
lines = "526-566"
title = "Weak — upgrade first, and a dead reference becomes null"
kind  = "impl"
tracks = ["reference"]
rust_features = ["smart-pointers", "option", "cfg"]
prereqs = ["ser-impls-0040", "ser-impls-0014"]
body = """
`RcWeak` and `ArcWeak` cannot use `deref_impl!`, because there may be nothing to
deref to. Instead: `self.upgrade().serialize(serializer)`.

`upgrade()` returns an `Option`, so these two impls route straight into the
`Option` impl from earlier. A live weak reference serializes as its contents; a
dead one serializes as `None` — a JSON `null`.

That makes the output depend on the strong count at the instant of serialization
rather than on the value alone. Serialize the same structure twice with a drop
in between and you get two different documents, legitimately. It is the correct
answer — there is nothing else a dead `Weak` could mean — but it is the only
place in this file where the same value can serialize two different ways.

These are the two impls with the longest attribute stacks in the crate: a doc
comment, a three-clause `#[cfg]`, and a `cfg_attr` repeating it for docs.rs,
spread over eight lines before the impl even begins. That is what feature-gating
costs when a type needs `rc` *and* an allocator.
"""

[[annotation]]
id    = "ser-impls-0043"
file  = "src/ser/impls.rs"
lines = "567-583"
title = "nonzero_integers! — and the comma that must be trailing"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "11-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "marker-types"]
prereqs = ["ser-impls-0002"]
body = """
The smallest macro in the file, and it teaches one precise thing about
repetition syntax.

The matcher is `($($T:ident,)+)`: the comma is **inside** the repetition. That
makes it a terminator, so every element including the last must be followed by
one, and the invocation below has to end with a trailing comma. Write it as
`$($T:ident),+` instead — comma as a *separator* — and the opposite rule
applies: commas between elements only, and a trailing one is an error. Neither
form accepts both. It is a two-character difference that changes what compiles,
and it is the single most common thing to get wrong when writing a list macro.

`num::$T` puts the path in the transcriber, so the invocation is twelve bare
type names rather than twelve qualified paths.

The body is `self.get().serialize(serializer)`. `get()` returns the underlying
primitive, which then dispatches through `primitive_impl!`'s impls from the top
of the file — so a `NonZeroU32` serializes as a plain `u32`. The non-zero
invariant is not represented in the output at all. It exists on the Rust side,
is proved on the way out, and has to be proved again by the deserializer on the
way back in.
"""

[[annotation]]
id    = "ser-impls-0044"
file  = "src/ser/impls.rs"
lines = "584-598"
title = "NonZeroI8 … NonZeroUsize → twelve, one per primitive"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-repetition"]
macro_def = "ser-impls-0043"
prereqs = ["ser-impls-0004", "ser-impls-0005"]
body = """
Twelve types, each ending in the mandatory comma the matcher demands, including
the last.

They inherit everything the primitives do. `NonZeroIsize` widens to
`serialize_i64` and `NonZeroUsize` to `serialize_u64`, because `get()` hands back
an `isize` or `usize` and the impl from the top of the file takes over.
`NonZeroI128` and `NonZeroU128` inherit the erroring default, so they fail on a
format that never implemented 128-bit integers — two indirections away from
where that decision was made.
"""

[[annotation]]
id    = "ser-impls-0045"
file  = "src/ser/impls.rs"
lines = "599-610"
title = "Cell<T> — the only impl that demands Copy"
kind  = "impl"
tracks = ["reference"]
rust_features = ["interior-mutability", "ownership", "where-clauses"]
prereqs = ["ser-impls-0037"]
body = """
`T: Serialize + Copy` — the only `Copy` bound in the file, and it comes straight
from `Cell::get`, which returns a copy of the contents because a `Cell` will not
hand out references to what it holds.

The consequence is a hole in the coverage: `Cell<String>` has no `Serialize`
impl, and no amount of deriving will produce one. `Cell` is for small copyable
values; anything larger belongs in a `RefCell`, which is the impl directly
below and has no such restriction.

What lands in the output is the value at the moment `get()` runs. Interior
mutability means another part of the program can change it a line later, and
nothing about the encoding records which instant you captured.
"""

[[annotation]]
id    = "ser-impls-0046"
file  = "src/ser/impls.rs"
lines = "611-625"
title = "RefCell<T> — the first impl that can fail on its own account"
kind  = "impl"
tracks = ["reference"]
rust_features = ["interior-mutability", "custom-errors", "result"]
prereqs = ["ser-mod-0011", "ser-impls-0045"]
body = """
Everything failing so far has failed because a *format* could not represent
something — no 128-bit integers, no NaN in JSON. This is the first impl that
fails because of the program's own state: if a `RefMut` is outstanding when
serialization reaches this cell, `try_borrow` returns `Err` and the whole
operation stops with `already mutably borrowed`.

`try_borrow` rather than `borrow` is the deliberate part. `borrow` panics; this
returns an error the caller can handle, through `Error::custom` — the escape
hatch every format's error type is required to provide, being used exactly as
intended.

Note the bound: `T: ?Sized`, no `Copy`. `RefCell` hands out a reference rather
than a copy, so `RefCell<String>` and even `RefCell<[u8]>` work where `Cell`
could not.

It is reachable in ordinary code: serialize a structure from inside a method
that is already holding a `borrow_mut()` on part of it, and this is the error
you get.
"""

[[annotation]]
id    = "ser-impls-0047"
file  = "src/ser/impls.rs"
lines = "626-659"
title = "Mutex and RwLock — serialization that can block"
kind  = "impl"
tracks = ["reference"]
rust_features = ["interior-mutability", "custom-errors", "cfg"]
prereqs = ["ser-impls-0046"]
body = """
The same shape as `RefCell`, with the failure mode moved from borrow-checking to
locking, and one property that deserves stating plainly: **these impls acquire a
lock.**

`self.lock()` blocks. Serializing a structure containing a `Mutex` waits for
whatever else holds it, for as long as that takes. If the current thread already
holds that lock — serializing from inside a critical section — `std::sync::Mutex`
is not reentrant and the program deadlocks. Nothing in the signature hints at
this; `serialize` looks like a pure read.

`RwLock` uses `.read()`, taking the shared lock, so concurrent serializations of
the same structure do not contend with each other.

The `Err` arm is poisoning: a thread panicked while holding the lock, so the
contents may be inconsistent. Both impls decline rather than serialize possibly
broken data, and report it through `Error::custom` with the same message.

`std`-only, because neither type exists in `core` or `alloc`.
"""

[[annotation]]
id    = "ser-impls-0048"
file  = "src/ser/impls.rs"
lines = "660-681"
title = "Result — an ordinary enum, behind a feature you can turn off"
kind  = "impl"
tracks = ["reference"]
rust_features = ["result", "cfg", "pattern-matching", "feature-unification"]
prereqs = ["ser-impls-0028"]
body = """
Structurally this is `Bound` again: a two-variant enum, both variants carrying a
value, encoded with `serialize_newtype_variant` and the indices `0` and `1`.
`Ok(5)` becomes `{"Ok":5}` in a self-describing format. There is nothing special
about `Result` to the data model — it is a name, two variants, and two indices.

The gate is what makes this impl interesting. `feature = "result"` is **on by
default**, so the impl is normally present, but a crate can switch it off with
`default-features = false`. That is unusual in serde, where features are
otherwise additive things you add rather than defaults you remove.

It is also a reminder that Cargo features must be additive: if any crate in the
graph enables `result`, every crate gets the impl. Turning it off is only
effective if nothing else in your dependency tree turns it back on, which for a
default feature of serde is a real constraint rather than a theoretical one.
"""

[[annotation]]
id    = "ser-impls-0049"
file  = "src/ser/impls.rs"
lines = "682-696"
title = "Duration — two fields, and the units are in the names"
kind  = "impl"
tracks = ["reference"]
prereqs = ["ser-impls-0024"]
body = """
A two-field struct, `secs` and `nanos`, read through `as_secs()` and
`subsec_nanos()` rather than from fields, since `Duration`'s representation is
private.

`subsec_nanos()` is the sub-second remainder, not the total — so the pair is
`secs + nanos/1e9`, never `nanos` alone. A three-and-a-half second duration
serializes as `{"secs":3,"nanos":500000000}`, and reading `nanos` in isolation
tells you nothing.

No `#[cfg]`: `Duration` lives in `core`, so it is available in the barest
`no_std` build. `SystemTime`, immediately below, is not.
"""

[[annotation]]
id    = "ser-impls-0050"
file  = "src/ser/impls.rs"
lines = "697-717"
title = "SystemTime — an epoch, and the times it cannot express"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors", "result", "cfg"]
prereqs = ["ser-impls-0049"]
body = """
`SystemTime` is an opaque platform timestamp with no defined zero, so it cannot
be serialized directly. This impl converts it to a `Duration` since the Unix
epoch first, and writes that as two fields — `secs_since_epoch` and
`nanos_since_epoch`, named differently from `Duration`'s so the encodings cannot
be confused for one another.

**Any time before 1970 fails.** `duration_since(UNIX_EPOCH)` returns `Err` for
an earlier instant, and this impl turns that into
`SystemTime must be later than UNIX_EPOCH`. A birth date, a historical
timestamp, a clock that has not been set yet — all unserializable. The
alternative would have been a signed offset, which `Duration` cannot represent.

The early return is written out longhand rather than with `tri!`, because the
two error types are different: `duration_since` yields a
`SystemTimeError` and the function returns `S::Error`, so the conversion has to
go through `Error::custom` explicitly. `tri!` deliberately does no `From`
conversion, which is exactly why it does not fit here.
"""

[[annotation]]
id    = "ser-impls-0051"
file  = "src/ser/impls.rs"
lines = "718-733"
title = "serialize_display_bounded_length! — formatting without an allocator"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "12-no-std-and-cfg"
rust_features = ["macro-rules", "no-std", "strings", "cfg"]
prereqs = ["ser-impls-0002"]
body = """
A macro with a doc comment, which is unusual — and the comment is load-bearing,
because it documents a panic.

The body writes a `Display` value into a **stack array** of exactly `$max`
bytes, using `crate::format::Buf`, a thirty-line `fmt::Write` implementation
whose only job is to fill a fixed slice. No `String`, no allocator, so this
works in a `no_std` build where the obvious `value.to_string()` does not exist.

Then `.unwrap()`. `Buf::write_str` returns `Err(fmt::Error)` when the value
overruns the buffer, so a `Display` impl that writes more than `MAX_LEN` bytes
panics here. A library panicking on its own data would normally be a bug; it is
tolerable in this one case because every call site pairs its `MAX_LEN` with a
`debug_assert_eq!` against a literal example of the longest possible value.
The constant is checked against reality in debug builds, and the panic is what
happens if that check was wrong.

The `#[cfg]` sits on the macro *definition*, so in a build without networking
support the macro does not exist at all. And the outer `{{ ... }}` makes the
expansion a block expression, so the invocation can be used as the value of an
`if` arm — which is exactly how the impls below use it.
"""

[[annotation]]
id    = "ser-impls-0052"
file  = "src/ser/impls.rs"
lines = "734-757"
title = "IpAddr — the first impl that asks what kind of format it is talking to"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "04-generic-bounds"
rust_features = ["cfg", "pattern-matching"]
prereqs = ["ser-mod-0041"]
body = """
`if serializer.is_human_readable()` — and the same value now has two entirely
different encodings.

For JSON and friends: the string `"192.168.0.1"`, by delegating to the `Ipv4Addr`
or `Ipv6Addr` impl. For a compact binary format: an externally tagged enum,
`serialize_newtype_variant("IpAddr", 0, "V4", a)`, whose payload is the raw
octets. A human reading a config file gets something they can edit; a wire
protocol gets four bytes instead of fifteen.

This is the one place the data model deliberately leaks information about the
format back to the value being serialized, and `ser/mod.rs` argues at length
that it should be used sparingly. Address types are the canonical justified
case: the textual form is genuinely the natural one for humans and genuinely
wasteful for machines, and no single choice serves both.

The cost is real and worth stating: **the two encodings are not
interchangeable.** A document written by a human-readable format cannot be read
by a binary one, and vice versa, even with the same serde version and the same
types.
"""

[[annotation]]
id    = "ser-impls-0053"
file  = "src/ser/impls.rs"
lines = "758-803"
title = "DEC_DIGITS_LUT and format_u8 — the only hand-optimized code in the crate"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["collections", "pattern-matching", "zero-cost"]
body = """
Forty-five lines of ordinary imperative Rust, which makes this the least
serde-like passage in the crate — and one of the few places to see what the
crate looks like when it is optimizing rather than abstracting.

`DEC_DIGITS_LUT` is the classic two-digits-at-a-time table: two hundred bytes
holding `"00", "01", … "99"` end to end, so converting a number to decimal
becomes an index rather than a division per digit. It is the same trick the
`itoa` crate is built on. `format_u8` uses it in three cases — three digits, two
digits, one — and returns how many bytes it wrote.

Below it, a `#[test]` that runs `format_u8` against `to_string()` for **every
one of the 256 possible inputs**. Exhaustive testing is normally out of reach;
here the domain is one byte, so the test is not a sample, it is a proof. When
you can do this, do it.

Both items are gated on the same networking `#[cfg]` as everything else in this
section. They exist for exactly one caller: the `Ipv4Addr` impl immediately
below.
"""

[[annotation]]
id    = "ser-impls-0054"
file  = "src/ser/impls.rs"
lines = "804-827"
title = "Ipv4Addr — a prefilled buffer, and one of the crate's two unsafe blocks"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "13-errors-and-control-flow"
rust_features = ["unsafe", "strings", "zero-cost"]
prereqs = ["ser-impls-0053", "ser-impls-0052"]
body = """
The human-readable branch is a small piece of systems programming.

`let mut buf = [b'.'; MAX_LEN]` fills the buffer with dots **first**, so the
three separators are already in place and the loop only writes digits, skipping
one byte between octets. No separator is ever written explicitly.

`debug_assert_eq!(MAX_LEN, "101.102.103.104".len())` is a pattern worth
stealing: the magic constant `15` is checked against a literal example of the
longest possible value, so the number cannot silently drift from what it claims
to describe.

Then `unsafe { str::from_utf8_unchecked(...) }`. This is **one of exactly two
`unsafe` blocks in the entire crate** — the other is in `format.rs`, doing the
same thing for the same reason. The safety argument is airtight and stated in a
comment directly above: only ASCII digits and dots were written, so the bytes
are valid UTF-8 by construction. It is also worth being honest about the size of
the prize: skipping validation on at most fifteen bytes. Two `unsafe` blocks in
twelve thousand lines is the ratio to notice, not the micro-optimization.

The binary branch is one line: `self.octets()` is a `[u8; 4]`, which reaches
`array_impls!` and goes out as a four-element tuple.
"""

[[annotation]]
id    = "ser-impls-0055"
file  = "src/ser/impls.rs"
lines = "828-843"
title = "Ipv6Addr — where the bounded-length macro pays for itself"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "no-std"]
prereqs = ["ser-impls-0051", "ser-impls-0054"]
body = """
IPv6 text form has zero compression, embedded IPv4 notation, and variable-width
groups — far too much to hand-roll the way `Ipv4Addr` does. So this impl uses
the `Display` impl that `core` already provides and captures it into a stack
buffer with `serialize_display_bounded_length!`.

`MAX_LEN` is 39, checked against `"1001:1002:1003:1004:1005:1006:1007:1008"` —
eight groups of four hex digits and seven colons, the longest form that exists
once you know no compression is applied.

The binary branch sends `self.octets()`, a `[u8; 16]`, which lands on the
sixteen-element tuple impl — the very last arity `tuple_impls!` generates. One
more byte of address and this line would not compile.
"""

[[annotation]]
id    = "ser-impls-0056"
file  = "src/ser/impls.rs"
lines = "844-867"
title = "SocketAddr — the same two-encoding split, one level up"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
prereqs = ["ser-impls-0052"]
body = """
Structurally identical to `IpAddr`: delegate to the concrete impl when the
format is human-readable, emit a tagged enum with indices `0` and `1` when it is
not.

The nesting is worth tracing once. A `SocketAddr` in a binary format becomes a
variant wrapping a `SocketAddrV4`, which becomes a two-element tuple of an
`Ipv4Addr` and a `u16`, where the address is itself a four-element tuple. Four
model constructs deep, and every layer was chosen by an impl that had no idea
what the layer above it was doing.
"""

[[annotation]]
id    = "ser-impls-0057"
file  = "src/ser/impls.rs"
lines = "868-902"
title = "SocketAddrV4 and V6 — where the two encodings stop agreeing"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "pattern-matching"]
prereqs = ["ser-impls-0055"]
body = """
Both follow the pattern: bounded-length `Display` when human-readable,
`(self.ip(), self.port())` as a two-tuple when not. And in the V6 case those two
branches do not carry the same information.

`SocketAddrV6` has four components — address, port, flowinfo, and scope id. The
`Display` form includes the scope: the `MAX_LEN` of 58 is checked against
`"[1001:…:1008%4294967295]:65000"`, and that `%4294967295` is the scope id at
full width. The binary branch sends `(ip, port)` and **drops flowinfo and scope
id entirely**.

So a link-local IPv6 socket address — exactly the case where the scope id is not
optional — round-trips through JSON and loses nothing, and round-trips through a
compact binary format as a different address. That is a genuine inconsistency
rather than a design trade, and it is invisible unless you go looking at both
branches side by side.

The `MAX_LEN` of 21 for V4, `"101.102.103.104:65000"`, is the same
checked-constant discipline as everywhere else in this section.
"""

[[annotation]]
id    = "ser-impls-0058"
file  = "src/ser/impls.rs"
lines = "903-929"
title = "Path and PathBuf — UTF-8 or nothing"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "custom-errors", "cfg", "sized-bound"]
prereqs = ["ser-impls-0010", "ser-mod-0008"]
body = """
A `Path` serializes as a string, and if it is not valid UTF-8 it does not
serialize at all: `path contains invalid UTF-8 characters`.

This is the example the `Error::custom` documentation in `ser/mod.rs` uses to
justify the whole mechanism, so it is worth seeing the actual line. A
`Serialize` impl discovers a problem, has no idea what error type the format
uses, and cannot construct one — so it goes through the constructor every format
is required to provide.

Paths are not UTF-8 on any real platform. A Unix path is arbitrary bytes minus
`/` and nul; a Windows path is arbitrary UTF-16 including unpaired surrogates.
Serde takes the strings that fit and refuses the rest, which is the honest
choice for a *portable* encoding — the alternative is the `OsStr` impl below,
and its cost is on display there.

`PathBuf` delegates through `as_path()`, the same relationship `String` has to
`str`, spelled out here because `PathBuf` does not deref-coerce all the way to
the impl.
"""

[[annotation]]
id    = "ser-impls-0059"
file  = "src/ser/impls.rs"
lines = "930-963"
title = "OsStr — an encoding that names the platform it came from"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "strings", "iterators"]
prereqs = ["ser-impls-0058"]
body = """
Two `fn serialize` definitions inside one impl block, one `#[cfg(unix)]` and one
`#[cfg(windows)]`. Exactly one survives compilation, which is how a single impl
gets a per-platform body without duplicating the surrounding block. Note the
outer gate, `any(unix, windows)`: on any other target the impl does not exist,
and `OsStr` is simply not serializable.

Unix sends raw bytes; Windows sends a `Vec<u16>` of UTF-16 code units. Both wrap
the payload in a variant named for the platform — index `0` `"Unix"`, index `1`
`"Windows"` — so the encoding records where it was produced.

That tag is doing real work: it makes cross-platform reads **fail loudly**
rather than silently mangling a path. It also means an `OsString` written on
Linux cannot be read on Windows at all, which is the price of representing what
`Path` refused to.

The variant name is `"OsString"`, not `"OsStr"`, in an impl for `OsStr`. That is
deliberate — `OsString` below delegates here, and both types must produce the
same encoding.

`self.encode_wide().collect::<Vec<_>>()` is the one allocation in this stretch
of the file, and unavoidable: the iterator has to be materialized before it can
be handed over as a slice.
"""

[[annotation]]
id    = "ser-impls-0060"
file  = "src/ser/impls.rs"
lines = "964-1005"
title = "Wrapping, Saturating, Reverse — three newtypes that disappear"
kind  = "impl"
tracks = ["reference"]
rust_features = ["marker-types", "msrv", "cfg", "zero-cost"]
prereqs = ["ser-impls-0037"]
body = """
Three impls, one body each: `self.0.serialize(serializer)`. These are newtype
wrappers that change how arithmetic or ordering behaves, not what the value
*is*, so nothing about them reaches the output. A `Wrapping<u8>` is a `u8` on
the wire.

The distinction they carry is a Rust-side behavioural one, and the model has no
vocabulary for behaviour. Compare `NonZeroU32` earlier, which also serializes as
its primitive: same conclusion, different reason.

`Saturating` is gated on `not(no_core_num_saturating)` — another build-script
cfg, set below Rust 1.74 where the type was stabilized. The crate keeps its 1.56
MSRV and quietly gains the impl on any newer toolchain, with nothing for the
user to configure. `Wrapping` and `Reverse` are old enough to need no gate at
all.
"""

[[annotation]]
id    = "ser-impls-0061"
file  = "src/ser/impls.rs"
lines = "1006-1026"
title = "atomic_impl! — a macro that generates its own cfgs"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "12-no-std-and-cfg"
rust_features = ["macro-rules", "cfg", "interior-mutability", "msrv"]
prereqs = ["ser-impls-0043"]
body = """
The last macro in the file, and the only one whose transcriber emits `#[cfg]`
attributes of its own rather than passing through ones the caller supplied.

`($($ty:ident $size:expr)*)` pairs a type with a width string, with **no
separator between the pairs at all** — just whitespace, since `tt`-level parsing
does not care. The width then appears inside a generated attribute:
`#[cfg(any(no_target_has_atomic, target_has_atomic = $size))]`. So each of the
eleven impls is independently gated on the target actually having an atomic of
that width. A platform without 64-bit atomics gets the other impls and not those
two, silently and correctly.

`no_target_has_atomic` is the escape hatch for compilers too old to know the
`target_has_atomic` cfg at all — set by the build script, and it makes the
`any(...)` fall through to "just compile it".

The body is `self.load(Ordering::Relaxed)`, with a comment noting it matches what
libcore's `Debug` impl does. `Relaxed` is the right choice and worth
understanding: serializing an atomic performs no synchronization and establishes
no happens-before with any other thread. You get *a* value that was in the cell,
not a consistent snapshot across several of them. Serializing a struct with
three atomics can produce a combination that never simultaneously existed.
"""

[[annotation]]
id    = "ser-impls-0062"
file  = "src/ser/impls.rs"
lines = "1027-1039"
title = "AtomicBool … AtomicUsize → nine, gated per width"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["cfg", "interior-mutability"]
macro_def = "ser-impls-0061"
body = """
Nine types paired with the width their `target_has_atomic` gate will check.
`AtomicIsize` and `AtomicUsize` use `"ptr"`, which is what the cfg calls a
pointer-width atomic — and they then widen to `i64`/`u64` on the wire like the
plain integers do.
"""

[[annotation]]
id    = "ser-impls-0063"
file  = "src/ser/impls.rs"
lines = "1040-1045"
title = "AtomicI64, AtomicU64 → a second invocation, for a second reason"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["cfg", "msrv"]
macro_def = "ser-impls-0061"
body = """
The sixty-four-bit atomics are split into their own invocation because they need
a different outer gate: `not(no_std_atomic64)` rather than `not(no_std_atomic)`.
The build script sets those two separately, since a target can have 32-bit
atomics and not 64-bit ones — 32-bit ARM without the right extensions, some
embedded targets, `wasm32` in certain configurations.

Two invocations rather than one extra parameter, and the file ends here.
"""
