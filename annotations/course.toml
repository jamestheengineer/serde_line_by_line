# The course track.
#
# Same annotation store as the reference track, different ordering: the
# reference track walks the source tree, this one walks a teaching progression.
# A unit's content is the annotations tagged with its `id` in `course_unit`,
# plus the framing written here.
#
# `supplement` is the honesty field. The annotated crates exercise lifetimes,
# traits, macros and code generation exhaustively and ordinary imperative Rust
# barely at all (PLAN.md §2), so some units cannot be taught from them. Saying
# which is the point:
#
#   none    — taught entirely from the annotated crates; nothing invented
#   partial — they show part of it, written material fills the rest
#   full    — they do not exercise this; the unit is written from scratch
#
# Units 15-21 draw from `serde_derive` (PLAN.md §12, R6). Their reading-order
# entries are qualified with the crate name, because both crates have a
# `src/lib.rs` and a bare path means the first source (D12).
#
# Units from 22 draw from `serde_json` (PLAN.md §14, K7), qualified the same
# way. The scope doc lists eight; a unit is registered when it is written,
# because a planned unit with nothing tagged to it would have to claim a
# `supplement` nobody has checked.
#
# `status` is "written" once the unit's framing and its supplementary material
# both exist; "planned" until then. The coverage gate warns on planned units so
# the remaining work stays visible, and the reader sees the label too.

