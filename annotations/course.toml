[[unit]]
id = "01-why-a-data-model"
title = "Why serialization needs a data model"
supplement = "none"
status = "written"
prereqs = []
rust_features = ["traits", "modules"]
examples = ["primitive_dispatch"]
summary = """
Serde does not connect data structures to formats directly. It connects both to
a 29-type model in the middle, and almost every design decision in the crate
follows from that one choice.
"""
body = """
Start with the arithmetic. Ten data structures and ten formats need a hundred
pieces of conversion code if each pair is written by hand. Put a fixed model
between them and it is ten plus ten: each type says how it maps onto the model,
each format says how it writes the model down, and neither has heard of the
other.

The model is the price. It has 29 types, and a type that does not fit one of
them cannot be serialized without lying about its shape — which is why the list
is worth reading closely rather than skimming. `ser/mod.rs` enumerates it in
prose; `private/content.rs` is the same model expressed as a Rust enum, which
makes the shape concrete and also shows the two variants it turns out not to
have.

The model is read twice, once from each side, and both readings are in this
unit. `ser/mod.rs` lists the 29 types a value can claim to be; `de/mod.rs` lists
the same 29 read back, and differs in exactly two places — strings and byte
arrays arrive in three flavours rather than one, which is the sentence the whole
deserializing half is built on, and the reason unit 08 exists. Read alongside it
is the choice between `deserialize_any` and the typed hints: a fork that decides
which formats a hand-written impl can ever support, taken long before anything
about lifetimes matters.

Watch for the seam this creates. The data structure chooses which model type it
looks like, the format chooses what that type costs, and neither choice is
visible to the other side. `is_human_readable` is the one place the seam leaks,
and the annotation on it says what that leak buys and what it costs.

The examples in this unit make the dispatch observable: a serializer whose `Ok`
type is *the method it was called with*, so you can see exactly which of the 29
types a value claimed to be.
"""

[[unit]]
id = "02-traits-and-supertraits"
title = "Traits and supertraits"
supplement = "none"
status = "written"
prereqs = ["01-why-a-data-model"]
rust_features = ["traits", "supertraits", "sized-bound", "trait-objects"]
examples = []
summary = """
`Serialize` and `Serializer` are the two halves of the contract. The bounds
attached to them — especially the ones deliberately left off — decide what can
implement each side.
"""
body = """
Two traits, two roles: `Serialize` is implemented by data structures,
`Serializer` by formats. Read them as a pair of interfaces negotiating across a
boundary, not as a base class and its subclasses.

The teaching is in the bounds. `Serialize` has no `Sized` bound, which is why
`str` and `[T]` — types whose size is not known at compile time — can implement
it at all; the `str` impl is the proof, and it is four lines long. `Serializer`
does have `Sized` as a supertrait, and that single word rules out
`dyn Serializer` for the whole ecosystem. That is a real trade: static dispatch
and monomorphized formats in exchange for never being able to store a boxed
serializer.

A supertrait here is a requirement, not an inheritance relationship. When you
see `trait Foo: Bar`, read it as "anything implementing `Foo` must also
implement `Bar`, and `Foo`'s default methods may rely on that" — the compiler
gives you `Bar`'s methods inside `Foo`'s bodies, and nothing else.
"""

[[unit]]
id = "03-associated-types"
title = "Associated types"
supplement = "none"
status = "written"
prereqs = ["02-traits-and-supertraits"]
rust_features = ["associated-types", "generic-params", "traits"]
examples = ["ok_and_error", "seq_state_machine"]
summary = """
`type Ok`, `type Error`, and the seven compound types are how a format states
its own vocabulary. This is the unit where Serde's central trick becomes
visible.
"""
body = """
An associated type is a type the *implementer* chooses and the caller has to
accept. `Serializer::Ok` is the clearest case in the crate: `serde_json`'s
string serializer produces `()` because output accumulates into a buffer the
caller already owns, while a hash-computing serializer produces `u64`. Same
trait, same calls, different type — and the `Serialize` impls are generic over
it, so they never notice.

Compare that with a type parameter. `trait Serializer<Ok>` would let one format
implement `Serializer` at several `Ok` types, and every call site would then
have to say which one it meant. Associated types are the "there is exactly one"
version, and that is the property the whole API depends on.

The seven compound associated types — `SerializeSeq`, `SerializeMap`, and the
rest — are the same idea applied to state machines. Each names the type you get
back from `serialize_seq` or `serialize_map`, and the receivers on that type's
methods (`&mut self` to add, `self` to finish) turn the protocol into something
the borrow checker enforces rather than something the docs ask for.

On the deserialization side the payoff is `Visitor::Value` and
`DeserializeSeed::Value`: the visitor names what it will produce, and that is
what lets a seed carry data *into* deserialization instead of only out of it.
"""

[[unit]]
id = "04-generic-bounds"
title = "Generic bounds and `where` clauses"
supplement = "none"
status = "written"
prereqs = ["03-associated-types"]
rust_features = ["generic-params", "where-clauses", "sized-bound", "traits"]
examples = []
summary = """
519 `where` clauses. This unit reads the ones that carry a decision, and the
ones whose absence carries a bigger one.
"""
body = """
A bound is a promise you demand from a caller. Two questions are worth asking at
every one in this crate: what breaks without it, and what does requiring it stop
you from doing?

`Option<T>` needs `T: Serialize` — obvious. `[T; 0]` needs nothing at all, which
looks like an oversight until you notice there is no `T` value to serialize, so
demanding `T: Serialize` would reject arrays of unserializable types for no
reason. `Box<T>` is bounded on `Box<T>: Serialize`-adjacent shapes rather than
on `T` in the deserializing direction, and `Cell<T>` inherits a `Copy` bound
from the operation it has to perform rather than from the trait it is
implementing. Both of those bounds are written inside `macro_rules!` bodies, so
their annotations sit in unit 11 with the macros that generate them — the claim
is worth carrying there, because a bound inside a macro is still a bound.

Bounds in `where` position instead of inline are usually a readability choice,
but not always: `where` is the only place you can bound something that is not a
bare type parameter, such as `A::Error` or `Self::Ok`. Once you see that,
several of the crate's longer clauses stop looking decorative.

Collections make the trade-off concrete. `BTreeSet` and `HashSet` have the same
deserialization body and different bounds — `Ord` for one, `Hash + Eq` for the
other — because the bound is dictated by the container, not by Serde.
"""

[[unit]]
id = "05-default-methods"
title = "Default methods, and what silence means"
supplement = "none"
status = "written"
prereqs = ["04-generic-bounds"]
rust_features = ["default-methods", "traits", "zero-cost"]
examples = ["default_methods", "collect_str"]
summary = """
157 trait methods in this crate have bodies. Every one of them is a decision the
trait makes on your behalf when you say nothing, and a few of those decisions
are surprising.
"""
body = """
A default method is a policy with a fallback, and reading one means asking what
the fallback commits you to. Three in `Serializer` are worth the time:

`serialize_i128` defaults to an error. Silence means "this format has no 128-bit
integers", which is the right default only because the alternative — silently
truncating — is worse. `is_human_readable` defaults to `true`, so a format that
says nothing is assumed to be rendering for people. `collect_str` defaults to
`self.serialize_str(&value.to_string())`, which allocates; a format that can
stream a `Display` implementation directly overrides it and saves the
allocation.

The pattern generalizes past this crate: a default body is how a trait grows
without breaking implementers, and the cost is that every default silently
picks a behaviour for code that was written before the method existed.

The deserializing side shows the other reason to override: performance.
`MapDeserializer::next_entry_seed` exists only because the default —
`next_key_seed` then `next_value_seed` — has to stash the value between the two
calls, and this implementation has both halves in hand at once.
"""

[[unit]]
id = "06-ownership-and-borrowing"
title = "Ownership and borrowing"
supplement = "full"
status = "written"
prereqs = ["05-default-methods"]
rust_features = ["ownership", "borrowing", "strings", "smart-pointers"]
examples = ["move_and_borrow", "compile_fail"]
summary = """
Fully supplementary. serde_core is generic, trait-heavy code that almost never
does ordinary imperative ownership work, so this unit is written from scratch —
and the next unit needs it.
"""
body = """
Nothing in this unit comes from serde_core, and the reason is PLAN.md §2: the
crate has no long functions shuffling values between locals, no `clone()` added
to appease the borrow checker, no structure mutated in place through a chain of
`&mut`. What it has instead is 724 lifetime parameters — the *next* unit, and
unreadable without this one.

Two questions are worth holding onto, because every rule below is an answer to
one of them.

**Ownership answers: who frees this, and when?** Rust has no garbage collector
and no manual `free`. Each value has exactly one owner, and the value is dropped
when that owner goes out of scope. So `let b = a;` on a `String` cannot mean
"now there are two" — that would mean two frees. It means the ownership moved,
and `a` is no longer usable.

The part that surprises people is what a move *costs*. It copies the `String`
itself — pointer, length, capacity, three machine words — and does not touch the
heap buffer at all. `move_and_borrow` proves it by comparing `as_ptr()` across a
move, a function call that takes the value, and a call that gives it back: same
address every time. The line that actually allocates is `clone()`, and it shows
up as a different address holding equal contents. A move is not a deep copy that
the optimizer might elide; it is a change of who is responsible.

Types that own nothing opt out. `i32`, `bool`, `char`, `&T` are `Copy`:
duplicating them is harmless because there is nothing to free twice. Same
syntax, different rule, and the difference is a property of the type rather than
of the line you wrote.

Scope is the other half. The example's `Tracked` type appends to a log when it
is dropped, which turns the rules into a printed sequence: a value moved into a
function dies inside that function, before the caller's next statement; locals
die at the closing brace in reverse declaration order; a value never bound to a
name dies at the end of the statement that made it. Read that transcript once
and "when does the destructor run" stops being a guess. This is also how RAII
works in Rust — a file closes, a lock releases, a buffer frees, all because
something went out of scope.

**Borrowing answers: who may look while someone else owns?** A `&T` is a
temporary view: read-only, and any number may exist at once. A `&mut T` is
exclusive: while one exists, no other reference to that value may. That is the
aliasing rule, and it is one rule, not two — shared *xor* mutable.

Borrows are also cheap in the way moves are. Four `&str` values in the example
point into a single `String`'s buffer at different offsets, and no allocation
happens. A `&str` is a pointer and a length into memory that someone else owns
and will free.

Which is exactly why the aliasing rule is not bookkeeping. `String::push_str`
may reallocate — copy every byte into a larger buffer and free the old one — so
a `&str` taken beforehand would be left pointing at freed memory. The compiler
rejecting the mutation is the entire reason that program cannot read a dangling
pointer. `examples/compile_fail` holds that case with rustc's own diagnostic
committed next to it, along with the use-after-move, the two `&mut`, and the
move out of a shared reference. Reading the real error, underlines and all,
teaches more than any paraphrase of it.

Two practical corollaries. First, a borrow ends at its **last use**, not at the
end of the block — so restructuring code so the borrow finishes earlier is often
the whole fix. Second, when a reference cannot survive a mutation, an index can:
a `Range<usize>` is a pair of numbers and promises nothing about memory, so you
save it, mutate, and re-slice. That trade — reference versus index — is the one
you will keep making.

**Where this touches serde_core, honestly:** in one place, and it is a design
decision rather than an exercise. Every `Serializer` method that produces
output takes `self` by value — the one exception, `is_human_readable`, takes
`&self` because it only answers a question — so serializing a value *consumes*
the serializer, and it cannot be reused by mistake. Formats that need to write several values implement the trait for
`&'a mut MySerializer` instead, which makes the reuse explicit at the type
level. That is ownership as an API constraint — which is how this crate uses it
throughout, and why it never has to teach it.

Then unit 07 picks up the question this unit cannot answer: `first_word` at the
end of the example returns a `&str` borrowed from its argument, and something
has to tell the compiler what that reference points into.
"""

[[unit]]
id = "07-lifetimes-basics"
title = "Lifetimes I: the basics"
supplement = "full"
status = "written"
prereqs = ["06-ownership-and-borrowing"]
rust_features = ["lifetimes", "borrowing"]
examples = ["lifetime_basics", "compile_fail"]
summary = """
Fully supplementary. Lifetime *syntax* has to be routine before `'de` can teach
anything, and serde_core's lifetimes are all advanced ones.
"""
body = """
serde_core is one of the best places in the ecosystem to learn what lifetimes
are *for*, and one of the worst places to learn what they *are*. It has 724
lifetime parameters and not one of them is a first example: they are outlives
bounds, higher-ranked bounds, and two lifetimes deliberately unified into one.
Every one is doing real work. So this unit is written from scratch, like unit
06, and for the same measured reason (PLAN.md §2).

One sentence carries the whole unit. **A lifetime parameter does not create,
extend, or shorten anything — it relates references that already exist**, so
the compiler can prove no reference outlives what it points into. Everything
below is a consequence, and `lifetime_basics` checks each one the only way a
running program can: by comparing `as_ptr()` and showing the result really does
share a buffer with the argument it claimed to borrow from.

**Why a signature needs the annotation at all.** `fn longest<'a>(a: &'a str, b:
&'a str) -> &'a str` returns whichever argument is longer. The example calls it
twice and the returned pointer comes from a different argument each time — so a
caller cannot know which buffer the result points into, and the compiler will
not read the body to find out. The signature is the entire contract. `'a` is
not "the lifetime of `a`" and not a duration; it is a region the compiler picks,
at most the overlap of what the two arguments cover, and the result is held to
it. At runtime the function is a length comparison and a pointer return.

**Elision writes the annotation you did not.** Three rules: every elided input
reference gets its own lifetime; with exactly one input, the output gets it;
with a `&self` among the inputs, the output gets `self`'s. That covers most
signatures you will write, which is why lifetimes feel optional until suddenly
they are not. Elision never guesses — it applies the rules or refuses, and
`fn pick(a: &str, b: &str) -> &str` is the refusal.

**A lifetime on a struct means the type is a view.** `struct Parser<'a> { input:
&'a str, pos: usize }` is where a type stops being self-contained and starts
describing someone else's memory. The example's `next_field` returns `Option<&'a
str>` and the choice is deliberate: elision would have tied it to `&mut self`,
making every field borrow the *parser* — uncollectable while parsing continues,
and dead as soon as the cursor is dropped. Written as `'a`, the fields borrow
the input, and the transcript reads three of them back after the parser is gone.

**`'long: 'short` is a promise that fits.** It reads "`'long` outlives
`'short`", and it is what makes returning a `&'long str` from a function that
promises `&'short str` legal: valid-until-later satisfies required-until-sooner.
Subtyping on lifetimes only ever shortens. serde_core writes this as
`impl<'de: 'a, 'a>` — the input buffer outlives the borrow taken out of it —
and that is unit 08's central signature, read here first in a five-line
function.

**`'static` is two different claims wearing one word.** `&'static str` says the
pointed-at bytes last as long as the program, which is true of literals.
`T: 'static` says the type contains no borrow that can expire — which `String`
satisfies while still being dropped at the next closing brace. Neither means
"lives forever", and reaching for `&'static str` to quiet an error usually makes
a signature demand something no caller can supply.

The rejections are where most of the teaching is, and a running program cannot
show them, so `examples/compile_fail` grew four more cases with rustc's own
diagnostics committed: the two-input signature elision will not complete, a
reference returned to a dead local, a `Parser<'a>` outliving its input, and an
ordinary `String` offered where `&'static str` was demanded. Read the E0106
help text in particular — it prints the fixed signature with the annotations
underlined, which is a better explanation of elision than a paragraph.

**Where this touches serde_core:** section 6 of the example is the bridge. A
parse that borrows every field out of its input instead of copying — proven by
offsets into the one buffer, against an owned version that allocates six times —
is what `Deserialize<'de>` does. Unit 08 gives that input buffer a name.
"""

[[unit]]
id = "08-lifetimes-de-and-zero-copy"
title = "Lifetimes II: `'de` and zero-copy deserialization"
supplement = "none"
status = "written"
prereqs = ["07-lifetimes-basics"]
rust_features = ["lifetime-de", "lifetimes", "hrtb", "borrowing", "strings"]
examples = []
summary = """
The crate's central idea, and the reason `Deserialize<'de>` has a lifetime
parameter at all: some data can be handed to you as a borrow of the input
instead of a copy of it.
"""
body = """
`'de` is the lifetime of the input data. `Deserialize<'de>` means "this type can
be built from data borrowed for `'de`", and a type that borrows nothing — `u64`,
`String` — satisfies it for every `'de`, which is what `DeserializeOwned`
expresses without being a trait anyone implements directly.

The pair to study is `visit_str` and `visit_borrowed_str`. Both receive a
`&str`; only the second promises that the string lives as long as `'de`, so only
the second lets a visitor keep the reference instead of copying it. Sixteen
lines, and the entire zero-copy story is in the difference.

Not every format can offer that. One reading from a socket has no buffer to
borrow from, so it only ever calls `visit_str` — which is why the borrowed
methods have defaults that fall back to the transient ones, and why a type that
requires borrowing simply will not deserialize from such a format. The failure
is a compile-time bound in one direction and a runtime error in the other, and
the annotations say which is which.

Then read `Cow`. It is the impl most people expect to borrow, it never does, and
the annotation explains why the obvious implementation cannot be written.
"""

[[unit]]
id = "09-phantomdata-and-variance"
title = "`PhantomData` and variance"
supplement = "partial"
status = "written"
prereqs = ["08-lifetimes-de-and-zero-copy"]
rust_features = ["marker-types", "variance", "generic-params"]
examples = []
summary = """
107 `PhantomData` fields. What a type parameter that appears in no field is
for, and the variance question that decides which `PhantomData<...>` you write.
"""
body = """
A struct that is generic over `E` but stores no `E` will not compile with `E`
unused, so it stores `PhantomData<E>` — zero bytes, and a note to the compiler
about how the parameter should behave. serde_core does this 107 times, most
visibly in the error-typed deserializers of `de/value.rs`, where `E` exists only
so the caller can name the error type the deserializer will produce.

`PhantomData` is not inert. `PhantomData<T>` makes the struct behave, for
variance and drop-check purposes, as though it owned a `T`; `PhantomData<fn() -> T>`
does not. The annotations point at the places where this choice is visible, and
at `UnitDeserializer`, whose single field claims an ownership relationship the
struct does not have.

**Supplement needed.** Variance itself — covariance, contravariance, why
`&'long T` is usable where `&'short T` is wanted and function arguments go the
other way — is not something serde_core demonstrates by contrast anywhere. The
written material for this unit fills that in; the crate supplies the motivation
but not the counter-examples.
"""

[[unit]]
id = "10-blanket-impls-and-coherence"
title = "Blanket impls and coherence"
supplement = "none"
status = "written"
prereqs = ["09-phantomdata-and-variance"]
rust_features = ["blanket-impls", "traits", "trait-objects", "generic-params"]
examples = []
summary = """
`impl<T: Bound> Trait for T` gives every qualifying type an implementation at
once. The orphan rule is what stops that from being chaos, and it shapes the
whole `IntoDeserializer` module.
"""
body = """
`de/value.rs` exists to turn values you already have into deserializers, and it
is the best blanket-impl case study in the crate: one trait — `IntoDeserializer`,
declared back in unit 03 for its associated type — and roughly 30 impls,
several of them written as blankets over anything satisfying a bound. Reading
them together shows the technique and its cost — a blanket impl is a commitment
you cannot narrow later without breaking downstream code.

Coherence is the rule that makes it safe: an impl is allowed only if the trait
or the type is local to your crate. That is why you cannot implement `Serialize`
for `Vec<T>` in your own crate, why serde ships the impls for the standard
library itself, and why `#[serde(remote)]` exists as a workaround for foreign
types.

Two smaller pieces are worth reading in the same sitting. `Expected` is a
one-method trait that could not have been `Display`, and its impl on a trait
object shows dispatch working through `dyn` in a crate that otherwise avoids it.
`&mut Formatter` implementing `Serializer` is the same move from the other
direction: an impl on a reference type, chosen because the underlying type
cannot be consumed.
"""

[[unit]]
id = "11-macro-rules"
title = "`macro_rules!`"
supplement = "none"
status = "written"
prereqs = ["10-blanket-impls-and-coherence"]
rust_features = ["macro-rules", "macro-repetition", "macro-hygiene", "monomorphization"]
examples = ["num_widening", "primitive_dispatch"]
summary = """
45 definitions generate 288 invocations. This is the largest single body of
declarative-macro practice in the unit list, and `de/impls.rs` is where it
lives.
"""
body = """
Declarative macros match token patterns and emit tokens. That is the whole
model, and everything difficult about them follows from it: a macro cannot see
types, cannot compute names, and cannot ask the compiler a question.

serde_core makes each of those limits visible. `impl_deserialize_num!` takes
*macro calls* as arguments, because there is no other way to parametrize which
conversion each impl applies. `forward_to_deserialize_any!` needs a two-stage
helper table because `concat_idents!` never stabilized, so building
`deserialize_bool` from the token `bool` is impossible and 29 arms do it by
hand. `seq_impl!` parses a generic parameter list by hand, one token category at
a time.

Hygiene is the other half. Every path inside these macros is fully qualified —
`$crate::de::Error`, not `Error` — because the caller's scope is unknown and a
name that resolves during testing may not resolve where the macro is used. The
`__private` modules those paths land in are read here for the same reason: they
are the namespace the expansions aim at, not plumbing you would notice
otherwise.

One macro in this unit declares a trait rather than an impl. `declare_error_trait!`
exists because a supertrait list cannot be `#[cfg]`-ed, so both `ser::Error` and
`de::Error` are written once and instantiated twice, with and without `std`.
That is why `de::Error`'s two required-reading methods — `custom`, and the
`invalid_type`/`invalid_value` pair every format's messages come out of — are
annotated in this unit and not in unit 13: the trait arrives with the macro that
declares it, and unit 13 revisits the design once the whole crate has leaned on
it. `tri!`, serde's replacement for `?`, first shows up here for the same
reason — it is a macro, and the collection impls are where you meet it.

Read the definitions first and the invocations second. The reference track
renders runs of invocations as compact rows under one definition for exactly
this reason: the sixteenth call of `primitive_impl!` teaches nothing the first
did not, and the two examples here make what the expansion *does* observable.
"""

[[unit]]
id = "12-no-std-and-cfg"
title = "`no_std` and feature gates"
supplement = "none"
status = "written"
prereqs = ["11-macro-rules"]
rust_features = ["no-std", "cfg", "feature-unification", "msrv", "modules"]
examples = []
summary = """
315 `#[cfg]` attributes. Supporting `no_std`, `alloc`, and `std` from one source
tree is an engineering discipline, and this crate is a complete worked example
of it.
"""
body = """
`crate_root.rs` is the map: a module named `core` that is sometimes `std`, seven
alloc-or-std import pairs, and imports gated on a compiler version detected by a
build script. Read it before anything else in this unit, because every later
`#[cfg]` in the crate assumes that scaffolding.

Three rules the crate follows, each visible in the annotations:

Features must be additive. Enabling `std` may add impls; it may never remove or
change one, because Cargo unifies features across the whole dependency graph and
a crate you have never heard of may have turned it on. Feature-gated behaviour
that *differs* rather than *adds* is the bug this rule prevents.

Where a method cannot be written the same way twice, write it twice.
`collect_str` has two full bodies chosen by `cfg`, because the `no_std` version
cannot allocate — and `format.rs` exists to give that version somewhere to write
into, using one of the crate's two `unsafe` blocks.

Version detection is a build-time cfg, not a feature. `CString`, the 128-bit
integer impls and several atomics are gated on what the compiler supports, which
is why `build.rs` and `#[cfg(no_core_cstr)]`-style names show up alongside the
ordinary feature gates.
"""

[[unit]]
id = "13-errors-and-control-flow"
title = "Errors and control flow"
supplement = "partial"
status = "written"
prereqs = ["12-no-std-and-cfg"]
rust_features = ["custom-errors", "result", "pattern-matching", "option"]
examples = ["error_custom"]
summary = """
`ser::Error` and `de::Error` are a case study in designing an error type you do
not control — plus `tri!`, the macro that replaced `?` crate-wide, with
measurements attached.
"""
body = """
A `Serialize` impl is generic over the format, so it cannot name a concrete
error type. All it has is `S::Error: ser::Error`, and therefore `Error::custom`,
which takes anything `Display` and no `self`. That signature is the constraint
worth studying: an error constructor that cannot see the serializer cannot know
*where* the failure happened, so position has to be attached by the format
afterwards.

`de::Error` adds `invalid_type` and `invalid_value`, which read the input back
to you in the message. Getting those right is most of the difference between a
usable deserializer and one that says "invalid value" and stops. Both traits are
declared by `declare_error_trait!` and were read in unit 11 alongside it; this
unit is where the design they add up to is worth judging, now that every impl in
the crate has been seen calling into them.

Then the control-flow half. serde_core does not use `?`. `lib.rs` sets
`#![deny(clippy::question_mark_used)]`, making it a compile error crate-wide,
and `tri!` is used instead — justified upstream by a measurement: 9% of compile
time against `?`, 5.5% against the old `try!`. The reason it can be a plain
macro at all is that no `From::from` conversion is ever needed here.

**Supplement needed.** Idiomatic application-level error handling — `From`
conversions, error enums, the `?` operator you would normally reach for — is
exactly what this crate opted out of, so the written material covers it.
"""

[[unit]]
id = "14-iterators-and-closures"
title = "Iterators and closures"
supplement = "partial"
status = "written"
prereqs = ["13-errors-and-control-flow"]
rust_features = ["iterators", "closures", "option"]
examples = ["iterator_by_hand", "closure_kinds", "compile_fail"]
summary = """
serde_core consumes iterators carefully in exactly three places and writes
thirteen closures in twelve thousand lines, so the crate supplies three good
cautionary tales and none of the fundamentals. Both halves are written from
scratch, and the closure half explains why the crate has no closures to show.
"""
body = """
serde_core's three careful uses of an iterator are all about the *edges* of
iteration rather than the protocol: a `SeqDeserializer` that wraps its iterator
in `Fuse`, a visitor that calls `next()` twice because both alternatives are
wrong, and a two-state machine built out of `Option::take`. The last two are
annotated here; `SeqDeserializer` itself is read in unit 04, where its bounds
are the lesson, and the `Fuse` in it is picked up again below.
`examples/iterator_by_hand` is those three reduced to code that runs, with the
protocol underneath them supplied.

**The one method.** `Iterator` requires `next`, and provides about seventy
methods on top of it. The example writes a `Fields<'a>` splitter — one `next`,
yielding borrows of its input the way unit 07's `Parser` did — and then calls
`collect`, `count`, `max_by_key`, `enumerate` and `last` on it without writing
another line. `for x in it` is not syntax over collections; it is
`IntoIterator::into_iter` followed by a loop over `next`, which is why it works
on anything with this one method and nothing without it. It is also why `for x
in v` *moves* `v` — the impl it picks takes `self` — and that is the first of
the unit's compile-fail cases.

**Adapters are values, not work.** Building `map(..).filter(..)` runs nothing:
the closure count in the example is still zero after the chain is built, one
after a single `next`, and three out of eight when `find` gets its answer at the
third element. `size_hint` is the claim that travels with the chain — `map`
forwards it exactly, `filter` can only say "between none and five", and
`collect` allocates against the lower bound. That is the same question
`private/size_hint.rs` answers from the other end of the pipe, where the number
came out of an input file and `cautious` caps it.

**What the trait does not promise.** Nothing in `Iterator` says what happens
after the first `None`, and a `for` loop cannot tell, because it stops there and
never asks again. The example's `Resurrecting` iterator yields, stops, and
starts again — legal — and a fused copy of it does not. That is the whole reason
`SeqDeserializer` stores `iter: iter::Fuse<I>`: the loop belongs to the
`Visitor`, which may ask past the end, and `end()` calls `count()` on the same
iterator afterwards to check the length. One word in a struct definition,
load-bearing.

**Then closures, which the crate cannot teach at all.** `examples/closure_kinds`
starts from what a closure is: a struct the compiler wrote, holding what it
captured, with one method. Its size is the size of its captures — zero words
when it captures nothing, one for a `&String`, three for a `String` moved in —
and there are three traits because there are three ways that one method can take
`self`. `FnOnce` takes `self` and may move its captures out; `FnMut` takes `&mut
self` and may change them; `Fn` takes `&self` and may only read. They nest, so
`|n| n * 2` implements all three, and the rule when you are writing the bound is
to ask for the weakest one that does the job.

Two more facts that surprise people, both made observable: every closure has its
own anonymous type, so two identical ones cannot share a `Vec` unless they
capture nothing and coerce to `fn` pointers; and `move` decides only *how* a
variable is captured, not *what* — since edition 2021 the compiler takes
`record.name` rather than all of `record`, and `move` on a `Copy` type makes a
copy, so a moved counter and the original count separately.

**Where this lands in serde.** A closure has exactly one call signature, and the
whole problem a `Deserializer` faces is that it does not know which type it
holds until it has looked. That is why serde is built out of visitors: a
`Visitor` is the closure with twenty-seven entry points, every `visit_*` taking
`self` by value because exactly one of them will run — `FnOnce`, written
longhand and multiplied by the data model. `DeserializeSeed` is closer still,
`fn deserialize(self, deserializer: D)` being a `FnOnce` that carries captured
state in, and its impl for `PhantomData<T>` is the seed that captured nothing,
zero-sized exactly as a non-capturing closure is.

The inventory is the honest ending. serde_core writes thirteen closures, all of
them arguments handed straight to a std combinator: eleven in `FnOnce` positions
(`map_err`, `map`, `ok_or_else`, and two constructors passed through
`parse_socket_impl!`), and two `FnMut` — the `try_for_each` line in
`collect_seq` and its twin in `collect_map`. It declares no `Fn` bound of its
own and no `dyn Fn` anywhere. It never asks you for a closure; it asks for a
type with named methods, which can have twenty-seven of them and can be written
by a derive macro.

Four compile-fail cases carry the rejections a running program cannot show: a
`for` loop consuming the vector it was handed, a `push` while a loop over the
same vector is alive, two identical closures refused from one `vec![]`, and a
counting closure offered where `Fn` was demanded.
"""

[[unit]]
id = "15-proc-macro-basics"
title = "What a derive macro is, and is not"
supplement = "none"
status = "written"
prereqs = ["01-why-a-data-model"]
rust_features = ["proc-macro-boundary", "modules", "result", "custom-errors"]
summary = """
A derive macro is a function from tokens to tokens, run by the compiler, with no
access to types, names or anything outside the item it was given. Everything
awkward about `serde_derive` follows from that, and so does everything clever.
"""
body = """
The whole public surface of `serde_derive` is fourteen lines. Two functions,
each taking a `TokenStream` and returning one, and that is the entire contract
with the compiler.

Read what those fourteen lines do *not* have. There is no type information: the
macro sees `x: MyType` as three tokens and cannot ask whether `MyType`
implements anything. There is no name resolution: `PhantomData` in a field type
might be `std::marker::PhantomData` or a local struct, and the crate decides by
comparing the string. There is no way to return an error: a failure has to be
*emitted as code*, which is what `syn::Error::into_compile_error` does — it
produces a `compile_error!` invocation that the compiler then executes.

Three consequences shape the rest of the crate.

**Errors are collected, not propagated.** `Ctxt` exists because a macro gets one
chance to report, and a user with four bad attributes should see four messages.
Its `Drop` impl panics if you forget to check, which is a deliberate choice to
make the macro author's mistake loud rather than the user's problem.

**Output needs a scope of its own.** Generated code cannot assume `serde` is in
scope, cannot introduce names into the user's namespace, and must work inside a
function body as well as at module scope. `wrap_in_const` is one anonymous
`const` block answering all three.

**The expansion has to be polite.** A `#[deprecated]` type produces a warning
when the generated code mentions it — in the user's build, about their own
deliberate deprecation — so the expansion carries `#[allow(deprecated)]` when it
needs to. There is a small file whose entire job is deciding that.

This is also the unit where the derive track's live expander is worth opening:
everything below is easier to read once you have seen what comes out.
"""

[[unit]]
id = "16-tokens-and-spans"
title = "Spans, and where a compiler error points"
supplement = "none"
status = "written"
prereqs = ["15-proc-macro-basics"]
rust_features = ["proc-macro-boundary", "macro-hygiene", "lifetimes"]
summary = """
Every token carries a source location. A macro that gets those wrong produces
diagnostics pointing at nothing, and serde's reputation for good error messages
is almost entirely the story of getting them right.
"""
body = """
A `proc_macro2::Span` says where a token came from, and the compiler uses it to
draw the squiggle. Tokens a macro invents have no natural location, so the macro
has to choose one — and the choice is the difference between

    error[E0277]: the trait bound `Foo: Serialize` is not satisfied
      --> src/main.rs:4:12
       |
    4  |     inner: Foo,
       |            ^^^ the trait `Serialize` is not implemented for `Foo`

and the same error pointing at `#[derive(Serialize)]` with no indication which
field caused it.

**`quote_spanned!` is the tool.** It is `quote!` with a span applied to every
token it produces, and `serde_derive` uses it at exactly the points where
generated code can fail to type-check: the call to `Serialize::serialize` for a
field, the call to a user's `serialize_with` function, the `Default::default()`
for a defaulted field. Each carries the span of the thing the user wrote, so the
error lands there.

Notice what is *not* spanned. Braces, structural keywords, the impl header —
all `call_site`, because they came from the macro and pointing at the user's
code would be a lie.

**Rewriting spans afterwards** is the other half. `respan` walks a token stream
and re-stamps everything, including recursively inside groups — `set_span` on a
group sets only its delimiters, which is a classic source of "why does this
error point at the wrong place". Its one caller is `replace_receiver`, which
substitutes `Self` for the concrete type before anything else runs, because the
generated impl is a different impl and `Self` there would mean the visitor.

**And there is no hygiene at all for generic parameters.** A derive macro cannot
introduce a type parameter the user's code definitely cannot see, so the crate
uses a convention — `__S`, `__D`, `__field0`, `__serde_state` — and a
`precondition` that rejects a user lifetime literally called `'de`. Convention
and a check, because the language offers nothing better.
"""

[[unit]]
id = "17-syn-and-a-narrower-ast"
title = "Parsing into your own AST, not syn's"
supplement = "none"
status = "written"
prereqs = ["16-tokens-and-spans"]
rust_features = ["pattern-matching", "trait-objects", "modules"]
summary = """
`syn` gives you a tree that describes Rust. `serde_derive` immediately converts
it into a smaller tree that describes what serde needs, and the difference
between the two is where most of the design lives.
"""
body = """
The input arrives as a `syn::DeriveInput`: a faithful syntax tree with three
data kinds, four field shapes and every generic form Rust allows. Almost none of
that distinction matters to code generation, and some of what does matter is not
in it.

So `internals::ast` defines its own. `Data` has two variants rather than three,
because unions are rejected before the tree is built. `Style` has four rather
than syn's three, because serde needs *newtype* separated from tuple — a
one-field tuple struct has its own place in the data model, and that single
extra variant is why a newtype wrapper is free on the wire.

Three lessons generalize past serde.

**Reject early, and narrow the type.** Every case that survives `from_ast` is a
case codegen must handle, which means no generator carries an arm for something
that cannot happen. The alternative — passing syn's types down and checking at
every use — is how a macro ends up with `unreachable!` in forty places instead
of four.

**Keep the original.** Every node here holds a borrow of the syn node it came
from, purely so an error can be spanned on the user's tokens. The parsed form is
for generating; the original is for complaining.

**Validate in two passes.** Anything decidable from one attribute is checked
while parsing it; anything needing two is checked afterwards, in `check.rs`,
against the assembled tree. The comment at the top of that file states the rule,
and following it is why the attribute parser is a flat chain rather than a
tangle.

There is a fourth thing worth noticing, because it is a wart rather than a
lesson: `check.rs` does not only check. `check_transparent` picks the field that
`#[serde(transparent)]` refers to and *records* it, which is why `check` takes
`&mut` and why the module is slightly misnamed. It is still the right call —
deriving that field twice, in two generators, with the same three-condition
rule, would be worse.
"""

[[unit]]
id = "18-quote-and-interpolation"
title = "Writing code that writes code"
supplement = "none"
status = "written"
prereqs = ["17-syn-and-a-narrower-ast"]
rust_features = ["macro-rules", "macro-repetition", "zero-cost"]
summary = """
`quote!` looks like a template language and behaves like one, with two twists
that decide how the whole crate is structured: interpolation is typed, and
repetition is driven by iterators.
"""
body = """
`quote!(fn #name() { #body })` produces tokens. Anything after `#` is
interpolated through the `ToTokens` trait, which means interpolation is *typed*:
a `syn::Ident` renders as an identifier, a `Name` renders as a string literal
carrying its original span, `None` renders as nothing at all.

That last one is used constantly and is worth internalizing. `#let_mut` in
`ser.rs` is an `Option<TokenStream>` that is `Some(mut)` or `None`, so the
template has no conditional in it — a struct whose fields are all skipped simply
gets `let __serde_state` with no `mut`, and no unused-mut warning in a build the
user cannot fix.

**Repetition** is `#(...)*`, and it iterates whatever the interpolated variables
iterate. `#(#serialize_stmts)*` splices a `Vec<TokenStream>` in sequence;
`#(#members: #placeholders),*` zips two iterators with a comma between. There is
one limitation the crate hits three times: a variable cannot be both a repeating
and a non-repeating interpolation in the same template, which is why you will
find `let private2 = private;` in `enum_untagged.rs`, `identifier.rs` and
`pretend.rs`.

**The `Fragment` type** is the crate's own addition and the thing most worth
stealing. Generated code goes into three kinds of position — expression,
statement sequence, match arm — and each needs different punctuation. Rather
than deciding at the splice site, every generator returns a `Fragment` saying
whether it produced an expression or a block, and three adapter types apply the
right braces or comma. Getting it wrong produces code that does not compile,
which is exactly where you want that class of mistake.

Finally, a worked example of a template with no runtime at all: `pretend.rs`
generates code whose only purpose is to be *compiled*. A remote derive's
placeholder struct never has its fields read, so rustc calls them dead; this
file emits `match None::<&T> { Some(T { a: __v0 }) => {} _ => {} }` to say
otherwise. For a `repr(packed)` struct it cannot even bind the fields — a
binding borrows, and a packed field cannot be borrowed — so it takes their
addresses instead.
"""

[[unit]]
id = "19-the-attribute-dsl"
title = "Designing an attribute language"
supplement = "none"
status = "written"
prereqs = ["18-quote-and-interpolation"]
rust_features = ["pattern-matching", "custom-errors", "strings"]
summary = """
`#[serde(...)]` accepts thirty-five names, most in two or three forms, with
rules about which may appear together. It is a language with a grammar, a
namespace and a type checker, and all three are in `internals/`.
"""
body = """
Start with the vocabulary: `symbol.rs` is thirty-five `const`s and four
`PartialEq` impls, and the impls are the point. They let a parser write
`if path == RENAME` instead of `path.is_ident("rename")`, which turns a typo
from an attribute that silently never matches into a compile error in the macro
itself.

**Accumulate, do not return.** Every attribute is parsed into an `Attr` slot
that reports its own duplicates, so writing `rename` twice produces one message
from one place rather than sixty call sites each remembering to check. `VecAttr`
is the same thing for attributes that may legitimately repeat, with an
`at_most_one` for the ones that may not.

**Two forms for free.** `rename = "x"` and `rename(serialize = "x",
deserialize = "y")` are the same attribute, and one function — `get_ser_and_de`
— handles both for `rename`, `rename_all`, `bound` and `alias`. That is why the
parser is a flat chain of two-line branches rather than a tangle.

**Parse strings as Rust.** `bound = "T: Serialize"` is not carried as text; it
is parsed into where-predicates immediately, and `respan` puts the user's own
span on every token of the result. A malformed bound is a syntax error
underlining the offending part *inside the string*, rather than a mystery in
generated code.

**Compile-time, not run-time.** `rename_all = "camelCase"` becomes a
`RenameRule` at parse time and is applied to every field name before codegen
starts. Nothing about renaming survives into the output: the emitted
`serialize_field` call carries the literal `"xCoord"`. If you internalize one
thing from this unit, make it that — renaming reads like a runtime feature in
the documentation and is entirely a compile-time one.

**Cross-cutting rules go somewhere else.** `check.rs` holds the ten checks that
need more than one attribute — the tag cannot collide with a field name, a
tuple field with a default requires defaults after it, `transparent` cannot
combine with `from`. The comment at the top of that file is the rule that keeps
the parser flat.

And one piece of restraint: `is_cow` carries a twenty-line comment stating its
own false positives and false negatives with examples. Every derive macro that
reasons about types by name has that limitation. Almost none of them say so.
"""

[[unit]]
id = "20-generating-an-impl"
title = "Bounds, generics, and types invented to hold a borrow"
supplement = "none"
status = "written"
prereqs = ["19-the-attribute-dsl", "04-generic-bounds", "09-phantomdata-and-variance"]
rust_features = ["generic-params", "where-clauses", "lifetimes", "marker-types", "associated-types"]
summary = """
The generics of a generated impl are never the generics of the input. Inferring
the difference is the hardest non-obvious work in the crate, and the wrapper
types it produces are a small masterclass in `PhantomData`.
"""
body = """
`impl<T> Serialize for S<T>` does not compile unless `T: Serialize` — but adding
that bound unconditionally rejects types that would have worked. `bound.rs` is
four hundred lines deciding which parameters actually need it.

**The inference.** A hand-written visitor walks the type of every field the
filter accepts, recording which declared parameters appear. A skipped field's
type is never visited, so its parameters pick up no bound. A field of type
`T::Assoc` records `T::Assoc: Serialize` rather than `T: Serialize`, because
bounding `T` says nothing about its associated type.

**And one hardcoded exception.** `PhantomData<T>` implements `Serialize` for
every `T`, so a parameter appearing only inside one must not be bounded. Five
lines, matched by name, with a comment saying "hardcoded exception" — and
without them every user with a non-serializable marker type would have to write
`#[serde(bound = "")]`. There is no way to ask this question properly from
inside a proc macro, because a proc macro has no type system.

**Declaration and use are different.** A default (`T = u32`) is legal in a
struct declaration and illegal in an impl header, where it parses as an
associated-type binding — so `without_defaults` strips them. A lifetime is
declared with bounds (`'de: 'a`) and used without them, which is why the
deserialize side has two wrapper types with hand-written `ToTokens` impls just
to render the same generics two ways.

**Wrapper types, and why they all carry `PhantomData`.** Three times in this
crate a value has to be passed somewhere that wants one `Serialize` — a
`serialize_with` field, an adjacently tagged payload, a flattened struct variant
— and each time the answer is a generated struct holding *references* to the
real fields. Each one needs a fresh lifetime, added by `with_lifetime_bound`
along with a bound on every existing parameter. And each one carries
`phantom: PhantomData<Type<Generics>>`, without which a parameter appearing only
behind a reference would be unconstrained and the impl would not compile.

Unit 09 introduced `PhantomData` as a marker. This is what it looks like when
something actually depends on it.
"""

[[unit]]
id = "21-enum-representations"
title = "Four ways to put an enum on the wire"
supplement = "none"
status = "written"
prereqs = ["20-generating-an-impl", "13-errors-and-control-flow"]
rust_features = ["pattern-matching", "zero-cost", "custom-errors"]
summary = """
External, internal, adjacent and untagged. They cost wildly different amounts to
read, and the reason is visible in the generated code: three of the four have to
buffer the input before they can decide what it is.
"""
body = """
Writing an enum is easy in all four representations — a `match` over `*self`,
one arm per variant, each arm calling a `Serializer` method. Reading one is
where they diverge, and the divergence is the whole content of this unit.

**Externally tagged** is the default and the only cheap one. The format's
`EnumAccess` hands over the variant name and *then* the payload, in order, so
the generated code dispatches on the name and reads the payload directly. Four
`VariantAccess` methods, one per shape, and nothing is held in memory.

**Internally tagged** puts the discriminant in a field of the payload's own map —
so the tag can arrive anywhere, and nothing can be parsed until it is found. The
generated code calls `deserialize_any` once with a visitor that buffers the
*entire* payload into serde's private `Content` type, finds the tag, then
replays the buffer into the chosen variant. That is not an implementation
choice; the representation forces it.

**Adjacently tagged** is the longest deserializer in the crate — 324 lines — and
almost all of them are about ordering. Tag first costs nothing. Content first
means buffering until the tag arrives. Then there are duplicate keys, unknown
keys to step over or reject, and a sequence form where a two-field struct is two
elements. The `Serialize` side is 120 lines.

**Untagged** buffers once and re-runs the buffer against every variant in order,
taking the first that succeeds. The `TODO` above the failure message is
upstream's and is worth reading: by the time the last variant fails, the reasons
the earlier ones failed have been discarded, so the error can only say "none of
these matched".

Two things to take away beyond enums.

The first is that **a representation that cannot tell the format what to expect
cannot work with a non-self-describing format.** `deserialize_any` is the call
that says "I do not know"; it appears in the internally tagged, adjacently
tagged and untagged paths and nowhere else.

The second is how much is *shared*. `enum_untagged::deserialize_variant` is
called by three of the four. `struct_::deserialize` reads a struct variant's
fields identically whatever encloses them. `deserialize_seq` serves tuples and
structs. Four representations, three reading paths — which is why the reference
track claims 4,728 lines of codegen in 261 annotations rather than the 338 a
count of `quote!` blocks predicted.
"""

[[unit]]
id = "22-implementing-a-deserializer"
title = "Implementing a Deserializer: bytes in, visitor calls out"
supplement = "none"
status = "written"
prereqs = ["03-associated-types", "06-ownership-and-borrowing", "08-lifetimes-de-and-zero-copy"]
rust_features = ["traits", "sealed-traits", "lifetime-de", "borrowing", "pattern-matching", "generic-params"]
examples = ["json_document"]
summary = """
Units 3 and 8 read `Deserializer` as a contract. This unit reads one being
kept: a JSON parser, from the trait that hands it bytes to the four lines
behind `from_str`. Most of what there is to learn is about who holds the
`&mut`.
"""
body = """
Everything so far has looked at `Deserializer<'de>` from the side that
declares it. `serde_core` says what a format must provide and never provides
it. `serde_json` is a format, and its `de.rs` is the first place in this
course where those methods have bodies.

**Two layers, and the lower one is sealed.** The parser does not read from a
slice or a stream. It reads from a `Read<'de>`, a trait with a byte-at-a-time
core of `next`, `peek` and `discard`, and three implementors. The trait is
public and cannot be implemented outside the crate, because its supertrait
lives in a private module. That is the sealed-trait pattern, and the reason
for it is here in the doc comments: every method has an informal contract,
such as "only valid after a call to peek", that upstream wants to stay free
to change.

**The trait is implemented for `&mut Deserializer<R>`, not for the struct.**
This is the line the unit turns on. Every method of `serde_core`'s
`Deserializer` takes `self` by value. If the struct implemented the trait,
reading one value would consume the parser. Implementing it for a mutable
reference means each nested value gets a re-borrow, written `&mut *self.de`,
and the parser is there again when the borrow ends. Unit 6 had to teach
`&mut` from written examples, because `serde_core` has almost no code that
passes one around, and it ended on the observation that a method taking
`self` by value consumes what it is called on. This file is what a format
does about that, and it does it on every path.

**One peeked byte decides.** `deserialize_any` skips whitespace, looks at the
next byte without consuming it, and matches. `n`, `t` and `f` are the three
literals, a digit or a minus sign is a number, a quote is a string, and a
bracket or brace opens a container. Seven patterns cover the whole grammar.
The typed methods, `deserialize_bool` and the rest, are the same frame with
one arm kept and a type error for everything else.

**The recursion goes through the visitor.** For an array, the parser does not
loop over elements. It gives the visitor a `SeqAccess` that borrows the
parser, and the visitor pulls. Each pull is `seed.deserialize(&mut *self.de)`,
a call back into the impl you are reading. A nested document is therefore a
nested call stack, with the type being built in control of when the parser
advances. `check_recursion!` puts a budget of 128 on that depth.

**Punctuation lives in the access objects.** `SeqAccess` and `MapAccess` each
hold the borrowed parser and one `bool`, `first`. That flag is all the state a
comma-separated list needs. The comma rules sit in a nested function that is
generic over the reader and not over the element type, so the compiler emits
them once per reader instead of once per type in your program.

Then read `from_trait` last. It is four lines: build a `Deserializer`, call
`T::deserialize(&mut de)`, call `end`, return. The second of those is where
control passes to the type, and it does not come back until the value is
complete.

Strings and numbers are passed over here. Each arm of the central match that
handles them is in this unit, and the machinery behind each is not: a string
may or may not be borrowed from the input, and a number may or may not fit in
an integer, and each of those questions has enough in it to be read on its
own.
"""

[[unit]]
id = "23-writing-a-serializer"
title = "Writing a Serializer: what to write, and what it looks like"
supplement = "none"
status = "written"
prereqs = ["03-associated-types", "05-default-methods", "22-implementing-a-deserializer"]
rust_features = ["traits", "associated-types", "default-methods", "borrow-splitting", "generic-params", "marker-types"]
examples = ["json_document"]
summary = """
Units 2 to 5 read `Serializer` as a contract with thirty methods and almost
no default bodies. This unit reads one format answering all thirty, and the
second trait it invents so that it only has to answer once.
"""
body = """
Unit 22 was the reading half of a format. This is the writing half, and it is
the shorter story, because a serializer makes no decisions about its input.
The type being serialized calls `serialize_bool` or `serialize_struct`, and
the format's only question is which bytes that means.

**The same first line.** `serde_core`'s `Serializer` is implemented for
`&'a mut Serializer<W, F>`, for the reason unit 22 gave on the other side:
the trait's methods take `self` by value, and one serializer has to write
many values. Every nested value is `value.serialize(&mut *self)`.

**Seven associated types, one answer.** Unit 3 counted the seven compound
types and said a format may use seven different ones. JSON has two kinds of
bracket, and all seven are `Compound`, an enum holding the borrowed
serializer and a three-valued `State`. What tells a tuple variant from a
plain sequence is not a field. It is which trait's `end` the caller invokes:
`SerializeSeq::end` writes one bracket and `SerializeTupleVariant::end`
writes a bracket and a brace. The outer object that `serialize_tuple_variant`
left open is recorded nowhere but in the type the caller is holding.

**Two traits, split on purpose.** No method of the `Serializer` impl writes a
byte. Each one calls a method of `Formatter`, a second trait this crate
declares, and passes it the writer. `Serializer` says what is being written in
terms of the data model. `Formatter` says what that looks like. Read
`serialize_newtype_variant` once slowly for the shape: eight calls, seven of
which only tell the formatter where it is.

**Unit 5, the other way round.** Unit 5 was about `serde_core` giving
`Serializer` almost no default methods, so that silence from a format is a
compile error. `Formatter` is the opposite design in the same file. Every one
of its methods has a body, the bodies together are compact JSON, and
`CompactFormatter` is a unit struct with an empty impl. `PrettyFormatter`
overrides nine of them and keeps three fields. The difference follows from who
implements each trait: a format that forgot `serialize_u64` would be broken,
and a formatter that forgot `end_array_value` wants the default.

**Commas go before, not after.** `State::First` and `State::Rest` are the
whole of the separator logic. A serializer cannot know an element is the last
one until `end` is called, so the comma is written in front of every element
but the first. It is the same single flag `SeqAccess` kept in unit 22, on the
side that produces the punctuation instead of checking it.

**A second serializer, for keys.** JSON object keys are strings and Rust map
keys are not. `SerializeMap::serialize_key` does not pass the key to the
serializer you have been reading. It wraps the borrow in `MapKeySerializer`,
a different type with its own impl of all thirty methods: integers and
booleans are written between quotation marks, and the seven compound methods
return errors. Their associated types are `serde_core`'s `Impossible`, the
uninhabited type from unit 9, so the signatures already say that `Err` is the
only thing those methods can return.

End on `to_writer`. It builds a `Serializer` and calls
`value.serialize(&mut ser)`, and that one call is the handover, as
`T::deserialize(&mut de)` was in `from_trait`.

Four things in this file are left for later units: the string scanner and its
escape table, the float methods and what they do with NaN, the two emitter
types that exist only behind a feature, and the unchecked conversion inside
`to_string`.
"""

[[unit]]
id = "24-strings-escapes-and-borrowing"
title = "Strings, escapes, and borrowing from the input"
supplement = "none"
status = "written"
prereqs = ["07-lifetimes-basics", "08-lifetimes-de-and-zero-copy", "22-implementing-a-deserializer", "23-writing-a-serializer"]
rust_features = ["strings", "lifetime-de", "lifetimes", "borrowing", "hrtb", "closures", "zero-cost"]
examples = ["json_document"]
summary = """
Unit 8 said a visitor may be offered a string that lives as long as the
input. This unit reads the code that decides whether to make that offer, one
string at a time, and the code on the other side that writes a string back
out. The decision is an enum with two variants and two lifetimes.
"""
body = """
Unit 8 taught `'de` from the receiving end. `visit_borrowed_str` hands the
visitor a `&'de str` it may keep, `visit_str` hands it one it may not, and
`serde_core` leaves it to the format to know which it has. Unit 22 walked past
the string arm of the parser and said the machinery was worth reading on its
own. This is that machinery.

**The answer is a value, not a type.** `Reference<'b, 'c, T>` has two
variants, `Borrowed(&'b T)` and `Copied(&'c T)`. They hold the same kind of
pointer and differ only in what it points into: the input, or a scratch
buffer the parser owns. `parse_str` returns one, and the string arm of
`deserialize_any` matches on it. `Borrowed` becomes `visit_borrowed_str`.
`Copied` becomes `visit_str`. That `match` is all of zero-copy
deserialization in `serde_json`, and it is decided per string at run time.

**What decides it is a backslash.** Read `SliceRead::parse_str_bytes`. It
skips to the next quote, backslash or control character. If the first thing
it reaches is the closing quote and nothing has been copied, the string is a
sub-slice of the input and comes back `Borrowed`. If it reaches a backslash,
the run before it goes into scratch, the escape is decoded into scratch, and
from there the string is `Copied`. So `"x"` can be borrowed and `"\\u0078"`
cannot, though they are the same string. This unit's example reads both
into a `&str` field, and the second is an error.

**And which reader you chose.** `IoRead` has no stable buffer to point into.
Its string methods end in `.map(Reference::Copied)` on every path, so a type
holding `&'de str` cannot be read with `from_reader` at all. That is the
run-time face of the bound unit 22 pointed at, `DeserializeOwned` on
`from_reader`.

**The line that needed a higher-ranked bound.** `parse_str_bytes` takes a
closure that converts the finished bytes into the result type, and it calls
that closure with input bytes in one branch and scratch bytes in the other.
The two have different lifetimes. `for<'f> FnOnce(&'s Self, &'f [u8]) ->
Result<&'f T>` says the closure works for any lifetime it is given. Unit 8
met `for<'de>` inside `DeserializeOwned`. Here it is doing ordinary work:
one function body, two callers' worth of lifetimes.

**Skipping is done a word at a time.** Most bytes of most strings are
ordinary, and `skip_to_escape` tests a machine word of them per step. Read
the annotation for the arithmetic. The point for this unit is where the cost
went: the common case of a string with no escapes is a scan and a slice, with
no allocation and no copy.

**Escapes are where JSON's history shows.** Eight of the nine are one byte.
`\\u` is four hex digits, validated by two lookup tables and a single sign
check, and a code point above `U+FFFF` is two of them in a row because JSON
inherited UTF-16's surrogate pairs. `parse_unicode_escape` handles a pair, a
lone half, and a half followed by an unrelated escape. Text must be
well-formed. `deserialize_bytes` asks for the non-validating scan, and a lone
surrogate is let through as bytes that are not UTF-8.

**Writing is the same scan, backwards.** `format_escaped_str_contents` walks
the string with a 256-entry table. A zero entry means the byte is written as
it is. Runs of those are written as one fragment each, so a string with
nothing to escape is one call. The table marks the same three classes of
byte the reader stops at: the quote, the backslash, and everything below
`0x20`. Bytes from `0x80` up are zero, so non-ASCII text goes out as UTF-8
and is never `\\u`-escaped. The reader accepts `\\/` and the writer never
produces it.

Four `unsafe` blocks sit in the code this unit covers: a pointer subtraction
in `skip_to_escape`, and in the writer two unchecked conversions and an
`unreachable_unchecked`. Each annotation gives the argument for its own. A
later unit reads those arguments side by side with the rest of the crate's.
"""

[[unit]]
id = "25-numbers-and-round-tripping"
title = "Numbers, and what survives a round trip"
supplement = "none"
status = "written"
prereqs = ["04-generic-bounds", "22-implementing-a-deserializer", "23-writing-a-serializer"]
rust_features = ["pattern-matching", "option", "result", "macro-rules", "cfg", "traits"]
examples = ["json_numbers"]
summary = """
JSON has one number type and the data model has a dozen. This unit reads the
parser deciding which one a run of digits is, the arithmetic it does so
without overflowing, and the two places where a number written out does not
come back as it went in.
"""
body = """
Unit 4 read `visit_i8` through `visit_i64` and found serde's widening policy
in their default bodies: a visitor that only implements `visit_i64` still
accepts an `i8`. That was the receiving side of a negotiation. This unit is
the sending side, in a format whose numbers carry no type at all.

**Three shapes, chosen from the text.** `ParserNumber` is `U64`, `I64` or
`F64`, and those are the only three calls the parser ever makes into a
visitor. A `.` or an `e` after the integer digits makes a float. Otherwise the
sign decides between the other two. The typed methods do not change this:
`deserialize_u8` and `deserialize_i64` are one macro invocation each and run
the same function, and neither uses the width in its name. The example's
second block shows whose check it is. `256` into a `u8` is an error that says
"expected u8", and that sentence was written by `serde_core`'s visitor, not by
the parser.

**Overflow is tested before it happens.** `parse_integer` accumulates digits
with `significand * 10 + digit`. In a debug build that expression panics when
it overflows, and in a release build it wraps, and neither is acceptable in a
parser. `overflow!` asks the question without doing the multiplication, by
comparing against `u64::MAX / 10`. The macro's matcher contains the literal
tokens `* 10 +`, so the call site reads as the arithmetic it guards.

**When the digits do not fit, the answer is a float, not an error.**
`18446744073709551615` is `u64::MAX` and comes back an integer. Add one and
it comes back `1.8446744073709552e+19`. The same happens one past the bottom
of `i64`. A JSON integer may have any number of digits, and upstream chose
the nearest `f64` over a refusal.

**Negative zero is the careful case.** `parse_number` negates with
`wrapping_neg` and then tests whether the result is negative. That one test
catches a magnitude too large for `i64`, where the cast wrapped, and a
magnitude of zero. Both become floats. `-0` is the `f64` negative zero
because an integer would have thrown the sign away.

**`checked`, `wrapping`, `saturating`.** Rust makes you say what you want
from arithmetic that might not fit, and the code in this unit uses all three
on purpose.
`wrapping_neg` where the wrapped value is itself the signal.
`saturating_add` on exponents, where a clamped exponent gives the same
answer as the true one. `checked_mul` in the float fast path, where failure
means "take the slower path". Read each as a decision, because each is one.

**Out is the easy direction.** `write_f64` asks `zmij` for the shortest
decimal text that reads back as the same float, so `0.1` is written `0.1`.
`f32` has its own method for the reason the example's two `0.1f32` lines
show: the shortest text depends on the width.

**Two things do not round trip, and the example runs both.** NaN and the
infinities serialize as `null`, without an error, and `null` does not read
back as an `f64`. That is `serialize_f64`'s `match` on `classify()`.

The other is subtler and is the reason a fifth of this crate exists. The
default conversion in `f64_from_parts` turns the significand into a float
and then multiplies or divides by a power of ten from a table. Those are two
roundings, and two roundings can land one float away from the nearest one.
The example parses `2.2250738585072011e-308` and prints the bits beside the
standard library's answer for the same text. They differ in the last place.

With the `float_roundtrip` feature the same function has a different body,
and calls `lexical::parse_concise_float`. Read that function as an outline:
a fast path where one floating-point operation is provably exact, a moderate
path that tracks its own error, and a slow path in big-integer arithmetic.
The module's header says what it is for. Every float the serializer writes
must read back to the same bits, and parsing arbitrary digit strings
perfectly is explicitly not the goal.

That is two functions with one name under opposite `#[cfg]`s, and it is the
first of many in this crate. What the feature buys is a parse that is right
in the last bit. What it costs is nineteen files that a default build never
compiles.
"""

[[unit]]
id = "26-the-value-tree-and-json-macro"
title = "The `Value` tree, and the `json!` muncher"
supplement = "none"
status = "written"
prereqs = ["03-associated-types", "11-macro-rules", "22-implementing-a-deserializer", "23-writing-a-serializer"]
rust_features = ["associated-types", "traits", "macro-rules", "macro-repetition", "macro-hygiene", "collections", "sealed-traits", "closures"]
examples = ["json_value"]
summary = """
A format does not have to be bytes. `Value` is an enum with six variants,
and `serde_json` implements `Serializer` and `Deserializer` over it a second
time. Then the macro that writes one from a literal, which is unit 11's
`macro_rules!` used as a parser.
"""
body = """
Unit 3 said the format chooses `type Ok`, and gave the example that a
serializer writing into a string might choose `()`. Unit 23 read that
serializer. This unit reads the one that chose something else.

**The same trait, with `Ok = Value`.** `value::Serializer` is a unit struct.
It has no writer and no state, so it is implemented by value and not for a
`&mut`. What it returns from each method is the output. `to_value` is one
line, `value.serialize(Serializer)`, and the example runs one struct through
it and through `to_string`. The struct's `Serialize` impl is the same code
both times and does not know which it was given.

The compound types differ too, and for a reason you can now state. The text
serializer used one `Compound` for all seven because a bracket is a bracket.
A tree builder has to remember different things: a vector, a vector and a
variant name, a map and a key waiting for its value. So there are four types.

**A tree is a format.** `from_value` is also one line, `T::deserialize(value)`,
which compiles because `Value` implements `Deserializer`. Its
`deserialize_any` is a `match` on six variants where the parser's was a
`match` on seven byte patterns, and both feed the same visitor methods.

It is implemented twice, and the difference is unit 24's subject again. For
`Value` by value, deserializing consumes the tree and a string is handed
over as an owned `String`. For `&'de Value` the trait's lifetime is tied to
the borrow, and a string is delivered with `visit_borrowed_str`. The example
reads a struct with a `&str` field out of `&tree` and checks that the field
points into the tree. The `for &'de Value` in that impl's header is the
whole reason that works.

**`Value` itself is a `Deserialize` type**, with a visitor that accepts
anything. That is how `from_str::<Value>` works: the parser from unit 22
drives it like any other type. Nothing in `de.rs` knows `Value` exists.

**Indexing that does not panic.** `value["a"][0]` returns `Null` for a
missing key, an index out of range, or the wrong kind of value. The impl
needs somewhere for that reference to point, and it is a `static NULL`.
Read the comment above it, which argues for the choice. Writing through
brackets is the other half and is not symmetric: a string index creates the
key, turns a `Null` into an object on the way, and panics where it can do
neither. The trait behind both is sealed, the way `Read` was in unit 22.

**`pointer_mut` and one `move`.** The two pointer methods are the same
iterator chain with `try_fold`. The mutable one needs `move` on a closure
that the shared one does not, because a `&mut` cannot be copied into a
closure and the returned reference has to outlive it. Unit 14 taught closure
captures from written examples. This is one in the crate.

**Then the macro.** Unit 11 read macros that stamp out impls: a list of
types in, one impl per type out. `json!` is a different kind of thing. It
parses. Its input is not Rust, and `macro_rules!` has no loop, so
`json_internal!` consumes one element, appends the result to an accumulator
written into its own arguments, and calls itself on what is left. That is a
token-tree muncher.

Three things in it are worth the time. The order of the rules is the
design: `null`, `[...]` and `{...}` are matched before the general
`$next:expr` rule, because `[1, 2]` is also a Rust expression, and once the
`expr` matcher has captured something it is opaque and cannot be matched
again. The object rules carry the remaining tokens twice, so that an error
can be reported at the token the user wrote. And the last rule, for any Rust
expression, expands to `to_value(&expr).unwrap()`. A macro cannot return an
error to its caller, so `json!` on a value whose `Serialize` impl fails is a
panic at run time, and the documentation says so.

The example's `json!` line was written with its keys in the order `z`, `a`,
`computed`, and they print sorted. `Map` is a `BTreeMap` in this build. It
does not have to be, and that is the next unit but one.
"""
