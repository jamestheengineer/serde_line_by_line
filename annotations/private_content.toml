title = "The data model as a data type, minus two variants"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "01-why-a-data-model"
rust_features = ["pattern-matching", "smart-pointers", "collections", "lifetime-de"]
prereqs = ["private-content-0001", "de-mod-0015"]
body = """
Twenty-two variants covering the twenty-nine-type data model in concrete form.
Worth reading beside `Unexpected` in `de/mod.rs`: that enum describes what was
found for an error message, this one *stores* it.

Three details repay attention.

`Str(&'de str)` and `Bytes(&'de [u8])` sit next to `String(String)` and
`ByteBuf(Vec<u8>)`, so the buffer preserves whether the input was borrowable.
Buffering an untagged enum does not force a copy of every string.

`Some`, `Newtype` and the map/seq variants box or vector their contents, because
an enum containing itself by value would have no finite size. `Map` is a `Vec`
of pairs rather than a real map — it has to preserve order and duplicates, since
it does not yet know which variant will consume it.

And what is missing: there is no `I128` or `U128`. The 128-bit types were added
to the data model later than this enum, and nothing filled the gap. A value that
must pass through this buffer therefore has nowhere to put a 128-bit integer —
which is one concrete reason the "obsoleted" note above it exists.
"""
