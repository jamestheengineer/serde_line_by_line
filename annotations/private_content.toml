title = "Four lines of comment that deprecate the file"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["visibility", "proc-macro-boundary"]
prereqs = ["private-mod-0001"]
body = """
    // Used from generated code to buffer the contents of the Deserializer when
    // deserializing untagged enums and internally tagged enums.
    //
    // Not public API. Use serde-value instead.
    //
    // Obsoleted by format-specific buffer types (https://github.com/serde-rs/serde/pull/2912).

Three separate statements, each doing different work. The first says what the
type is for: `#[serde(untagged)]` has to try variants in order, which means
reading the input once and replaying it, which means holding it somewhere. This
enum is that somewhere.

The second heads off the obvious misuse. `Content` looks exactly like the
generic value type people want, and pointing at `serde-value` is more useful
than a refusal.

The third is the one worth acting on: this design has been superseded. Formats
can now supply their own buffer type — that is what `__deserialize_content_v1`
on the `Deserializer` trait is for — so the format buffers into its own
representation instead of being flattened into serde's. Reading the linked PR is
the fastest way to understand why the method with the version number in its name
exists.
"""

[[annotation]]
