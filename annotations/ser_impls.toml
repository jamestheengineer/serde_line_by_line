[[annotation]]
id    = "ser-impls-0001"
file  = "src/ser/impls.rs"
lines = "1-4"
title = "Two imports for a thousand lines of impls"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules", "cfg", "no-std", "traits"]
prereqs = ["ser-mod-0010"]
body = """
`crate::lib` is not a standard module. It is the facade that the `crate_root!`
macro generates in `src/crate_root.rs`: one place that re-exports `String`,
`Vec`, `Box`, `Cow`, `PhantomData` and the rest from `core`, `alloc`, or `std`
depending on which features are enabled. Every module glob-imports it, so the
`#[cfg]` wrangling happens once instead of nineteen times. That is why you will
not find a single `#[cfg(feature = "alloc")] use alloc::...` below, in a file
that implements `Serialize` for types drawn from all three crates.

The second line imports four names, and two of them are here only so that method
calls resolve. `Error` is a trait, and calls like `S::Error::custom("lock poison
error while serializing")` further down need it in scope. `SerializeTuple` is the
same: the array and tuple impls call `seq.serialize_element(...)`, which is one
of its methods. Neither is named in a type position anywhere in this
file — they are imported for their methods alone, which is a thing Rust makes you do and
never tells you about until an error message does.
"""

[[annotation]]
id    = "ser-impls-0002"
file  = "src/ser/impls.rs"
lines = "5-20"
title = "primitive_impl! — sixteen impls from thirteen lines"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "10-macro-rules"
rust_features = ["macro-rules", "macro-repetition", "traits", "inlining", "monomorphization"]
examples = ["primitive_dispatch"]
prereqs = ["ser-mod-0012", "ser-mod-0019"]
body = """
Thirteen lines that become sixteen `Serialize` implementations. The matcher is
where the design is:

```rust
($ty:ident, $method:ident $($cast:tt)*)
```

The first two fragments are unremarkable — a type name and a method name, pasted
into the body. The third is the interesting one.

**Why `$($cast:tt)*`.** It is a repetition with no separator, so it matches
either nothing at all or a run of arbitrary tokens. Fifteen invocations pass
nothing. One passes `as i64` and one passes `as u64`, and those two tokens get
spliced directly into `serializer.$method(*self $($cast)*)` to produce
`*self as i64`.

`tt` is the only fragment specifier that could work here. `as i64` is not an
expression, not a type, and not any other nameable fragment — it is a piece of
one. It also has to stay *transparent*: once `macro_rules!` matches something as
`expr` or `ty`, the result is a single opaque AST node that cannot be pasted next
to neighbouring tokens to build a larger expression. `tt` keeps tokens as tokens.
This is the most common thing to get stuck on when writing a declarative macro
for the first time, and this macro is a five-line demonstration of the fix.

**What the body assumes.** `*self` is a copy, so every type passed in must be
`Copy` — which is also why `str` and `String`, immediately below, are written
out longhand instead. There is no `where` clause and no bound on `$ty`: these
are sixteen concrete types, so there is nothing to constrain.

**`$ty:ident`, not `$ty:ty`.** All sixteen arguments happen to be single
identifiers, so the narrower specifier is enough. It also documents the
restriction: you cannot invoke this with `Vec<u8>`.

**Definition order matters.** Unlike an `fn` or a `struct`, a `macro_rules!`
macro is only in scope *after* its definition, textually. That is why the
definition sits directly above its uses here and in every other macro-driven
file in this crate — not style, but the only arrangement that compiles.
"""

