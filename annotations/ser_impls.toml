[[annotation]]
id    = "ser-impls-0004"
file  = "src/ser/impls.rs"
lines = "22"
title = "isize → serialize_i64, widened"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-repetition"]
macro_def = "ser-impls-0002"
body = """
There is no `serialize_isize` on `Serializer`, and this line is why the macro
accepts a trailing token sequence at all.

`isize` is 64 bits on a typical host and 32 bits under `wasm32`. Putting a
platform-dependent width into the data model would make the same program emit
values of different types on different targets, so serde widens first and formats
only ever see `i64`. Run the example: the method name in the trace is
`serialize_i64` no matter where it runs.
"""

[[annotation]]
id    = "ser-impls-0005"
file  = "src/ser/impls.rs"
lines = "23-27"
title = "i8 … i128 → one method each"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["default-methods"]
macro_def = "ser-impls-0002"
prereqs = ["ser-mod-0021"]
body = """
Five exact-width types, five dedicated methods, no casts. A format that treats
all signed integers alike can funnel them into one place — `Serializer`'s own
docs suggest it — but that collapse is the format's decision, taken after the
model has said precisely which type it had.

`i128` is the exception in the group: its `Serializer` method is one of only two
of these sixteen with a default body, and that body returns
`Err(Error::custom("i128 is not supported"))`. Nothing here knows that. This impl
forwards exactly like its neighbours, and a format that never opted in fails at
run time rather than at compile time.
"""

