body = """
Two required methods, two plain forwards, no casts. Everything difficult about
floats — shortest round-tripping decimal strings, `NaN`, the infinities — happens
on the format's side of this call, which is exactly why the invocation is one
line long.
"""

[[annotation]]
id    = "ser-impls-0009"
file  = "src/ser/impls.rs"
lines = "36"
title = "char → serialize_char, and the end of the macro"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["sized-bound", "strings"]
macro_def = "ser-impls-0002"
prereqs = ["ser-mod-0025"]
body = """
The sixteenth and last invocation, and the end of the generated stretch.

Look at what follows: `str` and `String` get impls written out longhand, in
blocks nearly identical to what the macro would have produced. The reason is one
character in the transcriber. `*self` copies, and `str` is not `Sized` — there
is nothing to copy. Both impls pass `self` by reference instead, so the body
differs, so no macro. That is the whole boundary between the generated half of
this file and the hand-written half.
"""
