Two glob re-exports under opposite `#[cfg]`s. Code elsewhere imports from
`large_powers` and gets the 32-bit or the 64-bit table without a `#[cfg]`
of its own.

This is the same facade idea as `io/mod.rs`, selecting on a cfg from the
build script instead of a Cargo feature.
