[[annotation]]
id    = "json-lib-0001"
file  = "src/lib.rs"
lines = "1-37"
title = "The crate documentation — three ways to hold JSON"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["modules"]
body = """
The crate-level docs open by sorting JSON handling into three kinds: as
text, as a loosely typed tree, and as a strongly typed Rust structure.

That list is also a map of the crate. Text to and from types is `de.rs`
and `ser.rs`. The tree is `value/`. And the conversions between tree and
types are the second `Serializer` and `Deserializer` in `value/`. You have
now read all of them.
"""

[[annotation]]
id    = "json-lib-0002"
file  = "src/lib.rs"
lines = "38-114"
title = "Untyped values — and an honest account of their limits"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
This section shows the `Value` enum, parses a document into one, and
indexes it.

Two paragraphs are worth more than the example. The first explains why
printing `v["name"]` shows quotation marks: a `Value` prints as JSON. The
second is a warning. `Value` is "tedious" for anything substantial, error
handling is verbose, and "the compiler is powerless to help you" when a key
is misspelled. `v["nmae"]` compiles and evaluates to null.

The enum shown in the first code block is a copy written into the docs,
with hidden lines to make it compile as a doctest. It is not the
definition.
"""

[[annotation]]
id    = "json-lib-0003"
file  = "src/lib.rs"
lines = "115-176"
title = "Typed parsing — the same function, a different type annotation"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits"]
body = """
The typed example parses the same text into a `Person` struct. The comment
inside it makes the point: this is the same `from_str`, and the only
difference is the type of the variable the result is assigned to.

That works because `from_str` is generic over `T: Deserialize`, and type
inference fills in `T` from the annotation.

The closing paragraph gives the argument for typed data in terms of tools.
Field names autocomplete, and `p.phones[0]` is known to be a `String`.
"""

