[[annotation]]
id    = "json-lib-0009"
file  = "src/lib.rs"
lines = "364-370"
title = "Restrictions — no question mark, documented, no_std"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["no-std", "cfg"]
body = """
Six attributes that constrain the crate.

`deny(clippy::question_mark_used)` forbids the `?` operator anywhere in
the crate. The replacement is the `tri!` macro defined below, and the
reason is given there.

`allow(non_upper_case_globals)` is for one item: the associated constant
`should_early_return_if_failed` in `read.rs`.

`deny(missing_docs)` makes an undocumented public item a compile error.
`no_std` removes the standard prelude, which is why every file imports
`String` and `Vec` from `alloc` by name.
"""

[[annotation]]
id    = "json-lib-0010"
file  = "src/lib.rs"
lines = "371-383"
title = "A compile error for an impossible configuration, and three extern crates"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "28-feature-gated-engineering"
rust_features = ["cfg", "no-std"]
prereqs = ["lib-0002"]
body = """
If neither `std` nor `alloc` is enabled, `compile_error!` stops the build
with a sentence explaining what to do. Without it, the user would get
hundreds of errors about missing types.

`extern crate alloc` is unconditional. `extern crate std` is added when the
feature is on, which is how a `no_std` crate regains `std`.

`extern crate serde_core as serde` is the line behind every `serde::de` and
`serde::ser` path in this crate. The dependency is `serde_core`, the crate
this site annotated first, under the name `serde`.
"""

[[annotation]]
id    = "json-lib-0011"
file  = "src/lib.rs"
lines = "384-390"
title = "__private — a path for macro-generated code"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules", "visibility", "macro-hygiene"]
body = """
A public, hidden module containing a re-export of `alloc::vec`.

The `json!` macro expands in the caller's crate and needs to construct a
`Vec`. It cannot assume the caller has `vec!` in scope, since the caller
may be `no_std`. So the expansion names `$crate::__private::vec!`, a path
that is valid from anywhere.
"""

[[annotation]]
id    = "json-lib-0012"
file  = "src/lib.rs"
lines = "391-407"
title = "The public API — six re-exports"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "28-feature-gated-engineering"
rust_features = ["modules", "visibility", "cfg"]
body = """
Everything a user calls as `serde_json::something`. The functions, the two
engine types, the error, and the `Value` family.

`from_reader`, `to_writer`, `to_writer_pretty` and `Serializer` are
re-exported only with `std`. `to_string` and `to_vec` are available without
it.

`#[doc(inline)]` makes the documentation for each item appear at the crate
root, as though it were defined here.
"""

[[annotation]]
id    = "json-lib-0013"
file  = "src/lib.rs"
lines = "408-418"
title = "tri! — the question mark, without the conversion"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["macro-rules", "result", "zero-cost"]
prereqs = ["crate-root-0006"]
body = """
The macro you have seen on nearly every fallible line of this crate. It
matches a `Result`, yields the value on `Ok`, and returns the error on
`Err`.

The `?` operator does the same and one thing more. It passes the error
through `From::from`, so that a function can return a different error type
from the one it received. This crate has one error type and never needs the
conversion.

The comment gives the measured benefit of leaving it out: four percent
fewer lines of LLVM IR. Each `?` instantiates a `From` call for the
optimizer to remove, and with this macro it is never generated.

It is defined before the `mod` declarations because a `macro_rules!` macro
is visible only to code that comes after it in the source.
"""

[[annotation]]
id    = "json-lib-0014"
file  = "src/lib.rs"
lines = "419-441"
title = "Twelve modules — which are public, and which exist at all"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "28-feature-gated-engineering"
rust_features = ["modules", "visibility", "cfg"]
prereqs = ["json-lib-0010"]
body = """
The module tree. `#[macro_use]` on `macros` makes the `json!` family
available to the modules declared after it.

`de`, `error`, `map` and `value` are public modules. `ser` is declared
twice. With `std` it is `pub mod ser`. Without, it is a private `mod ser`,
and its functions are reachable only through the re-exports above.

`io`, `number` and `read` are always private. Their public types reach
users through `de`, `value` and the crate root.

Three modules exist only under a feature. `iter` needs `std`, `lexical`
needs `float_roundtrip`, and `raw` needs `raw_value`. These three lines are
the gates the files themselves do not carry.
"""
