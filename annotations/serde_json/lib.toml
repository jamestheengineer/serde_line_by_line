body = """
`html_root_url` tells rustdoc where this crate's docs live, so that links
from other crates' documentation resolve. It contains the version number,
which is one of the lines that changes in every release.

The first `allow` block silences twenty Clippy lints from the default set.
One carries a link to a Clippy bug report. The rest are places where
upstream prefers its own style, such as `float_cmp`, which a float parser
cannot avoid.
"""

