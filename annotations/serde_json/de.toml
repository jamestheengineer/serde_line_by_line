body = """
The first example is the common case: open a file, wrap it in a
`BufReader`, deserialize a struct.

The second is the workaround for the socket problem. It builds a
`Deserializer` by hand with `from_reader` and calls `User::deserialize(&mut
de)` directly. Nothing calls `end`, so nothing waits for the connection to
close.

The hidden lines beginning with `#` split `main` in two. The visible program
has a `main` that opens a file or a port. The compiled doctest has an empty
`main` and an uncalled `fake_main`, so the example is type-checked and never
touches the filesystem or the network.

The errors section separates two kinds of failure: the input has the wrong
structure, or the structure is right and the type's own `Deserialize` impl
rejects the data.
"""

[[annotation]]
id    = "json-de-0096"
file  = "src/de.rs"
lines = "2622-2631"
title = "from_reader — and why its bound is DeserializeOwned"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["cfg", "where-clauses", "lifetime-de"]
prereqs = ["de-mod-0022"]
body = """
The body is one line. The signature is the lesson.

`T: de::DeserializeOwned` means `T` can be deserialized for *every* input
lifetime, which is another way of saying it borrows nothing from the input.
A type containing `&'a str` does not satisfy the bound, so trying to
deserialize borrowed data from a reader is a compile error at the call site.

Without the bound, the same attempt would compile and then fail at run time
with "expected a borrowed string", since the stream reader never produces a
borrowed one. The bound moves that failure to the compiler.
"""

