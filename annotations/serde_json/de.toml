Here the bound is `T: de::Deserialize<'a>`, with `'a` the lifetime of the
slice. `T` may hold references into `v`, and the borrow checker will keep `v`
alive as long as the result.

The doc comment's errors section is the same text as on `from_reader`. The
example parses a byte-string literal, which is why the quotation marks
inside it are escaped.
"""

