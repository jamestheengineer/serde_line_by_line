body = """
The fraction and exponent, scanned into the buffer.

`scan_decimal` requires at least one digit after the point, as every version
of this grammar does. `scan_exponent` requires at least one digit after the
optional sign.

There is one place the text is not copied faithfully. The exponent marker is
pushed as a lower-case `e` whatever the input had, and if no sign was written
a `+` is inserted. So `1E5` is stored as `1e+5`. The value is the same. The
spelling is not, which matters if you expected `arbitrary_precision` to
preserve a number byte for byte.
"""

[[annotation]]
id    = "json-de-0039"
