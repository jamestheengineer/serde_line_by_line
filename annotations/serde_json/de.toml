The end of the text-buffer path. The scratch buffer is split at `integer_end`
and the two halves go to `lexical::parse_truncated_float` with the exponent.

"Truncated" refers to the fast representation being unable to hold all the
digits, which is how this path was entered. The function it calls is the slow,
exact algorithm.

The shape matches the other `f64_from_parts`: choose a precision from the
flag, reject infinity, apply the sign.
