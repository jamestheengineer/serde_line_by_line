[[annotation]]
id    = "json-de-0057"
file  = "src/de.rs"
lines = "1517-1559"
title = "char, str and string — one method and two forwards"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "lifetime-de"]
body = """
`deserialize_char` and `deserialize_string` both call `deserialize_str`. JSON
has one kind of string, and what distinguishes a `char` from a `String` is
what the visitor does with the text.

`deserialize_str` is the string arm of `deserialize_any` with a type error
for everything else. The same `Borrowed` and `Copied` split decides between
`visit_borrowed_str` and `visit_str`.

`serde_core`'s contract describes `deserialize_string` as a hint that the
visitor would like ownership. This format ignores the hint. It always offers a
reference, and a `String` visitor copies it.
"""

[[annotation]]
id    = "json-de-0058"
file  = "src/de.rs"
lines = "1560-1632"
title = "deserialize_bytes — what the documentation commits to"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["strings"]
body = """
Seventy lines of documentation for one method, because the behaviour is a
deliberate departure and upstream wants it on record.

The quoted passage from RFC 7159 is the justification. The JSON grammar
permits escapes such as `\\uDEAD` that are not Unicode characters, and says
software receiving them behaves unpredictably. `serde_json` chooses to be
predictable in two different ways depending on the target type. Into a Rust
string type, such input is an error. Through this method, it succeeds and
yields WTF-8 bytes.

The two examples pin that down. The first passes raw non-UTF-8 bytes through
a JSON string unchanged. The second shows a lone surrogate escape becoming the
three bytes `ED A0 81`.

What is still enforced is stated twice: escapes are processed, and a `\\u`
escape must still be four hex digits. You have read the code that implements
this, in `parse_unicode_escape` with `validate` set to false.
"""

[[annotation]]
id    = "json-de-0059"
file  = "src/de.rs"
lines = "1633-1670"
title = "deserialize_bytes and deserialize_byte_buf — a string, or an array"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "lifetime-de"]
body = """
For a string, this calls `parse_str_raw` where the string methods call
`parse_str`. That is the non-validating scan, and its result goes to
`visit_borrowed_bytes` or `visit_bytes` by the same rule as for text.

There is a second accepted form. If the value starts with `[`, the method
hands over to `deserialize_seq`, so a byte buffer may also be written as a
JSON array of numbers. That is the form `serde_json` itself produces when it
serializes bytes, so the two directions agree.

`deserialize_byte_buf` forwards, for the same reason `deserialize_string`
does.
"""

[[annotation]]
id    = "json-de-0060"
file  = "src/de.rs"
lines = "1671-1686"
title = "deserialize_option — null is None, anything else is Some"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["option", "pattern-matching"]
prereqs = ["de-mod-0029"]
body = """
The whole policy is in the doc comment. A `null` is consumed and reported as
`visit_none`. Anything else is `visit_some(self)`, which gives the visitor the
deserializer back so it can read the inner value from the same position.

Nothing has been consumed in the `Some` case. Whitespace was skipped and one
byte was peeked.

One consequence follows from JSON having a single `null`. `Option<Option<T>>`
cannot distinguish `None` from `Some(None)`. Both would be written as `null`,
and reading `null` gives the outer `None`.
"""

