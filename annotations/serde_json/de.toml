rust_features = ["lifetime-de", "where-clauses", "strings"]
body = """
The same signature shape as `from_slice`, over `&'a str`.

The difference is in the reader it constructs. `StrRead` knows its input is
already valid UTF-8, so strings in the document are not re-validated. If you
have a `String`, this is faster than passing its bytes to `from_slice`.

Follow the body down and you have the whole path: `from_str` makes a
`StrRead`, `from_trait` makes a `Deserializer` and calls
`T::deserialize`, and the type calls back into the `Deserializer` impl in
the middle of this file.
"""
