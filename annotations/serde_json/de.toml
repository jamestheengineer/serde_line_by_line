[[annotation]]
id    = "json-de-0001"
file  = "src/de.rs"
lines = "1-29"
title = "Imports — what a parser borrows from serde_core, and what it re-exports"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "modules", "visibility"]
body = """
The two `serde` imports are the contract this file implements.
`serde::de` holds `Deserializer`, `Visitor` and the four access traits, all of
which you have read in `serde_core`. `forward_to_deserialize_any` is the macro
from that crate's `macros.rs`, and it is used here more than once.

`Expected` and `Unexpected` are the two halves of a type-mismatch message:
what the visitor wanted and what the input held.

Three imports are feature-gated. `lexical` and `core::iter` come in only with
`float_roundtrip`, and `NumberDeserializer` only with `arbitrary_precision`.
Both features change how numbers are parsed, and both will reappear as paired
functions with the same name and opposite `#[cfg]`s.

The `pub use` lines are how the readers become public. `read` is a private
module, so `serde_json::de::SliceRead` is the only path to that type. `IoRead`
is re-exported only with `std`, matching the gate on its definition.
"""

[[annotation]]
id    = "json-de-0002"
file  = "src/de.rs"
lines = "30-40"
title = "Deserializer — a reader, a buffer and a depth budget"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["generic-params", "cfg"]
prereqs = ["json-read-0002"]
body = """
Three fields in a default build.

`read` is the input, of whatever type `R` is. `scratch` is the buffer that
`Read::parse_str` copies into when a string has escapes. It lives here so that
one allocation serves every string in the document. `remaining_depth` is a
`u8` counting down from 128, and it is the only defence against input like ten
thousand opening brackets.

The struct has no lifetime parameter. The input lifetime belongs to `R`, and
the struct definition places no bound on `R` at all. The bounds are on the
impl blocks, which is the usual arrangement: the type can be named without
proving anything, and the methods exist only when the proof is available.

The two gated fields are flags that change behaviour without changing the
type's public shape.
"""

[[annotation]]
id    = "json-de-0003"
file  = "src/de.rs"
lines = "41-70"
title = "Deserializer::new — the general constructor"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["lifetime-de", "where-clauses", "cfg"]
body = """
`new` accepts any reader and fills in the defaults: an empty scratch buffer,
which allocates nothing until a string needs it, and a depth of 128.

`'de` is declared on the impl and appears only in the bound `R:
read::Read<'de>`. Nothing in the struct mentions it. It is how the impl says
"for whichever input lifetime this reader has".

The doc comment repeats the buffering warning from `IoRead::new` and then
points at the three constructors people should use instead. `new` is public
because the `Read` trait is, and it is what lets a caller build a
deserializer over a borrowed reader.
"""

[[annotation]]
id    = "json-de-0004"
file  = "src/de.rs"
lines = "71-100"
title = "from_reader, from_slice, from_str — three impl blocks, three concrete types"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["generic-params", "lifetimes", "cfg"]
body = """
Each constructor lives in its own `impl` block for one concrete reader type.
`from_str` is defined on `Deserializer<StrRead<'a>>` and nowhere else.

That placement is what makes the return type work. `Self` in each block is a
fully specified type, so a caller who writes `Deserializer::from_str(s)` gets
`Deserializer<StrRead<'_>>` by inference, with no type annotation.

The doc comment on `from_reader` states a limit worth remembering. A
deserializer built from a stream cannot produce borrowed data such as `&str`.
You saw why in `read.rs`: the stream reader only ever returns the `Copied`
variant.

`from_reader`'s bound is `crate::io::Read`, the facade name, which is
`std::io::Read` because this block is gated on `std`.
"""

[[annotation]]
id    = "json-de-0005"
file  = "src/de.rs"
lines = "101-108"
title = "overflow! — would a times ten plus b exceed c?"
kind  = "macro-def"
tracks = ["reference"]
rust_features = ["macro-rules", "macro-hygiene"]
body = """
A macro that answers one question without performing the multiplication that
might overflow.

The pattern is unusual. `$a:ident * 10 + $b:ident` matches the literal tokens
`* 10 +` between two identifiers, so the call site reads as the arithmetic it
is asking about: `overflow!(significand * 10 + digit, u64::MAX)`. The macro
could not be used for any other expression, and that is intended.

The body rewrites the comparison. `a * 10 + b > c` is true when `a` is above
`c / 10`, or equal to it with `b` above `c % 10`. The outer `a >= c / 10`
is a cheap first test that is false for almost every digit of almost every
number.

`match $c { c => ... }` binds the limit to a name so that the expression is
evaluated once. It is a macro and not a function because it is called with
both `u64` and `i32` operands.
"""

[[annotation]]
id    = "json-de-0006"
file  = "src/de.rs"
lines = "109-141"
title = "ParserNumber — the three shapes a JSON number can take"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "cfg", "trait-objects"]
body = """
JSON has one number type. Serde's data model has many. This enum is the
parser's decision about which one a given run of digits is: an unsigned
integer, a negative integer, or a float.

`visit` forwards that decision to the visitor as `visit_u64`, `visit_i64` or
`visit_f64`. The parser never produces a narrower width. Turning a `u64` into
a `u8`, with a range check, is the job of the primitive `Deserialize` impls in
`serde_core`.

`invalid_type` builds the error for "a number arrived and the visitor wanted
something else". It takes `&dyn Expected`, a trait object, so one function
serves every visitor type without being generic.

The fourth variant exists only with `arbitrary_precision`. There a number is
kept as its original text and delivered through `visit_map`, the same
one-entry-map protocol that `RawValue` uses.
"""

[[annotation]]
id    = "json-de-0007"
file  = "src/de.rs"
lines = "142-152"
title = "end — the check that nothing follows the value"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["result"]
body = """
Parsing a value stops at its last byte. `end` is the separate step that makes
`1 2` an error.

It skips whitespace and looks at what comes next. `None` means the input is
exhausted, which is success. Any byte at all is `TrailingCharacters`, reported
with `peek_error` because the byte was looked at and not consumed.

The method is public and the doc comment says it "should be called". The
`from_str` family calls it for you. A caller driving a `Deserializer` by hand
has to remember.
"""

[[annotation]]
id    = "json-de-0008"
file  = "src/de.rs"
lines = "153-168"
title = "into_iter — an inherent method, because the caller picks T"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "marker-types", "iterators"]
body = """
This turns the deserializer into an iterator over consecutive JSON values,
each deserialized as `T`.

The comment explains the choice of an inherent method. The `IntoIterator`
trait fixes the item type as an associated type of the implementor. Here the
item type is not a property of the deserializer. It is whatever the caller
asks for, so it must be a type parameter of the method.

The starting byte offset is recorded, and two `PhantomData` fields carry `T`
and `'de`, neither of which is otherwise stored in the struct.
"""

[[annotation]]
id    = "json-de-0009"
file  = "src/de.rs"
lines = "169-218"
title = "disable_recursion_limit — a switch with a long warning attached"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
One line of code under forty-three lines of documentation, and the ratio is
appropriate.

With the `unbounded_depth` feature, this sets a flag that turns off the depth
counter. The parser is recursive, so deeply nested input then consumes stack
without limit. The doc comment says what else you must do: grow the stack
dynamically with `serde_stacker`, and be careful afterwards, because dropping
or printing a deeply nested `Value` recurses too.

The example builds ten thousand nested arrays and ends with a function that
flattens the value iteratively before it is dropped. That function is there
because the default `Drop` would overflow the stack the parser just avoided
overflowing.
"""

[[annotation]]
id    = "json-de-0010"
file  = "src/de.rs"
lines = "219-238"
title = "Five one-line wrappers, and a null byte that stands for end of input"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["option", "result", "visibility"]
body = """
The parser's own names for the reader's operations. `peek`, `eat_char` and
`next_char` forward to `read.peek`, `read.discard` and `read.next`.

The two `_or_null` variants are the useful ones. They replace `None` with the
byte `0x00`. A parser asking "is the next byte a digit?" can then match on a
plain `u8`, and end of input falls into the same arm as any other non-digit.
This is safe as a sentinel because a zero byte is never valid at any point
where JSON syntax is being decided.

`peek` is `pub(crate)` and the others are private. Other modules in the crate
need to look at the next byte, and only this one consumes.
"""

[[annotation]]
id    = "json-de-0011"
file  = "src/de.rs"
lines = "239-252"
title = "error and peek_error — the same error at two positions"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors", "inlining"]
body = """
Both build `Error::syntax` from a code and a position. They differ in which
position method they call, and the doc comments say when to use each: `error`
after a byte was consumed with `next_char`, `peek_error` after it was only
looked at.

Choosing the wrong one produces an error that is off by one column. There is
no type-level protection. Every call site in this file had to get it right by
hand.

`#[cold]` on both keeps error construction out of the fast paths that call
them.
"""

[[annotation]]
id    = "json-de-0012"
file  = "src/de.rs"
lines = "253-267"
title = "parse_whitespace — skip, then report what stopped you"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["pattern-matching", "option"]
body = """
JSON permits exactly four whitespace bytes: space, newline, tab and carriage
return. The or-pattern inside `Some(...)` matches them, and anything else,
including `None`, is returned.

The return value is the reason this function is called everywhere. It gives
back the first non-whitespace byte, still unconsumed. Almost every parsing
decision in this file begins by calling it and matching on the result, so
"skip whitespace" and "peek" are one operation.
"""

[[annotation]]
id    = "json-de-0013"
file  = "src/de.rs"
lines = "268-317"
title = "peek_invalid_type — parsing a value in order to complain about it"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors", "pattern-matching", "trait-objects"]
body = """
This runs when a typed method finds the wrong kind of value, such as
`deserialize_bool` meeting a string. The error should say what was found, and
to say that precisely the function parses the value.

For `null`, `true` and `false` it consumes the literal and reports a unit or
a boolean. For a number it parses the number and asks the `ParserNumber` to
describe itself. For a string it parses the string, so the message can quote
it. For `[` and `{` it does not parse anything and reports "sequence" or
"map".

If parsing the offending value fails, that failure is returned instead. A
syntax error outranks a type error.

`self.peek_or_null().unwrap_or(b'\\x00')` handles an I/O error from the reader
by treating it as the sentinel, which lands in the last arm.

The error built by `de::Error::invalid_type` has no position, since
`serde_core` knows nothing about lines. `fix_position` adds one on the way
out.
"""

[[annotation]]
id    = "json-de-0014"
file  = "src/de.rs"
lines = "318-344"
title = "deserialize_number — the shared body of twelve methods"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params", "lifetimes", "result"]
body = """
Every integer and float method of the `Deserializer` impl funnels into this
function through a macro you will meet further down.

It skips whitespace, and a missing value is `EofWhileParsingValue`. A `-`
is consumed and the rest parsed as a negative number. A digit starts a
positive one. Anything else is a type mismatch, built by the function above.

The visitor's lifetime parameter is named `'any`. The impl's `'de` is not
used because this function hands the visitor only owned numbers, so it works
for a visitor of any input lifetime.

The final `match` passes an error through `fix_position`. A visitor can
reject a number, for example a `u8` visitor given 300, and that error is
created without a line or column.
"""

[[annotation]]
id    = "json-de-0015"
file  = "src/de.rs"
lines = "345-355"
title = "do_deserialize_f32 — a flag set around a call"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
Compiled only with `float_roundtrip`. It sets `single_precision`, calls the
ordinary number path, and clears the flag.

The flag tells the float conversion to round to the nearest `f32` directly.
Parsing to `f64` and then narrowing rounds twice, and the two roundings can
disagree with a single correct one. A feature that promises exact round trips
has to avoid that.

The state is carried in a field because the conversion is several calls
below. If the number path returned early by `?` this would leave the flag
set, which is why the result is bound to `val` and returned after the reset.
"""

[[annotation]]
id    = "json-de-0016"
file  = "src/de.rs"
lines = "356-417"
title = "i128 and u128 — digits collected into a String"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "result"]
body = """
The ordinary number path accumulates into a `u64` and falls back to `f64` on
overflow. That would silently lose precision for a 128-bit integer, so these
two types get their own path.

It is simple. The digits are copied into a `String` and handed to the
standard library's `str::parse`. Any failure there means the value does not
fit and is reported as `NumberOutOfRange`.

The two functions differ in their treatment of a minus sign. The signed
version consumes it and puts it in the buffer. The unsigned version rejects
it immediately, before scanning any digits.

A fraction or an exponent is not consumed here. `1.5` scans as `1`, the
visitor receives 1, and the caller then finds `.5` where it expected the
value to have ended.
"""

[[annotation]]
id    = "json-de-0017"
file  = "src/de.rs"
lines = "418-439"
title = "scan_integer128 — the leading-zero rule, restated"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "strings"]
body = """
JSON forbids leading zeros. `0` is a number and `01` is not.

The first arm handles a `0`: it is pushed, and a following digit is
`InvalidNumber`. The second handles `1` to `9` and then loops with `while
let c @ b'0'..=b'9'`, which binds the byte and tests its range in one
pattern. The loop ends on the first non-digit, including the null sentinel
for end of input.

The same rule is written again in `parse_integer` below, over a `u64`
accumulator in place of a string.
"""

[[annotation]]
id    = "json-de-0018"
file  = "src/de.rs"
lines = "440-444"
title = "fix_position — adding a line and column after the fact"
kind  = "impl"
tracks = ["reference"]
rust_features = ["closures", "custom-errors"]
body = """
Errors raised by a visitor or by a `Deserialize` impl come from
`de::Error::custom` and its relatives. They are created by code that has no
access to the reader, so they carry line 0.

This helper passes the error to `Error::fix_position` in `error.rs`, along
with a closure that builds a positioned error from a code. If the error
already has a position it is returned unchanged.
"""

[[annotation]]
id    = "json-de-0019"
file  = "src/de.rs"
lines = "445-461"
title = "parse_ident — matching the rest of a literal"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["iterators", "option"]
body = """
`null`, `true` and `false` are recognised by their first byte. The caller
consumes that byte and calls this with the remainder: `b"ull"`, `b"rue"` or
`b"alse"`.

Each expected byte is compared with the next input byte. Running out of input
is `EofWhileParsingValue`, and a mismatch is `ExpectedSomeIdent`. Both use
`error`, the consumed-byte position, since `next_char` consumed the byte in
question.

Nothing checks what follows the literal. `truex` passes this function, and
the stray `x` is found by whatever looks for a comma or the end of input.
"""

[[annotation]]
id    = "json-de-0020"
file  = "src/de.rs"
lines = "462-508"
title = "parse_integer — digits into a u64, until they do not fit"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "macro-rules"]
body = """
The caller has dealt with any minus sign. This reads the integer part.

A leading `0` must stand alone, and the code then moves on with a
significand of 0. Otherwise digits are accumulated with `significand * 10 +
digit`, and the `overflow!` test runs before each step.

When the next digit would not fit in a `u64`, the function does not report
an error. It hands what it has to `parse_long_integer` and returns the result
as a float. A JSON integer with twenty-five digits is a legal number, and the
closest `f64` is the best a `u64`-based parser can offer.

Note that the overflowing digit is not consumed before that call. The
`eat_char` comes after the test, so the long-integer path starts at the digit
that did not fit.
"""

[[annotation]]
id    = "json-de-0021"
file  = "src/de.rs"
lines = "509-529"
title = "parse_number — integer, or float, or negative zero"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
After the integer digits, one byte decides the type. A `.` or an `e` makes it
a float. Anything else ends the number as an integer.

A positive integer is `U64`. A negative one is produced by casting to `i64`
and negating with `wrapping_neg`. The result is then tested, and the test
covers two cases at once. If the magnitude was too large for an `i64`, the
cast wrapped and the negation is not negative. If the magnitude was zero, the
negation is zero. Both yield a float.

So `-0` becomes the `f64` value negative zero. An integer type has no
negative zero, and returning `I64(0)` would discard the sign the input wrote.
"""

[[annotation]]
id    = "json-de-0022"
file  = "src/de.rs"
lines = "530-566"
title = "parse_decimal — fraction digits, counted as a negative exponent"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
The fraction is folded into the same integer significand. Each digit after
the point multiplies the significand by ten and decrements an exponent, so
`1.25` becomes 125 with exponent -2.

If the significand would overflow, the remaining digits go to
`parse_decimal_overflow`, which has to decide what to do with precision the
`u64` cannot hold.

The check after the loop enforces that at least one digit follows the point.
`1.` is an error, and so is `1.e5`. The two error codes distinguish "something
else was there" from "the input ended".

Then an `e` continues into the exponent, and anything else finishes the
number.
"""

[[annotation]]
id    = "json-de-0023"
file  = "src/de.rs"
lines = "567-622"
title = "parse_exponent — a sign, at least one digit, and saturation"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
The `e` is consumed, then an optional sign, then a required digit. `1e` and
`1e+` are both errors, with a different code depending on whether input ran
out.

Further digits accumulate into an `i32` with the same `overflow!` test, this
time against `i32::MAX`. An exponent that large cannot be represented, and
`parse_exponent_overflow` works out the answer from first principles: zero if
the significand is zero or the exponent negative, an error otherwise.

The final exponent combines this one with the exponent carried in from the
fraction. `saturating_add` and `saturating_sub` are used because the two
together could exceed `i32`, and a clamped exponent leads to the same result
as the true one: zero or out of range.
"""

[[annotation]]
id    = "json-de-0024"
file  = "src/de.rs"
lines = "623-637"
title = "f64_from_parts with float_roundtrip — delegate to lexical"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "generic-params"]
body = """
The first of two functions with this name. This one is compiled when the
`float_roundtrip` feature is on.

It calls `lexical::parse_concise_float` with the integer significand and the
exponent, choosing `f32` or `f64` by the `single_precision` flag. That
function is correct for every input, which the version below is not.

An infinite result means the number was too large for the type, and JSON has
no way to write infinity, so it is `NumberOutOfRange`. The sign is applied
last.
"""

[[annotation]]
id    = "json-de-0025"
file  = "src/de.rs"
lines = "638-673"
title = "f64_from_parts by default — one multiplication or one division"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "option"]
body = """
The default conversion. It turns the significand into an `f64` and scales it
by a power of ten from the `POW10` table.

For a non-negative exponent it multiplies. For a negative one it *divides* by
the positive power. Dividing by `1e2` is more accurate than multiplying by
`1e-2`, because `1e2` is exactly representable and `1e-2` is not.

`POW10.get(...)` returns `None` when the exponent's magnitude is past the end
of the table. A zero stays zero. A huge positive exponent is out of range. A
huge negative one divides by `1e308` and tries again, which lets very small
numbers reach the subnormal range.

This is fast and it is not always correctly rounded. The conversion of the
significand and the scaling are two separate roundings. The crate's answer for
callers who need exactness is the feature that selects the other function.
"""

[[annotation]]
id    = "json-de-0026"
file  = "src/de.rs"
lines = "674-713"
title = "parse_long_integer with float_roundtrip — keep every digit, as text"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "inlining", "collections"]
body = """
Reached when the integer part has more digits than a `u64` can hold. With
`float_roundtrip` on, no digit may be dropped, so the digits are kept as bytes
in the scratch buffer.

The comment describes the plan. Integer digits and fraction digits are pushed
into one buffer, and an index, `integer_end`, records where the first group
stops. The float parser in `lexical/` is later given the two halves as slices.

The digits already folded into the `u64` have to be recovered first.
`itoa::Buffer::new().format(...)` writes an integer as decimal text into a
small buffer on the stack. `itoa` is a separate crate that does this without
going through `fmt`.

Then the loop pushes further digits, and a `.`, an `e` or anything else
selects the next stage.
"""

[[annotation]]
id    = "json-de-0027"
file  = "src/de.rs"
lines = "714-739"
title = "parse_long_integer by default — count the digits and drop them"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "inlining"]
body = """
The default build's answer to the same situation, and it is much shorter. The
significand stays as it is. Each further digit is consumed and discarded, and
`exponent` is incremented.

That is arithmetic you can check. Dropping one trailing digit from an integer
divides it by ten, so adding one to the exponent keeps the magnitude right and
loses only the digit's own contribution. A `u64` already holds nineteen
digits, and an `f64` has about seventeen significant digits of precision, so
what is lost is mostly below what the result could represent anyway. Mostly:
this is one of the places the default build can be off by one unit in the
last place.

The comment about gigabytes is accurate. `exponent` is an `i32`, and
overflowing it would take two billion digits.
"""

[[annotation]]
id    = "json-de-0028"
file  = "src/de.rs"
lines = "740-762"
title = "parse_long_decimal — fraction digits into the same buffer"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "inlining"]
body = """
Compiled with `float_roundtrip`. The point has been consumed, and fraction
digits are pushed onto scratch after the integer digits.

`at_least_one_digit` starts as `integer_end < self.scratch.len()`. That is
false when this is entered straight after a `.`, and true when it is entered
from `parse_decimal_overflow`, which arrives with fraction digits already in
the buffer.

The rest mirrors `parse_decimal`: a missing digit is an error with one of two
codes, and an `e` continues into the exponent.
"""

[[annotation]]
id    = "json-de-0029"
file  = "src/de.rs"
lines = "763-810"
title = "parse_long_exponent — the exponent, for the text-buffer path"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "closures", "iterators"]
body = """
The same logic as `parse_exponent`: consume `e`, an optional sign, a required
digit, then more digits with an overflow test.

Two things differ. To learn whether the significand is zero, it cannot
compare a number with 0, because there is no number. It asks whether every
byte in scratch is the character `0`. And the final exponent is a plain
negation with no saturating arithmetic, since there is no exponent carried in
from the fraction. In this path the fraction is still text.

The duplication is real. Two functions parse an exponent with the same
grammar, and a change to one has to be made to the other.
"""

[[annotation]]
id    = "json-de-0030"
file  = "src/de.rs"
lines = "811-833"
title = "parse_decimal_overflow with float_roundtrip — turning a number back into digits"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "inlining", "iterators", "option"]
body = """
The fast path was folding fraction digits into a `u64` and has run out of
room. To switch to the text path, the digits consumed so far must be put back
into scratch, with the split between integer and fraction in the right place.

`itoa` renders the significand. `fraction_digits` is how many of those digits
came after the point. If there are at least as many fraction digits as
rendered digits, the number began with zeros that the `u64` never stored, as
in `0.00012…`, and `checked_sub` reports how many to restore.
`iter::repeat(b'0').take(n)` supplies them.

Then `integer_end` is the buffer length minus the fraction digits, and
`parse_long_decimal` continues from where the input stands.

The comment above the function explains the two attributes. This code is
rare, and the loop it was called from should stay compact.
"""

[[annotation]]
id    = "json-de-0031"
