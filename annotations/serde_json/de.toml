mutable borrow of the deserializer and a flag saying whether the next element
would be the first.

The flag is all the state a comma-separated list needs. Before the first
element no comma is allowed, and before every later one a comma is required.

`R: 'a` on the struct says the reader outlives the borrow. Current compilers
