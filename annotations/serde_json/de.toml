macro_def = "json-de-0046"
body = """
Thirteen invocations, of which twelve compile in any one build. Those with
one argument forward to `deserialize_number`. The 128-bit integers name
their own string-collecting functions as a second argument.

`deserialize_f32` appears twice under opposite `#[cfg]`s. Without
`float_roundtrip` it is a number like any other. With it, the method goes
through `do_deserialize_f32`, which sets the single-precision flag first.

None of these methods uses the width in its name. `deserialize_u8` and
