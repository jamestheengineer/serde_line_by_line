[[annotation]]
id    = "json-de-0083"
file  = "src/de.rs"
lines = "2243-2277"
title = "A bool key — and a closing quote folded into the literal"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "strings"]
body = """
A map keyed by `bool` is read from `"true"` and `"false"`.

The method consumes the opening quote and the first letter, then calls
