This is used by `Number`'s `FromStr` impl a little further down, where the
entire string is supposed to be one number.

It handles the sign, parses, and then requires that nothing follows. Any
remaining byte is `InvalidNumber`. Leading and trailing whitespace are not
skipped, so `" 1"` and `"1 "` both fail.

The comment on the last arm is a candid one. An error created through the
`de::Error` trait has no position, and at this point there is no way to know
whether the consumed or the peeked position is the right one. The code picks
one and accepts being off by a column.
"""

