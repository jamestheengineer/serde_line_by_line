After an object key there must be a colon. This skips whitespace and checks.

The three arms are the pattern used by all the punctuation helpers in this
file: the right byte is consumed, a wrong byte is one error code, and end of
input is another. The end-of-input code names the structure being parsed,
`EofWhileParsingObject`, so the message says what was left open.
