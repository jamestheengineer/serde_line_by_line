The table used by the default `f64_from_parts`. It holds `1e0` through
`1e308`, which is every power of ten an `f64` can represent as a finite
value. `1e309` would be infinity.

It is a `static`, so there is one copy in the binary and indexing it is a
load. The `//` at the end of each row is a formatting device. It stops
`rustfmt` from reflowing the rows, so each line keeps ten entries.

The table is gated out when `float_roundtrip` is on, since that build never
scales by a power of ten this way.
"""

[[annotation]]
id    = "json-de-0046"
file  = "src/de.rs"
lines = "1341-1355"
title = "deserialize_number! — one method per invocation"
kind  = "macro-def"
tracks = ["reference"]
rust_features = ["macro-rules"]
body = """
A macro that writes a `Deserializer` trait method whose whole body is a call
to an inherent method.

It has two arms. The one-argument arm calls the two-argument arm with a
default, so `deserialize_number!(deserialize_u8)` forwards to
`self.deserialize_number(visitor)`. The two-argument form names a different
target, which the 128-bit integers and, with `float_roundtrip`, `f32` need.

Recursion between arms is the standard way to give a `macro_rules!` macro an
optional argument. Note also that the generated method uses `'de`, which is
not a macro parameter. The macro can only be invoked inside an impl where
that lifetime is in scope.
"""

[[annotation]]
id    = "json-de-0047"
file  = "src/de.rs"
lines = "1356-1371"
title = "if_checking_recursion_limit! — a macro defined twice"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["macro-rules", "macro-repetition", "cfg"]
body = """
Two definitions with the same name under opposite `#[cfg]`s, so exactly one
exists in any build.

Without `unbounded_depth` the macro is the identity. It matches any tokens and
emits them unchanged. With the feature, it captures the first token as an
identifier, wraps everything in `if !$this.disable_recursion_limit { ... }`,
and re-emits the tokens inside.

The effect is that code written once, in the macro below, has a runtime check
only in builds where the limit can be switched off. In a default build there
is no flag to test and no branch.
"""

[[annotation]]
id    = "json-de-0048"
file  = "src/de.rs"
lines = "1372-1388"
title = "check_recursion! — spend one level of depth around a block"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["macro-rules", "macro-hygiene", "macro-repetition"]
body = """
This macro wraps the code that descends into an array or object. It
decrements `remaining_depth`, fails if that reaches zero, runs the body, and
increments again.

The budget starts at 128 and the check is for zero after the decrement, so
127 levels of nesting parse and the 128th is `RecursionLimitExceeded`. The
limit exists because the parser recurses through the visitor for every nested
container, and without it a few kilobytes of `[` would overflow the stack.

The pattern `$this:ident $($body:tt)*` is doing something specific. Callers
write `check_recursion! { self.eat_char(); ... }`, and the macro peels off
the first token, `self`, as `$this`. A macro body cannot write `self` on its
own, because `self` written inside a macro definition is not the `self` of
the function that invokes it. Capturing it from the call site is the
workaround, and `$this $($body)*` then re-emits the caller's code intact.

Every body used with this macro stores its result in a `let` and does not
return early. That is what guarantees the increment runs.
"""

[[annotation]]
id    = "json-de-0049"
file  = "src/de.rs"
lines = "1389-1403"
title = "Deserializer for &mut Deserializer<R> — and the first thing every value does"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["traits", "lifetime-de", "associated-types", "inlining"]
prereqs = ["de-mod-0029"]
body = """
The trait is implemented for a mutable reference, not for the struct. The
methods of `serde_core`'s `Deserializer` take `self` by value. If the struct
implemented the trait, deserializing one value would consume the parser and
there would be nothing left to read the next element with. A `&mut` can be
re-borrowed for each nested value.

`type Error = Error` names the crate's one error type.

`deserialize_any` is the method the whole format hangs on. JSON is
self-describing, so the parser can look at the input and tell the visitor
what is there. It begins as nearly every method in this impl does: skip
whitespace, and treat end of input as `EofWhileParsingValue`.
"""

[[annotation]]
id    = "json-de-0050"
file  = "src/de.rs"
lines = "1404-1419"
title = "null, true, false — one byte decides, then the rest is checked"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["pattern-matching"]
prereqs = ["de-mod-0043"]
body = """
The first three arms of the central `match`. A single peeked byte selects the
arm, the byte is consumed, and `parse_ident` verifies the remaining letters.

Then the visitor is told what was found. `null` is `visit_unit`. It is not
`visit_none`, because here nobody has said the value is optional. A visitor
for `Option` is reached through `deserialize_option` instead, which handles
`null` itself.
"""

[[annotation]]
id    = "json-de-0051"
file  = "src/de.rs"
lines = "1420-1424"
title = "The number arms — a sign, or a digit"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
A `-` is consumed and the number parsed as negative. A digit is left in place
and the number parsed as positive.

`parse_any_number` returns a `ParserNumber`, and `.visit(visitor)` forwards
it as `visit_u64`, `visit_i64` or `visit_f64`. This is the self-describing
path, so the parser chooses the type from the text alone.
"""

[[annotation]]
id    = "json-de-0052"
file  = "src/de.rs"
lines = "1425-1432"
title = "The string arm — Borrowed or Copied becomes two different visitor calls"
kind  = "impl"
tracks = ["reference"]
rust_features = ["lifetime-de", "borrowing", "pattern-matching"]
body = """
This is where the `Reference` enum from `read.rs` is consumed.

The scratch buffer is cleared, because `parse_str` requires it to be empty.
Then the result is matched. `Borrowed(s)` holds a `&'de str` and goes to
`visit_borrowed_str`, which is the one visitor method allowed to keep the
reference. `Copied(s)` holds a string in scratch that will be overwritten by
the next string, and goes to `visit_str`, where the visitor must copy if it
wants to keep anything.

A `String` visitor accepts both. A `&'de str` visitor accepts only the
first, and that is the mechanism behind the "expected a borrowed string"
error for input containing an escape.
"""

[[annotation]]
id    = "json-de-0053"
file  = "src/de.rs"
lines = "1433-1457"
title = "The array and object arms — where the parser recurses"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["pattern-matching", "result"]
prereqs = ["json-de-0048", "de-mod-0060"]
body = """
An opening bracket starts a container. Inside `check_recursion!` the bracket
is consumed and the visitor is given an access object that borrows the
parser. The visitor pulls elements out through that object, and each element
is a call back into this impl. That is the recursion the depth budget
bounds.

The `match (ret, self.end_seq())` afterwards is written to do two things.
`end_seq` runs whether or not the visitor succeeded, because it is evaluated
as part of building the tuple. And if both failed, the or-pattern binds the
first error it finds, which is the visitor's.

Any byte that begins none of the seven kinds of value is
`ExpectedSomeValue`.
"""

[[annotation]]
id    = "json-de-0054"
file  = "src/de.rs"
lines = "1458-1468"
