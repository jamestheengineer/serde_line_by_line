[[annotation]]
id    = "json-de-0087"
file  = "src/de.rs"
lines = "2340-2367"
title = "StreamDeserializer — several values in one input"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["marker-types", "lifetimes", "generic-params"]
body = """
An iterator that deserializes one `T` after another from the same input.
Line-delimited JSON is the usual use.

The doc comment states a rule about boundaries. A value must either be
self-delineating, meaning an array, object or string, or be followed by
whitespace or by a value that is. The example input shows it:
`{"k": 3}1"cool""stuff" 3{}` is six values. `12` is one value, and there is
no way to write two adjacent numbers without a separator.

The struct owns the `Deserializer`. `offset` and `failed` are bookkeeping.
The two `PhantomData` fields exist because `T` and `'de` are parameters of the
type and appear in no real field. `PhantomData<&'de ()>` is the conventional
way to mention a lifetime without storing a reference.
"""

[[annotation]]
id    = "json-de-0088"
file  = "src/de.rs"
