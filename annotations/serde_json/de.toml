where only a string can appear.

Its `deserialize_any` consumes the opening quote, on trust, and parses the
string. The `Borrowed` and `Copied` cases go to `visit_borrowed_str` and
`visit_str` as usual. Keys can be borrowed from the input in the same way
values can.

Note that `MapKey` is implemented by value. It is a small struct holding a
`&mut`, made fresh for each key, so there is no need for the
reference-to-self arrangement the main deserializer uses.
