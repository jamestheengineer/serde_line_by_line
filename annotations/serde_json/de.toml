[[annotation]]
id    = "json-de-0075"
file  = "src/de.rs"
lines = "2071-2099"
title = "VariantAccess — four kinds of content, four forwards"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "generic-params"]
body = """
The visitor has identified the variant and now says what shape it expects.
Each method reads that shape from the current position using the main
deserializer.

A newtype variant is whatever its inner type deserializes from. A tuple
variant is an array. A struct variant goes through `deserialize_struct`, so
it may be an object or, as for any struct, an array.

`unit_variant` deserializes `()`. That requires `null`, so in the object form
a unit variant is written `{"Variant": null}`. The bare string form is
handled by the other access type below.

The calls are written as `de::Deserializer::deserialize_seq(self.de,
visitor)` to name the trait method explicitly. `Deserializer<R>` also has
inherent methods, and the fully qualified form leaves no doubt which is
meant.
"""

[[annotation]]
id    = "json-de-0076"
