[[annotation]]
id    = "json-de-0079"
file  = "src/de.rs"
lines = "2167-2200"
title = "deserialize_numeric_key! — a number inside quotation marks"
kind  = "macro-def"
tracks = ["reference"]
rust_features = ["macro-rules", "pattern-matching"]
body = """
JSON object keys are strings. A Rust map may be keyed by integers. This macro
generates the methods that read a number from inside a quoted key, so that
`{"1": true}` can become a map from `u8`.

The two-argument arm does the work. It consumes the opening quote, requires
the next byte to be a digit or a minus sign, calls `$delegate` on the inner
deserializer to parse the number, and then requires and consumes a closing
quote. `ExpectedNumericKey` and `ExpectedDoubleQuote` are the two errors.

The digit check up front is necessary. The number parser skips leading
whitespace, and without the check `" 1"` would be accepted as the key 1.

The one-argument arm generates a method that calls
`self.deserialize_number(visitor)`. That is an inherent method on `MapKey`,
and the next block is where it comes from.
"""

