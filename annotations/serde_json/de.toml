rust_features = ["cfg", "inlining"]
body = """
Without `float_roundtrip`, further fraction digits are skipped. The comment
says so plainly.

Unlike the integer case, no exponent adjustment is needed. Digits after the
point that are never folded in do not change the scale of what was.

The cost is accuracy in the last bit for numbers written with more than
nineteen significant digits. Then the function carries on as `parse_decimal`
would have, into an exponent or straight to the conversion.
