[[annotation]]
id    = "json-de-0069"
file  = "src/de.rs"
lines = "1930-1971"
title = "next_element_seed — commas, and a helper that is not generic over T"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["traits", "generic-params", "monomorphization"]
prereqs = ["de-mod-0060"]
body = """
`serde_core`'s `SeqAccess` has one required method and this is it. It returns
`Some(element)` or `None` when the array ends.

The comma logic sits in a nested function, `has_next_element`. A `]` ends the
sequence. On the first call any other byte starts an element. Later, a comma
must come first, and a `]` directly after that comma is `TrailingComma`.

The nested function takes no `T`. The outer method is generic over the seed
type and is compiled once for every element type in the program. Code inside
it would be duplicated each time. Moving the punctuation handling into a
function that is generic only over the reader means it is compiled once per
reader type.

`seed.deserialize(&mut *self.de)` re-borrows the parser for one element. The
explicit `&mut *` creates a shorter borrow and leaves `self.de` usable for
the next call.
"""

