[[annotation]]
id    = "json-de-0074"
file  = "src/de.rs"
lines = "2047-2070"
title = "EnumAccess for VariantAccess — read the key, then the colon"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
body = """
`serde_core` splits enum deserialization in two. `EnumAccess` identifies the
variant, and `VariantAccess` reads its content. `type Variant = Self` says
the same object does both jobs here, which is why `variant_seed` returns
`self` in the tuple.

The opening brace has been consumed. The next byte must be `"`. The three
failure arms give three different messages for `{}`, for a non-string key,
and for end of input.

The variant name is read through `MapKey`, as an object key is, because that
is what it is. An error from the seed is positioned by hand, since the
`tri!` pattern used elsewhere would return it without a line. Then the colon
is consumed, leaving the parser at the variant's content.
