[[annotation]]
id    = "json-de-0040"
file  = "src/de.rs"
lines = "1072-1101"
title = "end_seq and end_map — closing brackets, and the trailing comma"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["pattern-matching", "custom-errors"]
body = """
These run after a visitor has finished with a sequence or map, and they
expect the closing bracket.

Finding more input there means the visitor stopped early. A tuple visitor
that wanted two elements and found three in the input ends up here, and the
result is `TrailingCharacters`.

`end_seq` goes one step further for a comma. It consumes it and peeks again.
If a `]` follows, the input had `[1, 2,]`, and the error is the more specific
`TrailingComma`. `end_map` reports a comma as `TrailingComma` without looking
further.
"""

[[annotation]]
id    = "json-de-0041"
file  = "src/de.rs"
lines = "1102-1216"
title = "ignore_value — skipping any value without recursion"
kind  = "impl"
tracks = ["reference"]
rust_features = ["collections", "pattern-matching", "option"]
body = """
This skips one complete JSON value of any shape. It is what runs for an
unknown struct field and for `IgnoredAny`.

It is a loop, not a recursive function. Nesting is tracked on an explicit
stack, and the stack is the scratch buffer. Each open container is one byte,
`[` or `{`. The innermost container is held in the local `enclosing` so that
the common case, a flat list of scalars, never touches the buffer.

Each pass of the outer loop skips one value. Scalars are consumed by the
same helpers the parser uses, or by `ignore_str` and `ignore_integer`, and
produce no frame. An opening bracket pushes the previous frame and becomes
the current one.

The inner loop then deals with what follows a value. A comma, where one is
allowed, breaks out to read the next value. A matching closing bracket pops a
frame, and the loop repeats, since several containers can close in a row.
When the stack is empty the whole value has been skipped. `accept_comma` is
false immediately after an opening bracket, which is how `[,` is rejected and
`[]` accepted.

The block at the bottom handles object keys. Inside a `{` frame every value
is preceded by a string and a colon.

Two consequences. Skipped data is checked for syntax but strings in it are
not checked for valid UTF-8 or valid surrogate pairs. And because nothing
recurses, `remaining_depth` is not consulted: skipped data may be nested to
any depth.
"""

[[annotation]]
id    = "json-de-0042"
file  = "src/de.rs"
lines = "1217-1283"
title = "ignore_integer, ignore_decimal, ignore_exponent — the number grammar, third time"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
The number grammar again, with no accumulator and no buffer. These consume a
number and check that it is well-formed.

That makes three renderings of one grammar in this file: computing a value,
copying text for `arbitrary_precision`, and skipping. They agree on what a
number is. They differ slightly in errors. `ignore_decimal` reports
`InvalidNumber` when the digit after the point is missing, without checking
whether the input ended, where `parse_decimal` would say
`EofWhileParsingValue`.

No overflow can happen here, so a number with a thousand digits is skipped
without complaint, even though parsing it would have produced a float.
"""

[[annotation]]
id    = "json-de-0043"
file  = "src/de.rs"
lines = "1284-1295"
title = "deserialize_raw_value — skip the value, keep the bytes"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "generic-params"]
body = """
Four lines that produce a `RawValue`. Leading whitespace is skipped first so
that it is not part of the captured text. Then the reader is told to start
buffering, the value is skipped with `ignore_value`, and the reader hands the
captured bytes to the visitor.

A raw value is therefore validated exactly as much as ignored data is. It is
syntactically JSON, and nothing in it has been interpreted.

The closing brace ends the large inherent `impl` block that began with `end`.
"""

