The same construction `into_iter` performs, starting from a reader. The doc
comment recommends `into_iter`, which lets the element type be written with a
turbofish at the call site.

The bounds on this impl are what the struct definition left off:
`R: Read<'de>` and `T: Deserialize<'de>`.
"""

[[annotation]]
id    = "json-de-0089"
file  = "src/de.rs"
lines = "2393-2427"
title = "byte_offset — how far the last good value reached"
kind  = "impl"
tracks = ["reference"]
rust_features = ["iterators"]
body = """
One line returning a field, and a doc comment that explains what the field is
for.

The offset is the number of bytes consumed by successful values. After an
end-of-input error the caller can take `data[offset..]`, append more data,
and parse again. The example walks through `[0] [1] [` and shows the offset
after each call.

The note at the end reserves the right to change the definition, with a link
to the issue. Upstream is saying that the exact value after a type error is
not yet a promise.
"""

[[annotation]]
id    = "json-de-0090"
file  = "src/de.rs"
lines = "2428-2443"
title = "peek_end_of_value — what may follow a number"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
Called after a value that has no closing delimiter: a number, `true`,
`false` or `null`.

The next byte must be whitespace, end of input, or one of the structural
characters. Anything else means two tokens were run together, as in `1x` or
`truefalse`, and the result is `TrailingCharacters`.

The error is built directly with `Error::syntax` here. The helper methods
that do this live on `Deserializer`, and this is a method of the stream type.
"""

[[annotation]]
id    = "json-de-0091"
file  = "src/de.rs"
lines = "2444-2497"
title = "Iterator for StreamDeserializer — one value per call, and a way to stay stopped"
kind  = "impl"
tracks = ["reference"]
rust_features = ["iterators", "associated-types", "zero-cost"]
body = """
`next` returns `None` at end of input, `Some(Ok(value))` for each value, and
`Some(Err(e))` once.

The first line is the check discussed in `read.rs`. For a stream reader it
tests the `failed` flag. For slice and string readers the constant is
`false` and the line compiles to nothing.

Then whitespace is skipped. End of input here is a clean finish. Otherwise
the first byte says whether the coming value is self-delineating, the offset
is recorded, and `T` is deserialized.

On success the offset advances, and a value without a delimiter is checked
with `peek_end_of_value`. On failure `set_failed` is called. For a slice
reader that truncates the input, so the next call sees end of input and
returns `None`.

There is one path that does not stop the stream. A failed
`peek_end_of_value` returns its error without calling `set_failed`. For the
input `1x` the iterator yields "trailing characters", and the next call
starts again at `x` and yields a second error.
"""

[[annotation]]
id    = "json-de-0092"
file  = "src/de.rs"
lines = "2498-2506"
title = "FusedIterator, only for readers that stay finished"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "marker-types", "where-clauses"]
body = """
An empty impl with a bound. `FusedIterator` promises that after the first
`None`, every later call is `None`.

The bound `R: Fused` restricts the promise to slice and string readers. Their
input is fixed, so end of input is permanent. A stream reader over a socket
could return `None` and later find more bytes, so the promise is withheld.
"""

[[annotation]]
id    = "json-de-0093"
file  = "src/de.rs"
lines = "2507-2519"
title = "from_trait — the three public functions, in four lines"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "22-implementing-a-deserializer"
rust_features = ["generic-params", "lifetime-de"]
prereqs = ["de-mod-0020"]
body = """
The private function behind `from_str`, `from_slice` and `from_reader`.

Build a deserializer over the reader. Call `T::deserialize` with a mutable
reference to it. Call `end` to confirm that only whitespace remains. Return
the value.

The second step is the handover. `Deserialize::deserialize` is code that
belongs to `T`, often generated by `serde_derive`, and from that call until
it returns, the type drives the parser.
"""

[[annotation]]
id    = "json-de-0094"
file  = "src/de.rs"
lines = "2520-2540"
title = "from_reader — three warnings before the example"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["traits"]
body = """
The first paragraphs of this doc comment are each a caveat.

The input is not buffered, so wrap files in a `BufReader`. The function
expects the stream to end after the value, because `from_trait` calls `end`,
and `end` reads until it finds a non-whitespace byte or end of input. On a
socket that stays open, that read blocks and the function does not return.
And reading from a stream is usually slower than reading the whole input
into memory first and calling `from_str`, with a link to the issue where
that was measured.

The third point follows from what you saw in `read.rs`. The stream reader
copies every string and tracks position on every byte. The slice reader does
neither.
"""

