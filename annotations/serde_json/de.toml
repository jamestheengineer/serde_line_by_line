[[annotation]]
id    = "json-de-0036"
file  = "src/de.rs"
lines = "937-955"
title = "parse_any_number with arbitrary_precision — text first, integers if they fit"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "strings"]
body = """
With `arbitrary_precision` the number is scanned into a `String` exactly as
written. Nothing is rounded because nothing is converted.

Then the code tries to do better. If the text parses as a `u64`, or as an
`i64` for a negative number, that integer is returned. Anything containing a
point or an exponent fails `str::parse` for an integer type, as does anything
too large, and those are returned as `ParserNumber::String`.

So ordinary integers take the same route to the visitor as in a default
build, and only the numbers that would have become floats are kept as text.
"""

[[annotation]]
id    = "json-de-0037"
file  = "src/de.rs"
lines = "956-1000"
title = "scan_or_eof, scan_integer, scan_number — the grammar, copying as it goes"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "strings", "pattern-matching"]
body = """
Three functions compiled only with `arbitrary_precision`. They walk the same
grammar as `parse_integer` and `parse_number` and append each byte to a
string in place of computing with it.

`scan_or_eof` consumes one byte, pushes it, and treats end of input as an
error. `scan_integer` applies the leading-zero rule and collects the integer
digits. `scan_number` looks at the next byte and continues into a fraction or
an exponent.

`b as char` is correct here because every byte pushed has been matched
against an ASCII pattern, or will be rejected by the caller immediately after.
"""

[[annotation]]
id    = "json-de-0038"
file  = "src/de.rs"
lines = "1001-1060"
title = "scan_decimal and scan_exponent — and one normalisation"
kind  = "cfg-gate"
tracks = ["reference"]
