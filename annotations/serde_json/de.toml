A wrapper around the borrowed parser, used only for object keys and variant
names.

The doc comment is a warning to the people who maintain this file. A `MapKey`
assumes the next byte is an opening quote. Its methods consume one byte
without looking at it. Constructed at any other position it would skip
whatever was there and could accept input that is not JSON. Both places that
build one check for the quote first.
