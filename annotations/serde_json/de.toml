[[annotation]]
id    = "json-de-0032"
file  = "src/de.rs"
lines = "855-875"
title = "parse_exponent_overflow — when the exponent itself does not fit"
kind  = "impl"
tracks = ["reference"]
rust_features = ["inlining"]
body = """
An exponent beyond `i32::MAX` in magnitude leaves only two possible answers,
and neither needs the digits.

If the significand is non-zero and the exponent positive, the value is beyond
any float, and the comment gives the policy: an error, not infinity. Otherwise
the value is zero, either because the significand was zero or because the
exponent is hugely negative. The remaining exponent digits are consumed so the
parser ends at the end of the number, and a zero with the right sign is
returned.

This function has no `#[cfg]`. Both float paths call it.
"""

[[annotation]]
id    = "json-de-0033"
