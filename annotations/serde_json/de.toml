kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "associated-types"]
body = """
The second enum form. When the input is `"Variant"` with no braces,
`deserialize_enum` constructs this type.

`variant_seed` deserializes the string with the main deserializer, which
identifies the variant, and returns `self` for the content step. There is no
colon to consume and no content to read.
"""

[[annotation]]
id    = "json-de-0077"
file  = "src/de.rs"
lines = "2123-2160"
title = "UnitVariantAccess — unit succeeds, everything else is a type error"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "custom-errors", "trait-objects"]
body = """
A bare string can only be a unit variant. `unit_variant` returns `Ok(())`
with nothing to check.

The other three methods fail with `invalid_type`. The "unexpected" half is
`Unexpected::UnitVariant` and the "expected" half is a string literal,
`&"newtype variant"`. That works because `serde_core` implements `Expected`
for `&str`, so a literal can be passed where a `&dyn Expected` is wanted.

These errors reach the caller without a line or column. They are created
here, returned through `visit_enum`, and the string arm of `deserialize_enum`
returns that result directly, without `fix_position`. Deserializing
`"New"` into an enum whose `New` variant holds a value reports "invalid type:
unit variant, expected newtype variant" and nothing more.
"""

[[annotation]]
id    = "json-de-0078"
file  = "src/de.rs"
lines = "2161-2166"
title = "MapKey — a deserializer with a precondition"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes"]
