[[annotation]]
id    = "json-ser-0050"
file  = "src/ser.rs"
lines = "1839-1861"
title = "begin_array_value and end_array_value — where the comma is"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "default-methods"]
body = """
The comma between array elements is written before every element except the
first. `first` is the flag the `Compound` state supplies.

Writing separators *before* items is what makes this work without
lookahead. The serializer does not know an element is the last until `end`
is called, and by then it is too late to have written a comma after it.

`end_array_value` does nothing by default. It exists as a hook, and the
pretty formatter uses it.
"""

