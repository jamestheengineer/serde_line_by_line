Writes a string's bytes with no quotes. This is the method
`NumberStrEmitter` calls for an arbitrary-precision number.

It is part of the public trait and is not feature-gated, so a custom
formatter always sees it, whether or not the feature that uses it is on.
"""

[[annotation]]
id    = "json-ser-0046"
file  = "src/ser.rs"
lines = "1734-1763"
title = "begin_string, end_string, write_string_fragment — a string in pieces"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "24-strings-escapes-and-borrowing"
rust_features = ["traits", "default-methods", "strings"]
body = """
A string is not written with one call. The formatter is told that a string is
beginning, then receives a series of fragments and escapes, then is told it
has ended.

The fragment method's doc comment carries the guarantee: a fragment "doesn't
need any escaping". The code that splits a string into fragments is
`format_escaped_str_contents`, and it is responsible for that being true.

The begin and end hooks both write a quotation mark by default. A formatter
could use them to do something else, such as colouring strings in terminal
output.
"""

[[annotation]]
id    = "json-ser-0047"
file  = "src/ser.rs"
lines = "1764-1800"
title = "write_char_escape — two bytes, or six"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "24-strings-escapes-and-borrowing"
rust_features = ["traits", "default-methods", "pattern-matching"]
prereqs = ["json-ser-0041"]
body = """
The method that turns a `CharEscape` into bytes.

The first `match` picks the letter that follows the backslash. The second
separates the two formats. Eight escapes are a backslash and that letter. A
control character with no short form is written as `\\u00` and two hex
digits, looked up in a sixteen-byte table. The digits are lower case, so
byte 1 is written `\\u0001` and byte 31 is `\\u001f`.

The two leading zeros are literal. This method is only reached for bytes
below `0x20`, so the high byte of the code unit is always zero.
"""

[[annotation]]
id    = "json-ser-0048"
file  = "src/ser.rs"
lines = "1801-1818"
title = "write_byte_array — the default, built from the other hooks"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "default-methods", "iterators"]
body = """
The doc comment names the choice a formatter has: an array of integers, or a
string encoding such as hex or base64.

The default is the array, and it is written by calling `begin_array`,
`begin_array_value`, `write_u8`, `end_array_value` and `end_array` on
`self`. Because it goes through the hooks, a formatter that overrides those
changes how byte arrays look too. Under the pretty formatter a byte slice is
printed one number per line.
"""

[[annotation]]
id    = "json-ser-0049"
