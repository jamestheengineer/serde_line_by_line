[[annotation]]
id    = "json-ser-0001"
file  = "src/ser.rs"
lines = "1-14"
title = "Imports — the other half of serde_core"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "modules"]
body = """
`serde::ser` is the serializing half of the data model. `Serialize` is the
trait a value implements, and `ser` itself is imported so the seven compound
traits can be named as `ser::SerializeSeq` and so on. `Impossible` is the
uninhabited helper type from `serde_core`, used below where a serializer has
to name a type it will never construct.

`crate::io` is the facade from `io/mod.rs`, so `io::Write` means the standard
trait in a `std` build and the substitute otherwise.

`FpCategory` is how the float methods ask whether a value is finite. `hint`
is imported for `hint::unreachable_unchecked`, which appears once, much
further down. `ToString` is needed only with `raw_value`.
"""

[[annotation]]
id    = "json-ser-0002"
file  = "src/ser.rs"
lines = "15-78"
title = "Serializer — a writer, a formatter, and seven names for one type"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["generic-params", "associated-types", "traits", "where-clauses", "lifetimes"]
prereqs = ["ser-mod-0016", "ser-mod-0018", "json-de-0049"]
body = """
The serializer is two fields. `writer` is where bytes go. `formatter` decides
what the punctuation between values looks like.

`F = CompactFormatter` is a default type parameter. `Serializer<W>` written
with one argument means the compact one. The constructors are split across
three impl blocks so that inference works: `new` is defined only for the
default formatter and `pretty` only for `PrettyFormatter`, so neither call
needs a type annotation. `with_formatter` is the general constructor, and
`into_inner` gives the writer back.

Then the trait impl. As on the deserializing side, `serde_core`'s
`Serializer` is implemented for `&'a mut Serializer<W, F>`, because the
trait's methods take `self` by value and one serializer has to write many
values.

`type Ok = ()` says a finished serialization returns nothing. The output has
already gone to the writer. The seven compound associated types are all the
same type, `Compound`. `serde_core` lets a format use seven different types
for sequences, tuples, maps, structs and their variants. JSON has two
bracket styles, and one enum with a small state field covers all seven.
"""

[[annotation]]
id    = "json-ser-0003"
file  = "src/ser.rs"
lines = "79-153"
title = "bool and ten integer widths — the serializer writes nothing itself"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["inlining", "result"]
prereqs = ["ser-mod-0019", "ser-mod-0020", "ser-mod-0022"]
body = """
Eleven methods with one body. Each calls the matching `write_*` method on the
formatter, passing the writer, and converts an I/O error into the crate's
error type with `map_err(Error::io)`.

This is the division of labour for the whole file. The `Serializer` impl
decides *what* to write, in terms of the data model. The `Formatter` trait
decides the bytes. A method here never calls `write_all` directly.

All of them are `#[inline]` except the two 128-bit methods. Those are rare,
and their formatting code is larger.
"""

[[annotation]]
id    = "json-ser-0004"
file  = "src/ser.rs"
lines = "154-181"
title = "f32 and f64 — NaN and infinity become null"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching"]
body = """
JSON numbers cannot express NaN or infinity. The grammar has no spelling for
them.

`value.classify()` returns an `FpCategory`, and for the two non-finite
categories this writes `null`. Everything else goes to the formatter as a
number.

This is a silent, lossy choice and you should know it is there. A struct with
an `f64` field holding NaN serializes without error. Reading the output back
into the same struct then fails, because `null` is not a number. The
alternative would have been to return an error from serialization, and
upstream chose output that is always valid JSON.
"""

[[annotation]]
id    = "json-ser-0005"
file  = "src/ser.rs"
lines = "182-200"
title = "char, str and bytes — a string, a string, and an array of numbers"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "24-strings-escapes-and-borrowing"
rust_features = ["strings", "inlining"]
prereqs = ["ser-mod-0025", "ser-mod-0026", "ser-mod-0027"]
body = """
A `char` is encoded into a four-byte stack buffer and serialized as a
one-character string. JSON has no character type.

`serialize_str` calls `format_escaped_str`, a free function further down that
writes the quotes and escapes what must be escaped.

`serialize_bytes` goes to `write_byte_array`, whose default writes the bytes
as a JSON array of integers. `b"ab"` becomes `[97,98]`. JSON has no binary
type, and this is the form `deserialize_bytes` accepts back alongside
strings.
"""

[[annotation]]
id    = "json-ser-0006"
file  = "src/ser.rs"
lines = "201-231"
title = "unit, unit struct, unit variant, newtype struct"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["strings", "sized-bound"]
prereqs = ["ser-mod-0029", "ser-mod-0030", "ser-mod-0031"]
body = """
Four methods that settle how the "empty" and "transparent" parts of the data
model look in JSON.

`()` is `null`. A unit struct is also `null`, and its name is discarded. A
unit variant is its name as a string, so `Color::Red` is `"Red"`. A newtype
struct is its inner value with nothing around it, as the doc comment says.

`T: ?Sized + Serialize` appears on every generic method in this impl. The
`?Sized` allows `T` to be `str` or a slice, which are serialized through
references and have no size of their own.
"""

[[annotation]]
id    = "json-ser-0007"
file  = "src/ser.rs"
lines = "232-269"
title = "newtype variant — the externally tagged form, spelled out in formatter calls"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["sized-bound", "result"]
prereqs = ["ser-mod-0032"]
body = """
`E::V(x)` becomes `{"V": x}`. This method writes that one piece at a time,
and it is worth reading once slowly because every compound method below is
some subset of the same sequence.

Open an object. Begin a key, passing `true` because it is the first key.
Write the variant name as a string. End the key. Begin the value. Serialize
the inner value. End the value. Close the object.

Eight calls, of which seven only tell the formatter where it is. The compact
formatter writes one byte for most of them and nothing for some. The pretty
formatter uses the same calls to place newlines and indentation.

`value.serialize(&mut *self)` re-borrows the serializer for the nested
value, so that `self` can be used again afterwards.
"""

[[annotation]]
id    = "json-ser-0008"
file  = "src/ser.rs"
lines = "270-282"
title = "none and some — null, or the value"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["option", "sized-bound"]
prereqs = ["ser-mod-0028", "json-de-0060"]
body = """
`None` is `null`. `Some(x)` is `x`, with no wrapper.

This is the serializing side of what you saw in `deserialize_option`, with
the same consequence. `Some(None)` and `None` both produce `null`, and the
distinction does not survive a round trip.
"""

[[annotation]]
id    = "json-ser-0009"
file  = "src/ser.rs"
lines = "283-319"
title = "seq, tuple, tuple struct — and why an empty array is closed immediately"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["option", "pattern-matching"]
prereqs = ["ser-mod-0033", "ser-mod-0034"]
body = """
`serialize_seq` writes the opening bracket and returns a `Compound` through
which the elements will be written.

The `len == Some(0)` branch closes the array at once and returns the state
`Empty`, which tells the eventual `end` call to do nothing. The point is the
pretty printer. Its `end_array` writes a newline and indentation before the
`]` if anything was written since the bracket opened. Closing immediately is
what makes an empty array print as `[]` on one line.

The variant returned is called `Compound::Map` even though this is an array.
The name is historical. The variant means "an ordinary bracketed container".

Tuples and tuple structs are arrays, and both forward with a known length.
"""

[[annotation]]
id    = "json-ser-0010"
file  = "src/ser.rs"
lines = "320-347"
title = "tuple variant — an object opened here and closed somewhere else"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["result"]
prereqs = ["ser-mod-0035"]
body = """
`E::V(a, b)` becomes `{"V": [a, b]}`. This method writes `{"V":` and then
calls `serialize_seq` for the array.

It returns with the outer object still open. Nothing in the returned
`Compound` records that. The closing brace is written by the `end` method of
the `SerializeTupleVariant` impl, which knows from which trait it is being
called that an outer object is waiting.
"""

[[annotation]]
id    = "json-ser-0011"
file  = "src/ser.rs"
lines = "348-370"
title = "serialize_map — the same shape with braces"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["option"]
prereqs = ["ser-mod-0035"]
body = """
Identical to `serialize_seq` with `begin_object` and `end_object`. An empty
map is closed immediately for the same reason an empty array is.

`len` is used only for that zero test. JSON does not write lengths, so a map
of unknown size, `None`, is handled exactly like a map of known non-zero
size.
"""

[[annotation]]
id    = "json-ser-0012"
file  = "src/ser.rs"
lines = "371-381"
title = "serialize_struct — an object, unless the name is a secret token"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "cfg", "strings"]
body = """
A struct is serialized as an object, by forwarding to `serialize_map`.

The two gated arms are the serializing end of a private protocol. With
`arbitrary_precision`, a `Number` serializes itself as a struct whose name is
a reserved string. With `raw_value`, `RawValue` does the same with a
different one. This method recognises those names and returns a special
`Compound` variant that will write the payload verbatim.

The data model has no way to say "emit this text unquoted", so the request is
encoded as a struct with a name no user type would choose. You saw the
receiving end in `deserialize_newtype_struct`.
"""

[[annotation]]
id    = "json-ser-0013"
file  = "src/ser.rs"
lines = "382-409"
title = "struct variant — an object inside an object"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["result"]
prereqs = ["ser-mod-0037"]
body = """
`E::V { a, b }` becomes `{"V": {"a": ..., "b": ...}}`. The method writes the
outer `{"V":` with the same five calls as the other variant forms and then
calls `serialize_map` for the inner object.

As with tuple variants, the outer brace is left open for the matching `end`.
"""

[[annotation]]
id    = "json-ser-0014"
file  = "src/ser.rs"
lines = "410-459"
title = "collect_str — writing a Display value without building a String"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "closures", "option", "custom-errors"]
prereqs = ["ser-mod-0040"]
body = """
`collect_str` serializes anything that implements `Display` as a JSON string.
`serde_core`'s default does it by formatting into a temporary `String`. This
override streams the formatted text into the output.

The local `Adapter` type bridges two traits. `write!` needs a `fmt::Write`.
The output is an `io::Write` that requires escaping. The adapter implements
`fmt::Write::write_str` by passing each fragment through
`format_escaped_str_contents`.

There is a mismatch in the error types. `fmt::Error` is a unit struct and
cannot carry a cause. So the adapter stores the real `io::Error` in a field,
returns the empty `fmt::Error` to stop the formatting, and the caller picks
the stored error up afterwards. The `expect` documents the invariant that a
formatting failure always has one.

The quotes are written outside the adapter, by `begin_string` and
`end_string`, since a value may arrive in several fragments.
"""

[[annotation]]
id    = "json-ser-0015"
file  = "src/ser.rs"
lines = "460-481"
title = "State and Compound — public by necessity"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["visibility", "cfg", "lifetimes"]
body = """
Both types carry the same comment: not public API, should be `pub(crate)`.

They are `pub` because of a rule about interfaces. `Compound` is named as an
associated type in a public trait impl, and a type that appears in a public
interface must itself be nameable as public. `#[doc(hidden)]` keeps it out of
the documentation.

`State` has three values. `First` means nothing has been written inside the
brackets. `Rest` means something has, so the next item needs a comma.
`Empty` means the container was closed as soon as it was opened.

`Compound::Map` holds the borrowed serializer and that state. The two gated
variants hold only the serializer. They are the special modes for a number
or raw value being emitted as text.
"""

[[annotation]]
id    = "json-ser-0016"
file  = "src/ser.rs"
lines = "482-528"
title = "SerializeSeq for Compound — one element"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "pattern-matching", "sized-bound"]
prereqs = ["ser-mod-0042"]
body = """
`serialize_element` tells the formatter an array value is beginning and
whether it is the first. The compact formatter writes a comma when it is
not. The state becomes `Rest`, the element is serialized, and the formatter
is told the value has ended.

`value.serialize(&mut **ser)` has two dereferences because `self` is matched
by reference. `ser` is a `&mut &'a mut Serializer`, and the nested call needs
a plain `&mut Serializer`.

`end` writes the closing bracket unless the state is `Empty`, in which case
it was written already.

The two gated arms are `unreachable!()`. Those variants are only created by
`serialize_struct`, and a struct is never driven through `SerializeSeq`.
"""

[[annotation]]
id    = "json-ser-0017"
file  = "src/ser.rs"
lines = "529-572"
title = "SerializeTuple and SerializeTupleStruct — forwarding to the sequence impl"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits"]
prereqs = ["ser-mod-0043"]
body = """
Two traits, each with two methods, each forwarding to `SerializeSeq`.

The calls are fully qualified, `ser::SerializeSeq::serialize_element(self,
value)`, because `Compound` implements several traits with a method of the
same name. A plain method call would be ambiguous.

`SerializeTupleStruct` calls its method `serialize_field`. The JSON is the
same array.
"""

[[annotation]]
id    = "json-ser-0018"
file  = "src/ser.rs"
lines = "573-610"
title = "SerializeTupleVariant — the end that closes two containers"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "pattern-matching"]
prereqs = ["ser-mod-0044"]
body = """
Elements are written as for any sequence. `end` is where this trait differs.

It closes the array, unless it was empty and already closed. Then it ends
the object value and closes the object. This is the brace that
`serialize_tuple_variant` left open.

The information that there is an outer object is not stored in the value. It
is carried by the type system: the caller holds this `Compound` as a
`SerializeTupleVariant` and calls that trait's `end`.
"""

[[annotation]]
id    = "json-ser-0019"
file  = "src/ser.rs"
lines = "611-644"
title = "SerializeMap::serialize_key — a key goes through its own serializer"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "pattern-matching"]
prereqs = ["ser-mod-0045"]
body = """
A key is announced to the formatter with the first-or-not flag, which is
where the comma between entries comes from. The state moves to `Rest`.

Then the key is serialized, and not with the main serializer. It is given
`MapKeySerializer { ser: *ser }`, a separate type with its own `Serializer`
impl. JSON keys must be strings, and a Rust map may be keyed by integers,
booleans or enums. `MapKeySerializer` turns the permitted types into quoted
strings and rejects the rest.

`*ser` re-borrows the `&'a mut Serializer` out of the pattern binding for the
duration of the call.
"""

[[annotation]]
id    = "json-ser-0020"
file  = "src/ser.rs"
lines = "645-682"
title = "serialize_value and end — a colon, a value, a closing brace"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "pattern-matching"]
prereqs = ["ser-mod-0045"]
body = """
`begin_object_value` is where the colon is written. The value is serialized
with the main serializer, and `end_object_value` follows.

`end` closes the object unless it was empty.

`SerializeMap` in `serde_core` also has `serialize_entry`, which takes a key
and a value together and by default calls these two methods in order. That
default is not overridden here, and the struct impl below relies on it.
"""

[[annotation]]
id    = "json-ser-0021"
file  = "src/ser.rs"
lines = "683-728"
title = "SerializeStruct — entries, or a verbatim payload"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "cfg", "pattern-matching"]
body = """
For an ordinary struct, a field is a map entry whose key is the field's name.
`serialize_field` forwards to `SerializeMap::serialize_entry`.

The gated arms complete the token protocol. In `Number` mode the one
expected field has the reserved name as its key, and its value is the
number's text. That text is serialized with `NumberStrEmitter`, a serializer
whose `serialize_str` writes the string without quotes or escaping. Any
other key is an error. `RawValue` mode works the same way through
`RawValueStrEmitter`.

`end` for the special modes returns `Ok(())` and writes nothing. No bracket
was opened.
"""

[[annotation]]
id    = "json-ser-0022"
file  = "src/ser.rs"
lines = "729-772"
title = "SerializeStructVariant — fields as for a struct, and a double close"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "pattern-matching"]
prereqs = ["ser-mod-0047"]
body = """
`serialize_field` forwards to the struct impl. `end` mirrors the tuple
variant's: close the inner object unless it was empty, end the object value,
close the outer object.

The match in `serialize_field` is on `*self` with wildcard patterns. Nothing
is bound, so nothing is moved out, and `self` can still be passed along.
"""

[[annotation]]
id    = "json-ser-0023"
file  = "src/ser.rs"
lines = "773-786"
title = "MapKeySerializer, and two errors for the token protocol"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["lifetimes", "cfg", "custom-errors"]
body = """
`MapKeySerializer` wraps the borrowed serializer. It is a distinct type so
that it can have a distinct `Serializer` impl.

The two functions build the errors for a malformed `Number` or `RawValue`
struct. `Error::syntax` takes a line and a column, and both are 0. A
serializer has no input position to report. The codes are borrowed from the
parser's vocabulary, which is why a serialization failure can carry the text
"expected value".
"""

[[annotation]]
id    = "json-ser-0024"
file  = "src/ser.rs"
lines = "787-833"
title = "Serializer for MapKeySerializer — strings pass, compounds are impossible"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "associated-types", "marker-types"]
prereqs = ["ser-impossible-0003"]
body = """
Two more error constructors first, for the two things a key serializer
refuses.

Then the impl. A string key is serialized as a string. A unit variant is its
name, so a map keyed by a field-less enum works. A newtype struct passes
`self` to the inner value, which means the inner value is still being
serialized as a key.

The seven compound types are `Impossible<(), Error>`. `Impossible` is
`serde_core`'s type for exactly this: it implements every compound trait and
has no values. The methods that would return one can therefore only return
`Err`, and the associated types are satisfied without writing seven dummy
structs.
"""

[[annotation]]
id    = "json-ser-0025"
file  = "src/ser.rs"
lines = "834-1020"
title = "bool and integer keys — the same value, inside quotation marks"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["result"]
body = """
Eleven methods and 187 lines, and one sentence describes all of them. Each
writes an opening quote with `begin_string`, writes the value with the same
formatter method the main serializer uses, and writes a closing quote with
`end_string`.

So a map keyed by `u8` serializes key 1 as `"1"`, and a map keyed by `bool`
writes `"true"`. This is the mirror of `deserialize_numeric_key!` in
`de.rs`, which reads a number back out from between the quotes.

No escaping is needed. A formatted integer or boolean contains only digits,
a minus sign or letters.

These are written out by hand, eleven times. The deserializer generated its
equivalents with a macro. Both approaches are in the same crate, and
neither file explains the difference.
"""

[[annotation]]
id    = "json-ser-0026"
file  = "src/ser.rs"
lines = "1021-1062"
title = "Float keys — finite, or an error"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors"]
body = """
Float keys are quoted like integers, with one check first. A NaN or an
infinity returns `FloatKeyMustBeFinite`.

Compare this with float *values*, where the same inputs are written as
`null`. That option does not exist here, since a key must be a string and
`"null"` would be a different key that happens to collide for every
non-finite float in the map. An error is the only honest answer.
"""

[[annotation]]
id    = "json-ser-0027"
file  = "src/ser.rs"
lines = "1063-1066"
title = "A char key — an ordinary string"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings"]
body = """
One character encoded into a four-byte buffer and passed to the main
serializer's `serialize_str`. The buffer is a temporary created inside the
argument expression.

A `char` needs the full string path because it may be a quote or a control
character and require escaping.
"""

[[annotation]]
id    = "json-ser-0028"
file  = "src/ser.rs"
lines = "1067-1095"
title = "Five things that cannot be a key"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["custom-errors"]
body = """
Bytes, unit, unit struct, newtype variant and `None` each return
`KeyMustBeAString`.

None of these has an obvious string form. A newtype variant would need both a
name and a payload. `None` has nothing to write, and `null` unquoted is not a
string.

Because the error is created with line 0 and column 0, its message is the
bare text "key must be a string" with no position. That is correct, since
nothing was being read.
"""

[[annotation]]
id    = "json-ser-0029"
file  = "src/ser.rs"
lines = "1096-1102"
title = "Some as a key — transparent"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["option", "sized-bound"]
body = """
`Some(x)` is serialized as `x`, still in key position. A map keyed by
`Option<u8>` therefore works as long as every key present is `Some`, and
fails on the first `None`.
"""

[[annotation]]
id    = "json-ser-0030"
file  = "src/ser.rs"
lines = "1103-1146"
title = "Seven compound keys — every one an error"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["custom-errors", "associated-types"]
body = """
The seven methods that would begin a sequence, map or struct. Each returns
`KeyMustBeAString`.

Their return types are `Result<Self::SerializeSeq>` and so on, which the
impl defined as `Impossible`. Since `Impossible` has no values, `Err` is the
only thing these functions could return. The types and the bodies agree.
"""

[[annotation]]
id    = "json-ser-0031"
file  = "src/ser.rs"
lines = "1147-1154"
title = "collect_str for a key — delegate"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits"]
body = """
A `Display` value used as a key is written by the main serializer's
`collect_str`, which already produces a quoted, escaped string. That is all a
key needs.

This closes the key serializer. It accepted strings, characters, integers,
booleans, finite floats, unit variants, and transparent wrappers around any
of those.
"""

[[annotation]]
id    = "json-ser-0032"
file  = "src/ser.rs"
lines = "1155-1170"
title = "NumberStrEmitter — a serializer that accepts one thing"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "associated-types", "marker-types"]
body = """
Compiled only with `arbitrary_precision`. This is the type `Compound::Number`
hands the number's text to.

It is a tuple struct around the borrowed serializer, and its `Serializer`
impl is a list of refusals with one exception. The compound types are
`Impossible`, as for the key serializer.
"""

