[[annotation]]
id    = "json-ser-0063"
file  = "src/ser.rs"
lines = "2276-2285"
title = "indent — one write per level"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["iterators"]
body = """
Writes the indent bytes `n` times. It is called once per line of pretty
output with the current depth.

There is no buffering here, so a value nested ten deep makes ten small
writes for each line's indentation. That is cheap into a `Vec` and is one
more reason to buffer a file or socket before handing it to `to_writer_pretty`.
"""
