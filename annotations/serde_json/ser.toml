[[annotation]]
id    = "json-ser-0054"
file  = "src/ser.rs"
lines = "1937-1983"
title = "CompactFormatter and PrettyFormatter — no state, and three fields"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "lifetimes", "default-methods"]
body = """
`CompactFormatter` is a unit struct, and its impl is an empty pair of braces.
Compact JSON is what the trait's defaults already write.

`PrettyFormatter` has state. `current_indent` is the nesting depth.
`indent` is the bytes of one indentation step, borrowed, which is where the
lifetime parameter comes from. `new` uses two spaces. `has_value` records
whether anything has been written inside the innermost open container.

`begin_array` shows how the fields are used. It increases the depth, clears
`has_value` because the new array is empty so far, and writes the bracket.
Nothing else is written yet. Whether a newline follows depends on whether an
element ever arrives.

`Default` is implemented by hand because the derived version would use an
empty indent.
"""

[[annotation]]
id    = "json-ser-0055"
file  = "src/ser.rs"
lines = "1984-2016"
title = "Pretty arrays — a newline before each value, and one before the bracket if needed"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "inlining"]
body = """
`begin_array_value` writes a newline, or a comma and a newline, and then
the indentation for the current depth. Each element starts on its own line.

`end_array_value` sets `has_value`. `end_array` decreases the depth and, if
`has_value` is set, writes a newline and the outer indentation before the
`]`. An array that never had an element gets no newline and prints as `[]`.

One `bool` is enough for any depth of nesting. When an inner container
closes, the next call is the *outer* container's `end_array_value` or
`end_object_value`, which sets the flag again. So by the time the outer
container closes, the flag describes it.
"""

[[annotation]]
id    = "json-ser-0056"
file  = "src/ser.rs"
lines = "2017-2068"
title = "Pretty objects — the same logic, and a space after the colon"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "inlining"]
body = """
The object methods repeat the array methods with braces.
`begin_object_key` starts each entry on a new indented line.
`end_object_value` sets `has_value`.

The one visible difference from compact output inside a line is
`begin_object_value`, which writes a colon followed by a space.

`end_object_key` is not overridden. Nothing is written between a key and its
colon.
"""

[[annotation]]
id    = "json-ser-0057"
file  = "src/ser.rs"
lines = "2069-2078"
title = "format_escaped_str — quotes around the contents"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "24-strings-escapes-and-borrowing"
rust_features = ["sized-bound", "generic-params"]
body = """
Three calls: begin the string, write its contents, end it. The contents
function is separate because `collect_str` needs it on its own, to write a
value that arrives in several pieces between one pair of quotes.

Both type parameters are `?Sized`, so this works with trait objects for the
writer and the formatter.
"""

[[annotation]]
id    = "json-ser-0058"
file  = "src/ser.rs"
lines = "2079-2166"
title = "format_escaped_str_contents and the escape table — runs, then one escape"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "24-strings-escapes-and-borrowing"
rust_features = ["unsafe", "strings", "pattern-matching", "zero-cost"]
prereqs = ["json-ser-0046"]
body = """
This is the serializer's string scanner. It walks the bytes, and for each
one looks up `ESCAPE[byte]`. Zero means the byte is written as it is. Most
bytes are zero, and for those the loop only advances `i`.

When a byte needs escaping, everything before it since the last escape is a
run. The run is written as one fragment, the escape is written, and the scan
restarts on the remainder. A string with no special characters is therefore
one `write_string_fragment` call for the whole thing.

The table is the specification. Read it by row and column: bytes `0x00` to
`0x1F` are all escaped, five of them with short forms, and above that only
`"` and `\\`. Bytes from `0x80` up are zero, so non-ASCII text is written as
UTF-8 and never as `\\u` escapes. `0x7F` is not escaped either. The single
letters stored in the table are the escape letters themselves, and the `__`
constant keeps the rows aligned.

There are three `unsafe` blocks. Two convert a run back to `&str` without
checking. The comment gives the argument: the input was a `&str`, and it is
only ever cut immediately before or after an ASCII byte, which cannot be
inside a multi-byte character.

The third is `unreachable_unchecked` in the `match`. It tells the compiler
that the table holds no value other than the eight listed, so no code is
generated for the impossible case. That claim is true because the table is
right there, and it would become undefined behaviour if someone added a ninth
letter to the table and not to the match.
"""

[[annotation]]
id    = "json-ser-0059"
file  = "src/ser.rs"
lines = "2167-2185"
title = "to_writer — a serializer, and one call"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["generic-params", "sized-bound", "where-clauses"]
prereqs = ["ser-mod-0012"]
body = """
The base of the six public serialization functions. It builds a compact
`Serializer` over the writer and calls `value.serialize(&mut ser)`.

That call is the handover, as `T::deserialize` was on the other side. The
type's `Serialize` impl now drives the serializer, calling whichever
`serialize_*` methods describe its shape.

The doc comment makes a promise about the output: only valid UTF-8 is ever
passed to the writer. The errors section names the two ways serialization
fails, the type's own impl failing or a map key that is not a string. An I/O
error from the writer is a third, and is not listed.
"""

[[annotation]]
id    = "json-ser-0060"
file  = "src/ser.rs"
