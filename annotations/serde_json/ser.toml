rust_features = ["generic-params", "sized-bound"]
body = """
Identical except for `Serializer::pretty`. The formatter is a type parameter
of the serializer, so choosing it is choosing a different monomorphization of
the same code.
"""

[[annotation]]
id    = "json-ser-0061"
file  = "src/ser.rs"
lines = "2206-2256"
title = "to_vec, to_vec_pretty and to_string — a Vec, then a String without a check"
kind  = "impl"
tracks = ["reference"]
rust_features = ["unsafe", "collections", "strings"]
body = """
`to_vec` allocates a `Vec<u8>` with room for 128 bytes and passes `&mut
writer` to `to_writer`. That works because `&mut W` is a writer when `W` is.
The initial capacity is a guess that avoids the first few reallocations for
small values.

`to_string` calls `to_vec` and converts the bytes with
`String::from_utf8_unchecked`. The comment is five words: "We do not emit
invalid UTF-8."

It is worth checking that claim against what you have read. Every byte
written is one of four things: ASCII punctuation and literals, digits from
`itoa` and `zmij`, escape sequences, or fragments of a `&str` that were cut at
ASCII boundaries. All of those are valid UTF-8. The claim also depends on the
`Formatter` being one of the built-in two, which it is here because these
functions construct it.
"""

