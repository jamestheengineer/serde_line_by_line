[[annotation]]
id    = "json-ser-0041"
file  = "src/ser.rs"
lines = "1516-1538"
title = "CharEscape — nine ways to escape a byte"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "24-strings-escapes-and-borrowing"
rust_features = ["pattern-matching"]
body = """
A public enum naming each kind of escape JSON has. Eight are the
two-character escapes. The ninth, `AsciiControl(u8)`, is every other control
character, written as `\\u00XX`.

The doc comment says "type-safe", and the point is the interface to
`Formatter::write_char_escape`. A formatter receives one of these values and
decides the bytes. It cannot be handed an arbitrary byte and asked to
escape it.

`Solidus` is in the list although the serializer never produces it. A
forward slash may be escaped in JSON and does not have to be.
"""

[[annotation]]
id    = "json-ser-0042"
file  = "src/ser.rs"
lines = "1539-1575"
title = "Formatter — every byte of output goes through here"
kind  = "trait-item"
tracks = ["reference", "course"]
course_unit = "23-writing-a-serializer"
rust_features = ["traits", "default-methods", "sized-bound", "generic-params"]
body = """
The trait that separates what JSON means from what it looks like. The doc
comment gives pretty printing as the reason, and the design goes further
than that requires: literals, numbers, string fragments and every bracket are
each a method.

Every method has a default body, and the defaults together are compact JSON.
A formatter overrides only what it wants to change.

The three methods here set the pattern. Each takes `&mut self` and a writer,
and returns `io::Result<()>`, the writer's own error type. The conversion to
the crate's `Error` happens in the serializer, one level up.

`W: ?Sized + io::Write` permits a writer behind a trait object. Each method
is generic over the writer, so the trait itself has no type parameter.

`write_i8` shows how integers are written. `itoa::Buffer` is a small
stack buffer from the `itoa` crate, and `format` writes the decimal digits
into it and returns them as a `&str`. No heap allocation and no `fmt`
machinery is involved.
"""

[[annotation]]
id    = "json-ser-0043"
file  = "src/ser.rs"
lines = "1576-1674"
title = "Nine more integer widths, each the same three lines"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "default-methods", "inlining"]
body = """
`write_i16` through `write_u128`. The bodies are identical, and the types are
not, which is why they cannot be one function. `itoa::Buffer::format` is
generic over an integer trait, and each call here is compiled for one width.

They are separate trait methods so that a formatter can treat widths
differently. One that wrote 64-bit integers as strings, to survive a
JavaScript consumer that reads numbers as doubles, would override
`write_u64` and `write_i64` and leave the rest.
"""

[[annotation]]
id    = "json-ser-0044"
file  = "src/ser.rs"
lines = "1675-1724"
title = "write_f32 and write_f64 — and a precondition in the doc comment"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["traits", "default-methods"]
body = """
Floats are formatted by `zmij`, a crate that does for floats what `itoa` does
for integers. `format_finite` writes the shortest decimal text that reads
back as the same float, so `f32::MAX` comes out as `3.4028235e+38` and not
as thirty-nine digits.

The doc comment is a contract with whoever calls this method. It does not
check for NaN or infinity, and for those inputs the output is "some correctly
formatted but unspecified numerical value". The caller must check first.
The serializer does, in `serialize_f64`, which is where non-finite values
become `null`.

The two methods are separate because the shortest representation depends on
the width. The `f32` nearest to 0.1 prints as `0.1` when formatted as an
`f32`, and as a long string of digits if first widened to `f64`.
"""

[[annotation]]
id    = "json-ser-0045"
