[[annotation]]
id    = "json-error-0007"
file  = "src/error.rs"
lines = "187-229"
title = "From Error for io::Error — unwrap it, or wrap it"
kind  = "cfg-gate"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["cfg", "traits", "pattern-matching"]
body = """
A `serde_json::Error` can be converted into an `io::Error`. If it was
holding one, that one is returned. Otherwise a new `io::Error` is built
with the JSON error inside it as the cause, with kind `UnexpectedEof` for
end-of-input and `InvalidData` for the rest.

The doc example shows the pattern this supports: an application error enum
that routes I/O failures one way and JSON failures another.

`Category::Io => unreachable!()` is correct because the `if let` above has
already taken that case. The `allow` silences a lint that objects to a
`From` impl containing a panic path.
"""

[[annotation]]
id    = "json-error-0008"
file  = "src/error.rs"
lines = "230-312"
title = "ErrorImpl and ErrorCode — what is inside the box"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["custom-errors", "visibility", "smart-pointers"]
prereqs = ["json-error-0002"]
body = """
`ErrorImpl` is the boxed payload: a code, a line and a column.

`ErrorCode` is `pub(crate)`. Callers of the crate cannot match on it. They
get `classify` and the `Display` text. That keeps the list of codes free to
change.

Two variants carry data. `Message(Box<str>)` holds free text, boxed as a
`str` and not a `String` because it is never modified and a `Box<str>` is
one word smaller. `Io` holds the I/O error.

The other twenty-three are unit variants, each naming one thing the parser
or serializer can object to. You have seen most of them raised.
`LoneLeadingSurrogateInHexEscape` is the one whose name `read.rs` admits is
wrong for one of its uses. The doc comment on `RecursionLimitExceeded` says
"more than 128 layers deep", and the limit you saw enforced is reached at
128.
"""

[[annotation]]
id    = "json-error-0009"
file  = "src/error.rs"
lines = "313-348"
title = "syntax, io, fix_position — three constructors"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["custom-errors", "closures", "inlining"]
prereqs = ["json-error-0008"]
body = """
`syntax` builds an error with a code and a position. It is the constructor
`read.rs` and `de.rs` call. Serializers call it too, with zeros.

`io` wraps an I/O error with no position. It is `pub` and hidden, with a
comment saying it should be `pub(crate)` and naming another crate that
depends on it.

`fix_position` is the mechanism behind every "error with no position"
remark in `de.rs`. If the line is 0, the error is taken apart and its code
is passed to a closure, which builds a new error at the parser's current
position. If the line is already set, the error is returned unchanged.

All three are `#[cold]`.
"""

