[[annotation]]
id    = "json-error-0001"
file  = "src/error.rs"
lines = "1-14"
title = "Imports — both of serde_core's Error traits"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "modules"]
body = """
`use serde::{de, ser}` brings in the two modules that each define an
`Error` trait. This file implements both for one type, so that the same
`serde_json::Error` is returned from serializing and deserializing.

`crate::io` is the facade, which matters here because an I/O error is one
of the things an `Error` can hold. The two `std`-gated imports are for the
parts that only make sense with the real standard library: the `Error`
trait's `source` chain and `io::ErrorKind`.
"""

[[annotation]]
id    = "json-error-0002"
file  = "src/error.rs"
lines = "15-26"
title = "Error — one pointer wide"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["smart-pointers", "custom-errors", "result"]
body = """
The public error type is a struct holding a `Box`. The doc comment on the
field gives the reason, and it is a measurement: a larger `Error` made the
crate "substantially slower".

Almost every function in the parser returns `Result<T, Error>`. A `Result`
is at least as large as its larger variant, so a wide error type makes every
return value wide, including the successful ones that are nearly all of
them. Boxing moves the cost to the failure path, which allocates. `Error`
is the size of one pointer.

`Result<T>` is the alias used throughout the crate. It shadows the
standard `Result`, which is why some files import `core::result` to name
the two-parameter form.
"""

[[annotation]]
id    = "json-error-0003"
file  = "src/error.rs"
lines = "27-47"
title = "line and column — one-based, except when they are zero"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["custom-errors"]
body = """
Two accessors with careful doc comments. Lines and columns are counted from
1.

The note on `column` admits an exception. A column of 0 is possible, for
example when a read fails immediately after a newline. That is the
`LineColIterator` convention showing through: its column is 0 after a
newline until the next byte arrives.

A line of 0 has a different meaning, used throughout this file. It means the
error has no position at all.
"""

[[annotation]]
id    = "json-error-0004"
file  = "src/error.rs"
lines = "48-113"
title = "classify — four categories from twenty-five codes"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["pattern-matching", "custom-errors"]
body = """
`classify` maps the private error code to a public category. The match is
exhaustive with no wildcard, so adding a code without categorising it is a
compile error.

`Message` is `Data`. Those are the errors created through `serde_core`'s
`Error::custom`, which is what a `Deserialize` impl uses to say the input
was well-formed and wrong for the type. The four end-of-input codes are
`Eof`. Everything else is `Syntax`.

Some of the `Syntax` entries are not about syntax. `KeyMustBeAString` and
`FloatKeyMustBeFinite` arise when serializing, and
`RecursionLimitExceeded` is a limit and not a grammar rule. The four
categories are coarse, and these had to go somewhere.

The four `is_*` methods compare against `classify`. `is_eof`'s doc comment
names its use: a streaming caller can wait for more input and retry.
"""

