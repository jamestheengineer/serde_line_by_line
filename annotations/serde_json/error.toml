[[annotation]]
id    = "json-error-0011"
file  = "src/error.rs"
lines = "389-398"
title = "The standard Error trait — through serde_core's alias"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "cfg", "no-std"]
body = """
`serde::de::StdError` is `std::error::Error` when `std` is available, and
`serde_core`'s own minimal substitute when it is not. You read that
substitute in `std_error.rs`. Implementing the alias lets this impl exist
in both builds.

`source` is defined only with `std`. For an I/O error it returns that
error's own source, skipping the I/O error itself.
"""

[[annotation]]
id    = "json-error-0012"
file  = "src/error.rs"
lines = "399-418"
title = "Display for Error — the position is a suffix"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["traits"]
body = """
`Error`'s `Display` forwards to `ErrorImpl`'s. That impl prints the code,
and if the line is not 0, appends " at line L column C".

The format matters beyond presentation. A function at the bottom of this
file parses this exact suffix back out of a string.
"""

[[annotation]]
id    = "json-error-0013"
file  = "src/error.rs"
lines = "419-432"
title = "Debug for Error — written for unwrap"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["traits"]
body = """
The comment explains the audience. `unwrap()` on an `Err` prints the
`Debug` form, so this is the representation people most often see.

A derived `Debug` would show the `Box`, the `ErrorImpl` struct and the
`ErrorCode` variant. This prints `Error("message", line: 1, column: 3)`,
with the code rendered through `Display`.
"""

[[annotation]]
id    = "json-error-0014"
file  = "src/error.rs"
lines = "433-480"
title = "de::Error and ser::Error — custom messages, and JSON's own words"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["traits", "custom-errors", "trait-objects"]
prereqs = ["de-mod-0008", "de-mod-0009"]
body = """
Both of `serde_core`'s `Error` traits require `custom`, which takes any
`Display` value. Both impls format it to a string and call `make_error`.

`de::Error` also has provided methods for common failures. Two are
overridden here, `invalid_type` and `invalid_value`, to change how the
unexpected value is described. `JsonUnexpected` wraps `serde_core`'s
`Unexpected` and replaces two of its renderings. A unit is printed as
`null`, where `serde_core` would say "unit value", since that is what a
JSON user wrote. A float is printed with `zmij`, so that `1.0` appears as
`1.0` and not as `1`.

Everything else falls through to `serde_core`'s `Display`.
"""

[[annotation]]
id    = "json-error-0015"
file  = "src/error.rs"
lines = "481-541"
title = "make_error — parsing a position back out of a message"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "27-errors-that-carry-a-position"
rust_features = ["strings", "option"]
prereqs = ["json-error-0012"]
body = """
The comment states the problem. Some crates, `erased-serde` among them,
pass errors through `de::Error::custom` by formatting them and rebuilding
them from the string. An error that had a line and column comes out the
other side as plain text ending in " at line 3 column 4", with its numeric
position lost.

`make_error` recovers it. `parse_line_col` finds the last " at line ",
reads digits, requires " column ", reads digits, and requires that nothing
follows. If all of that matches, the suffix is cut off the message and the
numbers are stored in the error's fields.

The effect is that any custom message that happens to end in that pattern
has it interpreted as a position. A `Deserialize` impl that calls
`custom("x at line 3 column 4")` produces an error whose `line()` is 3.

`starts_with_digit` checks one byte, and the scanning loops are by hand.
The crate does not pull in a parser for its own error messages.
"""
