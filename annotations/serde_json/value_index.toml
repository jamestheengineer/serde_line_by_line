file  = "src/value/index.rs"
lines = "119-133"
title = "Index for &T — so that &str works"
kind  = "impl"
tracks = ["reference"]
rust_features = ["blanket-impls", "sized-bound"]
body = """
A blanket impl over references. The impl above is for `str`, an unsized
type, and what callers write is `v["key"]`, where the index is a `&str`.
This impl is what connects them.

`T: ?Sized` is required for `T = str`. `(**self)` dereferences twice: once
from `&self` to `&T` and once more to `T`.
"""

