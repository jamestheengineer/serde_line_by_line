[[annotation]]
id    = "json-value-index-0010"
file  = "src/value/index.rs"
lines = "159-216"
title = "ops::Index for Value — and an argument for not panicking"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "where-clauses"]
body = """
The comment above this impl is a design argument, and it is unusually
direct. Indexing in Rust normally panics on a bad index. Here it returns
`Null`.

The reasoning is about who uses `Value`. Someone holding a `Vec` knows its
length. Someone holding JSON from a network endpoint wants to reach into it
and see what is there. The careful approaches already exist: `get`,
`as_array`, or a `match`. This impl is for the other mode, which the
comment calls "concise and careless".

The implementation is two lines. `static NULL: Value = Value::Null` gives a
`Value` with a `'static` address, and a failed lookup returns a reference
to it. `ops::Index::index` must return a reference, so there has to be a
`Null` somewhere to point at.

`type Output = Value` and the bound `I: Index` make this one impl cover
every index type.
"""

[[annotation]]
id    = "json-value-index-0011"
file  = "src/value/index.rs"
lines = "217-258"
title = "ops::IndexMut for Value — the half that does panic"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "where-clauses"]
body = """
Writing through brackets goes to `index_or_insert`, with the behaviour its
doc comment lists. A string index creates the key, and a `Null` becomes an
object. A numeric index must already be in bounds.

So the two operators are asymmetric. Reading a missing path gives `Null`
quietly. Writing to one creates objects as needed and panics where it
cannot, since there is no shared `NULL` that could be handed out mutably.
"""
