[[annotation]]
id    = "json-value-index-0002"
file  = "src/value/index.rs"
lines = "8-36"
title = "Index — what may go inside the brackets"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["sealed-traits", "traits"]
body = """
The crate's own `Index` trait describes a type that can be used to index a
`Value`. The doc comment names the implementors: strings, for objects, and
`usize`, for arrays.

It is sealed, and the comment says so. The methods are hidden and their
contracts are internal, so outside code can use the trait as a bound and
cannot implement it.

The example makes a small point about types. `&data["inner"]` is a
`&Value`, and `assert_eq!(first, 1)` compares a `&Value` with an integer.
That comparison compiles because of the impls in `partial_eq.rs`.
"""

[[annotation]]
id    = "json-value-index-0003"
file  = "src/value/index.rs"
lines = "37-53"
title = "Three methods — look, look mutably, or create"
kind  = "trait-item"
tracks = ["reference"]
rust_features = ["sealed-traits", "lifetimes", "option"]
body = """
`index_into` and `index_into_mut` return an `Option` and never modify the
structure. `index_or_insert` returns a reference unconditionally, and its
doc comment lists what that costs: it inserts a missing key, treats null as
an empty object, and panics when neither is possible.

The lifetime `'v` is on the value and the result, not on `&self`. The index
may be a temporary, and the returned reference borrows only from the
`Value`.
"""

[[annotation]]
id    = "json-value-index-0004"
file  = "src/value/index.rs"
lines = "54-82"
title = "Index for usize — arrays only"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "closures"]
body = """
A `usize` indexes an array. Against any other kind of value the two
optional methods return `None`.

`index_or_insert` does not insert. An array is not extended to reach an
index, so an out-of-bounds position panics with the index and the array's
length. A value that is not an array panics with a message naming its kind,
formatted by the `Type` helper below.

`len` is read before `get_mut` because the closure that builds the panic
message cannot borrow `vec` while `get_mut`'s mutable borrow is alive.
"""

[[annotation]]
id    = "json-value-index-0005"
file  = "src/value/index.rs"
lines = "83-106"
title = "Index for str — objects, and null promoted to an object"
kind  = "impl"
tracks = ["reference"]
rust_features = ["pattern-matching", "collections"]
body = """
A string indexes an object.

`index_or_insert` is where assignment through brackets gets its behaviour.
If the value is `Null`, it is first replaced with an empty object. Then the
key is looked up with the map's `entry` API and inserted with `Null` if
absent. That is why `data["a"]["b"]["c"] = x` works on a fresh `Null`: each
level is created on the way down.

Any other kind of value panics. A number cannot be given a key.

`self.to_owned()` allocates a `String` for the key on every call, including
when the key is already present.
"""

