[[annotation]]
id    = "json-raw-0010"
file  = "src/raw.rs"
lines = "178-193"
title = "from_string — validate, and keep the allocation if possible"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["strings", "ownership"]
prereqs = ["json-raw-0006"]
body = """
An owned `String` becomes a `Box<RawValue>`.

The first line parses the string as a `&RawValue`, which validates it and
returns a reference to the value without surrounding whitespace. If that
reference is shorter than the input, there was whitespace to trim, and the
trimmed text is copied to a new allocation. If the lengths match, the
original `String` is converted in place.

The doc comment adds the second condition for avoiding a copy.
`into_boxed_str` shrinks the allocation to fit, which reallocates if the
string had spare capacity.
"""

[[annotation]]
id    = "json-raw-0011"
file  = "src/raw.rs"
lines = "194-236"
title = "from_string_unchecked — an unsafe fn with a written contract"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["unsafe"]
prereqs = ["json-raw-0010"]
body = """
The same conversion without the parse. It is an `unsafe fn`, and the
`# Safety` section says exactly what the caller promises: one well-formed
JSON value with no surrounding whitespace.

The section also says why this is `unsafe` and not merely unchecked. A
`RawValue` is pasted into output verbatim, and other code is entitled to
rely on its contents being valid, "in the same way that unsafe code may
rely on `str` containing valid UTF-8". Breaking the invariant here could
make a distant piece of code misbehave.

The `debug_assert!` re-parses in debug builds, and the documentation is
honest that this makes debug builds slower than the function's stated
purpose implies.
"""

