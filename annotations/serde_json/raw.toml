title = "Imports — no cfg here, because the whole file is gated"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules"]
body = """
This file has no `#[cfg(feature = "raw_value")]` on its items. The gate is
on the `mod raw;` declaration in `lib.rs`, so without the feature none of
this is compiled.

`BorrowedStrDeserializer` is one of `serde_core`'s single-value
deserializers, the one that calls `visit_borrowed_str`. `mem` is here for
`transmute`, which is how this file creates its central type.
"""

[[annotation]]
id    = "json-raw-0002"
file  = "src/raw.rs"
lines = "15-34"
title = "RawValue — a piece of JSON, kept as text"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["strings"]
body = """
The first paragraph defines it by what it avoids. A `RawValue` is a
reference to the bytes of one JSON value. Deserializing into it checks that
the bytes are a value and does not build anything from them.

Two uses are named. Parsing can be deferred until the program knows what
type the payload is. Or it can be skipped entirely, when the payload is only
being copied from one document to another.

The second paragraph is a guarantee about output. A raw value is written
exactly as it was read. It is not compacted and not re-indented, which you
saw in `write_raw_fragment`.
"""

[[annotation]]
id    = "json-raw-0003"
file  = "src/raw.rs"
lines = "35-78"
title = "The example — moving a payload without parsing it"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["lifetimes", "borrowing"]
body = """
The example reads `{"code": 200, "payload": {}}` and writes
`{"info":[200,{}]}`.

`Input` holds `&'a RawValue` with `#[serde(borrow)]`, the attribute that
tells `serde_derive` the field borrows from the input. `Output` holds the
same reference inside a tuple. The payload is never allocated, never
parsed into a tree, and never re-serialized. The comment in the example
makes the comparison with `Value` explicit.
"""

[[annotation]]
id    = "json-raw-0004"
file  = "src/raw.rs"
lines = "79-114"
title = "Ownership — borrowed from a slice, boxed from a reader"
kind  = "doc-contract"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["ownership", "smart-pointers"]
prereqs = ["json-raw-0002"]
body = """
Two forms, and the documentation says when each applies.

`&'a RawValue` works with `from_str` and `from_slice`, which can lend out
parts of their input. With `from_reader` there is nothing to borrow from,
so the field must be `Box<RawValue>`, and the bytes are buffered as they are
read. You saw both sides of this in `read.rs`, in the two versions of
`end_raw_buffering`.
"""

[[annotation]]
id    = "json-raw-0005"
file  = "src/raw.rs"
lines = "115-120"
title = "struct RawValue { json: str } — an unsized newtype"
kind  = "plumbing"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["sized-bound", "unsafe"]
prereqs = ["json-raw-0002"]
body = """
A struct whose only field is a `str`. Since `str` has no fixed size, neither
does `RawValue`. A value of this type cannot be held directly. It is always
behind a pointer: `&RawValue` or `Box<RawValue>`.

`#[repr(transparent)]` guarantees the struct has the same layout as its
field. That guarantee is what the three conversion functions below depend
on.

The design mirrors `str` and `Path` in the standard library: a type that
is a view of bytes with an invariant attached. For `str` the invariant is
valid UTF-8. For `RawValue` it is one well-formed JSON value.
"""

[[annotation]]
id    = "json-raw-0006"
file  = "src/raw.rs"
lines = "121-134"
title = "Three transmutes"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["unsafe", "smart-pointers"]
prereqs = ["json-raw-0005"]
body = """
`from_borrowed` turns a `&str` into a `&RawValue`. `from_owned` and
`into_owned` convert between `Box<str>` and `Box<RawValue>`.

Each is a `mem::transmute` with both types written out. They are sound in
terms of layout because of `repr(transparent)`: a pointer to the wrapper and
a pointer to its field are the same pointer, with the same length metadata.

What the `unsafe` blocks do not check is the JSON invariant. These
functions are private, and every caller is responsible for passing text
that is a valid value.

`from_borrowed` is a `const fn`, which the constants below need.
"""

[[annotation]]
id    = "json-raw-0007"
file  = "src/raw.rs"
lines = "135-154"
title = "Clone, ToOwned and Default — implemented for the Box"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "29-unsafe-and-written-invariants"
rust_features = ["traits", "smart-pointers", "associated-types"]
body = """
An unsized type cannot implement `Clone`, whose method returns `Self` by
value. So `Clone` is implemented for `Box<RawValue>`.

`ToOwned` is the trait for "the owned form of a borrowed type", and here
`Owned = Box<RawValue>`. Its method copies the text into a new boxed
string and converts.

`Default` for the box is a copy of the `null` constant.
"""

[[annotation]]
id    = "json-raw-0008"
