[[annotation]]
id    = "json-raw-0015"
file  = "src/raw.rs"
lines = "342-354"
title = "TOKEN, and Serialize for RawValue"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "28-feature-gated-engineering"
rust_features = ["traits", "strings"]
prereqs = ["json-number-0012"]
body = """
The reserved name for raw values, and the three lines that start the
protocol on the serializing side. The text is sent as a struct named
`TOKEN` with one field named `TOKEN`.

This is the same shape `Number` uses under `arbitrary_precision`, with a
different token.
"""

[[annotation]]
id    = "json-raw-0016"
file  = "src/raw.rs"
lines = "355-384"
title = "Deserialize for &RawValue — borrowing the bytes"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "lifetime-de", "lifetimes"]
body = """
The impl header is `impl<'de: 'a, 'a> Deserialize<'de> for &'a RawValue`.
The bound `'de: 'a` says the input lives at least as long as the reference
being produced.

The request is `deserialize_newtype_struct(TOKEN, visitor)`. A deserializer
that recognises the token, which means this crate's, responds by calling
`visit_map` with a one-entry map. The visitor checks the key by
deserializing a `RawKey` and reads the value with the seed
`ReferenceFromString`.

A deserializer that does not know the token treats this as an ordinary
newtype and calls `visit_newtype_struct`, which this visitor does not
implement. So `RawValue` works with `serde_json` and fails cleanly
elsewhere.
"""

[[annotation]]
id    = "json-raw-0017"
file  = "src/raw.rs"
lines = "385-414"
title = "Deserialize for Box<RawValue> — owning the bytes"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "lifetime-de", "smart-pointers"]
body = """
The same exchange with a different seed, `BoxedFromString`, which accepts a
string of any lifetime and copies it if it must.
"""

[[annotation]]
id    = "json-raw-0018"
file  = "src/raw.rs"
lines = "415-447"
title = "RawKey — the key must be the token"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits"]
body = """
A unit struct that deserializes successfully only from the string `TOKEN`.
It is the counterpart of `NumberKey` in `number.rs`.
"""

[[annotation]]
id    = "json-raw-0019"
file  = "src/raw.rs"
lines = "448-475"
title = "ReferenceFromString — only a borrowed string will do"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "lifetime-de", "associated-types"]
body = """
A seed and a visitor in one type. As a seed it calls `deserialize_str`. As
a visitor it implements a single method, `visit_borrowed_str`, and converts
the `&'de str` with `from_borrowed`.

There is no `visit_str`. If the deserializer can offer only a short-lived
or owned string, `serde_core`'s default rejects it. That is what happens
when `&RawValue` is requested from a `Deserializer` built over a reader:
the error is "invalid type: string, expected raw value". The `from_reader`
function does not get that far. Its `DeserializeOwned` bound refuses the
type at compile time.

The text is not validated here. It came from the parser, which has just
skipped over exactly one value.
"""

[[annotation]]
id    = "json-raw-0020"
file  = "src/raw.rs"
lines = "476-511"
title = "BoxedFromString — any string, boxed"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "strings"]
body = """
The owning counterpart. `visit_str` copies. `visit_string` converts an owned
`String` without copying, and that is the method the stream reader's
`OwnedRawDeserializer` ends up calling.
"""

[[annotation]]
id    = "json-raw-0021"
file  = "src/raw.rs"
lines = "512-530"
title = "RawKeyDeserializer — the token, as a deserializer"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "macro-rules"]
body = """
A deserializer whose every method calls `visit_borrowed_str(TOKEN)`. It is
the key half of the one-entry map.
"""

[[annotation]]
id    = "json-raw-0022"
file  = "src/raw.rs"
lines = "531-555"
title = "OwnedRawDeserializer — the one-entry map, with an owned value"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "option"]
body = """
A `MapAccess` over `Option<String>`. It yields the token key while the
option is full, then the string as the value, then ends.

This is what `IoRead::end_raw_buffering` constructs, and also what
`Value`'s deserializer constructs after printing itself to a string.
"""

[[annotation]]
id    = "json-raw-0023"
file  = "src/raw.rs"
lines = "556-580"
title = "BorrowedRawDeserializer — the same map, with a borrowed value"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "option", "lifetime-de"]
body = """
The borrowed counterpart, holding `Option<&'de str>`. The value is
delivered through `BorrowedStrDeserializer`, so the visitor's
`visit_borrowed_str` is called and the reference keeps its full lifetime.

`SliceRead` and `StrRead` construct this one.
"""

[[annotation]]
id    = "json-raw-0024"
file  = "src/raw.rs"
lines = "581-598"
title = "A RawValue is a Deserializer — by parsing itself"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "lifetime-de", "associated-types"]
body = """
`&'de RawValue` implements `Deserializer`. When the program finally wants
the deferred value, it calls `T::deserialize(raw)`.

`deserialize_any` builds a `crate::Deserializer` over the stored text and
forwards to it. Parsing happens now. Because the text lives for `'de`, the
result can borrow from it.

There is no call to `end` afterwards. The invariant says the text is
exactly one value with nothing after it.
"""

[[annotation]]
id    = "json-raw-0025"
file  = "src/raw.rs"
lines = "599-827"
title = "Thirty methods, each constructing a parser and forwarding"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits"]
body = """
Every remaining method of the trait, written out, each with the same body
as `deserialize_any` and its own name in place of `deserialize_any`.

They cannot all forward to `deserialize_any`, which is what
`forward_to_deserialize_any!` would do. The typed methods must reach the
parser's typed methods, so that `deserialize_option` treats `null` as
`None` and `deserialize_enum` accepts a bare string. Forwarding by name
preserves that.

A macro could have written these 229 lines. Upstream wrote them by hand.
"""
