[[annotation]]
id    = "json-map-0001"
file  = "src/map.rs"
lines = "1-8"
title = "A map with two possible implementations"
kind  = "doc-contract"
tracks = ["reference"]
rust_features = ["feature-unification"]
body = """
The module comment states the arrangement in two sentences. `Map` is a
`BTreeMap` by default and an `IndexMap` with the `preserve_order` feature.

The practical difference is iteration order. A `BTreeMap` iterates in sorted
key order. An `IndexMap` iterates in insertion order. For JSON that decides
whether a document read into a `Value` and written back keeps its keys in
the order the author wrote them.

Everything else in this file exists to make that choice invisible in the
type's API.
"""

[[annotation]]
id    = "json-map-0002"
file  = "src/map.rs"
lines = "9-27"
title = "Imports — one backing map or the other"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "modules"]
body = """
The last four lines are the switch. Without the feature, `BTreeMap` and its
`btree_map` module are imported. With it, `IndexMap`.

`Vec` and `mem` are needed only by the `IndexMap` code paths, so they carry
the same gate. `Borrow`, `Hash` and `Hasher` are imported unconditionally,
and the reason for that is in the bounds on `get`.
"""

[[annotation]]
id    = "json-map-0003"
file  = "src/map.rs"
lines = "28-37"
title = "Map and MapImpl — a wrapper so the backing type is not public"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "visibility", "generic-params"]
body = """
`Map` is a struct with one private field of type `MapImpl<K, V>`, and
`MapImpl` is a type alias chosen by `#[cfg]`.

The wrapper is the point. If `Map` were itself an alias for `BTreeMap`,
every method of `BTreeMap` would be part of this crate's API, and code using
one would stop compiling when some other crate in the build enabled
`preserve_order`. Cargo features are unified across a dependency graph, so
that can happen without the code's author choosing it. A wrapper exposes
only the methods written below, and those are written to work with either
map.

The struct is generic over `K` and `V`. Every impl in the file is for
`Map<String, Value>` and nothing else.
"""

[[annotation]]
id    = "json-map-0004"
file  = "src/map.rs"
lines = "38-67"
title = "new, with_capacity, clear"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "inlining"]
body = """
`new` constructs the backing map. `clear` forwards.

`with_capacity` shows the wrapper absorbing a difference. `IndexMap` can
reserve space. `BTreeMap` has no such method, as the comment notes, so the
argument is discarded with `let _ = capacity`. The public method exists in
both builds and is a hint in one of them.
"""

[[annotation]]
id    = "json-map-0005"
file  = "src/map.rs"
lines = "68-119"
title = "get, contains_key, get_mut, get_key_value — bounds for both maps at once"
kind  = "impl"
tracks = ["reference"]
rust_features = ["where-clauses", "sized-bound", "generic-params", "feature-unification"]
body = """
Four lookups with the same signature shape. `key: &Q` where `String:
Borrow<Q>` is the standard way to let a map with `String` keys be searched
with a `&str`.

The second bound is the one specific to this crate: `Q: ?Sized + Ord + Eq +
Hash`. A `BTreeMap` lookup needs `Ord`. An `IndexMap` lookup needs `Hash`
and `Eq`. This method demands all three, in both builds.

That is the cost of hiding the implementation. A caller's key type must
satisfy the requirements of whichever map might be underneath, or the call
would compile in one configuration and fail in the other. For `str` it makes
no difference.

Each doc comment repeats a warning from the standard library: the borrowed
form must order the same way the owned key does.
"""

[[annotation]]
id    = "json-map-0006"
file  = "src/map.rs"
lines = "120-143"
title = "insert, and shift_insert"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
`insert` returns the previous value if the key was already present.

`shift_insert` exists only with `preserve_order`. Inserting at a position
has no meaning for a sorted map, so the method is absent from the default
build. This is one of a handful of places where the two builds do not offer
the same API, and each is marked for the documentation with `doc(cfg)`.
"""

[[annotation]]
id    = "json-map-0007"
file  = "src/map.rs"
lines = "144-189"
title = "remove and remove_entry — the same name, different effect on order"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
Both have two `return` statements under opposite `#[cfg]`s.

With the default map, removing a key leaves the others sorted. With
`preserve_order`, `remove` is `swap_remove`: the last entry is moved into
the removed entry's position. That is fast and it changes the order of the
remaining keys.

The doc comment says so and points to `shift_remove`. It is easy to miss. A
program that enables `preserve_order` to keep keys in order and then calls
`remove` has reordered them.
"""

[[annotation]]
id    = "json-map-0008"
file  = "src/map.rs"
lines = "190-261"
title = "swap_remove and shift_remove — the two removals an ordered map offers"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
Four methods available only with `preserve_order`, each forwarding to
`IndexMap`.

The doc comments compare them to `Vec::swap_remove` and `Vec::remove`.
Swapping is constant time and disturbs one entry. Shifting keeps relative
order and moves every entry after the removed one.
"""

[[annotation]]
id    = "json-map-0009"
file  = "src/map.rs"
lines = "262-271"
title = "append"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "ownership"]
body = """
Moves every entry of `other` into `self`. `BTreeMap` has an `append`
method. `IndexMap` does not, so that branch takes the other map's contents
with `mem::replace` and extends with them.
"""

[[annotation]]
id    = "json-map-0010"
file  = "src/map.rs"
lines = "272-288"
title = "entry — wrapping the backing map's Entry"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "26-the-value-tree-and-json-macro"
rust_features = ["cfg", "generic-params"]
body = """
The entry API, for inserting or updating with a single lookup. The key
parameter is `S: Into<String>`, so a `&str` can be passed.

The two `use` lines inside the function give the backing map's own `Entry`
type a common name. The match then rewraps its variants in this crate's
`Entry`, `VacantEntry` and `OccupiedEntry`. A wrapper type needs wrapper
types for everything it hands out.

The return type is written `Entry` with no lifetime. It is `Entry<'_>`,
borrowing from `&mut self`.
"""

[[annotation]]
id    = "json-map-0011"
file  = "src/map.rs"
lines = "289-348"
title = "len, is_empty, and six iterators"
kind  = "impl"
tracks = ["reference"]
rust_features = ["iterators", "inlining"]
body = """
Each iterator method wraps the backing map's iterator in a struct defined
at the bottom of this file: `Iter`, `IterMut`, `Keys`, `Values`,
`ValuesMut`, `IntoValues`.

The wrapping is for the same reason as everything else. A method returning
`btree_map::Iter` would put the backing type in a public signature.
"""

