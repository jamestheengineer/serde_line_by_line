Keeps the entries for which the closure returns `true`. The closure
receives the value mutably, so it can edit entries it keeps.
"""

[[annotation]]
id    = "json-map-0013"
file  = "src/map.rs"
lines = "361-384"
title = "sort_keys — does nothing unless order is preserved"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
The body is one gated statement. In a default build the method is empty,
because a `BTreeMap` is always sorted.

The doc comment notes that nested maps are not sorted and gives the
expression that sorts everything, which is what `Value::sort_all_objects`
does.
"""

[[annotation]]
id    = "json-map-0014"
file  = "src/map.rs"
lines = "385-417"
title = "Default, Clone, PartialEq, Eq — written out, not derived"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits"]
body = """
Four trait impls that forward to the backing map.

They are written by hand because a derive on `Map<K, V>` would produce
generic impls with bounds on `K` and `V`, and this crate wants impls for
`Map<String, Value>` only. The `allow` on `Default` silences a lint that
suggests deriving, with a link to the lint's bug report.

`Clone` overrides `clone_from`, which can reuse the destination's
allocations.

`PartialEq` on an `IndexMap` ignores order. Two maps with the same entries
in different orders are equal in both builds.
"""

[[annotation]]
id    = "json-map-0015"
file  = "src/map.rs"
lines = "418-433"
title = "Hash — sorted first, so that it agrees with equality"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "26-the-value-tree-and-json-macro"
rust_features = ["traits", "cfg", "closures", "collections"]
body = """
`Hash` and `Eq` must agree: equal values must hash equally.

With a `BTreeMap` that is automatic, since iteration order is determined by
the contents. With an `IndexMap`, two equal maps can iterate in different
orders, and hashing the entries as they come would give different results.

So the `preserve_order` branch collects references to the entries into a
`Vec`, sorts them by key, and hashes that. It costs an allocation and a sort
per hash. It is what `Value` deriving `Hash` depends on.
"""

[[annotation]]
id    = "json-map-0016"
file  = "src/map.rs"
lines = "434-482"
title = "Index and IndexMut for Map — these do panic"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "where-clauses", "associated-types"]
body = """
`map["key"]` on a `Map` panics if the key is absent. Both doc comments say
so.

That is the opposite of indexing a `Value`, which returns `Null`. The
difference is deliberate. A `Map` is a collection with the standard
library's conventions. A `Value` is the loosely typed thing.

The doc example shows the two together: `map["type"].as_str()` inside a
match arm that has already established the value is an object.

`IndexMut` cannot forward to `BTreeMap`, which does not implement it, so it
uses `get_mut` and `expect`.
"""

[[annotation]]
id    = "json-map-0017"
file  = "src/map.rs"
lines = "483-505"
title = "Debug and Serialize"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits"]
body = """
`Debug` forwards to the backing map, so a `Map` prints like a `BTreeMap` or
`IndexMap`.

`Serialize` writes a map with a known length and one `serialize_entry` per
pair, in iteration order. This is the code `Value`'s `Object` arm repeats
inline.
"""

[[annotation]]
id    = "json-map-0018"
file  = "src/map.rs"
lines = "506-548"
title = "Deserialize for Map — an object, or unit"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "lifetime-de"]
body = """
A visitor with two methods, passed to `deserialize_map`.

`visit_map` reads entries with `next_entry` and inserts them. With a
`BTreeMap` the entries end up sorted regardless of input order. With an
`IndexMap` they stay in input order. This loop is where `preserve_order`
takes effect during parsing.

`visit_unit` returns an empty map. `serde_json`'s own `deserialize_map`
rejects `null` before the visitor is consulted, so this method is reached
only from a deserializer that offers a unit where a map was asked for.

A repeated key is not an error. The later value replaces the earlier one.
"""

[[annotation]]
id    = "json-map-0019"
file  = "src/map.rs"
lines = "549-568"
title = "FromIterator and Extend"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "iterators"]
body = """
Collecting an iterator of `(String, Value)` pairs builds a `Map`. `Extend`
adds pairs to an existing one. Both forward.
"""

[[annotation]]
id    = "json-map-0020"
file  = "src/map.rs"
lines = "569-600"
title = "delegate_iterator! — four iterator traits for a wrapper"
kind  = "macro-def"
tracks = ["reference", "course"]
course_unit = "26-the-value-tree-and-json-macro"
rust_features = ["macro-rules", "macro-repetition", "iterators"]
body = """
Each iterator wrapper at the bottom of the file needs the same four impls,
all forwarding to `self.iter`. This macro writes them.

The pattern `($name:ident $($generics:tt)*) => $item:ty` takes a type name,
whatever follows it inside the parentheses, and an item type. The trailing
tokens are the generics, such as `<'a>`, captured as raw token trees so that
they can be emitted twice: once after `impl` and once after the type name.

Besides `Iterator`, the macro implements `DoubleEndedIterator`,
`ExactSizeIterator` and `FusedIterator`. Both backing maps' iterators
support all three, so the wrapper can promise them in either build.
"""

[[annotation]]
id    = "json-map-0021"
file  = "src/map.rs"
lines = "601-618"
title = "IntoDeserializer for Map and &Map"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "lifetime-de"]
body = """
The identity conversion, as for `Value`. A `Map` is its own deserializer
through the impl in `value/de.rs`.
"""

[[annotation]]
id    = "json-map-0022"
file  = "src/map.rs"
lines = "619-649"
title = "Entry, VacantEntry, OccupiedEntry — wrappers again"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "lifetimes", "visibility"]
body = """
The public entry types. `Entry` is an enum over the two cases, and each
case is a struct with one private field holding the backing map's entry.

Four type aliases under `#[cfg]` select the backing types. This is the same
technique as `MapImpl`, applied to every type the map API mentions.
"""

[[annotation]]
id    = "json-map-0023"
file  = "src/map.rs"
lines = "650-744"
title = "Entry — key, or_insert, or_insert_with, and_modify"
kind  = "impl"
tracks = ["reference"]
rust_features = ["closures", "pattern-matching", "lifetimes"]
body = """
The four methods people use on an entry, each a match over the two cases.

`or_insert` and `or_insert_with` return `&'a mut Value`, a reference with
the lifetime of the borrow of the map. That lets the result outlive the
`Entry` value itself, which was consumed by the call.

`and_modify` runs a closure on an occupied entry and returns the entry, so
it can be followed by `or_insert`. The doc example runs the same chain
twice. The first time the key is absent and the default is inserted. The
second time the closure runs.
"""

[[annotation]]
id    = "json-map-0024"
file  = "src/map.rs"
lines = "745-792"
title = "VacantEntry"
kind  = "impl"
tracks = ["reference"]
rust_features = ["lifetimes"]
body = """
`key` and `insert`, forwarding. `insert` consumes the entry and returns a
mutable reference to the new value.
"""

[[annotation]]
id    = "json-map-0025"
file  = "src/map.rs"
lines = "793-893"
title = "OccupiedEntry — four ways to reach the value"
kind  = "impl"
tracks = ["reference"]
rust_features = ["lifetimes", "borrowing"]
body = """
`key`, `get`, `get_mut` and `into_mut`.

The last two look alike and differ in lifetime. `get_mut` borrows the entry
and returns a reference that lives as long as that borrow. `into_mut`
consumes the entry and returns a reference that lives as long as the map
borrow, `'a`. The second is what you need to return the reference from a
function.
"""

[[annotation]]
id    = "json-map-0026"
file  = "src/map.rs"
lines = "894-952"
title = "OccupiedEntry insert and remove"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
`insert` replaces the value and returns the old one. `remove` takes the
entry out.

`remove` has the same two-`return` structure as `Map::remove`, and the same
consequence under `preserve_order`: it is a swap removal.
"""

[[annotation]]
id    = "json-map-0027"
file  = "src/map.rs"
lines = "953-1044"
title = "OccupiedEntry's ordered removals"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg"]
body = """
`swap_remove` and `shift_remove` for an entry, gated on `preserve_order`,
followed by `remove_entry` and its two gated variants, which return the key
as well as the value.
"""

[[annotation]]
id    = "json-map-0028"
file  = "src/map.rs"
lines = "1045-1070"
title = "Iterating a &Map — IntoIterator, Iter, and its backing type"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "iterators", "associated-types", "cfg"]
body = """
Three pieces that recur for each kind of iteration.

`IntoIterator for &Map` is what makes `for (k, v) in &map` work. `Iter` is
the wrapper struct. `IterImpl` is the gated alias for the backing iterator.
Then one `delegate_iterator!` line supplies the four trait impls.

`Iter` derives `Clone`, which the backing iterators over shared references
allow.
"""

[[annotation]]
id    = "json-map-0029"
file  = "src/map.rs"
lines = "1071-1096"
title = "Iterating a &mut Map"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "iterators", "cfg"]
body = """
The mutable counterpart. Items are `(&String, &mut Value)`. Keys are never
handed out mutably, since changing a key in place would break either map's
internal ordering.

`IterMut` derives `Debug` and not `Clone`. A mutable iterator cannot be
duplicated.
"""

[[annotation]]
id    = "json-map-0030"
file  = "src/map.rs"
lines = "1097-1122"
title = "Iterating a Map by value"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "iterators", "ownership", "cfg"]
body = """
`IntoIterator for Map` consumes the map and yields owned pairs. This is the
iterator `MapDeserializer` in `value/de.rs` is built on.
"""

[[annotation]]
id    = "json-map-0031"
file  = "src/map.rs"
lines = "1123-1181"
title = "Keys, Values, ValuesMut, IntoValues"
kind  = "impl"
tracks = ["reference"]
rust_features = ["iterators", "cfg"]
body = """
Four more wrappers in the same three-part form: a struct, a gated alias,
