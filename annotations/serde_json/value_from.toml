[[annotation]]
id    = "json-value-from-0001"
file  = "src/value/from.rs"
lines = "1-7"
title = "Imports for a file of conversions"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules"]
body = """
Everything in this file is a `From` or `FromIterator` impl producing a
`Value`. These are what make `"text".into()` and `vec![1, 2].into()` work,
and they are also what the `json!` macro leans on when it meets a plain
expression.

`Cow` is imported because one of the conversions accepts it.
"""

[[annotation]]
id    = "json-value-from-0002"
file  = "src/value/from.rs"
lines = "8-19"
title = "from_integer! — one impl per type in a list"
kind  = "macro-def"
tracks = ["reference"]
rust_features = ["macro-rules", "macro-repetition"]
body = """
A macro that takes a list of type names and writes `impl From<T> for
Value` for each.

`$($ty:ident)*` matches any number of identifiers separated by whitespace,
and the `$( ... )*` in the body repeats the impl once per match. Each impl
forwards to `Number`'s own `From` for that type with `n.into()`.

This is the repetition form you met throughout `serde_core`'s `impls.rs`,
at its smallest.
"""

[[annotation]]
id    = "json-value-from-0003"
file  = "src/value/from.rs"
lines = "20-29"
title = "Ten integer types, and two more behind a feature"
kind  = "macro-use"
tracks = ["reference"]
rust_features = ["macro-rules", "cfg"]
macro_def = "json-value-from-0002"
body = """
The first invocation covers every integer type up to 64 bits, including
`isize` and `usize`.

The second covers `i128` and `u128` and is compiled only with
`arbitrary_precision`. In a default build there is no `From<u128> for
Value`, and `Value::from(1u128)` is a compile error. That is consistent
with `to_value`, which has to return a run-time error for 128-bit values
that do not fit, because it cannot refuse at compile time.
"""

[[annotation]]
id    = "json-value-from-0004"
file  = "src/value/from.rs"
lines = "30-63"
title = "From f32 and f64 — the two conversions that can lose the value"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "option"]
body = """
A float becomes a `Number` if it is finite and `Value::Null` if it is not.
Both doc comments say so.

`From` is supposed to be a lossless, infallible conversion. This one is
infallible and, for NaN and infinity, not lossless. The alternative would
have been `TryFrom`, which would make `json!` unable to accept a float
expression directly. Upstream chose convenience and documented the edge.

The `f32` impl goes through `Number::from_f32`, which widens to `f64`.
"""

