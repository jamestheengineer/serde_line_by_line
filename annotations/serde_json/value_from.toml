[[annotation]]
id    = "json-value-from-0009"
file  = "src/value/from.rs"
lines = "170-207"
title = "From Vec, arrays and slices — anything whose elements convert"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "generic-params", "iterators"]
body = """
Three impls generic over the element type, with the bound `T: Into<Value>`.
Each maps `Into::into` over the elements and collects into a `Vec<Value>`.

The array impl uses a const generic, `const N: usize`, so it covers arrays
of every length with one impl. It is the only place in the crate where
const generics appear.

The slice impl needs `T: Clone` as well. It is given `&[T]` and has to
produce owned values, so each element is cloned before it is converted.

These impls are recursive through the bound. A `Vec<Vec<&str>>` converts
because `Vec<&str>` is itself `Into<Value>`.
"""

[[annotation]]
id    = "json-value-from-0010"
file  = "src/value/from.rs"
lines = "208-237"
title = "FromIterator for arrays"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "iterators", "generic-params"]
body = """
Implementing `FromIterator<T>` is what lets `.collect()` produce a `Value`.
Any iterator whose items convert to `Value` collects into
`Value::Array`.
"""

[[annotation]]
id    = "json-value-from-0011"
file  = "src/value/from.rs"
lines = "238-257"
title = "FromIterator for objects"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "iterators", "closures"]
body = """
A second `FromIterator` impl, for iterators of pairs. The key must be
`Into<String>` and the value `Into<Value>`, and the result is
`Value::Object`.

The two impls would overlap if some pair type `(K, V)` converted to
`Value`, since such an iterator would match both. The compiler accepts them
because it can see that none does. There is no `From<(K, V)> for Value` in
this crate, and the orphan rules stop any other crate from writing one.
"""

