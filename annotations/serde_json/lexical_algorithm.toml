[[annotation]]
id    = "json-lexical-algorithm-0005"
file  = "src/lexical/algorithm.rs"
lines = "163-195"
title = "fallback_path — moderate, then slow"
kind  = "impl"
tracks = ["reference"]
rust_features = ["generic-params"]
body = """
The shared tail of both entry points. If the moderate path is accurate, its
result is rounded to nearest and returned.

If not, the extended float is rounded *down* to give `b`. A special value
means infinity, and there is nothing to refine. Otherwise `bhcomp` settles
it exactly.

Rounding down is deliberate. The slow path needs a float that is known not
to be above the true value, so that the only question left is whether to
step up by one.
"""
