title = "POW5 — the index"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes"]
body = """
An array of slices, one per constant, so that the table can be indexed by
bit position. The element type is written `&'static [u32]` here and
`&[u64]` in the 64-bit file. In a `const` the two spellings mean the same
thing.
"""
