[[annotation]]
id    = "json-value-ser-0012"
file  = "src/value/ser.rs"
lines = "233-263"
title = "Sequences and tuple variants — a Vec to fill"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "26-the-value-tree-and-json-macro"
rust_features = ["collections", "option"]
prereqs = ["ser-mod-0033"]
body = """
`serialize_seq` returns a `SerializeVec` holding an empty vector with the
hinted capacity. Tuples and tuple structs forward to it.

A tuple variant gets its own type, because when it ends it must wrap the
vector in an object under the variant's name, and so it has to remember the
name.
"""

[[annotation]]
id    = "json-value-ser-0013"
file  = "src/value/ser.rs"
lines = "264-293"
title = "Maps, structs and struct variants"
kind  = "impl"
tracks = ["reference"]
rust_features = ["collections", "cfg", "pattern-matching"]
body = """
`serialize_map` returns the `Map` variant of `SerializeMap` with an empty
map and no pending key.

`serialize_struct` checks the name against the reserved tokens, as the text
serializer does, and returns a special variant for a `Number` or `RawValue`
passing through. Otherwise a struct is a map.

`serialize_struct_variant` ignores the length hint and starts with
`Map::new()`.
"""

[[annotation]]
id    = "json-value-ser-0014"
