title = "collect_str — format, then wrap"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings"]
body = """
A `Display` value becomes `Value::String(value.to_string())`. There is no
streaming to do. The destination is a `String`.
"""

[[annotation]]
id    = "json-value-ser-0015"
file  = "src/value/ser.rs"
lines = "302-326"
title = "Four builder types"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["visibility", "cfg", "collections"]
body = """
The state each compound serializer carries.

`SerializeVec` is a vector. `SerializeTupleVariant` adds the variant name.
`SerializeStructVariant` is a name and a map.

`SerializeMap` is an enum. Its `Map` variant holds the map under
construction and `next_key`, the key that has been serialized and is waiting
for its value. The two gated variants hold an `Option<Value>` that will
receive a number or raw value arriving through the token protocol.

All four are `pub`, for the same reason `Compound` is. They are named in a
public trait impl.
"""

[[annotation]]
id    = "json-value-ser-0016"
file  = "src/value/ser.rs"
lines = "327-343"
title = "SerializeSeq for SerializeVec — push, and wrap at the end"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits"]
body = """
An element is converted with `to_value` and pushed. `end` moves the vector
into `Value::Array`.

`end` takes `self` by value and returns the `Value`. This is where the `Ok`
type is finally produced for a compound.
"""

[[annotation]]
id    = "json-value-ser-0017"
file  = "src/value/ser.rs"
lines = "344-375"
title = "SerializeTuple and SerializeTupleStruct"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits"]
body = """
Both forward to the `SerializeSeq` impl with fully qualified calls.
"""

[[annotation]]
id    = "json-value-ser-0018"
file  = "src/value/ser.rs"
lines = "376-396"
title = "SerializeTupleVariant — an array inside a one-entry object"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "collections"]
body = """
Fields are pushed as for a sequence. `end` builds `{name: [fields]}`.
"""

[[annotation]]
id    = "json-value-ser-0019"
file  = "src/value/ser.rs"
lines = "397-447"
title = "SerializeMap — a key held until its value arrives"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "26-the-value-tree-and-json-macro"
rust_features = ["traits", "option", "pattern-matching"]
prereqs = ["ser-mod-0045"]
body = """
`serialize_key` serializes the key with `MapKeySerializer`, whose output is
a `String`, and stores it in `next_key`.

`serialize_value` takes the stored key and inserts the pair. If there is no
stored key it panics, and the comment defends the choice: calling
`serialize_value` first is a bug in the `Serialize` impl, not a property of
the data, so it is not reported as an ordinary error.

`end` wraps the map. A duplicate key is not detected. The later insert
replaces the earlier one.
"""

[[annotation]]
id    = "json-value-ser-0020"
file  = "src/value/ser.rs"
lines = "448-469"
title = "MapKeySerializer — a serializer whose output is a String"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "marker-types"]
body = """
The tree's key serializer. `type Ok = String`: serializing a key produces
the key.

It is a unit struct. The text serializer's counterpart had to hold a
reference to the writer. This one has nowhere to write and returns its
result.

The compound types are `Impossible<String, Error>`.
"""

[[annotation]]
id    = "json-value-ser-0021"
file  = "src/value/ser.rs"
lines = "470-487"
title = "Unit variants and newtype structs as keys"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings"]
body = """
A unit variant is its name. A newtype struct passes the key serializer on
to its inner value.
"""

[[annotation]]
id    = "json-value-ser-0022"
file  = "src/value/ser.rs"
lines = "488-531"
title = "bool and integer keys — formatted into a String"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings"]
body = """
A bool is the word. Each integer is formatted with `itoa` and copied into an
owned `String`.

There are no quotation marks to add. A key in a `Map` is a `String`, and
the quotes appear only if the tree is later written as text.
"""

[[annotation]]
id    = "json-value-ser-0023"
file  = "src/value/ser.rs"
lines = "532-561"
title = "Float, char and str keys"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "custom-errors"]
body = """
A finite float is formatted with `zmij`. A non-finite one is
`FloatKeyMustBeFinite`. A char and a string are copied.
"""

[[annotation]]
id    = "json-value-ser-0024"
file  = "src/value/ser.rs"
lines = "562-648"
title = "What cannot be a key — and one difference from the text serializer"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors"]
body = """
Bytes, unit, compounds and the rest return `KeyMustBeAString`, and
`collect_str` formats to a string.

`serialize_some` is in the list of refusals. In `ser.rs` the key serializer
passes `Some(x)` through to `x`. So a map keyed by `Option<u8>` serializes
with `to_string` as `{"1":1}` and fails with `to_value`. The two key
serializers were written separately and disagree on this one method.
"""

[[annotation]]
id    = "json-value-ser-0025"
file  = "src/value/ser.rs"
lines = "649-695"
title = "SerializeStruct for SerializeMap — fields, or a token payload"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "cfg", "pattern-matching"]
body = """
An ordinary struct field is a map entry, through `serialize_entry`.

In `Number` mode the single expected field carries the number as text. It is
serialized with `NumberValueEmitter`, which returns a `Value`, and the result
is stored in `out_value`. `end` then returns that stored value. The struct
with the reserved name never becomes an object. It is replaced by the number
it was carrying.

`RawValue` mode is the same with a different emitter. Both `end` arms
`expect` that the field arrived.
"""

[[annotation]]
id    = "json-value-ser-0026"
file  = "src/value/ser.rs"
lines = "696-716"
title = "SerializeStructVariant"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "collections"]
body = """
Each field is inserted with its name. `end` wraps the map in a one-entry
object keyed by the variant name.
"""

