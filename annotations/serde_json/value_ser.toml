[[annotation]]
id    = "json-value-ser-0010"
file  = "src/value/ser.rs"
lines = "205-219"
title = "newtype variant — a one-entry object"
kind  = "impl"
tracks = ["reference"]
rust_features = ["collections"]
body = """
`E::V(x)` becomes an object with the single key `"V"`. The inner value is
converted with `to_value` and inserted.

Compare this with the eight formatter calls the text serializer needed for
the same shape. Building a data structure is shorter than narrating its
punctuation.
"""

