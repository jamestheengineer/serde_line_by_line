[[annotation]]
id    = "json-value-ser-0001"
file  = "src/value/ser.rs"
lines = "1-10"
title = "Imports — to_value, used recursively"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["modules"]
body = """
`to_value` is imported from the parent module, and it is called throughout
this file. That is the first thing to know about how a tree is built: each
nested value is produced by a fresh call to `to_value`, which returns a
finished `Value` to be placed in its parent.

`Impossible` is here for the same purpose as in `ser.rs`, the compound
types of serializers that accept no compounds.
"""

[[annotation]]
id    = "json-value-ser-0002"
file  = "src/value/ser.rs"
lines = "11-37"
title = "Serialize for Value — six variants, six calls"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "pattern-matching", "cfg"]
body = """
The tree describes itself to any serializer. Null is a unit. A bool and a
string are themselves. A number delegates to `Number`'s own impl, and an
array to `Vec`'s.

An object is written out by hand: open a map with a known length, call
`serialize_entry` for each pair, and end it. `Map` has a `Serialize` impl
too, and this arm does the same work inline.

Given the JSON text serializer, this writes the document back out. Given
any other format's serializer, it writes that format. `Value` is not tied to
JSON on the way out, only to a data model that JSON happens to fit.

The second `Object` arm is `unreachable!()` under a `cfg` that is never true
in a build that compiles this crate.
"""

[[annotation]]
id    = "json-value-ser-0003"
file  = "src/value/ser.rs"
lines = "38-71"
title = "value::Serializer — the same trait, with Ok = Value"
kind  = "impl"
tracks = ["reference", "course"]
course_unit = "26-the-value-tree-and-json-macro"
rust_features = ["traits", "associated-types"]
prereqs = ["ser-mod-0017", "ser-mod-0018", "json-ser-0002"]
body = """
A second implementation of `serde_core`'s `Serializer`. The doc comment
shows `to_value` written in terms of it.

Two things differ from the serializer in `ser.rs`, and both are in these
lines. `type Ok = Value`, where the text serializer has `()`. Here the
result of serializing *is* the output, returned up the call stack. And the
struct is a unit struct, implemented by value. There is no writer to share
and no state to carry between values, so there is no reason for a `&mut`.

The compound types are four distinct types, not one enum. A tree builder has
to remember different things for each: a vector, a vector and a variant
name, a map and a pending key, a map and a variant name.
"""

[[annotation]]
id    = "json-value-ser-0004"
file  = "src/value/ser.rs"
lines = "72-95"
title = "bool and the small signed integers — widen to i64"
kind  = "impl"
tracks = ["reference"]
rust_features = ["inlining"]
body = """
A bool becomes `Value::Bool`. The three narrow signed integers are cast to
`i64` and forwarded, and `serialize_i64` makes a `Number` with `into()`.

The cast is lossless and it discards the original width. A `Value` does not
remember that a number was an `i8`.
"""

[[annotation]]
id    = "json-value-ser-0005"
file  = "src/value/ser.rs"
lines = "96-113"
title = "i128 — fits in 64 bits, or an error"
kind  = "cfg-gate"
tracks = ["reference"]
rust_features = ["cfg", "result"]
body = """
Two bodies under opposite `#[cfg]`s. With `arbitrary_precision`, any 128-bit
integer converts.

Without it, the value is tried as a `u64` and then as an `i64`. If neither
fits, the result is `NumberOutOfRange`.

This is stricter than the text serializer. `to_string(&u128::MAX)` writes
all thirty-nine digits, because text has no width. `to_value(u128::MAX)`
fails, because the `Number` it would have to build cannot hold the value.
"""

[[annotation]]
id    = "json-value-ser-0006"
file  = "src/value/ser.rs"
lines = "114-149"
title = "The unsigned integers, and u128"
kind  = "impl"
tracks = ["reference"]
rust_features = ["cfg", "inlining"]
body = """
The same arrangement for unsigned types: widen to `u64`, and for `u128`
either convert, with `arbitrary_precision`, or require that it fit.
"""

[[annotation]]
id    = "json-value-ser-0007"
file  = "src/value/ser.rs"
lines = "150-159"
title = "Floats — through From"
kind  = "impl"
tracks = ["reference"]
rust_features = ["inlining"]
body = """
Both call `Value::from(float)`. The `From` impls are in `value/from.rs`, and
they produce `Null` for a NaN or an infinity, matching what the text
serializer writes.

For `f32` there is a detail in that conversion worth knowing here. The value
is stored as an `f64`. The `f32` nearest 0.1 therefore becomes a `Number`
that prints as `0.10000000149011612`, where the text serializer, formatting
the `f32` directly, prints `0.1`.
"""

[[annotation]]
id    = "json-value-ser-0008"
file  = "src/value/ser.rs"
lines = "160-176"
title = "char, str and bytes"
kind  = "impl"
tracks = ["reference"]
rust_features = ["strings", "iterators", "closures"]
body = """
A `char` becomes a one-character `String`. A `&str` is copied. Every string
in a tree is owned.

Bytes become an array of numbers, built with `map` and `collect`. This is
the tree form of what `write_byte_array` writes as text.
"""

