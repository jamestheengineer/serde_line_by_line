[[annotation]]
id    = "json-value-de-0047"
file  = "src/value/de.rs"
lines = "1217-1244"
title = "deserialize_numeric_key! — parsing a key's text as a number"
kind  = "macro-def"
tracks = ["reference"]
rust_features = ["macro-rules", "pattern-matching"]
body = """
The tree's version of the macro of the same name in `de.rs`, and it takes a
shortcut the parser could not. It builds a real `Deserializer` over the key
string and runs the number parser on it.

The three checks are the same in spirit. The first byte must be a digit or a
minus sign. The number is parsed by `$using`, one of the parser's own
`pub(crate)` methods. Then nothing may remain. A key such as `"1x"` or
`" 1"` fails with `ExpectedNumericKey`.

The errors are built with line 0 and column 0. The key is not a position in
any input.

The first arm supplies `deserialize_number` as the default for `$using`, the
optional-argument idiom again.
"""

