[[annotation]]
id    = "json-value-de-0051"
file  = "src/value/de.rs"
lines = "1288-1328"
title = "option, newtype, enum, and the forwarding list"
kind  = "impl"
tracks = ["reference"]
rust_features = ["option", "macro-rules"]
body = """
A key is never null, so `deserialize_option` is `visit_some`. A newtype is
transparent. Neither has the `RawValue` hook that the parser's key
deserializer carries.

`deserialize_enum` converts the key with `into_deserializer`, which for a
`Cow<str>` is `serde_core`'s `CowStrDeserializer`, and lets that type handle
the unit-variant case.

The rest forward to `deserialize_any` and are read as a string.
"""

[[annotation]]
id    = "json-value-de-0052"
file  = "src/value/de.rs"
lines = "1329-1384"
title = "KeyClassifier — a seed and a visitor in one type"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "cfg", "strings", "pattern-matching"]
body = """
This is the seed `visit_map` used for the first key of every object.

`KeyClassifier` implements `DeserializeSeed`, so it can be passed to
`next_key_seed`, and `Visitor`, so it can be passed to `deserialize_str`. Its
`deserialize` method does exactly that: it hands itself over as the
visitor.

The visitor's job is to look at the key text. In a default build there is
one outcome, `KeyClass::Map` holding the key as a `String`. With
`arbitrary_precision` or `raw_value`, a key equal to the reserved token
means the map is not a real map, and the classifier says which special
value it stands for.

`visit_str` copies the key. `visit_string` takes an owned key without
copying, and a format that has one avoids an allocation per object.
"""

[[annotation]]
id    = "json-value-de-0053"
file  = "src/value/de.rs"
lines = "1385-1406"
title = "invalid_type and unexpected — describing a value for an error"
kind  = "impl"
tracks = ["reference"]
rust_features = ["custom-errors", "trait-objects", "inlining"]
body = """
The helper every typed method above used in its fallback arm.

`unexpected` converts a `Value` into `serde_core`'s `Unexpected`, the
"what was found" half of a type error. Scalars carry their value. Arrays and
objects are reported as `Seq` and `Map` with no contents.

`invalid_type` is generic over the error type `E` and takes the expectation
as `&dyn Expected`, so it is compiled once per error type and not once per
visitor. Both are `#[cold]`.
"""

[[annotation]]
id    = "json-value-de-0054"
file  = "src/value/de.rs"
lines = "1407-1451"
title = "BorrowedCowStrDeserializer — why serde_core's version was not enough"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "smart-pointers", "lifetime-de"]
body = """
`serde_core` already has a `CowStrDeserializer`. For a borrowed string it
calls `visit_str`, because its lifetime parameter is unrelated to `'de` and
it cannot promise the borrow lasts.

This type exists to make that promise. Its `Cow<'de, str>` is tied to the
deserializer lifetime, so the borrowed arm can call `visit_borrowed_str`.
That is what allows a map deserialized from `&Value` to have `&'de str`
keys.

The owned arm gives the `String` away. Everything but enums forwards to
`deserialize_any`.
"""

[[annotation]]
id    = "json-value-de-0055"
file  = "src/value/de.rs"
lines = "1452-1507"
title = "EnumAccess and UnitOnly — a string can only be a unit variant"
kind  = "impl"
tracks = ["reference"]
rust_features = ["traits", "associated-types", "custom-errors"]
body = """
The string deserializer also serves as its own enum access. `variant_seed`
deserializes the variant name from the string and returns `UnitOnly` for the
content.

`UnitOnly` is a unit struct whose `unit_variant` succeeds and whose other
three methods return the same `invalid_type` errors as the parser's
`UnitVariantAccess`. It is the third place in the crate where those three
refusals are written out.
"""
