body = """
The forwarding runs the other way round from the consuming impl. There,
`str` and `char` forwarded to `deserialize_string`. Here, `string` and
`char` forward to `deserialize_str`, which calls `visit_borrowed_str`.

The direction follows what each impl can offer. A consumed value offers an
owned string, and a borrowed value offers a long-lived reference.

`deserialize_bytes` accepts a string or an array, as before.
