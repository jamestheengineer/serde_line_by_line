[[annotation]]
id    = "json-value-de-0045"
file  = "src/value/de.rs"
lines = "1162-1212"
title = "MapRefDeserializer — a borrowed key in a Cow"
kind  = "impl"
tracks = ["reference"]
rust_features = ["iterators", "traits", "smart-pointers"]
body = """
The borrowed map access. The one line that differs in substance is the key:
`Cow::Borrowed(&**key)`.

`key` is a `&String`. One `*` gives `String`, a second gives `str` through
`Deref`, and `&` makes a `&'de str`. Wrapping it in `Cow::Borrowed` lets it
flow into the same `MapKeyDeserializer` that the consuming impl feeds with
`Cow::Owned`.

That is the reason for `Cow` in this file. One key deserializer serves both
impls, and it remembers which kind of key it was given.
"""

