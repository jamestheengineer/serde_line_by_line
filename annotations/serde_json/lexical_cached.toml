title = "ExtendedFloatArray — two parallel slices"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes"]
body = """
A table of extended floats stored as two arrays, one of mantissas and one
of exponents. The doc comment gives the reason: memory efficiency. An array
of structs holding a `u64` and an `i32` would be padded to sixteen bytes per
entry. Two arrays use twelve.

`get_extended_float` reassembles one entry. The doc comment above the impl
says "without bounds checking". The code uses ordinary indexing, which is
bounds-checked.
"""

[[annotation]]
id    = "json-lexical-cached-0002"
file  = "src/lexical/cached.rs"
lines = "34-67"
title = "ModeratePathPowers — small powers, large powers, and a step"
kind  = "plumbing"
tracks = ["reference"]
rust_features = ["lifetimes"]
body = """
The tables the moderate path multiplies by. To scale by any power of ten
without storing every one, the exponent is split in two. `large` holds
every `step`-th power across the whole range. `small` holds the first
`step` powers. Any exponent is one large entry times one small entry.

`small_int` holds the small powers again as plain integers, for the case
where the multiplication can be done exactly in a `u64`. `bias` shifts
negative exponents into the non-negative index range.
"""

