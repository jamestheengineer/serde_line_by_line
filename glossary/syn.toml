"""

[[entry]]
id    = "syn::parse2"
file  = "src/lib.rs"
lines = "1041-1045"
title = "Tokens in, syntax tree out"
see_also = ["syn::parse_macro_input", "proc_macro2::TokenStream"]
body = """
Parses a `proc_macro2::TokenStream` into any `Parse` type. This is the entry
point a harness uses when it calls `serde_derive` outside a real macro
