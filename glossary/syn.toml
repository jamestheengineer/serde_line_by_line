title = "syn's Result alias"
see_also = ["syn::Error"]
body = """
`Result<T, syn::Error>`. Two lines, and the return type of nearly every
function in `serde_derive` that can fail.
"""

[[entry]]
id    = "syn::ReturnType"
file  = "src/ty.rs"
lines = "284-295"
title = "`-> T`, or nothing"
see_also = ["syn::Type"]
