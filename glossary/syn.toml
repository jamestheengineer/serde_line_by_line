"""

[[entry]]
id    = "syn::parse::ParseStream"
file  = "src/parse.rs"
lines = "219-225"
title = "A cursor over tokens"
see_also = ["syn::meta::ParseNestedMeta", "syn::LitStr"]
body = """
`&ParseBuffer<'a>` — a type alias, and the alias is the point: parsers take a
shared reference and advance a cursor inside it, so a parse function can be
