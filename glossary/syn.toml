"""

[[entry]]
id    = "syn::Token"
file  = "src/token.rs"
lines = "879-984"
title = "The token table"
see_also = ["proc_macro2::Spacing"]
body = """
A macro mapping every piece of Rust punctuation and every keyword to its type:
`Token![,]` is `token::Comma`. `serde_derive` writes these in struct literals
when constructing syntax nodes that need a comma or a colon it never saw in
the input.
"""

[[entry]]
id    = "syn::TraitBound"
file  = "src/generics.rs"
lines = "418-433"
title = "A trait in bound position"
see_also = ["syn::TraitBoundModifiers", "syn::Path"]
body = """
A path, optional `for<'a>` binder, and modifiers. `serde_derive` constructs
these to say `T: _serde::Serialize`, which is why the path is fully qualified
through the `_serde` alias rather than written as `Serialize`.
"""

[[entry]]
id    = "syn::TraitBoundModifiers"
file  = "src/generics.rs"
lines = "446-448"
title = "`?Sized` and friends"
see_also = ["syn::TraitBound"]
body = """
Empty in this build, and `#[non_exhaustive]` so it can grow. It exists to
carry `?` and the maybe-async modifiers; serde constructs bounds without any,
so its role here is a field that must be filled in with a default.
"""

[[entry]]
id    = "syn::Type"
file  = "src/ty.rs"
lines = "15-80"
title = "The 20 shapes a type can take"
see_also = ["syn::TypePath", "syn::Path", "syn::GenericArgument"]
body = """
The syntax tree enum with a variant per type form: paths, references, slices,
tuples, `impl Trait`, and the rest. `serde_derive` matches on a handful —
`Path`, `Reference`, `Slice`, `Array`, `Group` — to decide whether a field's
type is borrowed, and treats the remainder as opaque.
"""

[[entry]]
id    = "syn::TypeGenerics"
file  = "src/generics.rs"
lines = "279-284"
title = "The type-position half of a split"
see_also = ["syn::Generics"]
body = """
A borrowed view of `Generics` that prints as `<T>` rather than `<T:
Serialize>`. Comes from `split_for_impl`, whose three-way split is exactly the
three places an impl needs its parameters written differently.
"""

[[entry]]
id    = "syn::TypeParam"
file  = "src/generics.rs"
lines = "70-80"
title = "A type parameter and its inline bounds"
see_also = ["syn::TypeParamBound", "syn::GenericParam"]
body = """
The `T: Clone` in `struct S<T: Clone>`. `serde_derive` reads the existing
bounds and adds its own rather than replacing them, because `#[serde(bound =
"...")]` overriding is a deliberate opt-in and silently dropping a user's
bound would not be.
"""

[[entry]]
id    = "syn::TypeParamBound"
file  = "src/generics.rs"
lines = "398-416"
title = "What a bound can be"
see_also = ["syn::TraitBound", "syn::Lifetime"]
body = """
A trait, a lifetime, or a precise-capture. `serde_derive` reads these to
decide whether it must add its own, and preserves the ones already there.
"""

[[entry]]
id    = "syn::TypePath"
file  = "src/ty.rs"
lines = "168-177"
title = "A named type"
see_also = ["syn::Path", "syn::QSelf", "syn::Type"]
body = """
A path with an optional qualified self, `<T as Trait>::Assoc`. The
overwhelmingly common case of a field type, and where `serde_derive` looks to
find out whether a field is an `Option`, a `Cow`, or a `PhantomData`.
"""

[[entry]]
id    = "syn::Variant"
file  = "src/data.rs"
lines = "12-27"
title = "One arm of an enum"
see_also = ["syn::Fields", "syn::Attribute", "syn::Data"]
body = """
A name, its fields, its attributes, and an optional discriminant.
`serde_derive` reads the attributes for `rename`, `skip`, `other` and the
rest, then generates one match arm per variant — four different ways,
depending on the enum's tagging.
"""

[[entry]]
id    = "syn::WhereClause"
file  = "src/generics.rs"
lines = "493-501"
title = "The where, if there is one"
see_also = ["syn::WherePredicate", "syn::Generics"]
body = """
The `where` token and its predicates. `serde_derive` reaches for this as an
`Option` and creates one when a struct had none, which is the common case:
most types being derived have no `where` clause until serde adds it.
"""

[[entry]]
id    = "syn::WherePredicate"
file  = "src/generics.rs"
lines = "503-520"
title = "One clause in a where"
see_also = ["syn::PredicateType", "syn::TypeParamBound"]
body = """
A lifetime predicate, a type predicate, or something syn does not model.
`serde_derive` synthesises the type kind: for every field type that needs it,
a `FieldTy: Serialize` predicate is appended here rather than to the parameter
list.
"""

[[entry]]
id    = "syn::meta::ParseNestedMeta"
file  = "src/meta.rs"
lines = "163-167"
title = "A callback's view of one nested option"
see_also = ["syn::Attribute", "syn::parse::ParseStream"]
