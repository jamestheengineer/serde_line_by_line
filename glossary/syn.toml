# The syn vocabulary serde_derive reads.
#
# These are quotations, not annotations: syn is a glossary source (D9), pinned
# and never claimed. Each entry names the lines that define the item, and the
# renderer reads the text from the pinned tree rather than from this file — a
# copy here would be a second thing to keep true.

schema = 1
source = "syn-3.0.5"

[[entry]]
id    = "syn::AngleBracketedGenericArguments"
file  = "src/path.rs"
lines = "197-207"
title = "What is inside the angle brackets"
see_also = ["syn::GenericArgument", "syn::PathArguments"]
body = """
The arguments plus the optional turbofish `::`. `serde_derive` reads these to
find the `T` in `Option<T>` and to rewrite lifetimes when a field is borrowed.
"""

[[entry]]
id    = "syn::Attribute"
file  = "src/attr.rs"
lines = "176-182"
title = "One `#[...]`"
see_also = ["syn::Meta", "syn::meta::ParseNestedMeta"]
body = """
The brackets, the style (outer or inner), and the meta inside. Everything
`#[serde(...)]` does starts as one of these, and `internals/attr.rs` is 1,818
lines of turning them into settings.
"""

[[entry]]
id    = "syn::Data"
file  = "src/derive.rs"
lines = "22-36"
title = "Struct, enum, or union"
see_also = ["syn::DataStruct", "syn::DataUnion", "syn::Fields", "syn::Variant"]
body = """
Which of the three shapes the input is. `serde_derive` matches all three:
structs and enums get code, unions get an error, and that error is the first
thing either expansion emits. Every branch downstream of this point is really
a branch on which arm matched here.
"""

[[entry]]
id    = "syn::DataStruct"
file  = "src/derive.rs"
lines = "38-46"
title = "A struct's body"
see_also = ["syn::Fields", "syn::Data"]
body = """
Fields plus the tokens around them. The `fields` is where the work is; the
`semi_token` distinguishes `struct A(u8);` from `struct A { x: u8 }` and
matters to nothing in `serde_derive` except that it exists.
"""

[[entry]]
id    = "syn::DataUnion"
file  = "src/derive.rs"
lines = "58-65"
title = "The shape that gets refused"
see_also = ["syn::Data", "syn::Error"]
body = """
Unions carry named fields like a struct, and `serde_derive` still refuses
them: there is no way to know which variant is live, so no correct `Serialize`
exists. The refusal is a one-line `Error` early in both expansions.
"""

[[entry]]
id    = "syn::DeriveInput"
file  = "src/derive.rs"
lines = "10-20"
title = "What a derive macro is handed"
see_also = ["syn::Data", "syn::Generics", "syn::Attribute"]
body = """
The whole input to `#[derive(Serialize)]`, already parsed. Five fields: the
outer attributes, the visibility, the name, the generics, and the body.
`serde_derive` never parses Rust — it is given this and walks it, which is why
syn's parser is vocabulary here and not subject matter.
"""

[[entry]]
id    = "syn::Error"
file  = "src/error.rs"
lines = "107-109"
title = "A parse error that becomes a compiler error"
see_also = ["syn::Result", "syn::spanned::Spanned"]
body = """
A span and a message. Its `to_compile_error` turns into a `compile_error!`
invocation, which is how every `#[serde(...)]` mistake reaches the user as a
normal rustc diagnostic pointing at the right token.
"""

[[entry]]
id    = "syn::Expr"
file  = "src/expr.rs"
lines = "138-306"
title = "Every expression form there is"
see_also = ["syn::ExprLit", "syn::ExprPath", "syn::Member"]
body = """
The largest syntax tree enum in syn, and `serde_derive` touches exactly two
variants: `Lit`, to read `#[serde(default = "...")]` values, and `Group`, to
see through invisible delimiters. The other forty are here because `syn`
models the whole language and this project models `serde_derive`.
"""

[[entry]]
id    = "syn::ExprLit"
file  = "src/expr.rs"
lines = "571-578"
title = "A literal in expression position"
see_also = ["syn::Lit", "syn::Expr"]
body = """
Attributes plus a `Lit`. Reached when an attribute value has been parsed as an
expression and `serde_derive` needs the string back out of it.
"""

[[entry]]
id    = "syn::ExprPath"
file  = "src/expr.rs"
lines = "636-647"
title = "A path used as a value"
see_also = ["syn::Path", "syn::QSelf"]
body = """
`Option::is_none` as an expression rather than a type.
`#[serde(skip_serializing_if = "Option::is_none")]` becomes one of these,
which is why the attribute takes a string and not a bare path: it is parsed on
demand, in the right position.
"""

[[entry]]
id    = "syn::Field"
file  = "src/data.rs"
lines = "184-206"
title = "One field, with everything attached"
see_also = ["syn::Attribute", "syn::Member", "syn::Type"]
body = """
Attributes, visibility, optional name, and type. The optional `ident` is the
whole tuple-vs-named distinction in one `Option`. `serde_derive` reads the
attributes for the `#[serde(...)]` options and the type for the bounds it will
need to infer.
"""

[[entry]]
id    = "syn::Fields"
file  = "src/data.rs"
lines = "29-49"
title = "Named, unnamed, or none"
see_also = ["syn::Field", "syn::Member"]
body = """
The three shapes a struct or variant body can take: `{ a: u8 }`, `(u8)`, or
nothing. This enum is why `serde_derive` can treat a tuple struct and a named
struct with one code path — the difference collapses into how each field is
addressed.
"""

[[entry]]
id    = "syn::GenericArgument"
file  = "src/path.rs"
lines = "172-195"
title = "One argument in a path"
see_also = ["syn::Type", "syn::Lifetime"]
body = """
A lifetime, a type, a const, or an associated-type binding. `serde_derive`
cares about the first two: replacing a lifetime here is how it retargets a
borrowed field's type onto `'de`.
"""

[[entry]]
id    = "syn::GenericParam"
file  = "src/generics.rs"
lines = "37-57"
title = "Lifetime, type, or const"
see_also = ["syn::TypeParam", "syn::LifetimeParam", "syn::Generics"]
body = """
One parameter of the three kinds. `serde_derive` walks these to decide what to
bound: type parameters get `Serialize`, lifetimes get carried into the impl,
const parameters get passed through untouched.
"""

[[entry]]
id    = "syn::Generics"
file  = "src/generics.rs"
lines = "18-35"
title = "The parameters and their bounds"
see_also = ["syn::GenericParam", "syn::WhereClause", "syn::TypeGenerics"]
body = """
Everything between the angle brackets plus the `where` clause. `serde_derive`
clones this, adds a `T: Serialize` bound per type parameter, and splits it
three ways for the impl header. The bound inference in `bound.rs` is most of
what this type is used for.
"""

[[entry]]
id    = "syn::Ident"
file  = "src/ident.rs"
lines = "8-12"
title = "syn's ident is proc-macro2's"
see_also = ["proc_macro2::Ident", "proc_macro2::Span"]
body = """
One line: `pub use proc_macro2::Ident`. Worth an entry precisely because the
one line is the surprising part — there is no separate syn ident type, and an
`Ident` built in `serde_derive` is the same object the lexer produced.
"""

[[entry]]
id    = "syn::Index"
file  = "src/expr.rs"
lines = "1129-1136"
title = "A tuple field's position"
see_also = ["syn::Member"]
body = """
A `u32` with a span. It exists because `self.0` written as a plain integer
literal would come out as `self.0usize` or trip the float lexer on `self.0.1`;
`Index` prints the bare index correctly.
"""

[[entry]]
id    = "syn::Lifetime"
file  = "src/lifetime.rs"
lines = "10-23"
title = "A lifetime, apostrophe and all"
see_also = ["syn::LifetimeParam", "proc_macro2::Ident"]
body = """
An apostrophe token plus an ident, kept separate because `'` and `de` are two
tokens to the lexer. The generated `impl<'de> Deserialize<'de>` builds one of
these by hand.
"""

[[entry]]
id    = "syn::LifetimeParam"
file  = "src/generics.rs"
lines = "59-68"
title = "A declared lifetime"
see_also = ["syn::Lifetime", "syn::GenericParam"]
body = """
The `'a` in `struct S<'a>`, with any bounds on it. `Deserialize` generation
cares intensely: every borrowed field forces a relationship between the
struct's lifetimes and the `'de` the impl introduces.
"""

[[entry]]
id    = "syn::Lit"
file  = "src/lit.rs"
lines = "23-62"
title = "The literal kinds"
see_also = ["syn::LitStr", "syn::ExprLit"]
body = """
String, byte string, byte, char, int, float, bool, or verbatim. `serde_derive`
reads `Str` almost exclusively — every `#[serde(...)]` value that names a
function or a type arrives as a string literal.
"""

[[entry]]
id    = "syn::LitStr"
file  = "src/lit.rs"
lines = "64-69"
title = "A string literal that can be re-parsed"
see_also = ["syn::Lit", "syn::parse::ParseStream"]
body = """
Carries the token and its span. Its `parse` method is the trick behind serde's
attribute design: `"Option::is_none"` is stored as a string and parsed into a
path later, with errors that still point inside the original literal.
"""

[[entry]]
id    = "syn::Macro"
file  = "src/mac.rs"
lines = "14-23"
title = "A macro invocation in the tree"
see_also = ["syn::Path"]
body = """
Path, bang, delimiter, and the tokens inside. `serde_derive` sees these when a
field type or a default expression is itself a macro call, and passes them
through rather than trying to expand them.
"""

[[entry]]
id    = "syn::Member"
file  = "src/expr.rs"
lines = "1051-1061"
title = "How a field is addressed"
see_also = ["syn::Index", "syn::Field"]
body = """
`Named(Ident)` or `Unnamed(Index)` — `self.x` or `self.0`. Generated code
interpolates this directly, so one `quote!` template serves both struct shapes
instead of two.
"""

[[entry]]
id    = "syn::Meta"
file  = "src/attr.rs"
lines = "476-485"
title = "The three shapes inside an attribute"
see_also = ["syn::Attribute", "syn::meta::ParseNestedMeta"]
body = """
`#[path]`, `#[path = value]`, or `#[path(tokens)]`. `#[serde(...)]` is always
the list form, so `serde_derive` reaches for `Meta::List` and then parses the
inside itself.
"""

[[entry]]
id    = "syn::Path"
file  = "src/path.rs"
lines = "12-19"
title = "A `::`-separated path"
see_also = ["syn::PathSegment", "syn::PathArguments"]
body = """
Segments, plus whether it starts with `::`. Everything from `T` to
`std::collections::HashMap<K, V>` is one of these. `serde_derive` matches the
last segment's ident constantly — that is how `Option<T>` is recognised as
`Option`.
"""

[[entry]]
id    = "syn::PathArguments"
file  = "src/path.rs"
lines = "129-147"
title = "Angle-bracketed, parenthesised, or none"
see_also = ["syn::AngleBracketedGenericArguments", "syn::GenericArgument"]
body = """
`<T>`, `(A) -> B`, or nothing. `serde_derive` looks for the angle-bracketed
form to reach inside a container type; the parenthesised form is `Fn` sugar
and is left alone.
"""

[[entry]]
id    = "syn::PathSegment"
file  = "src/path.rs"
lines = "108-115"
title = "An ident and its arguments"
see_also = ["syn::PathArguments", "syn::Path"]
body = """
One `Vec` or one `HashMap<K, V>`. The arguments hang off the segment, not the
path, which is why the type parameters of `Option<T>` are found on its final
segment.
"""

[[entry]]
id    = "syn::PredicateType"
file  = "src/generics.rs"
lines = "533-546"
title = "A type-bounded predicate"
see_also = ["syn::WherePredicate", "syn::TypeParamBound"]
body = """
`T: Serialize` in `where` position, with an optional higher-ranked `for<'a>`
in front. This is the shape `serde_derive` builds when inferring bounds,
because a `where` predicate can bound an arbitrary type expression and a
parameter list can only bound a parameter.
"""

[[entry]]
id    = "syn::QSelf"
file  = "src/path.rs"
lines = "274-281"
title = "The `<T as Trait>` prefix"
see_also = ["syn::TypePath", "syn::Type"]
body = """
The qualified-self of a path, carrying the type, the position of the `as`, and
the segment index it applies to. `serde_derive` preserves it when rewriting a
field type rather than trying to interpret it.
"""

[[entry]]
id    = "syn::Result"
file  = "src/error.rs"
